<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><base target="_top">
<title>پنل مدیر شعبه | ZingoVingo</title>
<!-- استایل‌ها دقیقاً کپی از Operator.html باشند -->
<style> /* استایل‌های Operator.html را اینجا کپی کنید */ </style>
</head>
<body>
<div id="loginPage" class="login-page">
  <div class="login-box">
    <h1>Zingo<span>Vingo</span></h1><div class="subtitle">پنل مدیر شعبه</div>
    <div id="loginError" class="login-error"></div>
    <div class="field"><label>نام کاربری</label><input id="loginUser"></div>
    <div class="field"><label>رمز عبور</label><input id="loginPass" type="password"></div>
    <button class="btn btn-primary" onclick="doLogin('branch')">ورود به پنل</button>
  </div>
</div>

<div id="appContainer" class="app" style="display:none">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><h2>Zingo<span>Vingo</span></h2><small>پنل مدیر شعبه</small></div>
    <nav class="nav-menu" id="navMenu"></nav>
    <div class="sidebar-footer">
      <div class="user-info"><div class="user-avatar" id="userAvatar">?</div><div><div class="user-name" id="userName">—</div><div class="user-role" id="userRole">مدیر شعبه</div></div></div>
      <button class="logout-btn" onclick="doLogout()">🚪 خروج</button>
    </div>
  </aside>
  <main class="main">
    <button class="menu-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')">☰ منو</button>
    <div id="pageContent"><div class="loading"><div class="spinner"></div></div></div>
  </main>
</div>
<div id="toast" class="toast"></div>
<div id="modal" class="modal"><div class="modal-box" id="modalBox"></div></div>

<script>
const $ = id => document.getElementById(id);
const toFa = n => new Intl.NumberFormat('fa-IR').format(n);
const money = n => new Intl.NumberFormat('en-US').format(Math.round(Number(n)||0)) + ' ریال';
let currentToken = localStorage.getItem('zv_branch_token') || null;
let currentUser = null;

const MENU_ITEMS = [
  { id: 'dashboard', label: '📊 داشبورد' },
  { id: 'employees', label: '👔 مدیریت کارمندان' },
  { id: 'reports', label: '📈 گزارشات شعبه' },
  { id: 'profile', label: '👤 پروفایل من' }
];

function toast(msg, type='info') { const t = $('toast'); t.textContent = msg; t.className = 'toast show ' + type; setTimeout(() => t.classList.remove('show'), 3500); }
function openModal(html) { $('modalBox').innerHTML = html; $('modal').classList.add('open'); }
function closeModal() { $('modal').classList.remove('open'); }

function doLogin(type) {
  const u = $('loginUser').value.trim(), p = $('loginPass').value;
  if (!u || !p) return $('loginError').style.display = 'block', $('loginError').textContent = 'نام کاربری و رمز را وارد کنید';
  
  const apiCall = type === 'branch' ? 'branchManagerLogin' : 'employeeLogin';
  google.script.run.withSuccessHandler(r => {
    if (r.success) {
      currentToken = r.token; currentUser = r.user;
      localStorage.setItem('zv_branch_token', r.token);
      localStorage.setItem('zv_branch_user', JSON.stringify(r.user));
      showApp(r.user);
    } else $('loginError').textContent = r.message || 'خطا';
  }).withFailureHandler(e => $('loginError').textContent = e.message)[apiCall](u, p);
}

function showApp(user) {
  currentUser = user;
  $('loginPage').style.display = 'none'; $('appContainer').style.display = 'grid';
  $('userName').textContent = user.name;
  $('userAvatar').textContent = user.name ? user.name.charAt(0) : '?';
  if (user.avatar) $('userAvatar').innerHTML = '<img src="' + user.avatar + '">';
  
  $('navMenu').innerHTML = MENU_ITEMS.map(i => `<div class="nav-item" data-page="${i.id}">${i.label}</div>`).join('');
  $('navMenu').querySelectorAll('.nav-item').forEach(item => {
    item.addEventListener('click', () => {
      $('navMenu').querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
      item.classList.add('active');
      loadPage(item.dataset.page);
      $('sidebar').classList.remove('open');
    });
  });
  loadPage('dashboard');
}

function loadPage(page) {
  $('pageContent').innerHTML = '<div class="loading"><div class="spinner"></div></div>';
  if (page === 'dashboard') loadDashboard();
  else if (page === 'employees') loadEmployees();
  else if (page === 'reports') loadReports();
  else if (page === 'profile') loadProfile();
}

// --- داشبورد ---
function loadDashboard() {
  google.script.run.withSuccessHandler(stats => {
    $('pageContent').innerHTML = `
      <div class="page-header"><h1 class="page-title">داشبورد شعبه (کد: ${currentUser.branchId})</h1></div>
      <div class="stats-grid">
        <div class="stat-card"><div class="stat-label">کل سفارشات شعبه</div><div class="stat-value">${toFa(stats.totalOrders)}</div></div>
        <div class="stat-card green"><div class="stat-label">تکمیل شده</div><div class="stat-value">${toFa(stats.completedOrders)}</div></div>
        <div class="stat-card yellow"><div class="stat-label">در انتظار</div><div class="stat-value">${toFa(stats.pendingOrders)}</div></div>
        <div class="stat-card blue"><div class="stat-label">درآمد شعبه</div><div class="stat-value">${money(stats.totalRevenue)}</div></div>
      </div>`;
  }).getBranchDashboard(currentToken);
}

// --- مدیریت کارمندان ---
function loadEmployees() {
  google.script.run.withSuccessHandler(emps => {
    let html = `<div class="page-header"><h1 class="page-title">کارمندان شعبه</h1><button class="btn btn-primary" onclick="openEmployeeModal()">+ کارمند جدید</button></div>
    <div class="card"><div class="table-wrap"><table><thead><tr><th>کد</th><th>نام</th><th>سمت</th><th>موبایل</th><th>وضعیت</th><th>عملیات</th></tr></thead><tbody>`;
    emps.forEach(e => {
      html += `<tr><td>${e.empId}</td><td>${e.fullName}</td><td>${e.jobTitle}</td><td>${e.phone}</td><td>${e.status}</td>
      <td><button class="btn btn-sm btn-secondary" onclick='openEmployeeModal(${JSON.stringify(e)})'>✏️</button> 
      <button class="btn btn-sm btn-danger" onclick="deleteEmp(${e.rowIndex})">🗑</button></td></tr>`;
 });
    html += `</tbody></table></div></div>`;
    $('pageContent').innerHTML = html;
  }).getBranchEmployees(currentToken);
}

function openEmployeeModal(e) {
  e = e || {};
  openModal(`<div class="modal-header"><h2>${e.rowIndex ? 'ویرایش' : 'افزودن'} کارمند</h2><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="form-grid">
      <div class="field"><label>نام</label><input id="eFirst" value="${e.fullName ? e.fullName.split(' ')[0] : ''}"></div>
      <div class="field"><label>نام خانوادگی</label><input id="eLast" value="${e.fullName ? e.fullName.split(' ').slice(1).join(' ') : ''}"></div>
      <div class="field"><label>نام کاربری</label><input id="eUser" value="${e.username || ''}" ${e.rowIndex ? 'readonly' : ''}></div>
      <div class="field"><label>رمز عبور ${e.rowIndex ? '(خالی=بدون تغییر)' : '*'}</label><input id="ePass" type="password"></div>
      <div class="field"><label>سمت</label><input id="eJob" value="${e.jobTitle || ''}"></div>
      <div class="field"><label>موبایل</label><input id="ePhone" value="${e.phone || ''}"></div>
      <div class="field"><label>وضعیت</label><select id="eStatus"><option ${e.status==='فعال'?'selected':''}>فعال</option><option ${e.status==='غیرفعال'?'selected':''}>غیرفعال</option></select></div>
    </div>
    <div class="modal-footer"><button class="btn btn-secondary" onclick="closeModal()">انصراف</button><button class="btn btn-primary" onclick="saveEmp(${e.rowIndex || 'null'})">ذخیره</button></div>`);
}

function saveEmp(rowIndex) {
  const data = { rowIndex: rowIndex, firstName: $('eFirst').value, lastName: $('eLast').value, username: $('eUser').value, password: $('ePass').value, jobTitle: $('eJob').value, phone: $('ePhone').value, status: $('eStatus').value };
  google.script.run.withSuccessHandler(() => { closeModal(); toast('ذخیره شد', 'success'); loadEmployees(); }).withFailureHandler(e => toast(e.message, 'error')).saveBranchEmployee(data, currentToken);
}

function deleteEmp(rowIndex) {
  if (!confirm('آیا از حذف این کارمند اطمینان دارید؟')) return;
  google.script.run.withSuccessHandler(() => { toast('حذف شد', 'success'); loadEmployees(); }).withFailureHandler(e => toast(e.message, 'error')).deleteBranchEmployee(rowIndex, currentToken);
}

// --- گزارشات ---
function loadReports() {
  $('pageContent').innerHTML = `<div class="page-header"><h1 class="page-title">گزارشات شعبه</h1></div>
    <div class="card"><div class="filters">
      <div class="field"><label>از تاریخ</label><input id="repFrom" placeholder="1403/01/01"></div>
      <div class="field"><label>تا تاریخ</label><input id="repTo" placeholder="1403/12/29"></div>
      <div class="field" style="justify-content:flex-end"><button class="btn btn-primary" onclick="fetchReports()">نمایش</button></div>
    </div><div id="repContent"></div></div>`;
}

function fetchReports() {
  google.script.run.withSuccessHandler(rep => {
    $('repContent').innerHTML = `<div class="stats-grid">
      <div class="stat-card"><div class="stat-label">تعداد</div><div class="stat-value">${toFa(rep.count)}</div></div>
      <div class="stat-card green"><div class="stat-label">درآمد</div><div class="stat-value">${money(rep.totalRevenue)}</div></div>
    </div>
    <div class="card" style="margin-top:16px"><h3>ریز تراکنش‌ها</h3><div class="table-wrap"><table><thead><tr><th>تاریخ</th><th>کد</th><th>خدمت</th><th>مبلغ</th><th>وضعیت</th></tr></thead><tbody>
    ${rep.transactions.map(t => `<tr><td>${t.date}</td><td>${t.requestId}</td><td>${t.service}</td><td>${money(t.amount)}</td><td>${t.status}</td></tr>`).join('')}
    </tbody></table></div></div>`;
  }).getBranchReports(currentToken, $('repFrom').value, $('repTo').value);
}

// --- پروفایل ---
function loadProfile() {
  google.script.run.withSuccessHandler(p => {
    $('pageContent').innerHTML = `<div class="page-header"><h1 class="page-title">پروفایل من</h1></div>
      <div class="card"><div class="employee-profile">
        <div class="employee-avatar-large">${p.avatar ? '<img src="'+p.avatar+'">' : p.name.charAt(0)}</div>
        <div class="employee-details">
          <div class="detail-item"><div class="detail-label">شناسه یکتا</div><div class="detail-value">${p.id}</div></div>
          <div class="detail-item"><div class="detail-label">نام</div><div class="detail-value">${p.name}</div></div>
          <div class="detail-item"><div class="detail-label">نقش</div><div class="detail-value">${p.role}</div></div>
          <div class="detail-item"><div class="detail-label">کد شعبه</div><div class="detail-value">${p.branchId}</div></div>
        </div>
      </div>
      <div style="margin-top:20px">
        <div class="field" style="max-width:300px"><label>تغییر رمز عبور</label><input id="newPass" type="password" placeholder="رمز جدید"></div>
        <button class="btn btn-primary" style="margin-top:10px" onclick="updateProfile()">بروزرسانی رمز</button>
      </div></div>`;
  }).getMyProfile(currentToken);
}

function updateProfile() {
  const pass = $('newPass').value;
  if (!pass) return toast('رمز عبور را وارد کنید', 'error');
  google.script.run.withSuccessHandler(() => { toast('رمز عبور بروزرسانی شد', 'success'); $('newPass').value = ''; }).withFailureHandler(e => toast(e.message, 'error')).updateMyProfile({ password: pass }, currentToken);
}

function doLogout() {
  google.script.run.branchLogout(currentToken);
  localStorage.removeItem('zv_branch_token');
  localStorage.removeItem('zv_branch_user');
  location.reload();
}

// بررسی نشست ذخیره‌شده
(function checkSession() {
  const saved = localStorage.getItem('zv_branch_user');
  if (currentToken && saved) { currentUser = JSON.parse(saved); showApp(currentUser); }
})();
</script>
</body>
</html>
