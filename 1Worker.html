<style>

button,input,select,textarea{font:inherit;color:inherit}a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid rgba(255,107,26,.45);outline-offset:2px;border-radius:8px}

.brand{display:flex;gap:11px;align-items:center;padding:20px}

.bdg{margin-right:auto;background:var(--brand);color:#fff;font-size:10px;font-weight:900;min-width:20px;height:20px;padding:0 6px;border-radius:12px;display:grid;place-items:center}

.side-foot{padding:14px;border-top:1px solid rgba(255,255,255,.08)}

.main{min-width:0;display:flex;flex-direction:column}

.topbar h2{font-size:17px;font-weight:900}.crumb{font-size:11px;color:var(--muted)}.sp{flex:1}
.ibtn{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--muted)}

.branch-chip{display:flex;align-items:center;gap:8px;padding:6px 12px;border:1px solid var(--line);border-radius:11px;background:var(--surface2);font-size:11.5px;font-weight:800;color:var(--brandDeep)}

.num{font-variant-numeric:tabular-nums}.ltr{direction:ltr;text-align:right}.ra{display:flex;gap:5px;justify-content:flex-end}

.p-blue{background:rgba(46,99,231,.12);color:var(--blue)}.p-green{background:rgba(14,159,110,.13);color:var(--green)}
.p-amber{background:rgba(217,119,6,.13);color:var(--amber)}.p-red{background:rgba(224,45,60,.12);color:var(--red)}
.p-violet{background:rgba(124,77,255,.12);color:var(--violet)}.p-teal{background:rgba(15,163,163,.13);color:var(--teal)}
.p-gray{background:rgba(100,116,139,.14);color:var(--slate)}.p-brand{background:rgba(255,107,26,.13);color:var(--brandDeep)}.p-pink{background:rgba(224,68,124,.12);color:var(--pink)}

.charts{grid-template-columns:repeat(auto-fit,minmax(330px,1fr))}
.cbox{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--sh)}

.modal{background:var(--surface);border:1px solid var(--line);border-radius:20px;width:min(680px,100%);box-shadow:var(--sh2);max-height:90vh;display:flex;flex-direction:column;overflow:hidden}
.modal.w{width:min(1060px,100%)}.modal>form{display:flex;flex-direction:column;min-height:0;flex:1;overflow:hidden}
.mh{display:flex;align-items:center;gap:11px;padding:17px 20px;border-bottom:1px solid var(--line);flex:0 0 auto}.mh h3{font-size:15px;font-weight:900;flex:1}
.mb{padding:20px 22px;overflow-y:auto;flex:1 1 auto;min-height:0}

.modal.dk{background:linear-gradient(165deg,#0D1830,#1D1A44);border-color:#2E3A66;color:#fff}

.modal.dk .btn-s{background:rgba(255,255,255,.09);border-color:#3A4880;color:#fff}.modal.dk .hint{color:#93A3C8}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.fgrid .full{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}.field label{font-size:11.5px;font-weight:800;color:var(--muted)}.req{color:var(--red)}

.field textarea{min-height:78px;resize:vertical}

.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px}.kvi{background:var(--surface2);border:1px solid var(--line);border-radius:11px;padding:9px 12px;min-width:0}

select{background:var(--glass);border:1px solid var(--glassBrd);color:inherit}select option{background:#111A30;color:#fff}
.zsel{position:relative;width:100%}

.zsel-btn{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;min-height:40px;padding:9px 12px;border:1px solid var(--glassBrd);border-radius:10px;background:var(--glass);backdrop-filter:blur(12px);color:inherit;font-size:12.5px;font-weight:600;cursor:pointer;text-align:right;transition:all var(--tr)}

.jdw{position:relative;width:100%}.jdw input{padding-left:42px!important;direction:ltr;text-align:right}

.zv-card-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,390px),1fr));gap:16px;margin-top:14px}

.zv-detail-wide{grid-column:1/-1}

.zv-planner-scroll{overflow:auto;border:1px solid var(--line);border-radius:13px;background:var(--surface)}

.menu-btn{display:grid}#zvTip{display:none!important}}

applyRail(!document.documentElement.classList.contains('zv-rail'));}
function showTip(el){if(!document.documentElement.classList.contains('zv-rail')||isMobile()||!el)return;
var sp=el.querySelector('span'),l=sp?sp.textContent:(el.title||'');l=String(l||'').trim();if(!l)return;
if(!TIP){TIP=document.createElement('div');TIP.id='zvTip';document.body.appendChild(TIP);}
var b=el.querySelector('.bdg'),ex=b&&b.textContent.trim()?'<b>'+esc(b.textContent.trim())+'</b>':'';
TIP.innerHTML=esc(l)+ex;TIP.classList.add('on');
var r=el.getBoundingClientRect(),w=TIP.offsetWidth,h=TIP.offsetHeight,left=r.left-w-12;if(left<8)left=r.right+12;
TIP.style.left=left+'px';TIP.style.top=Math.max(8,Math.min(r.top+(r.height-h)/2,window.innerHeight-h-8))+'px';}
function hideTip(){if(TIP)TIP.classList.remove('on');}
/* ═══ 16) ACTIONS ═══ */
var ACT={
'login':doLogin,'logout':doLogout,'rail':toggleRail,'theme':toggleTheme,
'menu':function(){var s=$('#sidebar'),sc=$('#scrim'),o=!s.classList.contains('open');s.classList.toggle('open',o);sc.classList.toggle('show',o);},
'scrim':function(){$('#sidebar').classList.remove('open');$('#scrim').classList.remove('show');},
'mclose':closeModal,'go':function(d){go(d.page);},
'refresh':function(){render();refreshUnread();toast('بروزرسانی شد.','ok');},
'cards-view':function(d){PS.view=d.mode;render();},
'card-detail':function(d){cardDetail(d.id);},
'card-status':function(d){cardStatusModal(d.id,d.status||'','');},
'card-refer':function(d){cardStatusModal(d.id,'','ارجاع به سرپرست');},
'card-msg':function(d){msgSupModal(d.id||'');},
'card-print':function(d){var b=$('#zv-detail-'+d.id);if(!b){toast('ابتدا جزئیات کارت را باز کنید.','warn');return;}
var w=window.open('','_blank');if(!w)return;w.document.write('<html lang="fa" dir="rtl"><meta charset="utf-8"><body style="font-family:Tahoma;padding:24px">'+b.innerHTML+'</body></html>');w.document.close();w.print();},
'week':function(d){var n=num(d.d);PS.week=n?new Date((PS.week||new Date()).getTime()+n*864e5):new Date();render();},
'msg-sup':function(){msgSupModal('');},'msg-support':function(){msgSupportModal();},
'msg-refresh':function(){return syncInbox().then(paintInbox);},
'chat-open':function(d){return chatOpen(d.id);},
'chat-status':function(d){return api('workerSetThreadStatus',d.id,d.state,TOKEN).then(function(){
toast(d.state==='CLOSED'?'گفتگو بسته شد.':'گفتگو باز شد.','ok');
var open=$('#mback').classList.contains('show');
return (open?chatOpen(d.id):Promise.resolve()).then(function(){return syncInbox().then(function(){if(PS.page==='messages')paintInbox();});});});},
'rep-run':runReports,
'dev-new':function(){devNewModal('');},'dev-new-kind':function(d){devNewModal(d.kind||'');},'dev-notify':function(d){devNotify(d.kind);},
'dev-del':function(d){confirmBox('حذف درخواست','آیا از حذف <b>'+esc(d.id)+'</b> مطمئن هستید؟',function(){
api('workerDeleteDevRequest',d.id,TOKEN).then(function(){toast('حذف شد.','ok');render();}).catch(function(e){toast(e.message,'err');});});},
'photo-edit':openPhoto};
document.addEventListener('click',function(e){
if(!e.target.closest('.jdw')&&!e.target.closest('#jpop'))jdClose();
var el=e.target.closest('[data-act]');
if(el){var fn=ACT[el.dataset.act];
if(fn){e.preventDefault();e.stopPropagation();
try{var r=fn(el.dataset,el,e);if(r&&typeof r.catch==='function')r.catch(function(x){toast(x.message||String(x),'err');});}
catch(x){toast(x.message||String(x),'err');}return;}}
if(!e.target.closest('.zsel'))zClose();
if(e.target.id==='mback')closeModal();});
var sDeb=debounce(function(){render();},300);
var mDeb=debounce(function(){if(PS.page==='messages')paintInbox();},250);
document.addEventListener('input',function(e){
if(e.target.matches('[data-search]')){PS.q=e.target.value;sDeb();return;}
if(e.target.matches('[data-msearch]')){PS.mq=e.target.value;mDeb();return;}});
document.addEventListener('change',function(e){var t=e.target;
if(t.matches('[data-cstatus]')){PS.status=t.value;render();return;}
if(t.matches('[data-mch]')){PS.mch=t.value;paintInbox();return;}
if(t.matches('[data-mst]')){PS.mst=t.value;paintInbox();return;}});
document.addEventListener('submit',function(e){
var f=e.target,k=f.dataset.form;if(!k)return;e.preventDefault();
var sub=f.querySelector('[type="submit"]');
var run=function(){
if(k==='card-status'){var st=f.elements.status.value,note=f.elements.note.value.trim();
if(st==='ارجاع به سرپرست'&&!note){toast('برای ارجاع به سرپرست، دلیل ارجاع الزامی است.','err');return;}
if(sub)sub.disabled=true;
return api('updateWorkerCardStatus',f.dataset.id,st,note,TOKEN).then(function(){closeModal();toast('وضعیت ثبت شد.','ok');render();}).catch(function(x){if(sub)sub.disabled=false;throw x;});}
if(k==='chat-reply'){var b=f.elements.body.value.trim();if(!b){toast('متن پاسخ الزامی است.','err');return;}
if(sub)sub.disabled=true;
return api('workerReplyThread',f.dataset.id,b,TOKEN).then(function(){toast('ارسال شد.','ok');
return chatOpen(f.dataset.id).then(syncInbox).then(function(){if(PS.page==='messages')paintInbox();});}).catch(function(x){if(sub)sub.disabled=false;throw x;});}
if(k==='msg-sup'){var cid=f.elements.cardId.value;if(!cid){toast('کارت مرتبط را انتخاب کنید.','err');return;}
var body=f.elements.body.value.trim();if(!body){toast('متن پیام الزامی است.','err');return;}
if(sub)sub.disabled=true;
return api('workerCreateThread',{channel:'SUP',cardId:cid,subject:f.elements.subject.value,body:body},TOKEN)
.then(function(r){closeModal();toast('گفتگو ایجاد شد.','ok');refreshUnread();go('messages');return chatOpen(r.threadId);}).catch(function(x){if(sub)sub.disabled=false;throw x;});}
if(k==='msg-support'){var sb=f.elements.body.value.trim();if(!sb){toast('متن پیام الزامی است.','err');return;}
if(sub)sub.disabled=true;
return api('workerCreateThread',{channel:'SUPPORT',subject:f.elements.subject.value,body:sb},TOKEN)
.then(function(r){closeModal();toast('پیام به پشتیبانی ارسال شد.','ok');refreshUnread();go('messages');return chatOpen(r.threadId);}).catch(function(x){if(sub)sub.disabled=false;throw x;});}
if(k==='dev-new'){var note=f.elements.note.value.trim();if(!note){toast('شرح درخواست الزامی است.','err');return;}
var mod=f.elements.module.value,name=SOON[mod]?SOON[mod].t:'پیشنهاد عمومی';
if(sub)sub.disabled=true;
return api('workerSubmitDevRequest',{module:mod,moduleName:name,kind:f.elements.kind.value,priority:f.elements.priority.value,note:note},TOKEN)
.then(function(r){closeModal();toast('درخواست ثبت شد · '+r.id,'ok');render();}).catch(function(x){if(sub)sub.disabled=false;throw x;});}
if(k==='profile'){var pp={username:f.elements.username.value.trim(),description:f.elements.description.value};
if(f.elements.password.value)pp.password=f.elements.password.value;
if(!pp.username){toast('نام کاربری الزامی است.','err');return;}
return api('updateWorkerProfile',pp,TOKEN).then(function(){if(USER){USER.username=pp.username;localStorage.setItem('zv_worker_user',JSON.stringify(USER));}toast('پروفایل ذخیره شد.','ok');render();});}};
try{var r=run();if(r&&typeof r.catch==='function')r.catch(function(x){toast(x.message||String(x),'err');});}
catch(x){toast(x.message||String(x),'err');}});
document.addEventListener('keydown',function(e){
if((e.ctrlKey||e.metaKey)&&String(e.key).toLowerCase()==='b'){var tg=(e.target&&e.target.tagName||'').toLowerCase();
if(tg==='input'||tg==='textarea'||e.target.isContentEditable)return;e.preventDefault();toggleRail();return;}
if(e.key==='Escape'){if($('#jpop').classList.contains('open')){jdClose();return;}
if($$('.zsel.open').length){zClose();return;}closeModal();hideTip();return;}
if(e.key==='Enter'&&$('#loginView').style.display!=='none'&&(e.target.id==='loginUser'||e.target.id==='loginPass'))doLogin();});
document.addEventListener('mouseover',function(e){var el=e.target.closest?e.target.closest('.sidebar .nav-item'):null;
if(!el)return;clearTimeout(TIPT);TIPT=setTimeout(function(){showTip(el);},90);});
document.addEventListener('mouseout',function(e){var el=e.target.closest?e.target.closest('.sidebar .nav-item'):null;if(!el)return;clearTimeout(TIPT);hideTip();});
window.addEventListener('scroll',function(){hideTip();if($('#jpop').classList.contains('open')&&JD.inp)jdOpen(JD.inp);},true);
window.addEventListener('resize',function(){hideTip();if($('#jpop').classList.contains('open')&&JD.inp)jdOpen(JD.inp);});
/* ═══ 17) INIT ═══ */
(function init(){
var th=localStorage.getItem('zv_worker_theme');if(th)document.documentElement.dataset.theme=th;
$('#themeBtn').innerHTML=icon(document.documentElement.dataset.theme==='dark'?'sun':'moon');
try{if(localStorage.getItem(RKEY)==='1')document.documentElement.classList.add('zv-rail');}catch(e){}
applyLogo('LOGO.png');
var saved=localStorage.getItem('zv_worker_user');
if(!TOKEN){$('#loginView').style.display='grid';return;}
$('#loginView').style.display='none';$('#app').style.display='grid';
$('#page').innerHTML='<div class="loading"><div class="spinner"></div></div>';
if(saved){try{USER=JSON.parse(saved);}catch(e){}}
loadBranding();
api('getWorkerProfile',TOKEN).then(function(p){
USER={name:p.name,workerId:p.workerId,username:p.username,branchId:p.branchId,branchName:p.branchName,groupId:p.groupId,avatar:p.avatar};
localStorage.setItem('zv_worker_user',JSON.stringify(USER));paintUser();refreshUnread();go('dashboard');
}).catch(function(){
if(USER){paintUser();refreshUnread();go('dashboard');}
else{localStorage.removeItem('zv_worker_token');TOKEN='';$('#app').style.display='none';$('#loginView').style.display='grid';}});
})();
</script>
