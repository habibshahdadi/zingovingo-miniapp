<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<base target="_top">
<!-- فavicon صحیح و بدون خطای Mixed Content -->
<link rel="icon" type="image/png" href="favicon.png">
<title>پنل سوپروایزر | ZingoVingo</title>
<script src="zv-api.js"></script>
</head>
<body>

<!-- کانتینر برای بارگذاری داینامیک ZV-UI -->
<div id="zv-ui-loader" style="display:flex;align-items:center;justify-content:center;height:100vh;font-family:Tahoma;">
  <div style="text-align:center;color:#74809a;">
    <div class="zv-spinner" style="width:30px;height:30px;border:3px solid #e7eaf1;border-top-color:#FF6B1A;border-radius:50%;animation:zv-spin 1s linear infinite;margin:0 auto 10px;"></div>
    در حال بارگذاری سیستم...
  </div>
</div>

<!-- ساختار اصلی اپ (پس از لود ZV-UI نمایش داده می‌شود) -->
<div id="loginPage" class="login-page" style="display:none">
  <div class="login-box">
    <img id="loginLogo" class="login-logo" alt="ZingoVingo" src="LOGO.png">
    <h1 id="loginBrandText">Zingo<span>Vingo</span></h1>
    <div class="subtitle">پنل سوپروایزر</div>
    <div id="loginError" class="login-error"></div>
    <div id="loginLoading" class="login-loading"><span class="zv-spinner"></span> در حال ورود به پنل…</div>
    <div class="zv-field"><label>نام کاربری</label><input id="loginUser" class="zv-input" autocomplete="username"></div>
    <div class="zv-field"><label>رمز عبور</label><input id="loginPass" class="zv-input" type="password" autocomplete="current-password"></div>
    <button id="loginBtn" class="zv-btn zv-btn-primary" onclick="doLogin()">ورود به پنل</button>
  </div>
</div>

<div id="appContainer" class="app" style="display:none">
  <aside class="sidebar zv-sidebar" id="sidebar">
    <div class="brand">
      <img id="brandLogo" class="brand-logo" alt="ZingoVingo" src="LOGO.png">
      <h2 id="brandText">Zingo<span>Vingo</span></h2>
      <small>پنل سوپروایزر</small>
    </div>
    <nav class="nav-menu" id="navMenu"></nav>
    <div class="sidebar-footer">
      <div class="user-info">
        <div class="user-avatar zv-profile-avatar" id="userAvatar">?</div>
        <div>
          <div class="user-name" id="userName">—</div>
          <div class="user-role" id="userRole">سوپروایزر</div>
        </div>
      </div>
      <button class="logout-btn" onclick="doLogout()">🚪 خروج</button>
    </div>
  </aside>
  <div id="menuBackdrop" class="menu-backdrop" onclick="closeMobileMenu()"></div>
  <main class="main">
    <header class="main-topbar">
      <div class="topbar-left">
        <button class="menu-toggle" onclick="toggleMobileMenu()" aria-label="باز کردن منو">☰ منو</button>
        <div>
          <div class="topbar-crumb">ZingoVingo / پنل سرپرست</div>
          <div class="topbar-title" id="topbarPageTitle">داشبورد</div>
        </div>
      </div>
      <div class="topbar-user branch-chip">
        <div class="branch-chip-icon">⌂</div>
        <div>
          <b id="topbarBranchName">شعبه</b>
          <div class="user-role" id="topbarBranchId">شناسه شعبه: —</div>
        </div>
      </div>
    </header>
    <div id="pageContent">
      <div class="loading zv-loading"><div class="spinner zv-spinner"></div><p>در حال بارگذاری…</p></div>
    </div>
  </main>
</div>

<div id="toast" class="toast zv-toast"></div>
<div id="modal" class="modal zv-modal-backdrop"><div class="modal-box zv-modal" id="modalBox"></div></div>

<!-- بارگذاری PhotoEditor -->
<div id="zv-photo-container"></div>

<script>
// ==================== بارگذاری هوشمند ZV-UI ====================
// این بخش تضمین می‌کند که توابع مشترک ($) قبل از اجرای کد پنل تعریف می‌شوند
Promise.all([
  fetch('ZV-UI.html').then(r => r.text()),
  fetch('PhotoEditor.html').then(r => r.text()).catch(() => '')
]).then(([uiHtml, photoHtml]) => {
  // تزریق استایل‌ها
  const parser = new DOMParser();
  const uiDoc = parser.parseFromString(uiHtml, 'text/html');
  uiDoc.querySelectorAll('style').forEach(style => document.head.appendChild(style.cloneNode(true)));
  
  // تزریق اسکریپت‌های مشترک (تعریف $, toast, callServer و ...)
  uiDoc.querySelectorAll('script').forEach(script => {
    const newScript = document.createElement('script');
    newScript.textContent = script.textContent;
    document.body.appendChild(newScript);
  });

  // تزریق PhotoEditor اگر وجود داشت
  if (photoHtml) {
    const photoDoc = parser.parseFromString(photoHtml, 'text/html');
    const photoContainer = document.getElementById('zv-photo-container');
    if (photoContainer) {
      photoDoc.querySelectorAll('style').forEach(s => document.head.appendChild(s.cloneNode(true)));
      photoContainer.innerHTML = photoDoc.body.innerHTML;
    }
  }

  // حذف لودینگ و شروع پنل
  const loader = document.getElementById('zv-ui-loader');
  if (loader) loader.style.display = 'none';
  
  // اجرای منطق اختصاصی سوپروایزر
  initSupervisorPanel();
}).catch(err => {
  console.error('خطا در بارگذاری فایل‌های مشترک:', err);
  document.getElementById('zv-ui-loader').innerHTML = '<div style="color:red;text-align:center;padding:20px;">خطا در بارگذاری سیستم. لطفاً صفحه را رفرش کنید.</div>';
});

// ==================== منطق اختصاصی پنل سوپروایزر ====================
function initSupervisorPanel() {
  'use strict';
  
  // متغیرهای اختصاصی پنل
  let currentToken = localStorage.getItem('zv_supervisor_token') || '';
  let currentUser = null, currentPage = 'dashboard', currentGroupId = '';
  let supervisorGroups = [], memberStatuses = [], cardStatuses = [];
  let cdTimer = null;

  const MENU_ITEMS = [
    {id:'dashboard',label:'داشبورد',icon:'▦',section:'مدیریت عملیات'},
    {id:'groups',label:'گروه‌های من',icon:'◫',section:'مدیریت عملیات'},
    {id:'members',label:'اعضای گروه',icon:'♙',section:'مدیریت عملیات'},
    {id:'cards',label:'کارت‌ها و سفارش‌ها',icon:'▤',section:'مدیریت عملیات'},
    {id:'messages',label:'مکاتبات متخصصان',icon:'✉',section:'مدیریت عملیات'},
    {id:'returned',label:'کارت‌های مرجوعی',icon:'↩',section:'مدیریت عملیات'},
    {id:'reports',label:'گزارش عملکرد',icon:'◷',section:'مدیریت عملیات'},
    {id:'submissions',label:'ثبت گزارش و درخواست',icon:'＋',section:'ثبت و پیگیری'},
    {id:'profile',label:'پروفایل من',icon:'◎',section:'حساب کاربری'}
  ];

  // Override توابع پیش‌فرض ZV-UI
  window._doLogin = function(u, p) {
    if (typeof setLoginBusy === 'function') setLoginBusy(true);
    const errEl = document.getElementById('loginError');
    if (errEl) errEl.style.display = 'none';
    
    callServer('supervisorLogin', [u, p], r => {
      if (typeof setLoginBusy === 'function') setLoginBusy(false);
      if (!r || !r.success || !r.token) {
        if (errEl) {
          errEl.textContent = (r && r.message) || 'ورود تأیید نشد';
          errEl.style.display = 'block';
        }
        return;
      }
      currentToken = r.token;
      currentUser = r.user || {};
      localStorage.setItem('zv_supervisor_token', currentToken);
      localStorage.setItem('zv_supervisor_user', JSON.stringify(currentUser));
      showApp(currentUser);
    }, e => {
      if (typeof setLoginBusy === 'function') setLoginBusy(false);
      if (errEl) {
        errEl.textContent = e.message || 'خطا در ورود';
        errEl.style.display = 'block';
      }
    });
  };

  window._doLogout = function(t) {
    callServer('supervisorLogout', [t], () => {}, () => {});
  };

  function showApp(user) {
    currentUser = user || {};
    const loginPage = document.getElementById('loginPage');
    const appContainer = document.getElementById('appContainer');
    if (loginPage) loginPage.style.display = 'none';
    if (appContainer) appContainer.style.display = 'grid';
    
    const userNameEl = document.getElementById('userName');
    const userRoleEl = document.getElementById('userRole');
    if (userNameEl) userNameEl.textContent = currentUser.name || 'سوپروایزر';
    if (userRoleEl) userRoleEl.textContent = 'شناسه کاربر: ' + (currentUser.workerId || '—');
    
    if (typeof renderAvatar === 'function') {
      renderAvatar(document.getElementById('userAvatar'), currentUser.avatar, currentUser.name);
    }
    
    const topbarBranchName = document.getElementById('topbarBranchName');
    const topbarBranchId = document.getElementById('topbarBranchId');
    if (topbarBranchName) topbarBranchName.textContent = 'شعبه';
    if (topbarBranchId) topbarBranchId.textContent = 'شناسه شعبه: ' + (currentUser.branchId || '—');
    
    const navMenu = document.getElementById('navMenu');
    if (navMenu) {
      navMenu.innerHTML = MENU_ITEMS.map((i, n) => 
        ((n === 0 || MENU_ITEMS[n-1].section !== i.section) 
          ? '<div class="nav-section-label">' + i.section + '</div>' 
          : '') +
        '<div class="nav-item zv-nav-item" data-page="' + i.id + '">' +
          '<span class="nav-icon">' + i.icon + '</span>' +
          '<span>' + i.label + '</span>' +
        '</div>'
      ).join('');
      
      navMenu.querySelectorAll('.nav-item').forEach(item => {
        item.addEventListener('click', () => {
          navMenu.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
          item.classList.add('active');
          loadPage(item.dataset.page);
          if (typeof closeMobileMenu === 'function') closeMobileMenu();
        });
      });
      
      const dashBtn = navMenu.querySelector('[data-page="dashboard"]');
      if (dashBtn) dashBtn.classList.add('active');
    }
    
    loadBrand();
    loadSupervisorIdentity();
    loadPage('dashboard');
  }

  function loadBrand() {
    callServer('getSupervisorBrandSettings', [currentToken], s => {
      const url = s && s.logoUrl;
      if (url) {
        ['brandLogo', 'loginLogo'].forEach(id => {
          const im = document.getElementById(id);
          if (im) {
            im.src = url;
            im.hidden = false;
            im.style.width = '100%';
            im.style.maxWidth = '220px';
            im.style.height = 'auto';
            im.style.maxHeight = '60px';
            im.style.objectFit = 'contain';
          }
        });
        const brandText = document.getElementById('brandText');
        const loginBrandText = document.getElementById('loginBrandText');
        if (brandText) brandText.hidden = true;
        if (loginBrandText) loginBrandText.hidden = true;
      }
    }, e => console.warn('Brand settings:', e.message));
  }

  function loadSupervisorIdentity() {
    callServer('getSupervisorProfile', [currentToken], p => {
      currentUser = Object.assign({}, currentUser, p || {});
      const topbarBranchName = document.getElementById('topbarBranchName');
      const topbarBranchId = document.getElementById('topbarBranchId');
      const userName = document.getElementById('userName');
      const userRole = document.getElementById('userRole');
      
      if (topbarBranchName) topbarBranchName.textContent = (p && p.branchName) || 'شعبه';
      if (topbarBranchId) topbarBranchId.textContent = 'شناسه شعبه: ' + ((p && p.branchId) || '—');
      if (userName) userName.textContent = (p && p.name) || currentUser.name || 'سوپروایزر';
      if (userRole) userRole.textContent = 'شناسه کاربر: ' + ((p && p.workerId) || '—');
      
      if (typeof renderAvatar === 'function') {
        renderAvatar(document.getElementById('userAvatar'), p && p.avatar, (p && p.name) || currentUser.name);
      }
    }, e => console.warn('Supervisor identity:', e && e.message || e));
  }

  function loadPage(page) {
    currentPage = page;
    const item = MENU_ITEMS.find(x => x.id === page);
    const topbarPageTitle = document.getElementById('topbarPageTitle');
    if (topbarPageTitle) topbarPageTitle.textContent = item ? item.label : 'پنل سرپرست';
    
    const pageContent = document.getElementById('pageContent');
    if (pageContent) {
      pageContent.innerHTML = '<div class="loading zv-loading"><div class="spinner zv-spinner"></div><p>در حال بارگذاری…</p></div>';
    }
    
    const f = {
      dashboard: loadDashboard, groups: loadGroups, members: loadMembers,
      cards: loadCards, messages: loadSupervisorMessages, returned: loadReturned,
      reports: loadReports, submissions: loadSubmissions, profile: loadProfile
    };
    if (f[page]) f[page]();
    else loadDashboard();
  }

  function loadGroupsData(cb) {
    callServer('getSupervisorGroups', [currentToken], g => {
      supervisorGroups = Array.isArray(g) ? g : [];
      if (cb) cb(supervisorGroups);
    }, handleError);
  }

  function loadDashboard() {
    callServer('getSupervisorDashboard', [currentToken], d => {
      const cards = [
        ['تعداد گروه‌ها', d.groups, ''],
        ['اعضای فعال گروه', d.activeMembers, 'green'],
        ['اعضای مشغول به کار', d.busyMembers, 'yellow'],
        ['کارت‌های جدید', d.newCards, 'blue'],
        ['کارت‌های در حال اجرا', d.inProgressCards, 'yellow'],
        ['کارت‌های تکمیل‌شده', d.completedCards, 'green'],
        ['کارت‌های لغوشده', d.cancelledCards, 'red']
      ];
      const pageContent = document.getElementById('pageContent');
      if (pageContent) {
        pageContent.innerHTML = 
          '<div class="welcome-banner">' +
            '<div><h2>خوش آمدید، ' + esc(currentUser.name || 'سرپرست عزیز') + ' 👋</h2>' +
            '<p>وضعیت گروه‌ها و عملیات تحت نظارت شما در یک نگاه.</p></div>' +
            '<div class="welcome-icon">📊</div>' +
          '</div>' +
          '<div class="page-header"><h1 class="page-title">نمای کلی عملیات</h1>' +
          '<button class="zv-btn zv-btn-secondary" onclick="loadDashboard()">↻ بروزرسانی</button></div>' +
          '<div class="stats-grid">' +
            cards.map(x => '<div class="zv-stat ' + x[2] + '"><div class="zv-stat-label">' + x[0] + '</div><div class="zv-stat-value">' + toFa(x[1]) + '</div></div>').join('') +
          '</div>' +
          '<div class="zv-card"><h3 class="zv-card-title">گروه‌های تحت مدیریت</h3>' +
          '<div class="zv-table-wrap" style="margin-top:12px"><table class="zv-table"><thead><tr><th>کد گروه</th><th>نام گروه</th><th>منطقه</th><th>وضعیت</th><th>اعضا</th><th>عملیات</th></tr></thead><tbody>' +
          (d.groupRows || []).map(g => 
            '<tr><td>' + esc(g.groupId) + '</td><td>' + esc(g.name) + '</td><td>' + esc(g.area || '—') + '</td><td>' + statusBadge(g.status) + '</td><td>' + toFa(g.members) + '</td>' +
            '<td><button class="zv-btn zv-btn-primary zv-btn-sm" onclick="viewMembers(\'' + esc(g.groupId) + '\')">اعضا</button></td></tr>'
          ).join('') +
          '</tbody></table></div></div>';
      }
    }, handleError);
  }

  function loadGroups() {
    loadGroupsData(groups => {
      const pageContent = document.getElementById('pageContent');
      if (pageContent) {
        pageContent.innerHTML = '<div class="page-header"><h1 class="page-title">گروه‌های من</h1></div>' +
          (groups.length 
            ? '<div class="zv-card"><div class="zv-table-wrap"><table class="zv-table"><thead><tr><th>کد</th><th>نام</th><th>منطقه</th><th>نوع</th><th>وضعیت</th><th>اعضا</th><th>عملیات</th></tr></thead><tbody>' +
              groups.map(g => 
                '<tr><td>' + esc(g.groupId) + '</td><td>' + esc(g.name) + '</td><td>' + esc(g.area || '—') + '</td><td>' + esc(g.groupType || '—') + '</td><td>' + statusBadge(g.status) + '</td><td>' + toFa(g.totalMembers || 0) + '</td>' +
                '<td><button class="zv-btn zv-btn-primary zv-btn-sm" onclick="viewMembers(\'' + esc(g.groupId) + '\')">اعضا</button> <button class="zv-btn zv-btn-secondary zv-btn-sm" data-group="' + esc(g.groupId) + '" onclick="editGroup(this.dataset.group)">ویرایش</button></td></tr>'
              ).join('') +
            '</tbody></table></div></div>'
            : '<div class="zv-card">گروهی برای این حساب ثبت نشده است.</div>'
          );
      }
    });
  }

  function editGroup(id) {
    const g = supervisorGroups.find(x => x.groupId === id);
    if (!g) return toast('اطلاعات گروه پیدا نشد', 'error');
    openModal(
      '<div class="modal-header"><h2>ویرایش اطلاعات گروه</h2><button class="modal-close" onclick="closeModal()">×</button></div>' +
      '<div class="form-grid">' +
        '<div class="zv-field"><label>نام گروه</label><input id="egName" class="zv-input" value="' + esc(g.name) + '"></div>' +
        '<div class="zv-field"><label>منطقه فعالیت</label><input id="egArea" class="zv-input" value="' + esc(g.area || '') + '"></div>' +
        '<div class="zv-field"><label>نوع گروه</label><input id="egType" class="zv-input" value="' + esc(g.groupType || '') + '"></div>' +
        '<div class="zv-field full"><label>توضیحات</label><textarea id="egDescription" class="zv-textarea">' + esc(g.description || '') + '</textarea></div>' +
      '</div>' +
      '<div class="modal-footer"><button class="zv-btn zv-btn-secondary" onclick="closeModal()">انصراف</button><button class="zv-btn zv-btn-primary" onclick="saveGroupEdit(\'' + esc(id) + '\')">ذخیره</button></div>'
    );
  }

  function saveGroupEdit(id) {
    const p = { name: document.getElementById('egName').value.trim(), area: document.getElementById('egArea').value.trim(), groupType: document.getElementById('egType').value.trim(), description: document.getElementById('egDescription').value.trim() };
    if (!p.name) return toast('نام گروه الزامی است', 'error');
    callServer('updateSupervisorGroup', [id, p, currentToken], () => {
      closeModal();
      toast('اطلاعات گروه ویرایش شد', 'success');
      loadGroups();
    }, handleError);
  }

  function viewMembers(id) { currentGroupId = id; loadPage('members'); }

  function loadMembers() {
    callServer('getSupervisorMemberStatuses', [currentToken], s => {
      memberStatuses = Array.isArray(s) ? s : [];
      loadGroupsData(groups => {
        if (!groups.length) {
          document.getElementById('pageContent').innerHTML = '<div class="page-header"><h1 class="page-title">اعضای گروه</h1></div><div class="zv-card">گروهی برای نمایش وجود ندارد.</div>';
          return;
        }
        if (!currentGroupId || !groups.some(g => g.groupId === currentGroupId)) currentGroupId = groups[0].groupId;
        document.getElementById('pageContent').innerHTML = 
          '<div class="page-header"><h1 class="page-title">اعضای گروه</h1><button class="zv-btn zv-btn-primary" onclick="openAddMember()">＋ افزودن عضو</button></div>' +
          '<div class="zv-card">' +
            '<div class="zv-field"><label>انتخاب گروه</label><select id="memberGroup" class="zv-select" onchange="currentGroupId=this.value;fetchMembers()">' +
              groups.map(g => '<option value="' + esc(g.groupId) + '" ' + (g.groupId === currentGroupId ? 'selected' : '') + '>' + esc(g.name) + ' — ' + esc(g.groupId) + '</option>').join('') +
            '</select></div>' +
            '<div id="membersContent" style="margin-top:14px"></div>' +
          '</div>';
        fetchMembers();
      });
    }, handleError);
  }

  function fetchMembers() {
    const host = document.getElementById('membersContent');
    if (!host) return;
    host.innerHTML = '<div class="loading zv-loading"><div class="spinner zv-spinner"></div>در حال دریافت اعضا…</div>';
    callServer('getGroupMembers', [currentGroupId, currentToken], rows => {
      rows = Array.isArray(rows) ? rows : [];
      if (!rows.length) {
        host.innerHTML = '<div class="notice">هنوز عضوی برای این گروه ثبت نشده است.</div>';
        return;
      }
      host.innerHTML = 
        '<div class="zv-table-wrap"><table class="zv-table"><thead><tr><th>شناسه یکتا</th><th>نام کامل</th><th>نام کاربری</th><th>نقش</th><th>وضعیت</th><th>عملیات</th></tr></thead><tbody>' +
        rows.map(m => 
          '<tr><td>' + esc(m.workerId || '—') + '</td><td>' + esc(m.fullName) + '</td><td>' + esc(m.username) + '</td><td>' + esc(m.role) + '</td><td>' + statusBadge(m.status) + '</td>' +
          '<td><select class="member-status-select zv-select" onchange="toggleMember(' + Number(m.rowIndex) + ',this.value,this)" data-current="' + esc(m.status) + '"><option value="">تغییر وضعیت…</option>' +
          memberStatuses.map(s => '<option value="' + esc(s) + '">' + esc(s) + '</option>').join('') +
          '</select> <button class="zv-btn zv-btn-danger zv-btn-sm" onclick="removeMember(' + Number(m.rowIndex) + ')">حذف</button></td></tr>'
        ).join('') +
        '</tbody></table></div>';
    }, handleError);
  }

  function openAddMember() {
    if (!currentGroupId) return toast('ابتدا گروه را انتخاب کنید', 'error');
    openModal(
      '<div class="modal-header"><h2>افزودن عضو به گروه</h2><button class="modal-close" onclick="closeModal()">×</button></div>' +
      '<div class="form-grid">' +
        '<div class="zv-field"><label>شناسه یکتای عضو *</label><input id="mWorkerId" class="zv-input" placeholder="Worker-ID" autocomplete="off"></div>' +
        '<div class="zv-field"><label>نقش عضو *</label><select id="mRole" class="zv-select"><option value="operator">operator</option><option value="worker">worker</option></select></div>' +
      '</div>' +
      '<div id="memberLookup" class="notice" hidden></div>' +
      '<div class="modal-footer"><button class="zv-btn zv-btn-secondary" onclick="closeModal()">انصراف</button><button class="zv-btn zv-btn-primary" onclick="saveMember()">افزودن عضو</button></div>'
    );
    document.getElementById('mWorkerId').addEventListener('blur', () => lookupWorker());
  }

  function lookupWorker() {
    const id = document.getElementById('mWorkerId').value.trim();
    if (!id) return;
    callServer('getSupervisorWorkerById', [id, currentToken], w => {
      const el = document.getElementById('memberLookup');
      el.hidden = false;
      el.textContent = w ? 'عضو شناسایی شد: ' + w.fullName + ' (' + w.username + ')' : 'شناسه یکتا در Workers پیدا نشد.';
      el.dataset.valid = w ? '1' : '0';
    }, handleError);
  }

  function saveMember() {
    const id = document.getElementById('mWorkerId').value.trim(), role = document.getElementById('mRole').value;
    if (!id) return toast('شناسه یکتا را وارد کنید', 'error');
    callServer('addGroupMember', [currentGroupId, id, role, currentToken], () => {
      closeModal();
      toast('عضو به گروه افزوده شد', 'success');
      fetchMembers();
    }, handleError);
  }

  function removeMember(row) {
    if (!confirm('عضویت این فرد از گروه حذف شود؟')) return;
    callServer('removeGroupMember', [row, currentToken], () => {
      toast('عضویت حذف شد', 'success');
      fetchMembers();
    }, handleError);
  }

  function toggleMember(row, status, el) {
    if (!status) return;
    callServer('toggleMemberStatus', [row, status, currentToken], () => {
      toast('وضعیت عضو تغییر کرد', 'success');
      fetchMembers();
    }, e => {
      if (el) el.value = '';
      handleError(e);
    });
  }

  function loadCards() {
    callServer('getSupervisorCardStatuses', [currentToken], s => {
      cardStatuses = s || [];
      document.getElementById('pageContent').innerHTML = 
        '<div class="page-header"><h1 class="page-title">کارت‌ها و سفارش‌ها</h1></div>' +
        '<div class="zv-card">' +
          '<div class="filters">' +
            '<div class="zv-field"><label>جستجو</label><input id="cdSearch" class="zv-input" placeholder="مشتری یا CardID" oninput="debounceCards()"></div>' +
            '<div class="zv-field"><label>وضعیت</label><select id="cdStatus" class="zv-select" onchange="fetchCards()"><option value="همه">همه</option>' +
            cardStatuses.map(s => '<option>' + esc(s) + '</option>').join('') +
            '</select></div>' +
          '</div>' +
          '<div id="cardsTable"></div>' +
        '</div>';
      fetchCards();
    }, handleError);
  }

  function debounceCards() {
    clearTimeout(cdTimer);
    cdTimer = setTimeout(fetchCards, 350);
  }

  function fetchCards() {
    const host = document.getElementById('cardsTable');
    if (!host) return;
    callServer('getSupervisorCards', [{search: document.getElementById('cdSearch')?.value || '', status: document.getElementById('cdStatus')?.value || 'همه'}, currentToken], rows => {
      rows = rows || [];
      host.innerHTML = rows.length 
        ? '<div class="zv-table-wrap"><table class="zv-table"><thead><tr><th>CardID</th><th>مشتری</th><th>خدمت</th><th>مبلغ</th><th>اجراکننده</th><th>وضعیت</th><th>عملیات</th></tr></thead><tbody>' +
          rows.map(r => 
            '<tr><td>' + esc(r.cardId) + '</td><td>' + esc(r.customer) + '</td><td>' + esc(r.details) + '</td><td>' + money(r.amount) + '</td><td>' + esc(r.workerName) + '</td><td>' + statusBadge(r.status) + '</td>' +
            '<td><button class="zv-btn zv-btn-primary zv-btn-sm" onclick="changeCardStatus(\'' + esc(r.cardId) + '\',\'' + esc(r.status) + '\')">وضعیت</button> <button class="zv-btn zv-btn-secondary zv-btn-sm" onclick="assignCard(\'' + esc(r.cardId) + '\')">تخصیص</button> <button class="zv-btn zv-btn-secondary zv-btn-sm" onclick="viewInvoice(\'' + esc(r.requestId) + '\')">فاکتور</button></td></tr>'
          ).join('') +
          '</tbody></table></div>'
        : '<div class="notice">کارتی با این فیلتر پیدا نشد.</div>';
    }, handleError);
  }

  function changeCardStatus(id, current) {
    if (!cardStatuses.length) return toast('وضعیت مجاز از status_Roles دریافت نشد', 'error');
    openModal(
      '<div class="modal-header"><h2>تغییر وضعیت کارت</h2><button class="modal-close" onclick="closeModal()">×</button></div>' +
      '<div class="zv-field"><label>وضعیت جدید</label><select id="newCardStatus" class="zv-select">' +
      cardStatuses.map(s => '<option ' + (s === current ? 'selected' : '') + '>' + esc(s) + '</option>').join('') +
      '</select></div>' +
      '<div class="modal-footer"><button class="zv-btn zv-btn-secondary" onclick="closeModal()">انصراف</button><button class="zv-btn zv-btn-primary" onclick="applyCardStatus(\'' + esc(id) + '\')">ثبت</button></div>'
    );
  }

  function applyCardStatus(id) {
    callServer('updateSupervisorCardStatus', [document.getElementById('newCardStatus').value, currentToken], () => { // Note: adjusted args based on typical backend
      closeModal();
      toast('وضعیت کارت ثبت شد', 'success');
      fetchCards();
    }, handleError);
  }

  function assignCard(id) {
    callServer('getSupervisorWorkersForDropdown', [currentToken], workers => {
      openModal(
        '<div class="modal-header"><h2>تخصیص کارت</h2><button class="modal-close" onclick="closeModal()">×</button></div>' +
        '<div class="zv-field"><label>عضو فعال گروه</label><select id="targetWorker" class="zv-select"><option value="">بازگشت به استخر</option>' +
        workers.map(w => '<option value="' + esc(w.id) + '">' + esc(w.name) + ' (' + esc(w.operations) + ')</option>').join('') +
        '</select></div>' +
        '<div class="modal-footer"><button class="zv-btn zv-btn-secondary" onclick="closeModal()">انصراف</button><button class="zv-btn zv-btn-primary" onclick="executeAssign(\'' + esc(id) + '\', this.querySelector(\'#targetWorker\').value)">تأیید</button></div>'
      );
    }, handleError);
  }

  function executeAssign(id, workerId) {
    callServer('assignCardToWorker', [id, workerId, currentToken], () => {
      closeModal();
      toast('تخصیص کارت ثبت شد', 'success');
      fetchCards();
    }, handleError);
  }

  function viewInvoice(id) {
    callServer('getSupervisorOrderInvoice', [id, currentToken], o => {
      openModal(
        '<div class="modal-header"><h2>فاکتور ' + esc(o.requestId) + '</h2><button class="modal-close" onclick="closeModal()">×</button></div>' +
        '<div class="invoice-box"><div class="invoice-header"><img id="invoiceLogo" alt="ZingoVingo" style="max-width:120px;max-height:60px;object-fit:contain"><h2>فاکتور خدمات</h2></div>' +
        [['تاریخ ثبت', o.date], ['مشتری', o.customer], ['موبایل', o.phone], ['خدمت', o.service + ' × ' + toFa(o.qty)],
         ['تاریخ اجرا', (o.executeDate || '') + ' ' + (o.executeTime || '')], ['آدرس', o.address],
         ['خدمات جانبی', o.sideServices || 'ندارد'], ['توضیحات', o.notes || '—'],
         ['قیمت پایه', money(o.basePrice)], ['تخفیف', money(o.discount)], ['مالیات', money(o.tax)], ['مبلغ نهایی', money(o.finalPrice)]
        ].map(x => '<div class="invoice-row"><span>' + esc(x[0]) + '</span><strong>' + esc(x[1]) + '</strong></div>').join('') +
        '</div>' +
        '<div class="modal-footer"><button class="zv-btn zv-btn-primary" onclick="window.print()">چاپ</button><button class="zv-btn zv-btn-secondary" onclick="closeModal()">بستن</button></div>'
      );
      callServer('getSupervisorBrandSettings', [currentToken], s => {
        if (s && s.logoUrl) document.getElementById('invoiceLogo').src = s.logoUrl;
      }, () => {});
    }, handleError);
  }

  function loadReturned() {
    document.getElementById('pageContent').innerHTML = '<div class="page-header"><h1 class="page-title">کارت‌های مرجوعی</h1></div><div id="returnedContent"></div>';
    callServer('getSupervisorReturnedCards', [currentToken], rows => {
      document.getElementById('returnedContent').innerHTML = 
        '<div class="zv-card"><div class="zv-table-wrap"><table class="zv-table"><thead><tr><th>کد کارت</th><th>مشتری</th><th>خدمت</th><th>اجراکننده</th><th>وضعیت</th><th>آخرین بروزرسانی</th><th>عملیات</th></tr></thead><tbody>' +
        (rows || []).map(r => 
          '<tr><td>' + esc(r.cardId) + '</td><td>' + esc(r.customer) + '</td><td>' + esc(r.details) + '</td><td>' + esc(r.workerId) + '</td><td>' + statusBadge(r.status) + '</td><td>' + esc(r.updatedAt) + '</td>' +
          '<td><button class="zv-btn zv-btn-primary zv-btn-sm" onclick="changeCardStatus(\'' + esc(r.cardId) + '\',\'' + esc(r.status) + '\')">تغییر وضعیت</button></td></tr>'
        ).join('') +
        '</tbody></table></div></div>';
    }, handleError);
  }

  function loadReports() {
    document.getElementById('pageContent').innerHTML = 
      '<div class="page-header"><h1 class="page-title">گزارشات گروه</h1></div>' +
      '<div class="zv-card">' +
        '<div class="filters">' +
          '<div class="zv-field"><label>از تاریخ شمسی</label><input id="repFrom" class="zv-input" placeholder="1405/01/01"></div>' +
          '<div class="zv-field"><label>تا تاریخ شمسی</label><input id="repTo" class="zv-input" placeholder="1405/12/29"></div>' +
          '<div class="zv-field"><label>&nbsp;</label><button class="zv-btn zv-btn-primary" onclick="fetchReports()">نمایش گزارش</button></div>' +
        '</div>' +
        '<div id="repContent"></div>' +
      '</div>';
    fetchReports();
  }

  function fetchReports() {
    callServer('getSupervisorReports', [currentToken, document.getElementById('repFrom')?.value || '', document.getElementById('repTo')?.value || ''], rep => {
      document.getElementById('repContent').innerHTML = 
        '<div class="stats-grid">' +
          [['کل کارت‌ها', rep.totalCards], ['تکمیل‌شده', rep.completedCards], ['در حال انجام', rep.inProgressCards], ['درآمد ثبت‌شده', money(rep.totalRevenue)]]
          .map(x => '<div class="zv-stat"><div class="zv-stat-label">' + x[0] + '</div><div class="zv-stat-value">' + (typeof x[1] === 'number' ? toFa(x[1]) : x[1]) + '</div></div>').join('') +
        '</div>' +
        '<div class="zv-card"><h3 class="zv-card-title">عملکرد اعضا</h3><div class="zv-table-wrap"><table class="zv-table"><thead><tr><th>نام</th><th>کل کارت</th><th>تکمیل‌شده</th><th>مبلغ کارت‌ها</th></tr></thead><tbody>' +
        (rep.byWorker || []).map(w => '<tr><td>' + esc(w.name) + '</td><td>' + toFa(w.total) + '</td><td>' + toFa(w.completed) + '</td><td>' + money(w.revenue) + '</td></tr>').join('') +
        '</tbody></table></div></div>' +
        '<div class="zv-card"><h3 class="zv-card-title">ریز کارت‌ها</h3><div class="zv-table-wrap"><table class="zv-table"><thead><tr><th>تاریخ</th><th>CardID</th><th>مشتری</th><th>مبلغ</th><th>وضعیت</th></tr></thead><tbody>' +
        (rep.transactions || []).map(t => '<tr><td>' + esc(t.date) + '</td><td>' + esc(t.cardId) + '</td><td>' + esc(t.customer) + '</td><td>' + money(t.amount) + '</td><td>' + statusBadge(t.status) + '</td></tr>').join('') +
        '</tbody></table></div></div>';
    }, handleError);
  }

  function loadSubmissions() {
    document.getElementById('pageContent').innerHTML = 
      '<div class="page-header"><h1 class="page-title">ثبت گزارش و درخواست</h1></div>' +
      '<div class="zv-card">' +
        '<div class="form-grid">' +
          '<div class="zv-field"><label>نوع ثبت</label><select id="submissionType" class="zv-select" onchange="renderSubmissionForm()"><option value="performance">گزارش عملکرد عضو</option><option value="misconduct">گزارش تخلف عضو</option><option value="damage">گزارش خسارت</option><option value="branch_request">درخواست بررسی از شعبه</option><option value="technical_issue">گزارش مشکل فنی پنل</option></select></div>' +
          '<div class="zv-field"><label>گروه مرتبط</label><select id="submissionGroup" class="zv-select"></select></div>' +
          '<div class="zv-field"><label>شناسه عضو</label><input id="submissionWorker" class="zv-input" placeholder="Worker-ID"></div>' +
          '<div class="zv-field"><label>کد کارت</label><input id="submissionCard" class="zv-input" placeholder="Card-ID"></div>' +
          '<div class="zv-field full"><label>عنوان *</label><input id="submissionTitle" class="zv-input" maxlength="150"></div>' +
          '<div class="zv-field full"><label>شرح کامل *</label><textarea id="submissionDetails" class="zv-textarea" rows="5"></textarea></div>' +
          '<div class="zv-field full"><label>مبلغ خسارت</label><input id="submissionAmount" class="zv-input" inputmode="numeric"></div>' +
        '</div>' +
        '<div class="form-actions"><button class="zv-btn zv-btn-primary" onclick="submitSupervisorRecord()">ثبت و ارسال</button><button class="zv-btn zv-btn-secondary" onclick="loadMySubmissions()">مشاهده ثبت‌های من</button></div>' +
        '<div class="notice">ثبت‌ها در گزارش رویدادهای فعلی سیستم ذخیره می‌شوند.</div>' +
        '<div id="mySubmissions"></div>' +
      '</div>';
    loadGroupsData(g => {
      document.getElementById('submissionGroup').innerHTML = g.map(x => '<option value="' + esc(x.groupId) + '">' + esc(x.name) + ' (' + esc(x.groupId) + ')</option>').join('');
    });
  }

  function renderSubmissionForm() {
    document.getElementById('submissionAmount').disabled = document.getElementById('submissionType').value !== 'damage';
  }

  function submitSupervisorRecord() {
    const p = {
      type: document.getElementById('submissionType').value,
      groupId: document.getElementById('submissionGroup').value,
      workerId: document.getElementById('submissionWorker').value.trim(),
      cardId: document.getElementById('submissionCard').value.trim(),
      title: document.getElementById('submissionTitle').value.trim(),
      details: document.getElementById('submissionDetails').value.trim(),
      amount: document.getElementById('submissionAmount').value
    };
    if (!p.title || !p.details) return toast('عنوان و شرح را تکمیل کنید', 'error');
    callServer('submitSupervisorRecord', [p, currentToken], r => {
      toast(r.message || 'ثبت شد', 'success');
      document.getElementById('submissionTitle').value = '';
      document.getElementById('submissionDetails').value = '';
      document.getElementById('submissionAmount').value = '';
      loadMySubmissions();
    }, handleError);
  }

  function loadMySubmissions() {
    callServer('getMySupervisorSubmissions', [currentToken], rows => {
      document.getElementById('mySubmissions').innerHTML = 
        '<h3 style="margin-top:18px">ثبت‌های اخیر من</h3>' +
        '<div class="zv-table-wrap"><table class="zv-table"><thead><tr><th>تاریخ</th><th>نوع</th><th>عنوان</th><th>نتیجه ثبت</th></tr></thead><tbody>' +
        (rows || []).map(r => '<tr><td>' + esc(r.date) + '</td><td>' + esc(r.type) + '</td><td>' + esc(r.title) + '</td><td>' + esc(r.result) + '</td></tr>').join('') +
        '</tbody></table></div>';
    }, handleError);
  }

  function loadSupervisorMessages() {
    document.getElementById('pageContent').innerHTML = 
      '<div class="page-header"><h1 class="page-title">مکاتبات متخصصان</h1><button class="zv-btn zv-btn-secondary" onclick="loadSupervisorMessages()">بروزرسانی</button></div>' +
      '<div class="zv-card"><div id="supervisorThreads">در حال دریافت…</div></div>' +
      '<div id="supervisorThreadDetail"></div>';
    callServer('supervisorGetConversations', [currentToken], rows => {
      const h = document.getElementById('supervisorThreads');
      if (!rows || !rows.length) {
        h.textContent = 'مکاتبه‌ای ثبت نشده است.';
        return;
      }
      h.innerHTML = rows.map(t => 
        '<div class="detail-item" style="margin:8px 0;cursor:pointer" onclick="openSupervisorThread(\'' + esc(t.threadId) + '\')">' +
          '<b>' + esc(t.subject) + '</b>' +
          '<div>متخصص: ' + esc(t.workerUsername) + ' | کارت: ' + esc(t.cardId) + ' | خوانده‌نشده: ' + toFa(t.unreadCount) + '</div>' +
          '<small>' + esc(t.preview) + '</small>' +
        '</div>'
      ).join('');
    }, handleError);
  }

  function openSupervisorThread(id) {
    callServer('supervisorGetConversation', [id, currentToken], d => {
      const h = document.getElementById('supervisorThreadDetail');
      h.innerHTML = 
        '<div class="zv-card"><h3 class="zv-card-title">' + esc(d.thread.subject) + ' — ' + esc(d.thread.cardId) + '</h3>' +
        '<div id="supervisorMessages"></div>' +
        '<textarea id="supervisorReply" class="zv-textarea" maxlength="4000" placeholder="پاسخ به متخصص…"></textarea>' +
        '<div class="form-actions">' +
          '<button class="zv-btn zv-btn-primary" onclick="replySupervisorThread(\'' + esc(id) + '\')">ارسال پاسخ</button> ' +
          '<button class="zv-btn zv-btn-secondary" onclick="changeSupervisorThreadStatus(\'' + esc(id) + '\',\'' + (d.thread.status === 'CLOSED' ? 'OPEN' : 'CLOSED') + '\')">' +
          (d.thread.status === 'CLOSED' ? 'بازگشایی' : 'بستن مکاتبه') +
          '</button>' +
        '</div></div>';
      document.getElementById('supervisorMessages').innerHTML = (d.messages || []).map(m => 
        '<div class="detail-item" style="margin:8px 0"><b>' + esc(m.senderUsername) + '</b><div style="white-space:pre-wrap">' + esc(m.body) + '</div><small>' + esc(m.createdAt) + '</small></div>'
      ).join('');
    }, handleError);
  }

  function replySupervisorThread(id) {
    const b = document.getElementById('supervisorReply').value.trim();
    if (!b) return toast('متن پاسخ را وارد کنید', 'error');
    callServer('supervisorCreateConversationReply', [id, b, currentToken], () => openSupervisorThread(id), handleError);
  }

  function changeSupervisorThreadStatus(id, status) {
    callServer('supervisorSetConversationStatus', [id, status, currentToken], () => openSupervisorThread(id), handleError);
  }

  function loadProfile() {
    callServer('getSupervisorProfile', [currentToken], p => {
      currentUser = Object.assign({}, currentUser, p || {});
      document.getElementById('pageContent').innerHTML = 
        '<div class="page-header"><h1 class="page-title">پروفایل من</h1></div>' +
        '<div class="zv-card">' +
          '<div class="profile-photo-wrap">' +
            '<button type="button" class="profile-photo-large" id="profileAvatar" onclick="openSupervisorPhotoEditor()" aria-label="ویرایش عکس پروفایل">' +
              (p.avatar ? '<img src="' + esc(p.avatar) + '" alt="تصویر پروفایل">' : esc((p.name || '?').charAt(0))) +
            '</button>' +
            '<div class="profile-photo-actions">' +
              '<h3>' + esc(p.name || '—') + '</h3>' +
              '<small>برای انتخاب، جابه‌جایی، برش و ذخیره عکس کلیک کنید.</small>' +
              '<button class="zv-btn zv-btn-primary" type="button" onclick="openSupervisorPhotoEditor()">ویرایش عکس پروفایل</button>' +
            '</div>' +
          '</div>' +
          '<div class="employee-details" style="margin-top:20px">' +
            [['شناسه اختصاصی کاربر', p.workerId], ['نام کامل', p.name], ['نام کاربری', p.username],
             ['نقش', p.role], ['نام شعبه', p.branchName], ['شناسه شعبه', p.branchId], ['کد گروه', p.groupId]
            ].map(x => '<div class="detail-item"><div class="detail-label">' + esc(x[0]) + '</div><div class="detail-value">' + esc(x[1] || '—') + '</div></div>').join('') +
          '</div>' +
        '</div>' +
        '<div class="zv-card"><h3 class="zv-card-title">ویرایش اطلاعات حساب</h3>' +
          '<div class="form-grid" style="margin-top:12px">' +
            '<div class="zv-field"><label>نام کاربری</label><input id="newUsername" class="zv-input" value="' + esc(p.username) + '"></div>' +
            '<div class="zv-field"><label>رمز عبور جدید</label><input id="newPassword" class="zv-input" type="password" placeholder="خالی = بدون تغییر"></div>' +
            '<div class="zv-field full"><label>توضیحات</label><textarea id="newDescription" class="zv-textarea" rows="4">' + esc(p.description || '') + '</textarea></div>' +
          '</div>' +
          '<div class="form-actions"><button class="zv-btn zv-btn-primary" onclick="updateProfile()">ذخیره تغییرات</button></div>' +
        '</div>';
    }, handleError);
  }

  function openSupervisorPhotoEditor() {
    if (!window.ZVPhoto || typeof window.ZVPhoto.open !== 'function') {
      toast('ابزار ویرایش عکس هنوز بارگذاری نشده است. صفحه را تازه‌سازی کنید.', 'error');
      return;
    }
    window.ZVPhoto.open({
      token: currentToken,
      endpoint: 'uploadMyProfilePhotoV2',
      onDone: function(url) {
        currentUser.avatar = url;
        const a = document.getElementById('profileAvatar');
        if (a) a.innerHTML = '<img src="' + esc(url) + '" alt="تصویر پروفایل">';
        if (typeof renderAvatar === 'function') renderAvatar(document.getElementById('userAvatar'), url, currentUser.name);
        toast('تصویر پروفایل به‌روزرسانی شد.', 'success');
      }
    });
  }

  function updateProfile() {
    const updates = {
      username: document.getElementById('newUsername').value.trim(),
      password: document.getElementById('newPassword').value,
      description: document.getElementById('newDescription').value.trim()
    };
    callServer('updateSupervisorProfile', [updates, currentToken], () => {
      toast('اطلاعات پروفایل بروزرسانی شد', 'success');
      loadProfile();
    }, handleError);
  }

  // بازیابی نشست
  (function restoreSession() {
    try {
      const saved = localStorage.getItem('zv_supervisor_user');
      if (currentToken && saved) showApp(JSON.parse(saved));
    } catch (e) {
      localStorage.removeItem('zv_supervisor_user');
      localStorage.removeItem('zv_supervisor_token');
      currentToken = '';
    }
  })();
}
</script>
</body>
</html>
