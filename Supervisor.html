<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<base target="_top">
<title>پنل سوپروایزر | ZingoVingo</title>
<link rel="icon" type="image/png" href="favicon.png">
<script src="zv-api.js"></script>
</head>
<body>

<!-- صفحه لاگین -->
<div id="loginPage" class="login-page" style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0B1736 0%,#1a2a4d 100%)">
  <div class="login-box" style="background:#fff;border-radius:20px;padding:40px;width:min(420px,92%);box-shadow:0 20px 60px #0003">
    <img id="loginLogo" class="zv-login-logo" alt="ZingoVingo" src="LOGO.png" hidden>
    <h1 id="loginBrandText" style="color:#0B1736;text-align:center;margin-bottom:8px;font-size:28px">Zingo<span style="color:#FF6B1A">Vingo</span></h1>
    <div class="subtitle" style="text-align:center;color:#657086;margin-bottom:24px;font-size:13px">پنل سوپروایزر</div>
    <div id="loginError" style="background:#fef3f2;color:#b42318;padding:10px;border-radius:8px;margin-bottom:12px;font-size:13px;display:none"></div>
    <div id="loginLoading" style="display:none;text-align:center;color:#657086;font-size:12px;margin-top:10px">در حال ورود به پنل…</div>
    <div class="zv-field" style="margin-bottom:14px"><label>نام کاربری</label><input id="loginUser" class="zv-input" autocomplete="username"></div>
    <div class="zv-field" style="margin-bottom:14px"><label>رمز عبور</label><input id="loginPass" class="zv-input" type="password" autocomplete="current-password"></div>
    <button id="loginBtn" class="zv-btn zv-btn-primary" style="width:100%;padding:13px;margin-top:8px" onclick="doLogin()">ورود به پنل</button>
  </div>
</div>

<!-- اپلیکیشن اصلی -->
<div id="appContainer" class="app" style="display:none;grid-template-columns:255px minmax(0,1fr);min-height:100vh">
  <aside class="sidebar zv-sidebar" id="sidebar" style="width:255px;background:#0B1736;padding:0;position:sticky;top:0;height:100vh;min-height:100vh;box-shadow:4px 0 22px rgba(11,23,54,.06);overflow-y:auto">
    <div class="brand" style="padding:22px 18px 24px;border-bottom:1px solid #ffffff20;text-align:right;min-height:112px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:5px">
      <img id="brandLogo" class="zv-brand-logo" alt="ZingoVingo" src="LOGO.png" hidden>
      <h2 id="brandText" style="font-size:20px;line-height:1.3;color:#fff;letter-spacing:-.3px;margin:0">Zingo<span style="color:#FF6B1A">Vingo</span></h2>
      <small style="font-size:10px;color:#b9c2d6">پنل سوپروایزر</small>
    </div>
    <nav class="nav-menu zv-nav-menu" id="navMenu" style="padding:12px 12px;overflow-y:auto"></nav>
    <div class="sidebar-footer" style="padding:14px 16px;border-top:1px solid #ffffff20;background:#ffffff09">
      <div class="user-info" style="margin-bottom:12px;display:flex;align-items:center;gap:10px">
        <div class="user-avatar zv-profile-avatar" id="userAvatar" style="width:36px;height:36px;min-width:36px;border-radius:50%;background:#ffeadf;color:#bd4a0d;font-weight:800;font-size:14px;display:grid;place-items:center;overflow:hidden">?</div>
        <div>
          <div class="user-name" id="userName" style="font-size:12px;color:#fff">—</div>
          <div class="user-role" id="userRole" style="font-size:10px;color:#b9c2d6">سوپروایزر</div>
        </div>
      </div>
      <button class="logout-btn" style="border:1px solid #ffffff25;border-radius:9px;color:#d4dced;padding:9px 12px;font-size:11px;transition:.2s;background:transparent;cursor:pointer;width:100%" onclick="doLogout()">🚪 خروج</button>
    </div>
  </aside>
  <div id="menuBackdrop" class="menu-backdrop" style="display:none;position:fixed;inset:0;background:#07112788;z-index:40" onclick="closeMobileMenu()"></div>
  <main class="main" style="padding:24px 30px 42px;min-width:0;overflow-x:hidden;background:#f3f5f9">
    <header class="main-topbar" style="display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:23px;min-height:48px">
      <div class="topbar-left" style="display:flex;align-items:center;gap:12px;min-width:0">
        <button class="menu-toggle zv-btn zv-btn-secondary" style="display:none;background:#fff;color:#0B1736;border:1px solid #e7eaf1;padding:9px 11px;border-radius:9px;cursor:pointer" onclick="toggleMobileMenu()" aria-label="باز کردن منو">☰ منو</button>
        <div>
          <div class="topbar-crumb" style="font-size:11px;color:#74809a;margin-bottom:2px">ZingoVingo / پنل سرپرست</div>
          <div class="topbar-title" id="topbarPageTitle" style="font-size:21px;font-weight:900;color:#0B1736;line-height:1.45">داشبورد</div>
        </div>
      </div>
      <div class="topbar-user zv-branch-chip" id="zvBranchChip">
        <div class="zv-branch-icon">⌂</div>
        <div>
          <b class="zv-branch-name" id="topbarBranchName">شعبه</b>
          <div class="zv-branch-id" id="topbarBranchId">شناسه شعبه: —</div>
        </div>
      </div>
    </header>
    <div id="pageContent"><div class="zv-loading"><div class="zv-spinner"></div><p>در حال بارگذاری…</p></div></div>
  </main>
</div>

<div id="toast" class="zv-toast"></div>
<div id="modal" class="zv-modal-backdrop"><div class="zv-modal" id="modalBox"></div></div>

<div data-include="ZV-UI"></div>
<div data-include="PhotoEditor"></div>

<script>
'use strict';
const $ = id => document.getElementById(id);
const money = n => new Intl.NumberFormat('en-US').format(Math.round(Number(n)||0)) + ' ریال';
const toFa = n => new Intl.NumberFormat('fa-IR').format(Number(n)||0);
const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let currentToken = localStorage.getItem('zv_supervisor_token') || '';
let currentUser = null, currentPage = 'dashboard', currentGroupId = '', supervisorGroups = [], memberStatuses = [], cardStatuses = [];
let cdTimer = null;

const MENU_ITEMS = [
  {id:'dashboard',label:'داشبورد',icon:'▦',section:'مدیریت عملیات'},
  {id:'groups',label:'گروه‌های من',icon:'◫',section:'مدیریت عملیات'},
  {id:'members',label:'اعضای گروه',icon:'♙',section:'مدیریت عملیات'},
  {id:'cards',label:'کارت‌ها و سفارش‌ها',icon:'▤',section:'مدیریت عملیات'},
  {id:'messages',label:'مکاتبات متخصصان',icon:'✉',section:'مدیریت عملیات'},
  {id:'returned',label:'کارت‌های مرجوعی',icon:'↩',section:'مدیریت عملیات'},
  {id:'reports',label:'گزارش عملکرد',icon:'◷',section:'مدیریت عملیات'},
  {id:'submissions',label:'ثبت گزارش و درخواست',icon:'＋',section:'ثبت و پیگیری'},
  {id:'profile',label:'پروفایل من',icon:'◎',section:'حساب کاربری'}
];

function callServer(name,args,success,failure){
  const runner=google.script.run.withSuccessHandler(v=>{if(success)success(v);}).withFailureHandler(e=>{if(failure)failure(e);else handleError(e);});
  runner[name].apply(runner,args||[]);
}
function handleError(e){const m=e&&e.message?e.message:String(e||'خطای نامشخص');toast(m,'error');if(/نشست منقضی|ابتدا وارد شوید|دسترسی غیرمجاز/i.test(m))forceLogout();}
function toast(msg,type='info'){const t=$('toast');if(!t)return;t.textContent=msg;t.className='zv-toast show '+type;clearTimeout(toast._timer);toast._timer=setTimeout(()=>t.classList.remove('show'),4000);}
function openModal(html){$('modalBox').innerHTML='<div class="zv-modal-header"><h3 id="modalTitle">عنوان</h3><button class="zv-modal-close" onclick="closeModal()">×</button></div><div class="zv-modal-body">'+html+'</div>';$('modal').classList.add('is-open');}
function closeModal(){$('modal').classList.remove('is-open');}
$('modal').addEventListener('click',e=>{if(e.target===$('modal'))closeModal();});

function statusBadge(s){
  const x=String(s||'');
  let c='info';
  if(/تکمیل|انجام شده|completed/i.test(x)) c='done';
  else if(/لغو|مرجوع|cancel/i.test(x)) c='cancel';
  else if(/جدید|new/i.test(x)) c='new';
  else if(/ارجاع/i.test(x)) c='warning';
  else if(/تعلیق/i.test(x)) c='warning';
  else if(/در حال|درحال|progress|اجرا/i.test(x)) c='progress';
  return '<span class="zv-badge zv-badge-'+c+'">'+esc(x||'—')+'</span>';
}

function setLoginBusy(b){$('loginLoading').style.display=b?'block':'none';$('loginBtn').disabled=!!b;$('loginBtn').textContent=b?'در حال ورود...':'ورود به پنل';}

function doLogin(){
  const u=$('loginUser').value.trim(),p=$('loginPass').value;
  if(!u||!p){$('loginError').textContent='نام کاربری و رمز عبور را وارد کنید';$('loginError').style.display='block';return;}
  setLoginBusy(true);$('loginError').style.display='none';
  callServer('supervisorLogin',[u,p],r=>{
    setLoginBusy(false);
    if(!r||!r.success||!r.token){$('loginError').textContent=(r&&r.message)||'ورود تأیید نشد';$('loginError').style.display='block';return;}
    currentToken=r.token;currentUser=r.user||{};
    localStorage.setItem('zv_supervisor_token',currentToken);
    localStorage.setItem('zv_supervisor_user',JSON.stringify(currentUser));
    showApp(currentUser);
  },e=>{setLoginBusy(false);$('loginError').textContent=e.message||'خطا در ورود';$('loginError').style.display='block';});
}

function doLogout(){const t=currentToken;forceLogout();if(t)callServer('supervisorLogout',[t],()=>{},()=>{});}
function forceLogout(){localStorage.removeItem('zv_supervisor_token');localStorage.removeItem('zv_supervisor_user');currentToken='';currentUser=null;location.reload();}
function closeMobileMenu(){$('sidebar').classList.remove('open');$('menuBackdrop').style.display='none';}
function toggleMobileMenu(){const sb=$('sidebar');sb.classList.toggle('open');$('menuBackdrop').style.display=sb.classList.contains('open')?'block':'none';}

function showApp(user){
  currentUser=user||{};
  $('loginPage').style.display='none';$('appContainer').style.display='grid';
  $('userName').textContent=currentUser.name||'سوپروایزر';
  $('userRole').textContent='شناسه کاربر: '+(currentUser.workerId||'—');
  renderAvatar($('userAvatar'),currentUser.avatar,currentUser.name);
  $('topbarBranchName').textContent='شعبه';
  $('topbarBranchId').textContent='شناسه شعبه: '+(currentUser.branchId||'—');
  
  $('navMenu').innerHTML=MENU_ITEMS.map((i,n)=>{
    const section=(n===0||MENU_ITEMS[n-1].section!==i.section)?'<div class="zv-nav-section-label">'+i.section+'</div>':'';
    const unread=i.id==='messages'?'<span class="zv-unread-badge" id="zvUnreadMessages" hidden>0</span>':'';
    return section+'<div class="zv-nav-item zv-nav-item" data-page="'+i.id+'"><span class="zv-nav-icon">'+i.icon+'</span><span>'+i.label+'</span>'+unread+'</div>';
  }).join('');
  
  $('navMenu').querySelectorAll('.zv-nav-item').forEach(item=>{
    item.addEventListener('click',()=>{
      document.querySelectorAll('.zv-nav-item').forEach(n=>n.classList.remove('active'));
      item.classList.add('active');
      loadPage(item.dataset.page);
      closeMobileMenu();
    });
  });
  $('navMenu').querySelector('[data-page="dashboard"]')?.classList.add('active');
  loadBrand();
  loadSupervisorIdentity();
  loadPage('dashboard');
  zvRefreshUnreadMessages_();
}

function renderAvatar(el,url,name){
  if(url){el.innerHTML='<img alt="" src="'+esc(url)+'" style="width:100%;height:100%;object-fit:cover">';}
  else el.textContent=(name||'?').charAt(0);
}

function loadBrand(){
  callServer('getSupervisorBrandSettings',[currentToken],s=>{
    const url=s&&s.logoUrl;
    if(url){
      ['brandLogo','loginLogo'].forEach(id=>{
        const im=$(id);
        if(im){im.src=url;im.hidden=false;}
      });
      $('brandText').hidden=true;$('loginBrandText').hidden=true;
    }
  },e=>console.warn('Brand settings:',e.message));
}

(function restoreSession(){
  try{const saved=localStorage.getItem('zv_supervisor_user');if(currentToken&&saved)showApp(JSON.parse(saved));}
  catch(e){localStorage.removeItem('zv_supervisor_user');localStorage.removeItem('zv_supervisor_token');currentToken='';}
})();

document.addEventListener('click',e=>{
  if(window.innerWidth<=900&&$('sidebar').classList.contains('open')&&!$('sidebar').contains(e.target)&&!$('menuBackdrop').contains(e.target)&&!e.target.closest('.menu-toggle'))closeMobileMenu();
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){closeModal();closeMobileMenu();}
  if(e.key==='Enter'&&$('loginPage').style.display!=='none')doLogin();
});

function loadPage(page){
  currentPage=page;
  const item=MENU_ITEMS.find(x=>x.id===page);
  if($('topbarPageTitle'))$('topbarPageTitle').textContent=item?item.label:'پنل سرپرست';
  $('pageContent').innerHTML='<div class="zv-loading"><div class="zv-spinner"></div><p>در حال بارگذاری…</p></div>';
  const f={dashboard:loadDashboard,groups:loadGroups,members:loadMembers,cards:loadCards,messages:loadSupervisorMessages,returned:loadReturned,reports:loadReports,submissions:loadSubmissions,profile:loadProfile};
  (f[page]||loadDashboard)();
  if(page!=='messages')zvRefreshUnreadMessages_();
}

function loadGroupsData(cb){
  callServer('getSupervisorGroups',[currentToken],g=>{
    supervisorGroups=Array.isArray(g)?g:[];
    if(cb)cb(supervisorGroups);
  },handleError);
}

function loadDashboard(){
  callServer('getSupervisorDashboard',[currentToken],d=>{
    const cards=[
      ['تعداد گروه‌ها',d.groups,''],
      ['اعضای فعال گروه',d.activeMembers,'green'],
      ['اعضای مشغول به کار',d.busyMembers,'yellow'],
      ['کارت‌های جدید',d.newCards,'blue'],
      ['کارت‌های در حال اجرا',d.inProgressCards,'yellow'],
      ['کارت‌های تکمیل‌شده',d.completedCards,'green'],
      ['کارت‌های لغوشده',d.cancelledCards,'red']
    ];
    $('pageContent').innerHTML=
      '<div class="zv-welcome-banner"><div><h2>خوش آمدید، '+esc(currentUser.name||'سرپرست عزیز')+' 👋</h2><p>وضعیت گروه‌ها و عملیات تحت نظارت شما در یک نگاه.</p></div><div class="welcome-icon">📊</div></div>'+
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:17px;flex-wrap:wrap;gap:10px"><h1 style="font-size:18px;color:#0B1736;font-weight:900;margin:0">نمای کلی عملیات</h1><button class="zv-btn zv-btn-secondary" onclick="loadDashboard()">↻ بروزرسانی</button></div>'+
      '<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:20px">'+
      cards.map(x=>'<div class="zv-stat"><div><div class="zv-stat-label">'+x[0]+'</div><div class="zv-stat-value">'+toFa(x[1])+'</div></div><div class="zv-stat-icon '+x[2]+'">▦</div></div>').join('')+
      '</div>'+
      '<div class="zv-card"><h3 class="zv-card-title">گروه‌های تحت مدیریت</h3><div class="zv-table-wrap" style="margin-top:12px"><table class="zv-table"><thead><tr><th>کد گروه</th><th>نام گروه</th><th>منطقه</th><th>وضعیت</th><th>اعضا</th><th>عملیات</th></tr></thead><tbody>'+
      (d.groupRows||[]).map(g=>'<tr><td>'+esc(g.groupId)+'</td><td>'+esc(g.name)+'</td><td>'+esc(g.area||'—')+'</td><td>'+statusBadge(g.status)+'</td><td>'+toFa(g.members)+'</td><td><button class="zv-btn zv-btn-primary zv-btn-sm" onclick="viewMembers(\''+esc(g.groupId)+'\')">اعضا</button></td></tr>').join('')+
      '</tbody></table></div></div>';
  },handleError);
}

function loadGroups(){
  loadGroupsData(groups=>{
    $('pageContent').innerHTML='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:17px;flex-wrap:wrap;gap:10px"><h1 style="font-size:18px;color:#0B1736;font-weight:900;margin:0">گروه‌های من</h1></div>'+
    (groups.length?'<div class="zv-card"><div class="zv-table-wrap"><table class="zv-table"><thead><tr><th>کد</th><th>نام</th><th>منطقه</th><th>نوع</th><th>وضعیت</th><th>اعضا</th><th>عملیات</th></tr></thead><tbody>'+
    groups.map(g=>'<tr><td>'+esc(g.groupId)+'</td><td>'+esc(g.name)+'</td><td>'+esc(g.area||'—')+'</td><td>'+esc(g.groupType||'—')+'</td><td>'+statusBadge(g.status)+'</td><td>'+toFa(g.totalMembers||0)+'</td><td><button class="zv-btn zv-btn-primary zv-btn-sm" onclick="viewMembers(\''+esc(g.groupId)+'\')">اعضا</button> <button class="zv-btn zv-btn-secondary zv-btn-sm" data-group="'+esc(g.groupId)+'" onclick="editGroup(this.dataset.group)">ویرایش</button></td></tr>').join('')+
    '</tbody></table></div></div>':'<div class="zv-card">گروهی برای این حساب ثبت نشده است.</div>');
  });
}

function editGroup(id){
  const g=supervisorGroups.find(x=>x.groupId===id);
  if(!g)return toast('اطلاعات گروه پیدا نشد','error');
  openModal('<div class="zv-field"><label>نام گروه</label><input id="egName" class="zv-input" value="'+esc(g.name)+'"></div>'+
    '<div class="zv-field"><label>منطقه فعالیت</label><input id="egArea" class="zv-input" value="'+esc(g.area||'')+'"></div>'+
    '<div class="zv-field"><label>نوع گروه</label><input id="egType" class="zv-input" value="'+esc(g.groupType||'')+'"></div>'+
    '<div class="zv-field"><label>توضیحات</label><textarea id="egDescription" class="zv-textarea">'+esc(g.description||'')+'</textarea></div>',
    'ویرایش اطلاعات گروه');
  $('modalTitle').textContent='ویرایش اطلاعات گروه';
  $('modalBox').innerHTML='<div class="zv-modal-body"><div class="zv-field" style="margin-bottom:12px"><label>نام گروه</label><input id="egName" class="zv-input" value="'+esc(g.name)+'"></div><div class="zv-field" style="margin-bottom:12px"><label>منطقه فعالیت</label><input id="egArea" class="zv-input" value="'+esc(g.area||'')+'"></div><div class="zv-field" style="margin-bottom:12px"><label>نوع گروه</label><input id="egType" class="zv-input" value="'+esc(g.groupType||'')+'"></div><div class="zv-field" style="margin-bottom:12px"><label>توضیحات</label><textarea id="egDescription" class="zv-textarea">'+esc(g.description||'')+'</textarea></div></div><div class="zv-modal-footer"><button class="zv-btn zv-btn-secondary" onclick="closeModal()">انصراف</button><button class="zv-btn zv-btn-primary" onclick="saveGroupEdit(\''+esc(id)+'\')">ذخیره</button></div>';
}

function saveGroupEdit(id){
  const p={name:$('egName').value.trim(),area:$('egArea').value.trim(),groupType:$('egType').value.trim(),description:$('egDescription').value.trim()};
  if(!p.name)return toast('نام گروه الزامی است','error');
  callServer('updateSupervisorGroup',[id,p,currentToken],()=>{closeModal();toast('اطلاعات گروه ویرایش شد','success');loadGroups();},handleError);
}

function viewMembers(id){currentGroupId=id;loadPage('members');}

function loadMembers(){
  callServer('getSupervisorMemberStatuses',[currentToken],s=>{
    memberStatuses=Array.isArray(s)?s:[];
    loadGroupsData(groups=>{
      if(!groups.length){$('pageContent').innerHTML='<div class="zv-card">گروهی برای نمایش وجود ندارد.</div>';return;}
      if(!currentGroupId||!groups.some(g=>g.groupId===currentGroupId))currentGroupId=groups[0].groupId;
      $('pageContent').innerHTML='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:17px;flex-wrap:wrap;gap:10px"><h1 style="font-size:18px;color:#0B1736;font-weight:900;margin:0">اعضای گروه</h1><button class="zv-btn zv-btn-primary" onclick="openAddMember()">＋ افزودن عضو</button></div>'+
      '<div class="zv-card"><div class="zv-field" style="margin-bottom:14px"><label>انتخاب گروه</label><select id="memberGroup" class="zv-select" onchange="currentGroupId=this.value;fetchMembers()">'+groups.map(g=>'<option value="'+esc(g.groupId)+'" '+(g.groupId===currentGroupId?'selected':'')+'>'+esc(g.name)+' — '+esc(g.groupId)+'</option>').join('')+'</select></div><div id="membersContent" style="margin-top:14px"></div></div>';
      fetchMembers();
    });
  },handleError);
}

function fetchMembers(){
  const host=$('membersContent');
  if(!host)return;
  host.innerHTML='<div class="zv-loading"><div class="zv-spinner"></div>در حال دریافت اعضا…</div>';
  callServer('getGroupMembers',[currentGroupId,currentToken],rows=>{
    rows=Array.isArray(rows)?rows:[];
    if(!rows.length){host.innerHTML='<div class="zv-notice">هنوز عضوی برای این گروه ثبت نشده است.</div>';return;}
    host.innerHTML='<div class="zv-table-wrap"><table class="zv-table"><thead><tr><th>شناسه یکتا</th><th>نام کامل</th><th>نام کاربری</th><th>نقش</th><th>وضعیت</th><th>عملیات</th></tr></thead><tbody>'+

/* مکاتبات متخصصان */
function loadSupervisorMessages(){
  $('pageContent').innerHTML='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:17px;flex-wrap:wrap;gap:10px"><h1 style="font-size:18px;color:#0B1736;font-weight:900;margin:0">مکاتبات متخصصان</h1><button class="zv-btn zv-btn-secondary" onclick="loadSupervisorMessages()">بروزرسانی</button></div><div class="zv-card"><div id="supervisorThreads">در حال دریافت…</div></div><div id="supervisorThreadDetail"></div>';
  callServer('supervisorGetConversations',[currentToken],rows=>{
    const h=$('supervisorThreads');
    if(!rows||!rows.length){h.textContent='مکاتبه‌ای ثبت نشده است.';return;}
    h.innerHTML=rows.map(t=>'<div class="zv-thread-row"><div><b>'+esc(t.subject)+'</b><div class="zv-thread-meta"><span>متخصص: '+esc(t.workerUsername)+'</span><span>کارت: '+esc(t.cardId)+'</span><span class="zv-thread-state '+(Number(t.unreadCount)>0?'unread':'read')+'">'+(Number(t.unreadCount)>0?'● خوانده‌نشده':'✓ خوانده‌شده')+'</span><span class="zv-thread-state '+(String(t.status).toUpperCase()==='CLOSED'?'closed':'open')+'">'+(String(t.status).toUpperCase()==='CLOSED'?'بسته':'باز')+'</span></div><small>'+esc(t.preview||'')+'</small></div><button class="zv-btn zv-btn-primary zv-btn-sm" onclick="openSupervisorThread(\''+esc(t.threadId)+'\')">نمایش پیام</button></div>').join('');
  },handleError);
}

function openSupervisorThread(id){
  callServer('supervisorGetConversation',[id,currentToken],d=>{
    const h=$('supervisorThreadDetail');
    h.innerHTML='<div class="zv-card" style="margin-top:17px"><h3 style="color:#0B1736;font-size:16px;margin:0 0 12px">'+esc(d.thread.subject)+' — کارت: '+esc(d.thread.cardId)+'</h3><div class="zv-thread-meta"><span class="zv-thread-state '+(String(d.thread.status).toUpperCase()==='CLOSED'?'closed':'open')+'">'+(String(d.thread.status).toUpperCase()==='CLOSED'?'بسته':'باز')+'</span></div><div id="supervisorMessages" style="margin-top:12px"></div><textarea id="supervisorReply" class="zv-textarea" maxlength="4000" placeholder="پاسخ به متخصص…" style="margin-top:12px"></textarea><div style="display:flex;gap:8px;margin-top:12px"><button class="zv-btn zv-btn-primary" onclick="replySupervisorThread(\''+esc(id)+'\')">ارسال پاسخ</button> <button class="zv-btn zv-btn-secondary" onclick="changeSupervisorThreadStatus(\''+esc(id)+'\',\''+(d.thread.status==='CLOSED'?'OPEN':'CLOSED')+'\')">'+(d.thread.status==='CLOSED'?'بازگشایی':'بستن مکاتبه')+'</button></div></div>';
    $('supervisorMessages').innerHTML=(d.messages||[]).map(m=>'<div style="margin:8px 0;padding:12px;background:#f8f9fc;border-radius:10px"><b style="color:#0B1736">'+esc(m.senderUsername)+'</b><div style="white-space:pre-wrap;margin-top:6px">'+esc(m.body)+'</div><small class="zv-muted">'+esc(m.createdAt)+'</small></div>').join('');
  },handleError);
}

function replySupervisorThread(id){
  const b=$('supervisorReply').value.trim();
  if(!b)return toast('متن پاسخ را وارد کنید','error');
  callServer('supervisorCreateConversationReply',[id,b,currentToken],()=>openSupervisorThread(id),handleError);
}

function changeSupervisorThreadStatus(id,status){
  callServer('supervisorSetConversationStatus',[id,status,currentToken],()=>openSupervisorThread(id),handleError);
}

function zvSetUnreadMessages_(rows){
  const n=(rows||[]).reduce((sum,t)=>sum+Math.max(0,Number(t.unreadCount)||0),0);
  const b=$('zvUnreadMessages');
  if(b){b.textContent=toFa(n);b.hidden=n<=0;}
}

function zvRefreshUnreadMessages_(){
  const api=google.script.run.withSuccessHandler(zvSetUnreadMessages_).withFailureHandler(e=>console.warn('Unread messages count:',e));
  api.supervisorGetUnreadConversationCount(currentToken);
}

document.addEventListener('keydown', e => { if (e.key === 'Enter' && $('loginPage').style.display !== 'none') doLogin(); });
</script>
</body>
</html>
