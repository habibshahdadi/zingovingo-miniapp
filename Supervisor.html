<style>

*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Vazirmatn',Tahoma,sans-serif;background:var(--bg);color:var(--ink);font-size:13.5px;line-height:1.8;min-height:100vh;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;z-index:-2;background:radial-gradient(700px 420px at 92% -6%,rgba(255,107,26,.14),transparent 60%),radial-gradient(640px 460px at -8% 108%,rgba(46,99,231,.13),transparent 60%),radial-gradient(520px 380px at 55% 118%,rgba(124,77,255,.09),transparent 60%)}
button,input,select,textarea{font:inherit;color:inherit}

:focus-visible{outline:3px solid rgba(255,107,26,.45);outline-offset:2px;border-radius:8px}

#app{display:none;grid-template-columns:272px minmax(0,1fr);min-height:100vh;transition:grid-template-columns var(--zv-tr)}

.brand{display:flex;gap:11px;align-items:center;padding:20px}

.nav{flex:1;padding:6px 12px 12px}

.ra{display:flex;gap:5px;justify-content:flex-end}

.req{color:var(--red)}

select{background:var(--glass);border:1px solid var(--glassBrd);color:inherit}

.zsel-opt{padding:8px 11px;border-radius:9px;color:#F2F6FF;font-size:12.5px;font-weight:600;cursor:pointer}

.zsel-opt:hover{background:rgba(255,107,26,.24)}
.zsel-opt.on{background:rgba(255,107,26,.34);font-weight:800}
.zsel-opt.muted{color:#A9B6D4}
#toasts{position:fixed;bottom:18px;left:18px;z-index:200;display:flex;flex-direction:column-reverse;gap:9px;max-width:min(400px,90vw)}
.toast{display:flex;align-items:center;gap:10px;background:var(--navy);color:#fff;padding:12px 16px;border-radius:13px;font-size:12.5px;box-shadow:var(--sh2);border-right:4px solid var(--blue)}
.toast.ok{border-right-color:var(--green)}.toast.err{border-right-color:var(--red)}.toast.warn{border-right-color:var(--amber)}
.toast button{background:rgba(255,255,255,.16);border:0;color:#fff;font-weight:900;font-size:11.5px;padding:5px 12px;border-radius:8px;cursor:pointer;margin-right:auto}
.thread{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px;background:var(--surface);transition:all var(--tr)}
.thread:hover{border-color:var(--line2);box-shadow:var(--sh)}
.thread.unread{border-right:3px solid var(--brand)}
.msgb{border:1px solid var(--line);border-radius:12px;padding:9px 12px;margin-bottom:8px;background:var(--surface);font-size:12.5px}
.msgb.me{background:rgba(255,107,26,.08);border-color:rgba(255,107,26,.3);margin-left:26px}
.msgb.them{margin-right:26px}
.msgb b{font-size:11.5px}.msgb small{color:var(--muted);font-size:10px;display:block;margin-top:4px}
.msgb .body{white-space:pre-wrap;margin:5px 0;word-break:break-word}
.chatbox{max-height:44vh;overflow-y:auto;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--surface2);margin-bottom:12px}
.modal.dk .chatbox{background:rgba(255,255,255,.04);border-color:#2E3A66}
.modal.dk .msgb{background:rgba(255,255,255,.07);border-color:#3A4880;color:#fff}
.modal.dk .msgb.me{background:rgba(255,107,26,.18);border-color:rgba(255,107,26,.45)}
.modal.dk .msgb small{color:#93A3C8}
.soon-hero{background:var(--hero);color:#fff;border-radius:20px;padding:30px;position:relative;overflow:hidden;margin-bottom:18px}
.soon-hero:before{content:"";position:absolute;inset:0;background:radial-gradient(420px 220px at 86% 15%,rgba(255,107,26,.4),transparent 60%)}
.soon-hero>*{position:relative;z-index:1}
.soon-hero .tag{display:inline-flex;gap:6px;align-items:center;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);padding:5px 14px;border-radius:20px;font-size:11px;font-weight:800;margin-bottom:12px}
.soon-hero h2{font-size:22px;font-weight:900;margin-bottom:8px}
.soon-hero p{color:#D3DCF5;font-size:12.5px;max-width:720px;line-height:2}
.prog{height:9px;border-radius:9px;background:rgba(255,255,255,.16);overflow:hidden;margin-top:16px;max-width:460px}
.prog i{display:block;height:100%;width:0;background:var(--grad);transition:width 1s cubic-bezier(.3,.9,.3,1)}
.prog-l{display:flex;justify-content:space-between;max-width:460px;font-size:11px;color:#D3DCF5;margin-top:6px;font-weight:700}
.soon-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.soon-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--sh);transition:transform var(--tr)}
.soon-card:hover{transform:translateY(-3px)}
.soon-card .sic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;margin-bottom:10px}
.soon-card h4{font-size:13.5px;font-weight:900;margin-bottom:6px}
.soon-card p{font-size:11.5px;color:var(--muted);line-height:1.9}
.rm-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--sh);display:flex;flex-direction:column;gap:10px}
.rm-top{display:flex;align-items:center;gap:11px}
.rm-ic{width:42px;height:42px;flex:0 0 42px;border-radius:12px;display:grid;place-items:center}
.rm-bar{height:8px;border-radius:8px;background:var(--surface2);border:1px solid var(--line);overflow:hidden}
.rm-bar i{display:block;height:100%;width:0;border-radius:8px;transition:width 1s cubic-bezier(.3,.9,.3,1)}
.rm-meta{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted);font-weight:800}
.rm-list{display:flex;flex-direction:column;gap:5px;font-size:11px;color:var(--muted)}
.rm-list span{display:flex;align-items:center;gap:6px}
.zv-card-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,390px),1fr));gap:16px;margin-top:14px}
.zv-work-card{background:var(--surface);border:1px solid var(--line);border-radius:17px;overflow:hidden;box-shadow:var(--sh);transition:.2s}
.zv-work-card:hover{box-shadow:var(--sh2);transform:translateY(-1px)}
.zv-work-card-head{padding:16px 18px 12px;display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.zv-work-card-title{font-size:16px;font-weight:900;color:var(--ink);margin:0 0 4px}
.zv-work-card-id{font-size:10px;color:var(--muted);direction:ltr;text-align:right}
.zv-work-card-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.zv-work-card-summary{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;padding:0 18px 15px}
.zv-work-card-stat{background:var(--surface2);border-radius:10px;padding:9px 11px;min-width:0}
.zv-work-card-stat small{display:block;color:var(--muted);font-size:10px}
.zv-work-card-stat b{display:block;color:var(--ink);font-size:12px;overflow-wrap:anywhere}
.zv-work-card-toggle{width:calc(100% - 36px);margin:0 18px 16px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);border-radius:10px;padding:10px 12px;font-weight:800;cursor:pointer}
.zv-work-card-toggle:hover{border-color:var(--brand);color:var(--brandDeep)}
.zv-work-card-detail{border-top:1px solid var(--line);padding:16px 18px 18px;background:var(--surface)}
.zv-detail-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.zv-detail-item{background:var(--surface2);border:1px solid var(--line);border-radius:9px;padding:9px 10px;min-width:0}
.zv-detail-item small{display:block;color:var(--muted);font-size:10px}
.zv-detail-item b{display:block;color:var(--ink);font-size:12px;overflow-wrap:anywhere;white-space:pre-wrap}
.zv-detail-wide{grid-column:1/-1}
.zv-card-actions{border-top:1px dashed var(--line);padding-top:13px;margin-top:14px}
.zv-card-actions-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.zv-planner-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.zv-planner-nav{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.zv-planner-week{font-weight:800;color:var(--ink);min-width:190px;text-align:center}
.zv-planner-scroll{overflow:auto;border:1px solid var(--line);border-radius:13px;background:var(--surface)}
.zv-planner-grid{display:grid;grid-template-columns:66px repeat(7,minmax(142px,1fr));min-width:1060px}
.zv-planner-head{position:sticky;top:0;z-index:3;background:var(--surface2);border-bottom:1px solid var(--line);padding:10px 7px;text-align:center;min-height:63px}
.zv-planner-head.today{background:rgba(255,107,26,.12)}
.zv-planner-head strong{display:block;color:var(--ink);font-size:12px}
.zv-planner-head small{color:var(--muted);font-size:11px}
.zv-planner-time{height:72px;padding:6px 7px;border-bottom:1px solid var(--line);color:var(--muted);font-size:10px;text-align:center;background:var(--surface2)}
.zv-planner-cell{height:72px;padding:4px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);min-width:0;position:relative}
.zv-planner-cell.today{background:rgba(255,107,26,.05)}
.zv-planner-event{display:block;width:100%;text-align:right;border:0;border-right:3px solid var(--brand);border-radius:7px;background:rgba(255,107,26,.11);padding:5px 6px;margin:0 0 4px;color:var(--ink);font:inherit;cursor:pointer;overflow:hidden}
.zv-planner-event strong{display:block;font-size:10px;line-height:1.6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.zv-planner-event small{display:block;font-size:9px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.zv-planner-event.status-new{border-right-color:var(--blue);background:rgba(46,99,231,.12)}
.zv-planner-event.status-progress{border-right-color:var(--amber);background:rgba(217,119,6,.12)}
.zv-planner-event.status-done{border-right-color:var(--green);background:rgba(14,159,110,.12)}
.zv-planner-event.status-cancel{border-right-color:var(--red);background:rgba(224,45,60,.12)}
.zv-planner-unscheduled{display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface2)}
.zv-planner-unscheduled .zv-planner-event{width:190px;margin:0}
.zv-planner-legend{display:flex;gap:12px;flex-wrap:wrap;margin:8px 0 14px;color:var(--muted);font-size:11px}
.zv-planner-legend span{display:inline-flex;align-items:center;gap:5px}
.zv-planner-dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.profile-layout{display:grid;grid-template-columns:minmax(220px,280px) 1fr;gap:22px;align-items:start}
.profile-photo-card{text-align:center;padding:22px}
.profile-photo-large{width:136px;height:136px;margin:0 auto 14px;border-radius:50%;overflow:hidden;display:grid;place-items:center;background:rgba(255,107,26,.12);color:var(--brandDeep);font-size:42px;font-weight:900;border:4px solid var(--surface);box-shadow:0 0 0 1px var(--line),0 8px 24px rgba(11,23,54,.1)}
.profile-photo-large img{width:100%;height:100%;object-fit:cover;display:block}
.profile-form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.profile-form .full{grid-column:1/-1}
.rail-btn .ra{transition:transform var(--zv-tr)}
html.zv-rail .rail-btn{color:var(--brandDeep);border-color:rgba(255,107,26,.45);background:rgba(255,107,26,.1)}
html.zv-rail .rail-btn .ra{transform:scaleX(-1)}
html.zv-rail #app{grid-template-columns:var(--rail) minmax(0,1fr)}
html.zv-rail .sidebar{width:var(--rail);overflow-x:hidden}
html.zv-rail .sidebar .brand{padding:18px 0;justify-content:center;gap:0}
html.zv-rail .sidebar .brand>div:last-child{display:none}
html.zv-rail .sidebar .mark{width:40px;height:40px}
html.zv-rail .sidebar .nav{padding:6px 10px 12px}
html.zv-rail .sidebar .nav-sec{font-size:0;height:1px;margin:14px 8px 12px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.2),transparent);overflow:hidden}
html.zv-rail .sidebar .nav-item{justify-content:center;gap:0;padding:11px 0}
html.zv-rail .sidebar .nav-item>span{display:none}
html.zv-rail .sidebar .nav-item .bdg{position:absolute;top:5px;left:7px;margin:0;min-width:9px;width:9px;height:9px;padding:0;font-size:0;box-shadow:0 0 0 2px #0B1736}
html.zv-rail .sidebar .side-foot{padding:12px 8px}
html.zv-rail .sidebar .uchip{flex-direction:column;gap:9px;padding:10px 4px}
html.zv-rail .sidebar .uchip>div:not(.av){display:none}
html.zv-rail .sidebar .av{width:34px;height:34px;font-size:14px}
#zvTip{position:fixed;z-index:300;pointer-events:none;background:linear-gradient(135deg,#0B1736,#3B2E7E);color:#fff;font-size:11.5px;font-weight:800;padding:7px 12px;border-radius:10px;white-space:nowrap;border:1px solid rgba(255,138,61,.35);box-shadow:0 12px 30px rgba(3,7,20,.45);opacity:0;transition:opacity 140ms}
#zvTip.on{opacity:1}
#zvTip b{color:#FFB25E;margin-right:6px;font-size:10.5px}
#printArea{display:none}
.loading{text-align:center;padding:44px;color:var(--muted)}
.spinner{display:inline-block;width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:1120px){
  #app,html.zv-rail #app{grid-template-columns:1fr}
  .sidebar,html.zv-rail .sidebar{position:fixed;right:0;top:0;width:276px;transform:translateX(105%);transition:transform .28s;z-index:96;box-shadow:var(--sh2)}
  .sidebar.open{transform:none}
  html.zv-rail .sidebar .brand{padding:20px;justify-content:flex-start;gap:11px}
  html.zv-rail .sidebar .brand>div:last-child{display:block}
  html.zv-rail .sidebar .nav-sec{font-size:10px;height:auto;margin:15px 10px 6px;background:none;color:#7C89B4}
  html.zv-rail .sidebar .nav-item{justify-content:flex-start;gap:11px;padding:9.5px 12px}
  html.zv-rail .sidebar .nav-item>span{display:inline}
  html.zv-rail .sidebar .nav-item .bdg{position:static;margin-right:auto;min-width:20px;width:auto;height:20px;padding:0 6px;font-size:10px;box-shadow:none}
  html.zv-rail .sidebar .uchip{flex-direction:row;padding:9px 10px}
  html.zv-rail .sidebar .uchip>div:not(.av){display:block}
  .menu-btn{display:grid}
  #zvTip{display:none!important}
}
@media(max-width:760px){
  #page{padding:16px 14px 70px}.topbar{padding:10px 14px}
  .crumb,.branch-chip{display:none}
  .fgrid,.kv,.profile-form{grid-template-columns:1fr}
  .hero .dchip{display:none}
  .topbar .btn-p span{display:none}
  .profile-layout{grid-template-columns:1fr}
  .zv-detail-grid{grid-template-columns:1fr 1fr}
  .zv-card-actions-grid{grid-template-columns:1fr 1fr}
}
@media print{body>*{display:none!important}#printArea{display:block!important;font-family:Vazirmatn,Tahoma,sans-serif}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div id="zvFatal"></div>

<div id="loginView" class="login">
  <div class="lbox">
    <div class="zv-login-logo" id="loginLogo"><img src="LOGO.png" alt="ZingoVingo" onerror="this.parentNode.style.display='none'"></div>
    <h1 class="zv-brand">Zingo<span>Vingo</span></h1>
    <div class="sub">پنل سوپروایزر — مدیریت گروه‌های عملیاتی</div>
    <div id="loginError" class="errbox"></div>
    <div class="field" style="margin-bottom:12px"><label>نام کاربری</label><input id="loginUser" autocomplete="username"></div>
    <div class="field" style="margin-bottom:16px"><label>رمز عبور</label><input id="loginPass" type="password" autocomplete="current-password"></div>
    <button class="btn btn-p" style="width:100%" id="loginBtn" data-act="login">ورود به پنل</button>
    <div style="text-align:center;margin-top:16px;font-size:12px"><a href="?page=portal" style="color:var(--brand)">بازگشت به درگاه نقش‌ها</a></div>
  </div>
</div>

<div id="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="mark" id="sideMark"><svg class="ic" viewBox="0 0 24 24" style="width:22px;height:22px"><path d="M13 2 4.5 13.5H11L9.5 22 19 10h-6.5L13 2z" fill="currentColor" stroke="none"/></svg></div>
      <div><h1 class="zv-brand">Zingo<span>Vingo</span></h1><small>پنل سوپروایزر</small></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <div class="uchip">
        <div class="av" id="sideAv"></div>
        <div style="flex:1;min-width:0"><b id="sideName"></b><small id="sideRole"></small></div>
        <button class="ibtn" data-act="logout" title="خروج"><svg class="ic" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg></button>
      </div>
    </div>
  </aside>
  <div class="main">
    <header class="topbar">
      <button class="ibtn rail-btn" id="railBtn" data-act="rail" title="جمع کردن منو (Ctrl+B)"><svg class="ic" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M9 4v16"/><path class="ra" d="M16.5 9.5 14 12l2.5 2.5"/></svg></button>
      <button class="ibtn menu-btn" data-act="menu"><svg class="ic" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      <div><h2 id="tbTitle">داشبورد</h2><div class="crumb" id="tbCrumb"></div></div>
      <div class="branch-chip" id="branchChip"></div>
      <div class="sp"></div>
      <button class="ibtn" data-act="theme" id="themeBtn"></button>
      <button class="btn btn-p" data-act="go" data-page="cards"><svg class="ic" viewBox="0 0 24 24" style="width:16px;height:16px"><path d="M12 5v14M5 12h14"/></svg><span>کارت‌های گروه</span></button>
    </header>
    <main id="page"></main>
  </div>
</div>

<div class="scrim" id="scrim" data-act="scrim"></div>
<div class="mback" id="mback"><div class="modal" id="modal"></div></div>
<div id="toasts"></div>
<div id="printArea"></div>

<script>
'use strict';
/* ═════════ 1) UTIL ═════════ */
var $=function(s,r){return (r||document).querySelector(s);};
var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));};
function esc(v){var m={'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'};return String(v==null?'':v).replace(/[&<>"']/g,function(c){return m[c];});}
function fa(v){return String(v==null?'':v).replace(/\d/g,function(d){return '۰۱۲۳۴۵۶۷۸۹'[+d];});}
function en(v){return String(v==null?'':v).replace(/[۰-۹]/g,function(d){return String('۰۱۲۳۴۵۶۷۸۹'.indexOf(d));}).replace(/[٠-٩]/g,function(d){return String('٠١٢٣٤٥٦٧٨٩'.indexOf(d));});}
function num(v){var n=Number(en(v).replace(/[٬,\s]/g,''));return isFinite(n)?n:0;}
var NF=new Intl.NumberFormat('fa-IR');
function money(n){return NF.format(Math.round(num(n)))+' ریال';}
function moneyC(n){n=num(n);if(Math.abs(n)>=1e9)return fa((n/1e9).toFixed(1))+' میلیارد';if(Math.abs(n)>=1e6)return fa((n/1e6).toFixed(1))+' میلیون';return NF.format(Math.round(n));}
function debounce(f,ms){var t;return function(){var a=arguments,s=this;clearTimeout(t);t=setTimeout(function(){f.apply(s,a);},ms);};}
function g2j(gy,gm,gd){var lp=(gy%4===0&&gy%100!==0)||gy%400===0;var M=[0,31,lp?29:28,31,30,31,30,31,31,30,31,30,31];var y2=gm>2?gy+1:gy;var d=355666+365*gy+Math.floor((y2+3)/4)-Math.floor((y2+99)/100)+Math.floor((y2+399)/400)+gd;for(var i=1;i<gm;i++)d+=M[i];var jy=-1595+33*Math.floor(d/12053);d%=12053;jy+=4*Math.floor(d/1461);d%=1461;if(d>365){jy+=Math.floor((d-1)/365);d=(d-1)%365;}var jm,jd;if(d<186){jm=1+Math.floor(d/31);jd=1+d%31;}else{jm=7+Math.floor((d-186)/30);jd=1+(d-186)%30;}return[jy,jm,jd];}
function j2g(jy,jm,jd){jy+=1595;var d=-355668+365*jy+Math.floor(jy/33)*8+Math.floor(((jy%33)+3)/4)+jd+(jm<7?(jm-1)*31:(jm-7)*30+186);var gy=400*Math.floor(d/146097);d%=146097;if(d>36524){gy+=100*Math.floor(--d/36524);d%=36524;if(d>=365)d++;}gy+=4*Math.floor(d/1461);d%=1461;if(d>365){gy+=Math.floor((d-1)/365);d=(d-1)%365;}var gd=d+1;var lp=gy%4===0&&(gy%100!==0||gy%400===0);var M=[0,31,lp?29:28,31,30,31,30,31,31,30,31,30,31];var gm=1;while(gm<=12&&gd>M[gm]){gd-=M[gm];gm++;}return[gy,gm,gd];}
function jLeap(y){var g=j2g(y,12,30),j=g2j(g[0],g[1],g[2]);return j[0]===y&&j[1]===12&&j[2]===30;}
function jDays(y,m){return m<=6?31:(m<=11?30:(jLeap(y)?30:29));}
function parseJ(s){var m=en(s).trim().replace(/[.\-]/g,'/').match(/^(\d{4})\/(\d{1,2})\/(\d{1,2})$/);if(!m)return null;var y=+m[1],mo=+m[2],d=+m[3];if(mo<1||mo>12||d<1||d>jDays(y,mo))return null;return[y,mo,d];}
function jDisp(v){if(!v)return '—';var d=new Date(v);if(isNaN(d.getTime()))return esc(v);var j=g2j(d.getFullYear(),d.getMonth()+1,d.getDate());return fa(j[0]+'/'+String(j[1]).padStart(2,'0')+'/'+String(j[2]).padStart(2,'0'));}

  if(sel._zv)return;sel._zv=true;
  var w=document.createElement('div');w.className='zsel';sel.parentNode.insertBefore(w,sel);w.appendChild(sel);
  var b=document.createElement('button');b.type='button';b.className='zsel-btn';
  var p=document.createElement('div');p.className='zsel-pan';w.appendChild(b);w.appendChild(p);
  function lab(){var o=sel.options[sel.selectedIndex];b.innerHTML='<span>'+esc(o?(o.text||o.value||'—'):'—')+'</span>'+icon('chevD');}
  function build(){p.innerHTML=Array.prototype.map.call(sel.options,function(o,i){var txt=(o.text||o.value||'').trim();if(!txt&&i>0)return '';return '<div class="zsel-opt'+(i===sel.selectedIndex?' on':'')+(o.value?'':' muted')+'" data-i="'+i+'">'+esc(txt||'انتخاب کنید')+'</div>';}).join('');}
  b.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();var op=w.classList.contains('open');zClose();if(!op){build();w.classList.add('open');var c=p.querySelector('.zsel-opt.on');if(c)p.scrollTop=Math.max(0,c.offsetTop-90);}});
  p.addEventListener('click',function(e){var o=e.target.closest('.zsel-opt');if(!o)return;e.stopPropagation();sel.selectedIndex=+o.dataset.i;sel.dispatchEvent(new Event('input',{bubbles:true}));sel.dispatchEvent(new Event('change',{bubbles:true}));lab();w.classList.remove('open');});

function plannerPage(){
  return Promise.all([api('getSupervisorCards',{search:'',status:'همه'},TOKEN),api('getSupervisorWorkersForDropdown',TOKEN)]).then(function(res){
    var cards=res[0]||[],workers=res[1]||[];
    var start=new Date(PS.week||new Date());start.setHours(12,0,0,0);start.setDate(start.getDate()-((start.getDay()+1)%7));
    var days=[];for(var i=0;i<7;i++){var d=new Date(start);d.setDate(start.getDate()+i);days.push(d);}
    var keys=days.map(gKey);
    var list=cards.filter(function(c){var p=parseJ(String(c.executeDateTime||'').split(' ')[0]);if(!p)return false;var g=j2g(p[0],p[1],p[2]);return keys.indexOf(g[0]+'-'+String(g[1]).padStart(2,'0')+'-'+String(g[2]).padStart(2,'0'))>=0;});
    if(PS.plWorker)list=list.filter(function(c){return String(c.workerId)===String(PS.plWorker);});
    var tk=gKey(new Date());
    var opts='<option value="">تمام اعضای گروه</option>'+workers.map(function(w){return '<option value="'+esc(w.id)+'"'+(String(w.id)===String(PS.plWorker)?' selected':'')+'>'+esc(w.name)+'</option>';}).join('');
    var h=head('برنامه کاری گروه',jDisp(days[0])+' تا '+jDisp(days[6])+' · '+fa(list.length)+' کارت',
      '<button class="btn btn-s btn-sm" data-act="week" data-d="-7">هفته قبل</button><button class="btn btn-p btn-sm" data-act="week" data-d="0">هفته جاری</button><button class="btn btn-s btn-sm" data-act="week" data-d="7">هفته بعد</button>'+
      '<select class="sel" data-plworker>'+opts+'</select>');
    h+='<div class="zv-planner-legend"><span><i class="zv-planner-dot" style="background:var(--blue)"></i>جدید</span><span><i class="zv-planner-dot" style="background:var(--amber)"></i>در حال انجام</span><span><i class="zv-planner-dot" style="background:var(--green)"></i>تکمیل شده</span><span><i class="zv-planner-dot" style="background:var(--red)"></i>لغو / مرجوع</span></div>';
    var noTime=list.filter(function(c){return !/\d{1,2}:\d{2}/.test(String(c.executeDateTime||''));});
    h+='<div class="zv-planner-scroll">';
    if(noTime.length)h+='<div class="zv-planner-unscheduled"><span style="font-size:11px;color:var(--muted);font-weight:800;min-width:80px;padding-top:5px">بدون ساعت</span>'+noTime.map(function(c){return plEvent(c);}).join('')+'</div>';
    h+='<div class="zv-planner-grid"><div class="zv-planner-head">ساعت</div>';
    days.forEach(function(d){h+='<div class="zv-planner-head'+(gKey(d)===tk?' today':'')+'"><strong>'+new Intl.DateTimeFormat('fa-IR',{weekday:'short'}).format(d)+'</strong><small>'+jDisp(d)+'</small></div>';});
    for(var hr=6;hr<23;hr++){
      h+='<div class="zv-planner-time">'+fa(String(hr).padStart(2,'0'))+':۰۰</div>';
      days.forEach(function(d){
        var dl=list.filter(function(c){var p=parseJ(String(c.executeDateTime||'').split(' ')[0]);if(!p)return false;var g=j2g(p[0],p[1],p[2]);var k=g[0]+'-'+String(g[1]).padStart(2,'0')+'-'+String(g[2]).padStart(2,'0');var tm=String(c.executeDateTime||'').match(/(\d{1,2}):\d{2}/);return k===gKey(d)&&tm&&+tm[1]===hr;});
        h+='<div class="zv-planner-cell'+(gKey(d)===tk?' today':'')+'">'+dl.map(function(c){return plEvent(c);}).join('')+'</div>';
      });
    }
    h+='</div></div>';
    return h;
  });
}
function plEvent(c){
  var s=String(c.status||''),cls=/تکمیل/.test(s)?'status-done':/لغو|مرجوع/.test(s)?'status-cancel':/جدید/.test(s)?'status-new':/در حال/.test(s)?'status-progress':'';
  var tm=String(c.executeDateTime||'').match(/(\d{1,2}:\d{2})/);
  return '<button class="zv-planner-event '+cls+'" data-act="card-detail" data-id="'+esc(c.cardId)+'"><strong>'+fa(tm?tm[1]+' · ':'')+esc(c.cardId)+'</strong><small>'+esc(c.customer||'')+'</small><small>'+esc(s)+'</small></button>';
}

}
function soonNotify(kind){
  var name=SOON[kind]?SOON[kind].t:'توسعه عمومی';
  api('submitSupervisorRecord',{type:'branch_request',title:'درخواست اطلاع‌رسانی: '+name,details:'لطفاً هنگام فعال‌سازی ماژول «'+name+'» در پنل سوپروایزر، اطلاع‌رسانی شود.',groupId:PS.group||'',workerId:'',cardId:'',amount:0},TOKEN)
  .then(function(){
    var reqs=soonRequests();reqs.unshift({kind:kind,title:name,at:new Date().toISOString()});
    try{localStorage.setItem('zv_supervisor_soon',JSON.stringify(reqs.slice(0,30)));}catch(e){}
    toast('درخواست اطلاع‌رسانی ثبت شد.','ok');render();
  }).catch(function(e){toast(e.message,'err');});
}
/* ═════════ 17) RAIL / TIP ═════════ */
var TIP=null,TIPT=null;
function isMobile(){return window.matchMedia&&window.matchMedia('(max-width:1120px)').matches;}
function applyRail(on){document.documentElement.classList.toggle('zv-rail',!!on);try{localStorage.setItem(RKEY,on?'1':'0');}catch(e){}if(!on)hideTip();}
function toggleRail(){if(isMobile()){var s=$('#sidebar'),sc=$('#scrim');var o=!s.classList.contains('open');s.classList.toggle('open',o);sc.classList.toggle('show',o);return;}applyRail(!document.documentElement.classList.contains('zv-rail'));}
function showTip(el){if(!document.documentElement.classList.contains('zv-rail')||isMobile()||!el)return;
  var sp=el.querySelector('span'),l=sp?sp.textContent:(el.title||'');l=String(l||'').trim();if(!l)return;
  if(!TIP){TIP=document.createElement('div');TIP.id='zvTip';document.body.appendChild(TIP);}
  var b=el.querySelector('.bdg'),ex=b&&b.textContent.trim()?'<b>'+esc(b.textContent.trim())+'</b>':'';
  TIP.innerHTML=esc(l)+ex;TIP.classList.add('on');
  var r=el.getBoundingClientRect(),w=TIP.offsetWidth,h=TIP.offsetHeight;
  var left=r.left-w-12;if(left<8)left=r.right+12;
  TIP.style.left=left+'px';TIP.style.top=Math.max(8,Math.min(r.top+(r.height-h)/2,window.innerHeight-h-8))+'px';}
function hideTip(){if(TIP)TIP.classList.remove('on');}
/* ═════════ 18) ACTIONS ═════════ */
var ACT={
'login':doLogin,'logout':doLogout,'rail':toggleRail,'theme':toggleTheme,
'menu':function(){var s=$('#sidebar'),sc=$('#scrim');var o=!s.classList.contains('open');s.classList.toggle('open',o);sc.classList.toggle('show',o);},
'scrim':function(){$('#sidebar').classList.remove('open');$('#scrim').classList.remove('show');},
'mclose':closeModal,
'go':function(d){go(d.page);},
'refresh':function(){render();toast('بروزرسانی شد.','ok');},
'convert-order':function(d){convertOrderModal(d.id);},
'cards-view':function(d){PS.view=d.mode;render();},
'card-detail':function(d){cardDetail(d.id);},
'card-status':function(d){cardStatusModal(d.id,d.status||'');},
'card-assign':function(d){cardAssignModal(d.id);},
'card-invoice':function(d){cardInvoice(d.id);},
'card-print':function(d){var el=$('#zv-detail-'+d.id);if(!el){toast('ابتدا جزئیات کارت را باز کنید','warn');return;}var w=window.open('','_blank');if(!w)return;w.document.write('<html lang="fa" dir="rtl"><meta charset="utf-8"><body style="font-family:Tahoma;padding:24px">'+el.innerHTML+'</body></html>');w.document.close();w.print();},
'print-inv':function(){var b=$('#invBox');if(b){$('#printArea').innerHTML=b.outerHTML;window.print();}},
'week':function(d){var n=num(d.d);PS.week=n?new Date((PS.week||new Date()).getTime()+n*864e5):new Date();render();},
'view-members':function(d){PS.group=d.id;go('members');},
'edit-group':function(d){editGroupModal(d);},
'add-member':function(d){addMemberModal(d.id);},
'remove-member':function(d){confirmBox('حذف عضو','آیا از حذف این عضو از گروه مطمئن هستید؟',function(){api('removeGroupMember',Number(d.id),TOKEN).then(function(){toast('حذف شد.','ok');render();}).catch(function(e){toast(e.message,'err');});});},
'open-thread':function(d){openThread(d.id);},
'thread-close-status':function(d){api('supervisorSetConversationStatus',d.id,'CLOSED',TOKEN).then(function(){toast('گفتگو بسته شد.','ok');closeModal();render();}).catch(function(e){toast(e.message,'err');});},
'thread-open-status':function(d){api('supervisorSetConversationStatus',d.id,'OPEN',TOKEN).then(function(){toast('گفتگو باز شد.','ok');openThread(d.id);}).catch(function(e){toast(e.message,'err');});},
'rep-run':runReports,
'my-photo':function(){toast('برای تغییر عکس از پنل اصلی پروفایل استفاده کنید.','warn');},
'soon-request':function(d){soonRequestModal(d.kind||'roadmap');},
'soon-notify':function(d){soonNotify(d.kind);}
};
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');
  if(el){var fn=ACT[el.dataset.act];if(fn){e.preventDefault();e.stopPropagation();try{var r=fn(el.dataset,el,e);if(r&&typeof r.catch==='function')r.catch(function(x){toast(x.message||String(x),'err');});}catch(x){toast(x.message||String(x),'err');}return;}}
  if(!e.target.closest('.zsel'))zClose();
  if(e.target.id==='mback')closeModal();
});
var sDeb=debounce(function(){render();},300);
document.addEventListener('input',function(e){if(e.target.matches('[data-search]')){PS.q=e.target.value;sDeb();}});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.matches('[data-cstatus]')){PS.status=t.value;render();return;}
  if(t.matches('[data-plworker]')){PS.plWorker=t.value;render();return;}
  if(t.matches('[data-group]')){PS.group=t.value;render();return;}
  if(t.matches('[data-mstatus]')){if(!t.value)return;api('toggleMemberStatus',Number(t.dataset.mstatus),t.value,TOKEN).then(function(){toast('وضعیت تغییر کرد.','ok');render();}).catch(function(x){toast(x.message,'err');});return;}
});
document.addEventListener('submit',function(e){
  var f=e.target,k=f.dataset.form;if(!k)return;e.preventDefault();
  var run=function(){
    if(k==='convert'){return api('supervisorConvertOrderToCard',f.dataset.id,f.elements.workerId.value,TOKEN).then(function(r){closeModal();toast(r.message||'کارت ایجاد شد.','ok');render();});}
    if(k==='card-status'){return api('updateSupervisorCardStatus',f.dataset.id,f.elements.status.value,TOKEN).then(function(){closeModal();toast('وضعیت ثبت شد.','ok');render();});}
    if(k==='card-assign'){return api('assignCardToWorker',f.dataset.id,f.elements.workerId.value,TOKEN).then(function(){closeModal();toast('تخصیص ثبت شد.','ok');render();});}
    if(k==='edit-group'){var p={name:f.elements.name.value,area:f.elements.area.value,groupType:f.elements.groupType.value,description:f.elements.description.value};if(!p.name.trim()){toast('نام گروه الزامی است.','err');return;}return api('updateSupervisorGroup',f.dataset.id,p,TOKEN).then(function(){closeModal();toast('ذخیره شد.','ok');render();});}
    if(k==='add-member'){if(!f.elements.workerId.value.trim()){toast('شناسه نیرو الزامی است.','err');return;}return api('addGroupMember',f.dataset.id,f.elements.workerId.value.trim(),f.elements.role.value,TOKEN).then(function(){closeModal();toast('عضو افزوده شد.','ok');render();});}
    if(k==='thread-reply'){if(!f.elements.body.value.trim()){toast('متن پاسخ الزامی است.','err');return;}return api('supervisorCreateConversationReply',f.dataset.id,f.elements.body.value,TOKEN).then(function(){toast('ارسال شد.','ok');openThread(f.dataset.id);});}
    if(k==='profile'){var p={username:f.elements.username.value.trim(),description:f.elements.description.value};if(f.elements.password.value)p.password=f.elements.password.value;if(!p.username){toast('نام کاربری الزامی است.','err');return;}return api('updateSupervisorProfile',p,TOKEN).then(function(){if(USER){USER.username=p.username;localStorage.setItem('zv_supervisor_user',JSON.stringify(USER));}toast('پروفایل ذخیره شد.','ok');render();});}
    if(k==='soon-request'){if(!f.elements.note.value.trim()){toast('شرح درخواست الزامی است.','err');return;}var kind=f.dataset.kind,name=SOON[kind]?SOON[kind].t:'توسعه عمومی';
      return api('submitSupervisorRecord',{type:'branch_request',title:'درخواست توسعه: '+name,details:f.elements.note.value,groupId:PS.group||'',workerId:'',cardId:'',amount:0},TOKEN).then(function(){
        var reqs=soonRequests();reqs.unshift({kind:kind,title:name,at:new Date().toISOString()});try{localStorage.setItem('zv_supervisor_soon',JSON.stringify(reqs.slice(0,30)));}catch(x){}
        closeModal();toast('درخواست ثبت شد.','ok');render();});}
  };
  try{var r=run();if(r&&typeof r.catch==='function')r.catch(function(x){toast(x.message||String(x),'err');});}catch(x){toast(x.message||String(x),'err');}
});
document.addEventListener('keydown',function(e){
  if((e.ctrlKey||e.metaKey)&&String(e.key).toLowerCase()==='b'){var tg=(e.target&&e.target.tagName||'').toLowerCase();if(tg==='input'||tg==='textarea'||e.target.isContentEditable)return;e.preventDefault();toggleRail();return;}
  if(e.key==='Escape'){if($$('.zsel.open').length){zClose();return;}closeModal();hideTip();return;}
  if(e.key==='Enter'&&$('#loginView').style.display!=='none'&&(e.target.id==='loginUser'||e.target.id==='loginPass'))doLogin();
});
document.addEventListener('mouseover',function(e){var el=e.target.closest?e.target.closest('.sidebar .nav-item'):null;if(!el)return;clearTimeout(TIPT);TIPT=setTimeout(function(){showTip(el);},90);});
document.addEventListener('mouseout',function(e){var el=e.target.closest?e.target.closest('.sidebar .nav-item'):null;if(!el)return;clearTimeout(TIPT);hideTip();});
window.addEventListener('scroll',hideTip,true);
window.addEventListener('resize',function(){hideTip();});
/* ═════════ 19) INIT ═════════ */
(function init(){
  var th=localStorage.getItem('zv_supervisor_theme');if(th)document.documentElement.dataset.theme=th;
  $('#themeBtn').innerHTML=icon(document.documentElement.dataset.theme==='dark'?'sun':'moon');
  try{if(localStorage.getItem(RKEY)==='1')document.documentElement.classList.add('zv-rail');}catch(e){}
  var saved=localStorage.getItem('zv_supervisor_user');
  if(!TOKEN){$('#loginView').style.display='grid';return;}
  $('#loginView').style.display='none';$('#app').style.display='grid';
  $('#page').innerHTML='<div class="loading"><div class="spinner"></div></div>';
  if(saved){try{USER=JSON.parse(saved);}catch(e){}}
  api('getSupervisorProfile',TOKEN).then(function(p){USER={name:p.name,workerId:p.workerId,username:p.username,branchId:p.branchId,branchName:p.branchName,groupId:p.groupId,avatar:p.avatar};localStorage.setItem('zv_supervisor_user',JSON.stringify(USER));paintUser();go('dashboard');})
  .catch(function(){if(USER){paintUser();go('dashboard');}else{localStorage.removeItem('zv_supervisor_token');TOKEN='';$('#app').style.display='none';$('#loginView').style.display='grid';}});
})();
</script>
