.login-box{background:#fff;border-radius:20px;padding:40px;width:min(420px,92%);box-shadow:0 20px 60px #0003}

.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
.sidebar{background:var(--navy);color:#fff;padding:0;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column}
.brand{padding:20px;border-bottom:1px solid var(--navy-light)}

.btn-primary{background:var(--orange);color:#fff}.btn-primary:hover{background:var(--orange-light)}
.btn-secondary{background:#eef1f7;color:var(--navy)}.btn-secondary:hover{background:#dfe4ee}

.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:16px;box-shadow:var(--shadow)}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:20px}
.stat-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:18px;position:relative;overflow:hidden}
.stat-card::before{content:'';position:absolute;top:0;right:0;width:4px;height:100%;background:var(--orange)}
.stat-card.green::before{background:var(--green)}.stat-card.blue::before{background:var(--blue)}.stat-card.yellow::before{background:var(--yellow)}.stat-card.red::before{background:var(--danger)}

.field{display:flex;flex-direction:column;gap:5px}

input,select,textarea{font:inherit;border:1px solid #cfd6e3;border-radius:8px;padding:9px 11px;background:#fff;outline:none;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--orange);box-shadow:0 0 0 3px #ff6b1a1c}
textarea{min-height:80px;resize:vertical}
.modal{display:none;position:fixed;inset:0;background:#071127a8;z-index:100;padding:18px;align-items:center;justify-content:center}
.modal.open{display:flex}
.modal-box{width:min(900px,100%);background:#fff;border-radius:var(--radius);padding:24px;max-height:90vh;overflow-y:auto}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--line)}

.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.form-grid .full{grid-column:1/-1}
.toast{position:fixed;bottom:20px;left:20px;background:var(--navy);color:#fff;padding:12px 20px;border-radius:10px;z-index:200;display:none;box-shadow:0 10px 30px #0003;font-size:13px}

body{background:var(--zv-bg);color:var(--zv-ink);font-family:IRANSans,Tahoma,Arial,sans-serif}
button,input,select,textarea{font:inherit}
button,[role=button],a{-webkit-tap-highlight-color:transparent}
:where(button,input,select,textarea,a,[tabindex]):focus-visible{outline:3px solid rgba(255,107,26,.35);outline-offset:2px}
.app{background:var(--zv-bg)}
.main{padding:24px 30px 90px;min-width:0}
.zv-app-topbar{direction:ltr;display:flex;align-items:center;justify-content:space-between;gap:14px;margin:0 0 22px;min-height:58px}
.zv-branch-chip{order:0;direction:rtl;display:flex;align-items:center;gap:10px;min-width:205px;max-width:min(48vw,360px);padding:8px 13px;background:#fff;border:1px solid var(--zv-line);border-radius:13px;box-shadow:var(--zv-shadow)}
.zv-branch-icon{width:38px;height:38px;flex:0 0 38px;border-radius:12px;display:grid;place-items:center;background:#fff0e7;color:var(--zv-orange);font-size:18px}
.zv-branch-meta{min-width:0;line-height:1.55}
.zv-branch-name{display:block;color:var(--zv-navy);font-size:12px;font-weight:900;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.zv-branch-id{display:block;color:var(--zv-muted);font-size:10px;direction:ltr;text-align:right}
.zv-app-topbar .menu-toggle{order:1}

.zv-identity-avatar{width:34px;height:34px;flex:0 0 34px;border-radius:50%;display:grid;place-items:center;background:var(--zv-orange);font-size:13px;font-weight:900;color:#fff}
.zv-identity-meta{min-width:0;line-height:1.5}
.zv-identity-name{display:block;font-size:11px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.zv-identity-id{display:block;color:#c8d0e1;font-size:9px;direction:ltr;text-align:right}
.zv-identity-role{color:#ffb58f;font-size:9px;margin-right:5px}
.nav-item,.btn,.logout-btn{transition:all var(--zv-transition)}
.nav-item{border-radius:10px}
.nav-item:hover{transform:translateX(-2px)}
.card,.stat-card{border-radius:var(--zv-radius);box-shadow:var(--zv-shadow);border-color:var(--zv-line)}
.card{transition:box-shadow var(--zv-transition),transform var(--zv-transition)}
.card:hover{box-shadow:var(--zv-shadow-hover)}
.stat-card{min-height:100px}
.btn{min-height:38px;border-radius:var(--zv-radius-sm);font-weight:700}
.btn-primary{background:var(--zv-orange);color:#fff}
.btn-primary:hover{background:var(--zv-orange-hover);transform:translateY(-1px);box-shadow:0 5px 13px rgba(11,23,54,.10)}
.btn-secondary{background:#eef1f7;color:var(--zv-navy)}
.btn-danger{background:#fff0f0;color:var(--zv-red)}
input,select,textarea{border-radius:var(--zv-radius-sm);border-color:#dfe4ed}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--zv-orange);box-shadow:0 0 0 3px rgba(255,107,26,.12)}
table{border-collapse:separate;border-spacing:0}
thead th{background:#f7f8fb}
tbody tr:hover{background:#fafbfe}
.badge,.pill{font-weight:700;border-radius:20px}
.toast{border-radius:11px;box-shadow:var(--zv-shadow)}
.modal-box{border-radius:18px}
.sidebar{box-shadow:4px 0 22px rgba(11,23,54,.06)}
.brand h2{letter-spacing:-.35px}
@media(max-width:900px){
 .main{padding:16px 16px 86px}
 .zv-app-topbar{min-height:48px;margin-bottom:17px}
 .zv-branch-chip{min-width:0;max-width:58vw;padding:6px 9px}
 .zv-branch-icon{width:32px;height:32px;flex-basis:32px}
}
@media(max-width:600px){
 .zv-app-topbar{gap:8px}
 .zv-branch-chip{max-width:calc(100vw - 105px)}
 .zv-branch-name{font-size:10px}
 .zv-branch-id{font-size:9px}

 .zv-identity-avatar{width:30px;height:30px;flex-basis:30px}
}
@media(prefers-reduced-motion:reduce){
 *,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

.zv-sidebar-person-id{display:block;margin-top:4px;color:#aebbd3;font-size:10px;direction:ltr;text-align:right;white-space:nowrap}.sidebar-footer .user-info{align-items:center}.sidebar-footer .user-meta{min-width:0;flex:1}
@media(max-width:900px){.sidebar-footer{padding-bottom:18px}}

/* ZV profile + unread conversation indicators */
.zv-unread-badge{display:inline-flex;align-items:center;justify-content:center;min-width:19px;height:19px;padding:0 5px;margin-right:auto;border-radius:20px;background:#d92d3a;color:#fff;font-size:10px;font-weight:900;line-height:1;box-shadow:0 0 0 2px var(--zv-navy,#0B1736)}
.zv-unread-badge[hidden]{display:none!important}
.zv-thread-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px;border:1px solid var(--line);border-radius:12px;margin:9px 0;background:#fff}
.zv-thread-meta{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin:6px 0;font-size:11px;color:var(--muted)}
.zv-thread-state{display:inline-flex;padding:4px 8px;border-radius:20px;font-size:10px;font-weight:800}
.zv-thread-state.unread{background:#ffebed;color:#c62836}.zv-thread-state.read{background:#e8f7f0;color:#13835d}.zv-thread-state.open{background:#edf2ff;color:#4567bb}.zv-thread-state.closed{background:#f0f1f4;color:#687386}
.zv-profile-layout{display:grid;grid-template-columns:minmax(220px,280px) 1fr;gap:22px;align-items:start}
.zv-profile-photo-card{text-align:center;padding:22px}.zv-profile-photo-large{width:136px;height:136px;margin:0 auto 14px;border-radius:50%;overflow:hidden;display:grid;place-items:center;background:#fff0e7;color:#bd4a0d;font-size:42px;font-weight:900;border:4px solid #fff;box-shadow:0 0 0 1px var(--line),0 8px 24px #0b17361a}.zv-profile-photo-large img{width:100%;height:100%;object-fit:cover;display:block}.zv-profile-photo-actions{display:flex;flex-direction:column;gap:8px}.zv-profile-form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.zv-profile-form .field{min-width:0}.zv-profile-form .full{grid-column:1/-1}
@media(max-width:700px){.zv-profile-layout{grid-template-columns:1fr}.zv-profile-form{grid-template-columns:1fr}.zv-profile-form .full{grid-column:auto}.zv-thread-row{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>

<div id="loginPage" class="login-page">
  <div class="login-box">
    <h1>Zingo<span>Vingo</span></h1>
    <div class="subtitle">پنل سوپروایزر</div>
    <div id="loginError" class="login-error"></div>
    <div class="field"><label>نام کاربری</label><input id="loginUser" autocomplete="username"></div>
    <div class="field"><label>رمز عبور</label><input id="loginPass" type="password" autocomplete="current-password"></div>
    <button id="loginButton" class="btn btn-primary" onclick="doLogin()">ورود به پنل</button><div id="loginProgress" class="login-progress"><span class="login-spinner"></span>در حال ورود به حساب...</div>
  </div>
</div>

<div id="appContainer" class="app" style="display:none">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><h2>Zingo<span>Vingo</span></h2><small>پنل سوپروایزر</small></div>
    <nav class="nav-menu" id="navMenu"></nav>
    <div class="sidebar-footer">
      <div class="user-info"><div class="user-avatar" id="userAvatar">?</div><div class="user-meta"><div class="user-name" id="userName">—</div><div class="user-role" id="userRole">سوپروایزر</div><div class="zv-sidebar-person-id" id="zvIdentityId">شناسه: —</div></div></div>
      <button class="logout-btn" onclick="doLogout()"> خروج</button>
    </div>
  </aside>
  <main class="main">
    <header class="zv-app-topbar">
      <button class="menu-toggle" type="button" aria-label="باز کردن منو" onclick="document.getElementById('sidebar').classList.toggle('open')">☰ منو</button>
      <div class="zv-branch-chip" id="zvBranchChip" aria-label="اطلاعات شعبه">
        <div class="zv-branch-icon" aria-hidden="true">⌂</div>
        <div class="zv-branch-meta">
          <span class="zv-branch-name" id="zvBranchName">شعبه</span>
          <span class="zv-branch-id" id="zvBranchId">—</span>
        </div>
      </div>
    </header>
    <div id="pageContent"><div class="loading"><div class="spinner"></div></div></div>
  </main>
</div>


<script>
fetch('PhotoEditor.html').then(function (r) { return r.text(); }).then(function (html) {
  var wrap = document.createElement('div'); wrap.innerHTML = html; document.body.appendChild(wrap);
  Array.prototype.slice.call(wrap.querySelectorAll('script')).forEach(function (old) {
    var s = document.createElement('script'); s.textContent = old.textContent; document.body.appendChild(s);
  });
}).catch(function (e) { console.warn('PhotoEditor بارگذاری نشد:', e); });
</script>


<script>
const $ = id => document.getElementById(id);
const money = n => new Intl.NumberFormat('en-US').format(Math.round(Number(n)||0)) + ' ریال';
const toFa = n => new Intl.NumberFormat('fa-IR').format(n);
let currentToken = localStorage.getItem('zv_supervisor_token') || null;
let currentUser = null;

const MENU_ITEMS = [
  { id: 'dashboard', label: '📊 داشبورد' },
  { id: 'groups', label: '👥 گروه‌های من' },
  { id: 'members', label: '👤 اعضای گروه' },
  { id: 'cards', label: '🎫 کارت‌ها' },
  { id: 'messages', label: '✉️ مکاتبات متخصصان' },
  { id: 'returned', label: '🔄 کارت‌های مرجوعی' },
  { id: 'reports', label: '📈 گزارشات' },
  { id: 'profile', label: '👤 پروفایل من' }
];

function toast(msg, type='info') { const t = $('toast'); t.textContent = msg; t.className = 'toast show ' + type; setTimeout(() => t.classList.remove('show'), 3500); }
function openModal(html) { $('modalBox').innerHTML = html; $('modal').classList.add('open'); }
function closeModal() { $('modal').classList.remove('open'); }
$('modal').addEventListener('click', e => { if (e.target === $('modal')) closeModal(); });
function statusBadge(s) { return '<span class="badge badge-' + (/جدید/.test(s)?'new':/تکمیل/.test(s)?'done':/لغو|مرجوع/.test(s)?'cancel':'progress') + '">' + s + '</span>'; }

function zvSetLoginBusy_(busy) {
  const b = $('loginButton'), p = $('loginProgress');
  if (b) { b.disabled = !!busy; b.textContent = busy ? 'در حال ورود...' : 'ورود به پنل'; }
  if (p) p.classList.toggle('show', !!busy);
}
function zvSaveSupervisorSession_(token, user) {
  try { localStorage.setItem('zv_supervisor_token', token); localStorage.setItem('zv_supervisor_user', JSON.stringify(user)); } catch(e) {}
  try { sessionStorage.setItem('zv_supervisor_token', token); sessionStorage.setItem('zv_supervisor_user', JSON.stringify(user)); } catch(e) {}
}
function doLogin() {
  const u = $('loginUser').value.trim(), p = $('loginPass').value;
  if (!u || !p) { $('loginError').textContent = 'نام کاربری و رمز را وارد کنید'; $('loginError').style.display = 'block'; return; }
  $('loginError').style.display = 'none';
  zvSetLoginBusy_(true);
  google.script.run.withSuccessHandler(r => {
    if (r && r.success) {
      currentToken = r.token; currentUser = r.user;
      zvSaveSupervisorSession_(r.token, r.user);
      showApp(r.user);
    } else { $('loginError').textContent = r.message || 'خطا'; $('loginError').style.display = 'block'; }
    zvSetLoginBusy_(false);
  }).withFailureHandler(e => { zvSetLoginBusy_(false); $('loginError').textContent = e.message; $('loginError').style.display = 'block'; }).supervisorLogin(u, p);
}

function doLogout() {
  if (currentToken) google.script.run.supervisorLogout(currentToken);
  localStorage.removeItem('zv_supervisor_token'); localStorage.removeItem('zv_supervisor_user');
  sessionStorage.removeItem('zv_supervisor_token'); sessionStorage.removeItem('zv_supervisor_user');
  location.reload();
}

function showApp(user) {
  currentUser = user;
  zvUpdateSharedIdentity_(user);
  $('loginPage').style.display = 'none'; $('appContainer').style.display = 'grid';
  $('userName').textContent = user.name;
  $('userRole').innerHTML = 'سوپروایزر <span class="badge-role">' + (user.branchId || '—') + '</span>';
  const av = $('userAvatar');
  if (user.avatar) av.innerHTML = '<img src="' + user.avatar + '">'; else av.textContent = user.name ? user.name.charAt(0) : '?';
  
  $('navMenu').innerHTML = MENU_ITEMS.map(i => '<div class="nav-item" data-page="' + i.id + '">' + i.label + (i.id === 'messages' ? '<span class="zv-unread-badge" id="zvUnreadMessages" hidden>0</span>' : '') + '</div>').join('');
  $('navMenu').querySelectorAll('.nav-item').forEach(item => {
    item.addEventListener('click', () => {
      $('navMenu').querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
      item.classList.add('active');
      loadPage(item.dataset.page);
      $('sidebar').classList.remove('open');
    });
  });
  loadPage('dashboard');
  zvRefreshUnreadMessages_();
}


function zvUpdateSharedIdentity_(user) {
  user = user || {};
  const branchName = user.branchName || (user.branchId ? 'شعبه' : 'شعبه تخصیص‌نیافته');
  const branchId = user.branchId || 'شناسه ثبت نشده';
  const fullName = user.name || user.username || 'کاربر';
  const personId = user.workerId || user.username || 'شناسه ثبت نشده';
  const branchNameEl = $('zvBranchName'), branchIdEl = $('zvBranchId');
  const idEl = $('zvIdentityId'), avatarEl = $('userAvatar');
  if (branchNameEl) branchNameEl.textContent = branchName;
  if (branchIdEl) branchIdEl.textContent = 'شناسه شعبه: ' + branchId;
  if (idEl) idEl.textContent = 'شناسه: ' + personId;
  if (avatarEl) { if (user.avatar) avatarEl.innerHTML = '<img src="'+zvEsc(zvPhotoDisplayUrl_(user.avatar))+'" alt="تصویر پروفایل">'; else avatarEl.textContent = fullName.trim().charAt(0) || '?'; }
}

function zvPhotoDisplayUrl_(url) {
  const value = String(url || '').trim();
  if (!value) return '';
  const id = (value.match(/[?&]id=([^&]+)/) || value.match(/\/d\/([^/]+)/));
  return id ? 'https://drive.google.com/thumbnail?id=' + encodeURIComponent(decodeURIComponent(id[1])) + '&sz=w400' : value;
}

function zvRestoreSupervisorSession_() {
  let saved = null, token = null;
  try {
    token = localStorage.getItem('zv_supervisor_token') || sessionStorage.getItem('zv_supervisor_token') || null;
    saved = localStorage.getItem('zv_supervisor_user') || sessionStorage.getItem('zv_supervisor_user') || null;
  } catch (e) { console.warn('Supervisor storage read:', e); }
  if (token) currentToken = token;
  if (!currentToken) return;

  // اگر داده کاربر در یکی از storageها باقی مانده باشد، پنل بدون چشمک‌زدن صفحه ورود باز می‌شود.
  if (saved) {
    try { currentUser = JSON.parse(saved); if (currentUser) showApp(currentUser); }
    catch (e) { console.warn('Supervisor cached user parse:', e); }
  } else {
    $('loginPage').style.display = 'flex';
    zvSetLoginBusy_(true);
    const progress = $('loginProgress'); if (progress) progress.innerHTML = '<span class="login-spinner"></span>در حال بازیابی نشست...';
  }

  google.script.run.withSuccessHandler(function(r) {
    zvSetLoginBusy_(false);
    if (r && r.success && r.user) {
      currentUser = r.user;
      zvSaveSupervisorSession_(currentToken, currentUser);
      if (!saved) showApp(currentUser);
      else { $('userName').textContent = currentUser.name || currentUser.username || '—'; zvUpdateSharedIdentity_(currentUser); }
    } else if (!saved) {
      currentToken = null;
      try { localStorage.removeItem('zv_supervisor_token'); sessionStorage.removeItem('zv_supervisor_token'); } catch(e) {}
      $('loginPage').style.display = 'flex';
    }
  }).withFailureHandler(function(err) {
    zvSetLoginBusy_(false);
    console.warn('Supervisor session restore validation:', err);
    // خطای موقت شبکه نباید نشست ذخیره‌شده را پاک کند یا کاربر را از پنل بیرون بیندازد.
    if (currentUser) showApp(currentUser);
    else { $('loginPage').style.display = 'flex'; $('loginError').textContent = 'بازیابی نشست ناموفق بود؛ اتصال را بررسی و دوباره تلاش کنید.'; $('loginError').style.display = 'block'; }
  }).supervisorValidateSession(currentToken);
}

(function checkSession() { zvRestoreSupervisorSession_(); })();

function zvSetUnreadMessages_(rows){const n=(rows||[]).reduce((sum,t)=>sum+Math.max(0,Number(t.unreadCount)||0),0);const b=$('zvUnreadMessages');if(b){b.textContent=toFa(n);b.hidden=n<=0;}}
function zvRefreshUnreadMessages_(){const api=google.script.run.withSuccessHandler(zvSetUnreadMessages_).withFailureHandler(e=>console.warn('Unread messages count:',e));api.supervisorGetConversations(currentToken);}
function loadPage(page) {
  const branchChip = $('zvBranchChip'); if (branchChip) branchChip.style.display = page === 'dashboard' ? 'flex' : 'none';
  $('pageContent').innerHTML = '<div class="loading"><div class="spinner"></div></div>';
  const loaders = { dashboard: loadDashboard, groups: loadGroups, members: loadMembers, cards: loadCards, messages: loadSupervisorMessages, returned: loadReturned, reports: loadReports, profile: loadProfile };
  (loaders[page] || loadDashboard)();
  if (page !== 'messages') zvRefreshUnreadMessages_();
}

function loadDashboard() {
  google.script.run.withSuccessHandler(groups => {
    $('pageContent').innerHTML = '<div class="page-header"><h1 class="page-title">داشبورد سوپروایزر</h1></div>' +
      '<div class="stats-grid">' +
      '<div class="stat-card"><div class="stat-label">تعداد گروه‌ها</div><div class="stat-value">' + toFa(groups.length) + '</div></div>' +
      '<div class="stat-card blue"><div class="stat-label">گروه فعال</div><div class="stat-value">' + toFa(groups.filter(g => g.status === 'فعال').length) + '</div></div>' +
      '</div>' +
      '<div class="card"><h3 style="margin-bottom:12px;color:var(--navy)">گروه‌های تحت مدیریت</h3>' +
      (groups.length ? groups.map(g => '<div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)"><span><strong>' + g.name + '</strong> (' + g.groupId + ')</span><span class="badge badge-' + (g.status==='فعال'?'active':'inactive') + '">' + g.status + '</span></div>').join('') : '<div style="color:var(--muted);text-align:center;padding:20px">گروهی یافت نشد</div>') +
      '</div>';
  }).getSupervisorGroups(currentToken);
}

let currentGroupId = null;
function loadGroups() {
  $('pageContent').innerHTML = '<div class="page-header"><h1 class="page-title">گروه‌های من</h1></div><div id="groupsContent"></div>';
  google.script.run.withSuccessHandler(groups => {
    if (!groups.length) { $('groupsContent').innerHTML = '<div class="card" style="text-align:center;padding:40px;color:var(--muted)">گروهی یافت نشد</div>'; return; }
    $('groupsContent').innerHTML = '<div class="card"><div class="table-wrap"><table><thead><tr><th>کد</th><th>نام</th><th>منطقه</th><th>نوع</th><th>وضعیت</th><th>عملیات</th></tr></thead><tbody>' +
      groups.map(g => '<tr><td>' + g.groupId + '</td><td>' + g.name + '</td><td>' + (g.area||'—') + '</td><td>' + (g.groupType||'—') + '</td><td><span class="badge badge-' + (g.status==='فعال'?'active':'inactive') + '">' + g.status + '</span></td><td><button class="btn btn-sm btn-primary" onclick="viewMembers(\'' + g.groupId + '\',\'' + g.name + '\')">👤 اعضا</button></td></tr>').join('') + '</tbody></table></div></div>';
  }).getSupervisorGroups(currentToken);
}

function viewMembers(groupId, groupName) {
  currentGroupId = groupId;
  loadPage('members');
}

function loadMembers() {
  if (!currentGroupId) {
    $('pageContent').innerHTML = '<div class="page-header"><h1 class="page-title">اعضای گروه</h1></div><div class="card" style="text-align:center;padding:40px;color:var(--muted)">ابتدا یک گروه انتخاب کنید</div>';
    return;
  }
  $('pageContent').innerHTML = '<div class="page-header"><h1 class="page-title">اعضای گروه ' + currentGroupId + '</h1><button class="btn btn-primary" onclick="openAddMember()">+ عضو جدید</button></div><div id="membersContent"></div>';
  google.script.run.withSuccessHandler(members => {
    $('membersContent').innerHTML = '<div class="card"><div class="table-wrap"><table><thead><tr><th>نام</th><th>یوزرنیم</th><th>نقش</th><th>وضعیت</th><th>عملیات</th></tr></thead><tbody>' +
      members.map(m => '<tr><td>' + m.fullName + '</td><td>' + m.username + '</td><td><span class="badge badge-new">' + m.role + '</span></td><td><span class="badge badge-' + (m.status==='فعال'?'active':'inactive') + '">' + m.status + '</span></td><td><button class="btn btn-sm btn-' + (m.status==='فعال'?'danger':'success') + '" onclick="toggleMember(' + m.rowIndex + ',\'' + (m.status==='فعال'?'غیرفعال':'فعال') + '\')">' + (m.status==='فعال'?'غیرفعال':'فعال') + '</button> <button class="btn btn-sm btn-danger" onclick="removeMember(' + m.rowIndex + ')">🗑</button></td></tr>').join('') + '</tbody></table></div></div>';
  }).getGroupMembers(currentGroupId, currentToken);
}

function openAddMember() {
  openModal('<div class="modal-header"><h2>افزودن عضو به گروه</h2><button class="modal-close" onclick="closeModal()">✕</button></div>' +
    '<div class="form-grid"><div class="field"><label>نام کاربری عضو *</label><input id="mUsername"></div>' +
    '<div class="field"><label>نقش</label><select id="mRole"><option value="member">member</option><option value="supervisor">supervisor</option></select></div></div>' +
    '<div class="modal-footer"><button class="btn btn-secondary" onclick="closeModal()">انصراف</button><button class="btn btn-primary" onclick="saveMember()">افزودن</button></div>');
}
function saveMember() {
  const username = $('mUsername').value.trim(), role = $('mRole').value;
  if (!username) return toast('نام کاربری را وارد کنید', 'error');
  google.script.run.withSuccessHandler(() => { closeModal(); toast('عضو اضافه شد', 'success'); loadMembers(); }).withFailureHandler(e => toast(e.message, 'error')).addGroupMember(currentGroupId, username, role, currentToken);
}
function removeMember(rowIndex) {
  if (!confirm('حذف این عضو؟')) return;
  google.script.run.withSuccessHandler(() => { toast('حذف شد', 'success'); loadMembers(); }).withFailureHandler(e => toast(e.message, 'error')).removeGroupMember(rowIndex, currentToken);
}
function toggleMember(rowIndex, newStatus) {
  google.script.run.withSuccessHandler(() => { toast('وضعیت تغییر کرد', 'success'); loadMembers(); }).withFailureHandler(e => toast(e.message, 'error')).toggleMemberStatus(rowIndex, newStatus, currentToken);
}

function loadCards() {
  $('pageContent').innerHTML = '<div class="page-header"><h1 class="page-title">کارت‌های گروه</h1></div>' +
    '<div class="card"><div class="filters"><div class="field"><label>جستجو</label><input id="cdSearch" placeholder="مشتری، CardID" oninput="debounceCards()"></div>' +
    '<div class="field"><label>وضعیت</label><select id="cdStatus" onchange="applyCardsFilter()"><option value="همه">همه</option><option>جدید</option><option>در حال انجام</option><option>تکمیل شده</option><option>لغو شده</option><option>ارجاع به سرپرست</option></select></div></div><div id="cardsTable"></div></div>';
  fetchCards();
}
let cdTimer;
function debounceCards() { clearTimeout(cdTimer); cdTimer = setTimeout(fetchCards, 400); }
function applyCardsFilter() { fetchCards(); }
function fetchCards() {
  const filters = { search: $('cdSearch')?.value || '', status: $('cdStatus')?.value || 'همه' };
  google.script.run.withSuccessHandler(rows => {
    if (!rows.length) { $('cardsTable').innerHTML = '<div style="padding:20px;text-align:center;color:var(--muted)">کارتی یافت نشد</div>'; return; }
    $('cardsTable').innerHTML = '<div class="table-wrap"><table><thead><tr><th>CardID</th><th>مشتری</th><th>خدمت</th><th>مبلغ</th><th>اجراکننده</th><th>وضعیت</th><th>عملیات</th></tr></thead><tbody>' +
      rows.map(r => '<tr><td><strong>' + r.cardId + '</strong></td><td>' + r.customer + '</td><td>' + r.details + '</td><td>' + money(r.amount) + '</td><td>' + r.workerName + '</td><td>' + statusBadge(r.status) + '</td><td style="white-space:nowrap"><button class="btn btn-sm btn-primary" onclick="changeCardStatus(\'' + r.cardId + '\',\'' + r.status + '\')">تغییر وضعیت</button> <button class="btn btn-sm btn-secondary" onclick="assignCard(\'' + r.cardId + '\')">تخصیص</button> <button class="btn btn-sm btn-secondary" onclick="viewInvoice(\'' + r.requestId + '\')">🧾</button></td></tr>').join('') + '</tbody></table></div>';
  }).getSupervisorCards(filters, currentToken);
}

function changeCardStatus(cardId, currentStatus) {
  openModal('<div class="modal-header"><h2>تغییر وضعیت کارت</h2><button class="modal-close" onclick="closeModal()">✕</button></div>' +
    '<div class="field"><label>وضعیت جدید</label><select id="newCardStatus" disabled><option>در حال دریافت وضعیت‌ها…</option></select></div>' +
    '<div class="modal-footer"><button class="btn btn-secondary" onclick="closeModal()">انصراف</button><button class="btn btn-primary" id="applyCardStatusBtn" disabled onclick="applyCardStatus(\'' + cardId + '\')">اعمال</button></div>');
  google.script.run.withSuccessHandler(function(statuses) {
    const select = $('newCardStatus');
    if (!select) return;
    const list = Array.isArray(statuses) ? statuses : [];
    if (!list.length) { select.innerHTML = '<option value="">وضعیتی در شیت Status_Roles تعریف نشده است</option>'; return; }
    select.innerHTML = list.map(function(st) { return '<option value="' + zvEsc(st) + '"' + (st === currentStatus ? ' selected' : '') + '>' + zvEsc(st) + '</option>'; }).join('');
    select.disabled = false;
    $('applyCardStatusBtn').disabled = false;
  }).withFailureHandler(function(e) { const select=$('newCardStatus'); if(select) select.innerHTML='<option value="">خطا در دریافت وضعیت‌ها</option>'; toast(e.message || 'دریافت وضعیت‌ها ناموفق بود','error'); }).getSupervisorCardStatuses(cardId, currentToken);
}

function applyCardStatus(cardId) {
  google.script.run.withSuccessHandler(() => { closeModal(); toast('بروزرسانی شد', 'success'); fetchCards(); }).withFailureHandler(e => toast(e.message, 'error')).updateSupervisorCardStatus(cardId, $('newCardStatus').value, currentToken);
}

function assignCard(cardId) {
  google.script.run.withSuccessHandler(workers => {
    let opts = '<option value="">بازگشت به استخر</option>';
    workers.forEach(w => opts += '<option value="' + w.id + '">' + w.name + ' (' + w.operations + ')</option>');
    openModal('<div class="modal-header"><h2>تخصیص کارت</h2><button class="modal-close" onclick="closeModal()">✕</button></div>' +
      '<div class="field"><label>تخصیص به</label><select id="targetWorker">' + opts + '</select></div>' +
      '<div class="modal-footer"><button class="btn btn-secondary" onclick="closeModal()">انصراف</button><button class="btn btn-primary" onclick="executeAssign(\'' + cardId + '\')">تأیید</button></div>');
  }).getSupervisorWorkersForDropdown(currentToken);
}
function executeAssign(cardId) {
  google.script.run.withSuccessHandler(() => { closeModal(); toast('تخصیص انجام شد', 'success'); fetchCards(); }).withFailureHandler(e => toast(e.message, 'error')).assignCardToWorker(cardId, $('targetWorker').value, currentToken);
}

function viewInvoice(requestId) {
  google.script.run.withSuccessHandler(o => {
    openModal('<div class="modal-header"><h2>فاکتور ' + o.requestId + '</h2><button class="modal-close" onclick="closeModal()">✕</button></div>' +
      '<div class="invoice-box"><div class="invoice-header"><h1>Zingo<span>Vingo</span></h1><div>فاکتور نهایی خدمات</div></div>' +
      '<div class="invoice-row"><span>تاریخ ثبت:</span><strong>' + o.date + '</strong></div>' +
      '<div class="invoice-row"><span>مشتری:</span><strong>' + o.customer + '</strong></div>' +
      '<div class="invoice-row"><span>موبایل:</span><strong style="direction:ltr">' + o.phone + '</strong></div>' +
      '<div class="invoice-row"><span>خدمت:</span><strong>' + o.service + ' × ' + toFa(o.qty) + '</strong></div>' +
      '<div class="invoice-row"><span>تاریخ اجرا:</span><strong>' + o.executeDate + ' ساعت ' + o.executeTime + '</strong></div>' +
      '<div class="invoice-row"><span>آدرس:</span><strong>' + o.address + '</strong></div>' +
      '<div class="invoice-row"><span>خدمات جانبی:</span><strong>' + (o.sideServices||'ندارد') + '</strong></div>' +
      '<div class="invoice-row"><span>نوع اقدام:</span><strong>' + o.actionType + '</strong></div>' +
      '<div class="invoice-row"><span>توضیحات:</span><strong>' + (o.notes||'—') + '</strong></div>' +
      '<hr style="margin:15px 0">' +
      '<div class="invoice-row"><span>قیمت پایه:</span><strong>' + money(o.basePrice) + '</strong></div>' +
      '<div class="invoice-row"><span>تخفیف:</span><strong style="color:var(--green)">− ' + money(o.discount) + '</strong></div>' +
      '<div class="invoice-row"><span>مالیات:</span><strong>' + money(o.tax) + '</strong></div>' +
      '<div class="invoice-row invoice-total"><span>مبلغ نهایی:</span><strong>' + money(o.finalPrice) + '</strong></div>' +
      '</div>' +
      '<div class="modal-footer"><button class="btn btn-primary" onclick="window.print()">🖨 پرینت</button><button class="btn btn-secondary" onclick="closeModal()">بستن</button></div>');
  }).getSupervisorOrderInvoice(requestId, currentToken);
}

function loadReturned() {
  $('pageContent').innerHTML = '<div class="page-header"><h1 class="page-title">کارت‌های مرجوعی</h1></div><div id="returnedContent"></div>';
  google.script.run.withSuccessHandler(rows => {
    $('returnedContent').innerHTML = '<div class="card"><div class="table-wrap"><table><thead><tr><th>CardID</th><th>مشتری</th><th>خدمت</th><th>اجراکننده</th><th>وضعیت</th><th>آخرین بروزرسانی</th><th>عملیات</th></tr></thead><tbody>' +
      (rows.length ? rows.map(r => '<tr><td><strong>' + r.cardId + '</strong></td><td>' + r.customer + '</td><td>' + r.details + '</td><td>' + r.workerId + '</td><td>' + statusBadge(r.status) + '</td><td>' + r.updatedAt + '</td><td><button class="btn btn-sm btn-primary" onclick="changeCardStatus(\'' + r.cardId + '\',\'' + r.status + '\')">تغییر وضعیت</button> <button class="btn btn-sm btn-secondary" onclick="assignCard(\'' + r.cardId + '\')">تخصیص مجدد</button></td></tr>').join('') : '<tr><td colspan="7" style="text-align:center;padding:20px;color:var(--muted)">کارت مرجوعی نیست</td></tr>') + '</tbody></table></div></div>';
  }).getSupervisorReturnedCards(currentToken);
}


function zvEsc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function loadSupervisorMessages(){
 $('pageContent').innerHTML='<div class="page-header"><h1 class="page-title">مکاتبات متخصصان</h1><button class="btn btn-secondary" onclick="loadSupervisorMessages()">بروزرسانی</button></div><div class="card"><div id="supervisorThreads">در حال دریافت…</div></div><div id="supervisorThreadDetail"></div>';
 google.script.run.withSuccessHandler(rows=>{zvSetUnreadMessages_(rows);const h=$('supervisorThreads');if(!rows.length){h.textContent='مکاتبه‌ای ثبت نشده است.';return;}
 h.innerHTML=rows.map(t=>'<div class="zv-thread-row"><div><b>'+zvEsc(t.subject)+'</b><div class="zv-thread-meta"><span>متخصص: '+zvEsc(t.workerUsername)+'</span><span>کارت: '+zvEsc(t.cardId)+'</span><span class="zv-thread-state '+(Number(t.unreadCount)>0?'unread':'read')+'">'+(Number(t.unreadCount)>0?'● خوانده‌نشده':'✓ خوانده‌شده')+'</span><span class="zv-thread-state '+(String(t.status).toUpperCase()==='CLOSED'?'closed':'open')+'">'+(String(t.status).toUpperCase()==='CLOSED'?'بسته':'باز')+'</span><span>پیام جدید: '+toFa(t.unreadCount||0)+'</span></div><small>'+zvEsc(t.preview||'')+'</small></div><button class="btn btn-primary btn-sm" onclick="openSupervisorThread(\''+zvEsc(t.threadId)+'\')">نمایش پیام</button></div>').join('');})
 .withFailureHandler(e=>{$('supervisorThreads').textContent=e.message;}).supervisorGetConversations(currentToken);
}
function openSupervisorThread(id){
 google.script.run.withSuccessHandler(d=>{
  if(!d || !d.thread){toast('جزئیات مکاتبه دریافت نشد','error');return;}
  const h=$('supervisorThreadDetail');
  h.innerHTML='<div class="card" style="margin-top:14px"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><h3>'+zvEsc(d.thread.subject)+' — '+zvEsc(d.thread.cardId)+'</h3><span class="zv-thread-state '+(String(d.thread.status).toUpperCase()==='CLOSED'?'closed':'open')+'">'+(String(d.thread.status).toUpperCase()==='CLOSED'?'بسته':'باز')+'</span></div><div id="supervisorMessages" style="margin-top:14px"></div><textarea id="supervisorReply" maxlength="4000" placeholder="پاسخ به متخصص…" style="width:100%;min-height:90px;margin-top:12px"></textarea><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><button class="btn btn-primary" onclick="replySupervisorThread(\''+zvEsc(id)+'\')">ارسال پاسخ</button><button class="btn btn-secondary" onclick="changeSupervisorThreadStatus(\''+zvEsc(id)+'\',\''+(String(d.thread.status).toUpperCase()==='CLOSED'?'OPEN':'CLOSED')+'\')">'+(String(d.thread.status).toUpperCase()==='CLOSED'?'بازگشایی مکاتبه':'بستن مکاتبه')+'</button></div></div>';
  $('supervisorMessages').innerHTML=(d.messages||[]).map(m=>'<div class="detail-item" style="margin:8px 0;padding:12px;border:1px solid var(--line);border-radius:10px"><b>'+zvEsc(m.senderUsername)+'</b><div style="white-space:pre-wrap;margin:6px 0">'+zvEsc(m.body)+'</div><small>'+zvEsc(m.createdAt)+'</small></div>').join('')||'<div class="muted">پیامی در این مکاتبه وجود ندارد.</div>';
  zvRefreshUnreadMessages_();
 }).withFailureHandler(e=>toast(e.message,'error')).supervisorGetConversation(id,currentToken);
}
function replySupervisorThread(id){
 const el=$('supervisorReply'), body=el?el.value.trim():'';
 if(!body)return toast('متن پاسخ را وارد کنید','error');
 google.script.run.withSuccessHandler(()=>{toast('پاسخ ارسال شد','success');openSupervisorThread(id);loadSupervisorMessages();}).withFailureHandler(e=>toast(e.message,'error')).supervisorCreateConversationReply(id,body,currentToken);
}
function changeSupervisorThreadStatus(id,status){
 google.script.run.withSuccessHandler(()=>{toast('وضعیت مکاتبه تغییر کرد','success');openSupervisorThread(id);loadSupervisorMessages();}).withFailureHandler(e=>toast(e.message,'error')).supervisorSetConversationStatus(id,status,currentToken);
}
function loadReports() {
  $('pageContent').innerHTML = '<div class="page-header"><h1 class="page-title">گزارشات گروه</h1></div>' +
    '<div class="card"><div class="filters"><div class="field"><label>از تاریخ</label><input id="repFrom" placeholder="1405/01/01"></div><div class="field"><label>تا تاریخ</label><input id="repTo" placeholder="1405/12/29"></div><div class="field" style="justify-content:flex-end"><button class="btn btn-primary" onclick="fetchReports()">نمایش</button></div></div><div id="repContent"></div></div>';
}
function fetchReports() {
  google.script.run.withSuccessHandler(rep => {
    $('repContent').innerHTML = '<div class="stats-grid"><div class="stat-card"><div class="stat-label">کل کارت‌ها</div><div class="stat-value">' + toFa(rep.totalCards) + '</div></div><div class="stat-card green"><div class="stat-label">تکمیل شده</div><div class="stat-value">' + toFa(rep.completedCards) + '</div></div><div class="stat-card yellow"><div class="stat-label">در حال انجام</div><div class="stat-value">' + toFa(rep.inProgressCards) + '</div></div><div class="stat-card blue"><div class="stat-label">درآمد کل</div><div class="stat-value">' + money(rep.totalRevenue) + '</div></div></div>' +
      '<div class="card" style="margin-top:16px"><h3>عملکرد اعضا</h3><div class="table-wrap"><table><thead><tr><th>نام</th><th>کل</th><th>تکمیل شده</th><th>درآمد</th></tr></thead><tbody>' +
      rep.byWorker.map(w => '<tr><td>' + w.name + '</td><td>' + toFa(w.total) + '</td><td>' + toFa(w.completed) + '</td><td>' + money(w.revenue) + '</td></tr>').join('') + '</tbody></table></div></div>' +
      '<div class="card" style="margin-top:16px"><h3>ریز تراکنش‌ها</h3><div class="table-wrap"><table><thead><tr><th>تاریخ</th><th>CardID</th><th>مشتری</th><th>مبلغ</th><th>وضعیت</th></tr></thead><tbody>' +
      rep.transactions.map(t => '<tr><td>' + t.date + '</td><td>' + t.cardId + '</td><td>' + t.customer + '</td><td>' + money(t.amount) + '</td><td>' + statusBadge(t.status) + '</td></tr>').join('') + '</tbody></table></div></div>';
  }).getSupervisorReports(currentToken, $('repFrom').value, $('repTo').value);
}

function loadProfile() {
  google.script.run.withSuccessHandler(p => {
    const photo = p.avatar ? '<img src="'+zvEsc(zvPhotoDisplayUrl_(p.avatar))+'" alt="تصویر پروفایل">' : zvEsc((p.name||'?').trim().charAt(0)||'?');
    $('pageContent').innerHTML = '<div class="page-header"><h1 class="page-title">پروفایل من</h1></div>'+
      '<div class="zv-profile-layout"><div class="card zv-profile-photo-card"><div class="zv-profile-photo-large" id="zvProfilePhoto">'+photo+'</div><h3>'+zvEsc(p.name||'—')+'</h3><div class="zv-muted">'+zvEsc(p.role||'')+' · '+zvEsc(p.workerId||'')+'</div><div class="zv-profile-photo-actions" style="margin-top:16px"><button class="btn btn-primary" type="button" onclick="zvOpenProfilePhoto_()">📷 تغییر تصویر پروفایل</button><small>فرمت JPG، PNG یا WEBP؛ حداکثر ۸ مگابایت</small></div></div>'+
      '<div class="card"><h3 style="margin-bottom:16px;color:var(--navy)">اطلاعات حساب</h3><div class="detail-grid"><div class="detail-item"><div class="detail-label">شناسه یکتا</div><div class="detail-value">'+zvEsc(p.workerId||'—')+'</div></div><div class="detail-item"><div class="detail-label">نام و نام خانوادگی</div><div class="detail-value">'+zvEsc(p.name||'—')+'</div></div><div class="detail-item"><div class="detail-label">نقش</div><div class="detail-value">'+zvEsc(p.role||'—')+'</div></div><div class="detail-item"><div class="detail-label">شناسه شعبه</div><div class="detail-value">'+zvEsc(p.branchId||'—')+'</div></div><div class="detail-item"><div class="detail-label">شناسه گروه</div><div class="detail-value">'+zvEsc(p.groupId||'—')+'</div></div></div><hr style="border:0;border-top:1px solid var(--line);margin:18px 0"><h3 style="margin-bottom:12px;color:var(--navy)">ویرایش اطلاعات ورود</h3><div class="zv-profile-form"><div class="field"><label>نام کاربری</label><input id="newUsername" value="'+zvEsc(p.username||'')+'"></div><div class="field"><label>رمز عبور جدید</label><input id="newPassword" type="password" autocomplete="new-password" placeholder="خالی = بدون تغییر"></div></div><button class="btn btn-primary" style="margin-top:16px" onclick="updateProfile()">ذخیره تغییرات</button></div></div>';
  }).withFailureHandler(e=>toast(e.message||'دریافت پروفایل ناموفق بود','error')).getSupervisorProfile(currentToken);
}
function zvOpenProfilePhoto_(){
  if(!window.ZVPhoto||!window.ZVPhoto.__v2){toast('ویرایشگر تصویر بارگذاری نشده است؛ صفحه را تازه‌سازی کنید.','error');return;}
  window.ZVPhoto.open({token:currentToken,endpoint:'uploadSupervisorProfilePhotoV2',onDone:function(url){if(currentUser){currentUser.avatar=url;zvSaveSupervisorSession_(currentToken,currentUser);}zvUpdateSharedIdentity_(currentUser);loadProfile();}});
}
function updateProfile() {
  const updates = { username: $('newUsername').value.trim(), password: $('newPassword').value };
  if(!updates.username) return toast('نام کاربری نمی‌تواند خالی باشد','error');
  google.script.run.withSuccessHandler(() => { if(currentUser){currentUser.username=updates.username;localStorage.setItem('zv_supervisor_user',JSON.stringify(currentUser));} toast('پروفایل بروزرسانی شد','success'); loadProfile(); }).withFailureHandler(e => toast(e.message, 'error')).updateSupervisorProfile(updates, currentToken);
}

document.addEventListener('keydown', e => { if (e.key === 'Enter' && $('loginPage').style.display !== 'none') doLogin(); });
