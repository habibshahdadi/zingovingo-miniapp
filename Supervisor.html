<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<base target="_top">
<title>پنل سوپروایزر | ZingoVingo</title>
<script src="zv-api.js"></script>
<style>
:root{--navy:#0B1736;--navy-light:#1a2a4d;--orange:#FF6B1A;--orange-light:#ff8533;--bg:#f4f6fb;--text:#172033;--muted:#657086;--line:#dfe4ee;--white:#fff;--green:#067647;--danger:#b42318;--blue:#1849a9;--yellow:#f79009;--shadow:0 2px 10px #17203308;--radius:14px}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:Tahoma,Arial,sans-serif;line-height:1.7;font-size:14px}
button,input,select,textarea{font-family:inherit;font-size:13px}
.login-page{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--navy) 0%,#1a2a4d 100%)}
.login-box{background:#fff;border-radius:20px;padding:40px;width:min(420px,92%);box-shadow:0 20px 60px #0003}
.login-box h1{color:var(--navy);text-align:center;margin-bottom:8px;font-size:28px}
.login-box h1 span{color:var(--orange)}
.login-box .subtitle{text-align:center;color:var(--muted);margin-bottom:24px;font-size:13px}
.login-box .field{margin-bottom:14px}
.login-box label{display:block;margin-bottom:6px;font-weight:700;font-size:13px}
.login-box input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;outline:none}
.login-box input:focus{border-color:var(--orange);box-shadow:0 0 0 3px #ff6b1a1c}
.login-box .btn{width:100%;padding:13px;margin-top:8px}
.login-error{background:#fef3f2;color:var(--danger);padding:10px;border-radius:8px;margin-bottom:12px;font-size:13px;display:none}
.login-progress{display:none;margin-top:12px;text-align:center;color:var(--muted);font-size:12px}.login-progress.show{display:block}.login-spinner{display:inline-block;width:15px;height:15px;vertical-align:middle;margin-left:7px;border:2px solid #e5e9f0;border-top-color:var(--orange);border-radius:50%;animation:zvLoginSpin .7s linear infinite}@keyframes zvLoginSpin{to{transform:rotate(360deg)}}
.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
.sidebar{background:var(--navy);color:#fff;padding:0;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column}
.brand{padding:20px;border-bottom:1px solid var(--navy-light)}
.brand h2{font-size:22px;font-weight:900}
.brand h2 span{color:var(--orange)}
.brand small{color:#8896b3;font-size:11px}
.nav-menu{flex:1;padding:12px 0}
.nav-item{display:flex;align-items:center;gap:10px;padding:12px 20px;cursor:pointer;color:#c8d2e6;font-size:14px;border-right:3px solid transparent;transition:all .2s}
.nav-item:hover{background:var(--navy-light);color:#fff}
.nav-item.active{background:var(--navy-light);color:#fff;border-right-color:var(--orange)}
.sidebar-footer{padding:16px 20px;border-top:1px solid var(--navy-light);font-size:12px}
.user-info{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.user-avatar{width:36px;height:36px;border-radius:50%;background:var(--orange);display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;font-size:14px;overflow:hidden}
.user-avatar img{width:100%;height:100%;object-fit:cover}
.user-name{font-weight:700;font-size:13px}
.user-role{color:#8896b3;font-size:11px}
.logout-btn{background:transparent;border:1px solid var(--navy-light);color:#c8d2e6;padding:8px;border-radius:8px;cursor:pointer;width:100%;font-size:12px}
.logout-btn:hover{background:var(--navy-light);color:#fff}
.main{padding:24px;overflow-x:hidden}
.page-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:10px}
.page-title{font-size:20px;color:var(--navy);font-weight:900}
.btn{border:0;border-radius:10px;padding:9px 16px;font:inherit;font-weight:700;cursor:pointer;transition:all .2s}
.btn-primary{background:var(--orange);color:#fff}.btn-primary:hover{background:var(--orange-light)}
.btn-secondary{background:#eef1f7;color:var(--navy)}.btn-secondary:hover{background:#dfe4ee}
.btn-danger{background:#fef3f2;color:var(--danger)}.btn-danger:hover{background:#fee4e2}
.btn-warning{background:#fff7ed;color:#9a3412}.btn-warning:hover{background:#fed7aa}
.btn-sm{padding:5px 10px;font-size:12px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:16px;box-shadow:var(--shadow)}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:20px}
.stat-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:18px;position:relative;overflow:hidden}
.stat-card::before{content:'';position:absolute;top:0;right:0;width:4px;height:100%;background:var(--orange)}
.stat-card.green::before{background:var(--green)}.stat-card.blue::before{background:var(--blue)}.stat-card.yellow::before{background:var(--yellow)}.stat-card.red::before{background:var(--danger)}
.stat-label{font-size:12px;color:var(--muted);margin-bottom:6px}
.stat-value{font-size:24px;font-weight:900;color:var(--navy);font-variant-numeric:tabular-nums}
.table-wrap{overflow-x:auto;border-radius:var(--radius);border:1px solid var(--line)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#f8f9fc;padding:12px;text-align:right;font-weight:700;color:var(--navy);border-bottom:2px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:hover{background:#fafbfd}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700}
.badge-new{background:#eff6ff;color:var(--blue)}.badge-progress{background:#fff7ed;color:#9a3412}
.badge-done{background:#ecfdf3;color:var(--green)}.badge-cancel{background:#fef3f2;color:var(--danger)}
.badge-role{background:var(--navy-light);color:#fff;padding:2px 8px;border-radius:10px;font-size:10px}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:16px}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12px;font-weight:700;color:var(--muted)}
input,select,textarea{font:inherit;border:1px solid #cfd6e3;border-radius:8px;padding:9px 11px;background:#fff;outline:none;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--orange);box-shadow:0 0 0 3px #ff6b1a1c}
textarea{min-height:80px;resize:vertical}
.modal{display:none;position:fixed;inset:0;background:#071127a8;z-index:100;padding:18px;align-items:center;justify-content:center}
.modal.open{display:flex}
.modal-box{width:min(600px,100%);background:#fff;border-radius:var(--radius);padding:24px;max-height:90vh;overflow-y:auto}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.modal-header h2{font-size:18px;color:var(--navy)}
.modal-close{background:transparent;border:0;font-size:22px;cursor:pointer;color:var(--muted);padding:4px 10px}
.modal-footer{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}
.form-grid{display:grid;grid-template-columns:1fr;gap:12px}
.toast{position:fixed;bottom:20px;left:20px;background:var(--navy);color:#fff;padding:12px 20px;border-radius:10px;z-index:200;display:none;box-shadow:0 10px 30px #0003;font-size:13px}
.toast.show{display:block;animation:slideIn .3s}
.toast.success{background:var(--green)}.toast.error{background:var(--danger)}
@keyframes slideIn{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
.loading{text-align:center;padding:40px;color:var(--muted)}
.spinner{display:inline-block;width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--orange);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.menu-toggle{display:none;background:var(--navy);color:#fff;border:0;padding:8px 12px;border-radius:8px;cursor:pointer}
@media(max-width:900px){.app{grid-template-columns:1fr}.sidebar{position:fixed;right:-280px;width:260px;z-index:50;transition:right .3s}.sidebar.open{right:0}.menu-toggle{display:block}.form-grid{grid-template-columns:1fr}}

/* Branch Chip Topbar */
.topbar-branch-chip{display:flex;align-items:center;gap:10px;padding:8px 13px;background:#fff;border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow);min-width:200px}
.topbar-branch-icon{width:36px;height:36px;border-radius:50%;background:#fff0e7;color:var(--orange);display:grid;place-items:center;font-size:18px;font-weight:900}
.topbar-branch-name{display:block;color:var(--navy);font-size:12px;font-weight:900}
.topbar-branch-id{display:block;color:var(--muted);font-size:10px}

/* Welcome Banner */
.welcome-banner{background:linear-gradient(115deg,#0B1736,#203968);color:#fff;border-radius:18px;padding:22px 25px;margin-bottom:18px;display:flex;justify-content:space-between;align-items:center;gap:15px;overflow:hidden;position:relative}
.welcome-banner h2{font-size:17px;margin:0 0 7px;color:#fff}
.welcome-banner p{font-size:11px;color:#d2d9e8;margin:0;line-height:1.9}
.welcome-icon{font-size:48px;opacity:.8;padding:0 10px}

/* Profile Layout */
.profile-layout{display:grid;grid-template-columns:minmax(220px,280px) 1fr;gap:22px;align-items:start}
.profile-photo-card{text-align:center;padding:22px}
.profile-photo-large{width:136px;height:136px;margin:0 auto 14px;border-radius:50%;overflow:hidden;display:grid;place-items:center;background:#fff0e7;color:#bd4a0d;font-size:42px;font-weight:900;border:4px solid #fff;box-shadow:0 0 0 1px var(--line),0 8px 24px #0b17361a}
.profile-photo-large img{width:100%;height:100%;object-fit:cover;display:block}
.profile-photo-actions{display:flex;flex-direction:column;gap:8px}
.profile-form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.profile-form .field{min-width:0}
.profile-form .full{grid-column:1/-1}
@media(max-width:700px){.profile-layout{grid-template-columns:1fr}.profile-form{grid-template-columns:1fr}.profile-form .full{grid-column:auto}}
</style>
</head>
<body>

<!-- صفحه لاگین -->
<div id="loginPage" class="login-page">
  <div class="login-box">
    <h1>Zingo<span>Vingo</span></h1>
    <div class="subtitle">پنل سوپروایزر</div>
    <div id="loginError" class="login-error"></div>
    <div class="field"><label>نام کاربری</label><input id="loginUser" autocomplete="username"></div>
    <div class="field"><label>رمز عبور</label><input id="loginPass" type="password" autocomplete="current-password"></div>
    <button id="loginButton" class="btn btn-primary" onclick="doLogin()">ورود به پنل</button>
    <div id="loginProgress" class="login-progress"><span class="login-spinner"></span>در حال ورود به حساب...</div>
  </div>
</div>

<!-- اپلیکیشن اصلی -->
<div id="appContainer" class="app" style="display:none">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><h2>Zingo<span>Vingo</span></h2><small>پنل سوپروایزر</small></div>
    <nav class="nav-menu" id="navMenu"></nav>
    <div class="sidebar-footer">
      <div class="user-info">
        <div class="user-avatar" id="userAvatar">?</div>
        <div>
          <div class="user-name" id="userName">—</div>
          <div class="user-role" id="userRole">سوپروایزر</div>
        </div>
      </div>
      <button class="logout-btn" onclick="doLogout()">🚪 خروج</button>
    </div>
  </aside>
  <main class="main">
    <header class="page-header">
      <button class="menu-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')">☰ منو</button>
      <h1 class="page-title" id="topbarPageTitle">داشبورد</h1>
    </header>
    <div id="pageContent"><div class="loading"><div class="spinner"></div></div></div>
  </main>
</div>

<div id="toast" class="toast"></div>
<div id="modal" class="modal"><div class="modal-box" id="modalBox"></div></div>

<script>
const $ = id => document.getElementById(id);
const money = n => new Intl.NumberFormat('en-US').format(Math.round(Number(n)||0)) + ' ریال';
const toFa = n => new Intl.NumberFormat('fa-IR').format(n);
let currentToken = localStorage.getItem('zv_supervisor_token') || null;
let currentUser = null;

const MENU_ITEMS = [
  { id: 'dashboard', label: '📊 داشبورد' },
  { id: 'groups', label: '👥 گروه‌های من' },
  { id: 'members', label: '👤 اعضای گروه' },
  { id: 'cards', label: '🎫 کارت‌ها و سفارش‌ها' },
  { id: 'messages', label: '✉️ مکاتبات متخصصان' },
  { id: 'returned', label: '🔄 کارت‌های مرجوعی' },
  { id: 'reports', label: ' گزارش عملکرد' },
  { id: 'profile', label: '👤 پروفایل من' }
];

function toast(msg, type='info') { const t = $('toast'); t.textContent = msg; t.className = 'toast show ' + type; setTimeout(() => t.classList.remove('show'), 3500); }
function openModal(html) { $('modalBox').innerHTML = html; $('modal').classList.add('open'); }
function closeModal() { $('modal').classList.remove('open'); }
$('modal').addEventListener('click', e => { if (e.target === $('modal')) closeModal(); });
function statusBadge(s) { 
  const x = String(s||'');
  let c = 'progress';
  if(/تکمیل|انجام شده/i.test(x)) c = 'done';
  else if(/لغو|مرجوع/i.test(x)) c = 'cancel';
  else if(/جدید/i.test(x)) c = 'new';
  else if(/ارجاع/i.test(x)) c = 'warning';
  return '<span class="badge badge-'+c+'">'+x+'</span>'; 
}

function setLoginBusy(busy) {
  const b = $('loginButton'), p = $('loginProgress');
  if (b) { b.disabled = !!busy; b.textContent = busy ? 'در حال ورود...' : 'ورود به پنل'; }
  if (p) p.classList.toggle('show', !!busy);
}

function doLogin() {
  const u = $('loginUser').value.trim(), p = $('loginPass').value;
  if (!u || !p) { $('loginError').textContent = 'نام کاربری و رمز را وارد کنید'; $('loginError').style.display = 'block'; return; }
  $('loginError').style.display = 'none';
  setLoginBusy(true);
  google.script.run.withSuccessHandler(r => {
    if (r && r.success) {
      currentToken = r.token; currentUser = r.user;
      localStorage.setItem('zv_supervisor_token', r.token);
      localStorage.setItem('zv_supervisor_user', JSON.stringify(r.user));
      showApp(r.user);
    } else { $('loginError').textContent = r.message || 'خطا'; $('loginError').style.display = 'block'; }
    setLoginBusy(false);
  }).withFailureHandler(e => { setLoginBusy(false); $('loginError').textContent = e.message; $('loginError').style.display = 'block'; }).supervisorLogin(u, p);
}

function doLogout() {
  if (currentToken) google.script.run.supervisorLogout(currentToken);
  localStorage.removeItem('zv_supervisor_token'); localStorage.removeItem('zv_supervisor_user');
  location.reload();
}

function showApp(user) {
  currentUser = user;
  $('loginPage').style.display = 'none'; $('appContainer').style.display = 'grid';
  $('userName').textContent = user.name;
  $('userRole').innerHTML = 'سوپروایزر <span class="badge-role">' + (user.workerId || '—') + '</span>';
  const av = $('userAvatar');
  if (user.avatar) av.innerHTML = '<img src="' + user.avatar + '">'; else av.textContent = user.name ? user.name.charAt(0) : '?';
  
  $('navMenu').innerHTML = MENU_ITEMS.map(i => '<div class="nav-item" data-page="' + i.id + '">' + i.label + '</div>').join('');
  $('navMenu').querySelectorAll('.nav-item').forEach(item => {
    item.addEventListener('click', () => {
      $('navMenu').querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
      item.classList.add('active');
      loadPage(item.dataset.page);
      $('sidebar').classList.remove('open');
    });
  });
  loadPage('dashboard');
}

(function checkSession() {
  const saved = localStorage.getItem('zv_supervisor_user');
  if (currentToken && saved) { currentUser = JSON.parse(saved); showApp(currentUser); }
})();

function loadPage(page) {
  $('topbarPageTitle').textContent = MENU_ITEMS.find(x => x.id === page)?.label || 'پنل سرپرست';
  $('pageContent').innerHTML = '<div class="loading"><div class="spinner"></div></div>';
  const loaders = { 
    dashboard: loadDashboard, groups: loadGroups, members: loadMembers, 
    cards: loadCards, messages: loadMessages, returned: loadReturned, 
    reports: loadReports, profile: loadProfile 
  };
  (loaders[page] || loadDashboard)();
}

function loadDashboard() {
  google.script.run.withSuccessHandler(d => {
    $('pageContent').innerHTML = 
      '<div class="topbar-branch-chip" style="margin-bottom:18px;display:inline-flex"><div class="topbar-branch-icon">⌂</div><div><span class="topbar-branch-name">' + (currentUser?.branchName || 'شعبه') + '</span><span class="topbar-branch-id">شناسه: ' + (currentUser?.branchId || '—') + '</span></div></div>' +
      '<div class="welcome-banner"><div><h2>خوش آمدید، ' + (currentUser?.name || 'سرپرست عزیز') + ' 👋</h2><p>وضعیت گروه‌ها و عملیات تحت نظارت شما در یک نگاه.</p></div><div class="welcome-icon">📊</div></div>' +
      '<div class="stats-grid">' +
      '<div class="stat-card"><div class="stat-label">تعداد گروه‌ها</div><div class="stat-value">' + toFa(d.groups) + '</div></div>' +
      '<div class="stat-card green"><div class="stat-label">اعضای فعال</div><div class="stat-value">' + toFa(d.activeMembers) + '</div></div>' +
      '<div class="stat-card yellow"><div class="stat-label">مشغول به کار</div><div class="stat-value">' + toFa(d.busyMembers) + '</div></div>' +
      '<div class="stat-card blue"><div class="stat-label">کارت‌های جدید</div><div class="stat-value">' + toFa(d.newCards) + '</div></div>' +
      '<div class="stat-card"><div class="stat-label">در حال اجرا</div><div class="stat-value">' + toFa(d.inProgressCards) + '</div></div>' +
      '<div class="stat-card green"><div class="stat-label">تکمیل شده</div><div class="stat-value">' + toFa(d.completedCards) + '</div></div>' +
      '</div>';
  }).withFailureHandler(e => toast(e.message, 'error')).getSupervisorDashboard(currentToken);
}

function loadGroups() {
  google.script.run.withSuccessHandler(groups => {
    let html = '<div class="page-header"><h1 class="page-title">گروه‌های من</h1></div><div class="card"><div class="table-wrap"><table><thead><tr><th>کد</th><th>نام</th><th>منطقه</th><th>وضعیت</th><th>اعضا</th><th>عملیات</th></tr></thead><tbody>';
    if (groups.length) {
      html += groups.map(g => '<tr><td>'+g.groupId+'</td><td>'+g.name+'</td><td>'+(g.area||'—')+'</td><td>'+statusBadge(g.status)+'</td><td>'+toFa(g.totalMembers||0)+'</td><td><button class="btn btn-sm btn-primary" onclick="viewMembers(\''+g.groupId+'\')">اعضا</button></td></tr>').join('');
    } else {
      html += '<tr><td colspan="6" style="text-align:center;padding:20px">گروهی ثبت نشده است.</td></tr>';
    }
    html += '</tbody></table></div></div>';
    $('pageContent').innerHTML = html;
  }).withFailureHandler(e => toast(e.message, 'error')).getSupervisorGroups(currentToken);
}

function viewMembers(groupId) {
  localStorage.setItem('sv_current_group', groupId);
  loadPage('members');
}

function loadMembers() {
  const groupId = localStorage.getItem('sv_current_group') || '';
  if (!groupId) { loadPage('groups'); return; }
  
  google.script.run.withSuccessHandler(statuses => {
    google.script.run.withSuccessHandler(rows => {
      let html = '<div class="page-header"><h1 class="page-title">اعضای گروه</h1><button class="btn btn-primary" onclick="openAddMember()">＋ افزودن عضو</button></div><div class="card"><div class="table-wrap"><table><thead><tr><th>شناسه</th><th>نام کامل</th><th>نام کاربری</th><th>نقش</th><th>وضعیت</th><th>عملیات</th></tr></thead><tbody>';
      if (rows.length) {
        html += rows.map(m => '<tr><td>'+(m.workerId||'—')+'</td><td>'+m.fullName+'</td><td>'+m.username+'</td><td>'+m.role+'</td><td>'+statusBadge(m.status)+'</td><td><select class="zv-select" style="min-width:120px" onchange="toggleMemberStatus('+m.rowIndex+',this.value)"><option value="">تغییر وضعیت...</option>'+statuses.map(s => '<option value="'+s+'" '+(s===m.status?'selected':'')+'>'+s+'</option>').join('')+'</select> <button class="btn btn-sm btn-danger" onclick="removeMember('+m.rowIndex+')">حذف</button></td></tr>').join('');
      } else {
        html += '<tr><td colspan="6" style="text-align:center;padding:20px">عضوی ثبت نشده است.</td></tr>';
      }
      html += '</tbody></table></div></div>';
      $('pageContent').innerHTML = html;
    }).withFailureHandler(e => toast(e.message, 'error')).getGroupMembers(groupId, currentToken);
  }).withFailureHandler(e => toast(e.message, 'error')).getSupervisorMemberStatuses(currentToken);
}

function openAddMember() {
  const groupId = localStorage.getItem('sv_current_group');
  openModal('<div class="modal-header"><h2>افزودن عضو</h2><button class="modal-close" onclick="closeModal()">✕</button></div>' +
    '<div class="form-grid"><div class="field"><label>شناسه یکتا (Worker-ID) *</label><input id="mWorkerId" class="zv-input"></div>' +
    '<div class="field"><label>نقش *</label><select id="mRole" class="zv-select"><option value="worker">worker</option><option value="operator">operator</option></select></div></div>' +
    '<div class="modal-footer"><button class="btn btn-secondary" onclick="closeModal()">انصراف</button><button class="btn btn-primary" onclick="saveMember(\''+groupId+'\')">افزودن</button></div>');
}

function saveMember(groupId) {
  const id = $('mWorkerId').value.trim(), role = $('mRole').value;
  if (!id) return toast('شناسه یکتا را وارد کنید', 'error');
  google.script.run.withSuccessHandler(() => { closeModal(); toast('عضو افزوده شد', 'success'); loadMembers(); })
  .withFailureHandler(e => toast(e.message, 'error')).addGroupMember(groupId, id, role, currentToken);
}

function removeMember(rowIndex) {
  if (!confirm('حذف شود؟')) return;
  google.script.run.withSuccessHandler(() => { toast('حذف شد', 'success'); loadMembers(); })
  .withFailureHandler(e => toast(e.message, 'error')).removeGroupMember(rowIndex, currentToken);
}

function toggleMemberStatus(rowIndex, newStatus) {
  if (!newStatus) return;
  google.script.run.withSuccessHandler(() => { toast('وضعیت تغییر کرد', 'success'); loadMembers(); })
  .withFailureHandler(e => toast(e.message, 'error')).toggleMemberStatus(rowIndex, newStatus, currentToken);
}

function loadCards() {
  $('pageContent').innerHTML = '<div class="page-header"><h1 class="page-title">کارت‌ها و سفارش‌ها</h1></div>' +
    '<div class="card"><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px">' +
    '<div class="field"><label>جستجو</label><input id="cdSearch" placeholder="مشتری یا CardID" oninput="debounceCards()"></div>' +
    '<div class="field"><label>وضعیت</label><select id="cdStatus" onchange="fetchCards()"><option value="همه">همه</option><option>جدید</option><option>در حال انجام</option><option>تکمیل شده</option><option>لغو شده</option><option>ارجاع به سرپرست</option></select></div></div><div id="cardsTable"></div></div>';
  fetchCards();
}

let cdTimer;
function debounceCards() { clearTimeout(cdTimer); cdTimer = setTimeout(fetchCards, 400); }

function fetchCards() {
  const filters = { search: $('cdSearch')?.value || '', status: $('cdStatus')?.value || 'همه' };
  google.script.run.withSuccessHandler(rows => {
    let html = '<div class="table-wrap"><table><thead><tr><th>CardID</th><th>مشتری</th><th>خدمت</th><th>مبلغ</th><th>اجراکننده</th><th>وضعیت</th><th>عملیات</th></tr></thead><tbody>';
    if (rows.length) {
      html += rows.map(r => '<tr><td><strong>'+r.cardId+'</strong></td><td>'+r.customer+'</td><td>'+r.details+'</td><td>'+money(r.amount)+'</td><td>'+(r.workerName||'—')+'</td><td>'+statusBadge(r.status)+'</td><td style="white-space:nowrap"><button class="btn btn-sm btn-primary" onclick="changeCardStatus(\''+r.cardId+'\',\''+r.status+'\')">وضعیت</button> <button class="btn btn-sm btn-secondary" onclick="assignCard(\''+r.cardId+'\')">تخصیص</button></td></tr>').join('');
    } else {
      html += '<tr><td colspan="7" style="text-align:center;padding:20px">کارتی یافت نشد.</td></tr>';
    }
    html += '</tbody></table></div>';
    $('cardsTable').innerHTML = html;
  }).withFailureHandler(e => toast(e.message, 'error')).getSupervisorCards(filters, currentToken);
}

function changeCardStatus(cardId, current) {
  google.script.run.withSuccessHandler(statuses => {
    openModal('<div class="modal-header"><h2>تغییر وضعیت</h2><button class="modal-close" onclick="closeModal()">✕</button></div>' +
      '<div class="field"><label>وضعیت جدید</label><select id="newCardStatus">' + statuses.map(s => '<option '+(s===current?'selected':'')+'>'+s+'</option>').join('') + '</select></div>' +
      '<div class="modal-footer"><button class="btn btn-secondary" onclick="closeModal()">انصراف</button><button class="btn btn-primary" onclick="applyCardStatus(\''+cardId+'\')">ثبت</button></div>');
  }).withFailureHandler(e => toast(e.message, 'error')).getSupervisorCardStatuses(currentToken);
}

function applyCardStatus(cardId) {
  google.script.run.withSuccessHandler(() => { closeModal(); toast('ثبت شد', 'success'); fetchCards(); })
  .withFailureHandler(e => toast(e.message, 'error')).updateSupervisorCardStatus(cardId, $('newCardStatus').value, currentToken);
}

function assignCard(cardId) {
  google.script.run.withSuccessHandler(workers => {
    let opts = '<option value="">بازگشت به استخر</option>' + workers.map(w => '<option value="'+w.id+'">'+w.name+' ('+w.operations+')</option>').join('');
    openModal('<div class="modal-header"><h2>تخصیص کارت</h2><button class="modal-close" onclick="closeModal()">✕</button></div>' +
      '<div class="field"><label>عضو فعال</label><select id="targetWorker">' + opts + '</select></div>' +
      '<div class="modal-footer"><button class="btn btn-secondary" onclick="closeModal()">انصراف</button><button class="btn btn-primary" onclick="executeAssign(\''+cardId+'\')">تأیید</button></div>');
  }).withFailureHandler(e => toast(e.message, 'error')).getSupervisorWorkersForDropdown(currentToken);
}

function executeAssign(cardId) {
  google.script.run.withSuccessHandler(() => { closeModal(); toast('تخصیص ثبت شد', 'success'); fetchCards(); })
  .withFailureHandler(e => toast(e.message, 'error')).assignCardToWorker(cardId, $('targetWorker').value, currentToken);
}

function loadMessages() {
  $('pageContent').innerHTML = '<div class="page-header"><h1 class="page-title">مکاتبات متخصصان</h1></div><div class="card" id="msgThreads">در حال دریافت…</div>';
  google.script.run.withSuccessHandler(rows => {
    let html = '';
    if (rows.length) {
      html = rows.map(t => '<div style="padding:14px;border:1px solid var(--line);border-radius:12px;margin:9px 0;background:#fff"><b>'+t.subject+'</b><div style="font-size:11px;color:var(--muted);margin:6px 0">کارت: '+t.cardId+' | متخصص: '+t.workerUsername+'</div><button class="btn btn-sm btn-primary" onclick="openThread(\''+t.threadId+'\')">نمایش پیام</button></div>').join('');
    } else {
      html = '<div style="text-align:center;padding:20px">مکاتبه‌ای ثبت نشده است.</div>';
    }
    $('msgThreads').innerHTML = html;
  }).withFailureHandler(e => toast(e.message, 'error')).supervisorGetConversations(currentToken);
}

function openThread(id) {
  google.script.run.withSuccessHandler(d => {
    openModal('<div class="modal-header"><h2>'+d.thread.subject+'</h2><button class="modal-close" onclick="closeModal()">✕</button></div>' +
      '<div id="threadMsgs" style="max-height:300px;overflow-y:auto;margin-bottom:12px">'+d.messages.map(m => '<div style="margin:8px 0;padding:12px;background:#f8f9fc;border-radius:10px"><b>'+m.senderUsername+'</b><div style="white-space:pre-wrap;margin-top:6px">'+m.body+'</div></div>').join('')+'</div>' +
      '<textarea id="threadReply" class="zv-textarea" placeholder="پاسخ…"></textarea>' +
      '<div class="modal-footer"><button class="btn btn-secondary" onclick="closeModal()">بستن</button><button class="btn btn-primary" onclick="replyThread(\''+id+'\')">ارسال</button></div>');
  }).withFailureHandler(e => toast(e.message, 'error')).supervisorGetConversation(id, currentToken);
}

function replyThread(id) {
  const b = $('threadReply').value.trim();
  if (!b) return toast('متن پاسخ را وارد کنید', 'error');
  google.script.run.withSuccessHandler(() => { closeModal(); toast('ارسال شد', 'success'); loadMessages(); })
  .withFailureHandler(e => toast(e.message, 'error')).supervisorCreateConversationReply(id, b, currentToken);
}

function loadReturned() {
  google.script.run.withSuccessHandler(rows => {
    let html = '<div class="page-header"><h1 class="page-title">کارت‌های مرجوعی</h1></div><div class="card"><div class="table-wrap"><table><thead><tr><th>کد کارت</th><th>مشتری</th><th>خدمت</th><th>اجراکننده</th><th>وضعیت</th><th>عملیات</th></tr></thead><tbody>';
    if (rows.length) {
      html += rows.map(r => '<tr><td><strong>'+r.cardId+'</strong></td><td>'+r.customer+'</td><td>'+r.details+'</td><td>'+(r.workerId||'—')+'</td><td>'+statusBadge(r.status)+'</td><td><button class="btn btn-sm btn-primary" onclick="changeCardStatus(\''+r.cardId+'\',\''+r.status+'\')">تغییر وضعیت</button></td></tr>').join('');
    } else {
      html += '<tr><td colspan="6" style="text-align:center;padding:20px">کارت مرجوعی نیست.</td></tr>';
    }
    html += '</tbody></table></div></div>';
    $('pageContent').innerHTML = html;
  }).withFailureHandler(e => toast(e.message, 'error')).getSupervisorReturnedCards(currentToken);
}

function loadReports() {
  $('pageContent').innerHTML = '<div class="page-header"><h1 class="page-title">گزارش عملکرد</h1></div>' +
    '<div class="card"><div style="display:grid;grid-template-columns:1fr 1fr auto;gap:12px;margin-bottom:16px;align-items:end">' +
    '<div class="field"><label>از تاریخ</label><input id="repFrom" placeholder="1405/01/01"></div>' +
    '<div class="field"><label>تا تاریخ</label><input id="repTo" placeholder="1405/12/29"></div>' +
    '<div class="field"><button class="btn btn-primary" style="width:100%" onclick="fetchReports()">نمایش</button></div></div><div id="repContent"></div></div>';
  fetchReports();
}

function fetchReports() {
  google.script.run.withSuccessHandler(rep => {
    $('repContent').innerHTML = '<div class="stats-grid">' +
      '<div class="stat-card"><div class="stat-label">کل کارت‌ها</div><div class="stat-value">' + toFa(rep.totalCards) + '</div></div>' +
      '<div class="stat-card green"><div class="stat-label">تکمیل شده</div><div class="stat-value">' + toFa(rep.completedCards) + '</div></div>' +
      '<div class="stat-card blue"><div class="stat-label">درآمد</div><div class="stat-value">' + money(rep.totalRevenue) + '</div></div></div>' +
      '<div class="card" style="margin-top:16px"><h3>عملکرد اعضا</h3><div class="table-wrap"><table><thead><tr><th>نام</th><th>کل</th><th>تکمیل</th><th>مبلغ</th></tr></thead><tbody>' +
      (rep.byWorker||[]).map(w => '<tr><td>'+w.name+'</td><td>'+toFa(w.total)+'</td><td>'+toFa(w.completed)+'</td><td>'+money(w.revenue)+'</td></tr>').join('') +
      '</tbody></table></div></div>';
  }).withFailureHandler(e => toast(e.message, 'error')).getSupervisorReports(currentToken, $('repFrom')?.value||'', $('repTo')?.value||'');
}

function loadProfile() {
  google.script.run.withSuccessHandler(p => {
    const photo = p.avatar ? '<img src="' + p.avatar + '" alt="تصویر پروفایل" style="width:100%;height:100%;object-fit:cover">' : (p.name || '?').charAt(0);
    $('pageContent').innerHTML = 
      '<div class="page-header"><h1 class="page-title">پروفایل من</h1></div>' +
      '<div class="profile-layout"><div class="card profile-photo-card"><div class="profile-photo-large" id="profilePhoto">' + photo + '</div><h3>' + p.name + '</h3><div class="zv-muted">' + p.role + ' · شناسه: ' + p.workerId + '</div><div class="profile-photo-actions" style="margin-top:16px"><button class="btn btn-primary" type="button" onclick="openPhotoEditor()">📷 تغییر تصویر پروفایل</button><small>فرمت JPG، PNG یا WEBP؛ حداکثر ۸ مگابایت</small></div></div>' +
      '<div class="card"><h3 style="margin-bottom:16px;color:var(--navy)">اطلاعات حساب</h3><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px"><div class="field"><label>شناسه یکتا</label><input class="zv-input" value="' + p.workerId + '" disabled></div><div class="field"><label>نام و نام خانوادگی</label><input class="zv-input" value="' + p.name + '" disabled></div><div class="field"><label>نقش</label><input class="zv-input" value="' + p.role + '" disabled></div><div class="field"><label>شناسه شعبه</label><input class="zv-input" value="' + p.branchId + '" disabled></div></div><hr style="border:0;border-top:1px solid var(--line);margin:18px 0"><h3 style="margin-bottom:12px;color:var(--navy)">ویرایش اطلاعات ورود</h3><div class="profile-form"><div class="field"><label>نام کاربری</label><input id="newUsername" class="zv-input" value="' + p.username + '"></div><div class="field"><label>رمز عبور جدید</label><input id="newPassword" class="zv-input" type="password" placeholder="خالی = بدون تغییر"></div></div><button class="btn btn-primary" style="margin-top:16px" onclick="updateProfile()">💾 ذخیره تغییرات</button></div></div>';
  }).withFailureHandler(e => toast(e.message || 'دریافت پروفایل ناموفق بود', 'error')).getSupervisorProfile(currentToken);
}

function updateProfile() {
  const updates = { username: $('newUsername').value.trim(), password: $('newPassword').value };
  if (!updates.username) return toast('نام کاربری نمی‌تواند خالی باشد', 'error');
  google.script.run.withSuccessHandler(() => { 
    if(currentUser) { currentUser.username = updates.username; localStorage.setItem('zv_supervisor_user', JSON.stringify(currentUser)); }
    toast('پروفایل بروزرسانی شد', 'success'); loadProfile(); 
  }).withFailureHandler(e => toast(e.message, 'error')).updateSupervisorProfile(updates, currentToken);
}

// ==========================================================
// بخش Photo Editor (اکنون به درستی داخل تگ script قرار دارد)
// ==========================================================
(function loadPhotoEditor() {
  fetch('PhotoEditor.html').then(function(r) { 
    return r.text(); 
  }).then(function(html) {
    var wrap = document.createElement('div'); 
    wrap.innerHTML = html; 
    document.body.appendChild(wrap);
    Array.prototype.slice.call(wrap.querySelectorAll('script')).forEach(function(old) {
      var s = document.createElement('script'); 
      s.textContent = old.textContent; 
      document.body.appendChild(s);
    });
  }).catch(function(e) { 
    console.warn('PhotoEditor بارگذاری نشد:', e); 
  });
})();

function openPhotoEditor() {
  if (!window.ZVPhoto || !window.ZVPhoto.__v2) {
    toast('ویرایشگر تصویر در حال بارگذاری است. لطفاً چند لحظه صبر کنید.', 'warning');
    return;
  }
  window.ZVPhoto.open({
    token: currentToken,
    endpoint: 'uploadMyProfilePhotoV2',
    onDone: function(url) {
      if (currentUser) {
        currentUser.avatar = url;
        localStorage.setItem('zv_supervisor_user', JSON.stringify(currentUser));
      }
      const av = $('userAvatar');
      if (av) av.innerHTML = '<img src="' + url + '">';
      toast('تصویر پروفایل با موفقیت تغییر کرد', 'success');
      loadProfile();
    }
  });
}
// ==========================================================

document.addEventListener('keydown', e => { if (e.key === 'Enter' && $('loginPage').style.display !== 'none') doLogin(); });
