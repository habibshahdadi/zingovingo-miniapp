<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<base target="_top">
<title>پنل مدیر ارشد | ZingoVingo</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="zv-api.js"></script>
<style>
:root{--navy:#0B1736;--navy-light:#1a2a4d;--orange:#FF6B1A;--orange-light:#ff8533;--bg:#f4f6fb;--text:#172033;--muted:#657086;--line:#dfe4ee;--white:#fff;--green:#067647;--danger:#b42318;--blue:#1849a9;--yellow:#f79009;--shadow:0 2px 10px #17203308;--radius:14px}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:Tahoma,Arial,sans-serif;line-height:1.7;font-size:14px}
button,input,select,textarea{font-family:inherit;font-size:13px}
.login-page{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--navy) 0%,#1a2a4d 100%)}
.login-box{background:#fff;border-radius:20px;padding:40px;width:min(420px,92%);box-shadow:0 20px 60px #0003}
.login-box h1{color:var(--navy);text-align:center;margin-bottom:8px;font-size:28px}
.login-box h1 span{color:var(--orange)}
.login-box .subtitle{text-align:center;color:var(--muted);margin-bottom:24px;font-size:13px}
.login-box .field{margin-bottom:14px}
.login-box label{display:block;margin-bottom:6px;font-weight:700;font-size:13px}
.login-box input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;outline:none}
.login-box input:focus{border-color:var(--orange);box-shadow:0 0 0 3px #ff6b1a1c}
.login-box .btn{width:100%;padding:13px;margin-top:8px}
.login-error{background:#fef3f2;color:var(--danger);padding:10px;border-radius:8px;margin-bottom:12px;font-size:13px;display:none}
.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
.sidebar{background:var(--navy);color:#fff;padding:0;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column}
.brand{padding:20px;border-bottom:1px solid var(--navy-light)}
.brand h2{font-size:22px;font-weight:900}
.brand h2 span{color:var(--orange)}
.brand small{color:#8896b3;font-size:11px}
.nav-menu{flex:1;padding:12px 0}
.nav-item{display:flex;align-items:center;gap:10px;padding:12px 20px;cursor:pointer;color:#c8d2e6;font-size:14px;border-right:3px solid transparent;transition:all .2s}
.nav-item:hover{background:var(--navy-light);color:#fff}
.nav-item.active{background:var(--navy-light);color:#fff;border-right-color:var(--orange)}
.nav-item .badge{margin-right:auto;background:var(--orange);color:#fff;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700}
.sidebar-footer{padding:16px 20px;border-top:1px solid var(--navy-light);font-size:12px}
.user-info{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.user-avatar{width:36px;height:36px;border-radius:50%;background:var(--orange);display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;font-size:14px;overflow:hidden}
.user-avatar img{width:100%;height:100%;object-fit:cover}
.user-name{font-weight:700;font-size:13px}
.user-role{color:#8896b3;font-size:11px}
.logout-btn{background:transparent;border:1px solid var(--navy-light);color:#c8d2e6;padding:8px;border-radius:8px;cursor:pointer;width:100%;font-size:12px}
.logout-btn:hover{background:var(--navy-light);color:#fff}
.main{padding:24px;overflow-x:hidden}
.page-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:10px}
.page-title{font-size:20px;color:var(--navy);font-weight:900}
.btn{border:0;border-radius:10px;padding:9px 16px;font:inherit;font-weight:700;cursor:pointer;transition:all .2s}
.btn-primary{background:var(--orange);color:#fff}
.btn-primary:hover{background:var(--orange-light)}
.btn-secondary{background:#eef1f7;color:var(--navy)}
.btn-secondary:hover{background:#dfe4ee}
.btn-danger{background:#fef3f2;color:var(--danger)}
.btn-danger:hover{background:#fee4e2}
.btn-success{background:#ecfdf3;color:var(--green)}
.btn-sm{padding:5px 10px;font-size:12px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:16px;box-shadow:var(--shadow)}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:20px}
.stat-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:18px;position:relative;overflow:hidden;transition:transform .2s}
.stat-card:hover{transform:translateY(-2px)}
.stat-card::before{content:'';position:absolute;top:0;right:0;width:4px;height:100%;background:var(--orange)}
.stat-card.green::before{background:var(--green)}
.stat-card.blue::before{background:var(--blue)}
.stat-card.yellow::before{background:var(--yellow)}
.stat-card.red::before{background:var(--danger)}
.stat-label{font-size:12px;color:var(--muted);margin-bottom:6px}
.stat-value{font-size:24px;font-weight:900;color:var(--navy);font-variant-numeric:tabular-nums}
.stat-sub{font-size:11px;color:var(--muted);margin-top:4px}
.table-wrap{overflow-x:auto;border-radius:var(--radius);border:1px solid var(--line)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#f8f9fc;padding:12px;text-align:right;font-weight:700;color:var(--navy);border-bottom:2px solid var(--line);position:sticky;top:0;white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:hover{background:#fafbfd}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700}
.badge-new{background:#eff6ff;color:var(--blue)}
.badge-progress{background:#fff7ed;color:#9a3412}
.badge-done{background:#ecfdf3;color:var(--green)}
.badge-cancel{background:#fef3f2;color:var(--danger)}
.badge-active{background:#ecfdf3;color:var(--green)}
.badge-inactive{background:#fef3f2;color:var(--danger)}
.badge-role{background:var(--navy-light);color:#fff;padding:2px 8px;border-radius:10px;font-size:10px}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:16px}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12px;font-weight:700;color:var(--muted)}
input,select,textarea{font:inherit;border:1px solid #cfd6e3;border-radius:8px;padding:9px 11px;background:#fff;outline:none;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--orange);box-shadow:0 0 0 3px #ff6b1a1c}
textarea{min-height:80px;resize:vertical}
.modal{display:none;position:fixed;inset:0;background:#071127a8;z-index:100;padding:18px;align-items:center;justify-content:center}
.modal.open{display:flex}
.modal-box{width:min(800px,100%);background:#fff;border-radius:var(--radius);padding:24px;max-height:90vh;overflow:auto}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.modal-header h2{font-size:18px;color:var(--navy)}
.modal-close{background:transparent;border:0;font-size:22px;cursor:pointer;color:var(--muted);padding:4px 10px}
.modal-footer{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}
.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.form-grid .full{grid-column:1/-1}
.toast{position:fixed;bottom:20px;left:20px;background:var(--navy);color:#fff;padding:12px 20px;border-radius:10px;z-index:200;display:none;box-shadow:0 10px 30px #0003;font-size:13px}
.toast.show{display:block;animation:slideIn .3s}
.toast.success{background:var(--green)}
.toast.error{background:var(--danger)}
@keyframes slideIn{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tab{padding:10px 16px;cursor:pointer;border-bottom:2px solid transparent;font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap}
.tab.active{color:var(--orange);border-bottom-color:var(--orange)}
.charts-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(350px,1fr));gap:16px;margin-bottom:20px}
.chart-box{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.chart-box h3{margin-bottom:12px;color:var(--navy);font-size:15px}
.employee-profile{display:grid;grid-template-columns:200px 1fr;gap:20px}
.employee-avatar-large{width:200px;height:200px;border-radius:50%;background:var(--orange);display:flex;align-items:center;justify-content:center;font-size:60px;color:#fff;font-weight:900;overflow:hidden;cursor:pointer}
.employee-avatar-large img{width:100%;height:100%;object-fit:cover}
.employee-details{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.detail-item{background:#f8f9fc;padding:12px;border-radius:10px}
.detail-label{font-size:11px;color:var(--muted);margin-bottom:4px}
.detail-value{font-weight:700;color:var(--navy)}
.loading{text-align:center;padding:40px;color:var(--muted)}
.spinner{display:inline-block;width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--orange);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.menu-toggle{display:none;background:var(--navy);color:#fff;border:0;padding:8px 12px;border-radius:8px;cursor:pointer}
.bulk-actions{background:#fff7ed;border:1px solid #fed7aa;padding:10px 14px;border-radius:10px;margin-bottom:14px;display:none;align-items:center;gap:10px;flex-wrap:wrap}
.bulk-actions.show{display:flex}
.bulk-actions strong{color:#9a3412}
.top-list{display:grid;gap:8px}
.top-item{display:flex;justify-content:space-between;align-items:center;padding:10px;background:#f8f9fc;border-radius:8px}
.top-item .rank{background:var(--orange);color:#fff;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900}
.top-item .info{flex:1;margin:0 10px}
.top-item .info .name{font-weight:700;font-size:13px}
.top-item .info .sub{font-size:11px;color:var(--muted)}
.top-item .value{font-weight:900;color:var(--navy)}
.multi-select{position:relative}
.multi-select-btn{border:1px solid #cfd6e3;border-radius:8px;padding:9px 11px;background:#fff;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.multi-select-dropdown{display:none;position:absolute;top:100%;right:0;left:0;background:#fff;border:1px solid var(--line);border-radius:8px;max-height:200px;overflow-y:auto;z-index:10;box-shadow:0 10px 30px #17203320}
.multi-select-dropdown.open{display:block}
.multi-select-dropdown label{display:flex;align-items:center;gap:8px;padding:8px 11px;cursor:pointer;font-size:13px}
.multi-select-dropdown label:hover{background:#f8f9fc}
@media print{.sidebar,.page-header,.btn,.filters,.modal-footer,.bulk-actions,.menu-toggle{display:none!important}.app{grid-template-columns:1fr}.main{padding:0}.card{box-shadow:none;border:1px solid #ddd}}
@media(max-width:900px){.app{grid-template-columns:1fr}.sidebar{position:fixed;right:-280px;width:260px;z-index:50;transition:right .3s}.sidebar.open{right:0}.menu-toggle{display:block}.form-grid{grid-template-columns:1fr}.employee-profile{grid-template-columns:1fr}.employee-avatar-large{width:150px;height:150px;font-size:40px}}
</style>
</head>
<body>
<div id="loginPage" class="login-page">
<div class="login-box">
<h1>Zingo<span>Vingo</span></h1>
<div class="subtitle">پنل مدیر ارشد — مدیریت سیستم</div>
<div id="loginError" class="login-error"></div>
<div class="field"><label>نام کاربری یا ایمیل</label><input id="loginUser" placeholder="username یا email" autocomplete="username"></div>
<div class="field"><label>رمز عبور</label><input id="loginPass" type="password" placeholder="••••••••" autocomplete="current-password"></div>
<button class="btn btn-primary" onclick="doLogin()">ورود به پنل</button>
<div style="text-align:center;margin-top:16px;font-size:12px;color:var(--muted)"><a href="customerform.html" style="color:var(--orange);text-decoration:none">→ بازگشت به سایت</a></div>
</div>
</div>
<div id="appContainer" class="app" style="display:none">
<aside class="sidebar" id="sidebar">
<div class="brand"><h2>Zingo<span>Vingo</span></h2><small>پنل مدیر ارشد</small></div>
<nav class="nav-menu" id="navMenu"></nav>
<div class="sidebar-footer">
<div class="user-info"><div class="user-avatar" id="userAvatar">?</div><div><div class="user-name" id="userName">—</div><div class="user-role" id="userRole">—</div></div></div>
<button class="logout-btn" onclick="doLogout()">🚪 خروج</button>
<div style="margin-top:10px"><a href="customerform.html" style="color:var(--orange);text-decoration:none;font-size:11px">→ بازگشت به سایت</a></div>
</div>
</aside>
<main class="main">
<button class="menu-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')">☰ منو</button>
<div id="pageContent"><div class="loading"><div class="spinner"></div></div></div>
</main>
</div>
<div id="toast" class="toast"></div>
<div id="modal" class="modal"><div class="modal-box" id="modalBox"></div></div>

<script>
fetch('PhotoEditor.html').then(function (r) { return r.text(); }).then(function (html) {
  var wrap = document.createElement('div'); wrap.innerHTML = html; document.body.appendChild(wrap);
  Array.prototype.slice.call(wrap.querySelectorAll('script')).forEach(function (old) {
    var s = document.createElement('script'); s.textContent = old.textContent; document.body.appendChild(s);
  });
}).catch(function (e) { console.warn('PhotoEditor بارگذاری نشد:', e); });
</script>

<script>
const $ = id => document.getElementById(id);
const money = n => new Intl.NumberFormat('en-US').format(Math.round(Number(n)||0)) + ' ریال';
const toFa = n => new Intl.NumberFormat('fa-IR').format(n);
let currentToken = localStorage.getItem('zv_administrator_token') || null;
let currentUser = null;
let selectedRows = new Set();
const MENU_ITEMS = [
{ id: 'dashboard', label: '📊 داشبورد' },
{ id: 'orders', label: ' سفارشات', hasBadge: true },
{ id: 'cards', label: '🎫 کارت‌ها' },
{ id: 'tasks', label: '✅ لیست کارها' },
{ id: 'branches', label: '🏢 شعبه‌ها' },
{ id: 'groups', label: '👥 گروه‌ها' },
{ id: 'employees', label: '👔 کارمندان' },
{ id: 'workers', label: '👷 نیروها' },
{ id: 'services', label: '🧰 خدمات' },
{ id: 'customers', label: ' مشتریان' },
{ id: 'offers', label: '🎟️ کدهای تخفیف' },
{ id: 'reports', label: '📈 گزارش‌ها' },
{ id: 'logs', label: '📝 لاگ‌ها' },
{ id: 'settings', label: '🔧 تنظیمات' },
{ id: 'profile', label: '👤 پروفایل من' }
];
function toast(msg, type='info') { const t = $('toast'); t.textContent = msg; t.className = 'toast show ' + type; setTimeout(() => t.classList.remove('show'), 3500); }
function openModal(html) { $('modalBox').innerHTML = html; $('modal').classList.add('open'); }
function closeModal() { $('modal').classList.remove('open'); }
$('modal').addEventListener('click', e => { if (e.target === $('modal')) closeModal(); });
function statusBadge(s) { return '<span class="badge badge-' + (/جدید|ثبت اولیه/.test(s)?'new':/تکمیل/.test(s)?'done':/لغو/.test(s)?'cancel':'progress') + '">' + s + '</span>'; }
function renderMenu() {
const menu = $('navMenu');
const allowed = (currentUser.permissions && currentUser.permissions.pages) || [];
menu.innerHTML = MENU_ITEMS.filter(item => allowed.includes(item.id)).map(item => '<div class="nav-item" data-page="' + item.id + '">' + item.label + (item.hasBadge ? '<span class="badge" id="pendingBadge">0</span>' : '') + '</div>').join('');
menu.querySelectorAll('.nav-item').forEach(item => { item.addEventListener('click', () => { menu.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active')); item.classList.add('active'); loadPage(item.dataset.page); document.getElementById('sidebar').classList.remove('open'); }); });
}
function doLogin() {
const u = $('loginUser').value.trim(), p = $('loginPass').value;
if (!u || !p) { showLoginError('نام کاربری و رمز عبور را وارد کنید'); return; }
$('loginError').style.display = 'none';
const btn = document.querySelector('.login-box .btn-primary');
if (btn) { btn.disabled = true; btn.textContent = 'در حال ورود...'; }
google.script.run.withSuccessHandler(function(r) {
if (btn) { btn.disabled = false; btn.textContent = 'ورود به پنل'; }
if (r && r.success) { currentToken = r.token; currentUser = r.user; localStorage.setItem('zv_administrator_token', r.token); localStorage.setItem('zv_administrator_user', JSON.stringify(r.user)); showApp(r.user); }
else showLoginError((r && r.message) || 'خطا در ورود');
}).withFailureHandler(function(e) { if (btn) { btn.disabled = false; btn.textContent = 'ورود به پنل'; } showLoginError(e.message || 'خطا در ورود'); }).adminLogin(u, p);
}
function showLoginError(msg) { $('loginError').textContent = msg; $('loginError').style.display = 'block'; }
function doLogout() { if (currentToken) google.script.run.adminLogout(currentToken); localStorage.removeItem('zv_administrator_token'); localStorage.removeItem('zv_administrator_user'); currentToken = null; currentUser = null; location.reload(); }
function showApp(user) {
currentUser = user; $('loginPage').style.display = 'none'; $('appContainer').style.display = 'grid';
$('userName').textContent = user.name; $('userRole').innerHTML = (user.roleFa || 'ادمین ارشد') + ' <span class="badge-role">' + user.role + '</span>';
const avatar = $('userAvatar'); if (user.avatar) avatar.innerHTML = '<img src="' + user.avatar + '" onerror="this.style.display=\'none\'">'; else avatar.textContent = user.name ? user.name.charAt(0) : '?';
renderMenu();
const firstNav = document.querySelector('.nav-item[data-page="dashboard"]'); if (firstNav) firstNav.classList.add('active');
loadPage('dashboard');
}
(function checkSession() { const saved = localStorage.getItem('zv_administrator_user'); if (currentToken && saved) { currentUser = JSON.parse(saved); showApp(currentUser); } })();
function loadPage(page) {
const c = $('pageContent'); c.innerHTML = '<div class="loading"><div class="spinner"></div></div>'; selectedRows.clear();
const loaders = { dashboard: loadDashboard, orders: loadOrders, cards: loadCards, tasks: loadTasks, branches: loadBranches, groups: loadGroups, employees: loadEmployees, workers: loadWorkers, services: loadServices, customers: loadCustomers, offers: loadOffers, reports: loadReports, logs: loadLogs, settings: loadSettings, profile: loadProfile };
(loaders[page] || loadDashboard)();
}
function updateBulkActions() { const sc = $('selectedCount'), ba = $('bulkActions'); if (sc) sc.textContent = toFa(selectedRows.size); if (ba) ba.classList.toggle('show', selectedRows.size > 0); }
function clearSelection() { selectedRows.clear(); document.querySelectorAll('.row-check,.chk').forEach(c => c.checked = false); const sa = $('selectAll'); if (sa) sa.checked = false; updateBulkActions(); }

/* ==================== آپلود عکس پروفایل ==================== */
function openMyPhotoEditor() {
if (!window.ZVPhoto) { toast('کامپوننت ویرایش عکس بارگذاری نشده', 'error'); return; }
ZVPhoto.open({
endpoint: 'uploadMyProfilePhoto',
token: currentToken,
onDone: function(url) {
currentUser.avatar = url;
localStorage.setItem('zv_administrator_user', JSON.stringify(currentUser));
const av = $('userAvatar'); if (av) av.innerHTML = '<img src="' + url + '" onerror="this.style.display=\'none\'">';
toast('عکس پروفایل بروزرسانی شد', 'success');
loadProfile();
}
});
}
function uploadFor(entity, id, username) {
if (!window.ZVPhoto) { toast('کامپوننت ویرایش عکس بارگذاری نشده', 'error'); return; }
ZVPhoto.open({
endpoint: 'uploadProfilePhotoFor',
token: currentToken,
target: { entity: entity, id: id, username: username },
onDone: function(url) {
toast('عکس ذخیره شد', 'success');
if (entity === 'employees') fetchEmployees();
else if (entity === 'workers') fetchWorkers();
else if (entity === 'customers') fetchCustomers();
}
});
}

/* ==================== داشبورد ==================== */
function loadDashboard() {
google.script.run.withSuccessHandler(function(data) {
$('pageContent').innerHTML = '<div class="page-header"><h1 class="page-title">داشبورد مدیریت سیستم</h1></div>' +
'<div class="stats-grid">' +
'<div class="stat-card"><div class="stat-label">کل سفارشات</div><div class="stat-value">' + toFa(data.totalOrders) + '</div></div>' +
'<div class="stat-card green"><div class="stat-label">امروز</div><div class="stat-value">' + toFa(data.todayOrders) + '</div></div>' +
'<div class="stat-card blue"><div class="stat-label">این ماه</div><div class="stat-value">' + toFa(data.monthOrders) + '</div><div class="stat-sub">' + money(data.monthRevenue) + '</div></div>' +
'<div class="stat-card yellow"><div class="stat-label">درآمد کل</div><div class="stat-value">' + money(data.totalRevenue) + '</div></div>' +
'<div class="stat-card"><div class="stat-label">در انتظار</div><div class="stat-value">' + toFa(data.pendingOrders) + '</div></div>' +
'<div class="stat-card green"><div class="stat-label">تکمیل شده</div><div class="stat-value">' + toFa(data.completedOrders) + '</div></div>' +
'<div class="stat-card red"><div class="stat-label">لغو شده</div><div class="stat-value">' + toFa(data.cancelledOrders) + '</div></div>' +
'<div class="stat-card blue"><div class="stat-label">مشتریان فعال</div><div class="stat-value">' + toFa(data.activeCustomers || 0) + '</div></div>' +
'</div>' +
'<div class="charts-grid">' +

if (!pending) toast('تغییری ثبت نشده است', 'info');
}
function saveImageSettings() {
['LOGO_URL','LANDING_MEDIA_URL','BRAND_SYMBOL_URL'].forEach(function(k) {
const el = $('img_' + k); if (el) google.script.run.withSuccessHandler(function(){}).withFailureHandler(function(e){ toast(e.message, 'error'); }).updateSetting(k, el.value, currentToken);
});
toast('تصاویر ذخیره شد', 'success');
}
function uploadImage(input, key) {
const file = input.files[0]; if (!file) return;
const reader = new FileReader();
reader.onload = function(e) {
google.script.run.withSuccessHandler(function(r) {
if (r.success) { const el = $('img_' + key); if (el) el.value = r.url; updateSettingDirect(key, r.url); toast('آپلود موفق', 'success'); }
}).withFailureHandler(function(err) { toast(err.message, 'error'); }).uploadImage(e.target.result, file.name, currentToken);
};
reader.readAsDataURL(file);
}
function updateSettingDirect(key, value) { google.script.run.withSuccessHandler(function(){}).withFailureHandler(function(e){ toast(e.message, 'error'); }).updateSetting(key, value, currentToken); }

/* ==================== پروفایل ==================== */
// ==================== پروفایل ====================
function loadProfile() {
  google.script.run.withSuccessHandler(function(profile) {
    $('pageContent').innerHTML = '<div class="page-header"><h1 class="page-title">پروفایل من</h1><div style="display:flex;gap:8px"><button class="btn btn-primary" onclick=\'editProfile(' + JSON.stringify(profile).replace(/'/g,"&#39;") + ')\'>️ ویرایش</button><button class="btn btn-secondary" onclick="openMyPhotoEditor()">📷 تغییر عکس</button></div></div>' +
    '<div class="card"><div class="employee-profile"><div class="employee-avatar-large" onclick="openMyPhotoEditor()" title="برای تغییر عکس کلیک کنید">' + 
    (profile.avatar ? '<img src="'+profile.avatar+'" onerror="this.parentElement.innerHTML=\'' + (profile.fullName||'?').charAt(0) + '\'">' : (profile.fullName||'?').charAt(0)) + 
    '</div>' +
    '<div class="employee-details"><div class="detail-item"><div class="detail-label">کد پرسنلی</div><div class="detail-value">' + profile.employeeId + '</div></div><div class="detail-item"><div class="detail-label">نام کامل</div><div class="detail-value">' + profile.fullName + '</div></div><div class="detail-item"><div class="detail-label">نام کاربری</div><div class="detail-value">' + profile.username + '</div></div><div class="detail-item"><div class="detail-label">ایمیل</div><div class="detail-value">' + (profile.email||'—') + '</div></div><div class="detail-item"><div class="detail-label">موبایل</div><div class="detail-value" style="direction:ltr;text-align:right">' + (profile.phone||'—') + '</div></div><div class="detail-item"><div class="detail-label">سمت</div><div class="detail-value">' + (profile.position||'—') + '</div></div><div class="detail-item"><div class="detail-label">تخصص</div><div class="detail-value">' + (profile.specialty||'—') + '</div></div><div class="detail-item"><div class="detail-label">نقش</div><div class="detail-value">ادمین ارشد</div></div><div class="detail-item"><div class="detail-label">تاریخ استخدام</div><div class="detail-value">' + (profile.joinDate||'—') + '</div></div><div class="detail-item"><div class="detail-label">کد ملی</div><div class="detail-value">' + (profile.nationalCode||'—') + '</div></div><div class="detail-item"><div class="detail-label">تماس اضطراری</div><div class="detail-value">' + (profile.emergencyContact||'—') + '</div></div><div class="detail-item" style="grid-column:1/-1"><div class="detail-label">آدرس</div><div class="detail-value">' + (profile.address||'—') + '</div></div></div></div></div>';
  }).withFailureHandler(function(e) { 
    $('pageContent').innerHTML = '<div class="card" style="color:var(--danger)">' + e.message + '</div>'; 
  }).getUserProfile(currentToken);
}

function editProfile(p) {
  openModal('<div class="modal-header"><h2>ویرایش پروفایل</h2><button class="modal-close" onclick="closeModal()">✕</button></div>' +
  '<div class="form-grid"><div class="field"><label>نام کامل</label><input id="pFullName" value="' + p.fullName + '"></div><div class="field"><label>موبایل</label><input id="pPhone" value="' + (p.phone||'') + '"></div><div class="field"><label>ایمیل</label><input id="pEmail" value="' + (p.email||'') + '"></div><div class="field"><label>تخصص</label><input id="pSpecialty" value="' + (p.specialty||'') + '"></div><div class="field"><label>عکس پروفایل (URL)</label><input id="pAvatar" value="' + (p.avatar||'') + '"></div><div class="field"><label>کد ملی</label><input id="pNational" value="' + (p.nationalCode||'') + '"></div><div class="field"><label>تماس اضطراری</label><input id="pEmergency" value="' + (p.emergencyContact||'') + '"></div><div class="field full"><label>آدرس</label><textarea id="pAddress">' + (p.address||'') + '</textarea></div></div>' +
  '<div class="modal-footer"><button class="btn btn-secondary" onclick="closeModal()">انصراف</button><button class="btn btn-primary" onclick="saveProfile()">ذخیره</button></div>');
}

function saveProfile() {
  const updates = { fullName: $('pFullName').value, contact: $('pPhone').value, email: $('pEmail').value, specialization: $('pSpecialty').value, photo: $('pAvatar').value, nationalId: $('pNational').value, emergency: $('pEmergency').value, address: $('pAddress').value };
  google.script.run.withSuccessHandler(function() { 
    closeModal(); 
    toast('پروفایل بروزرسانی شد', 'success'); 
    loadProfile(); 
  }).withFailureHandler(function(e) { 
    toast(e.message, 'error'); 
  }).updateUserProfile(updates, currentToken);
}

// تابع باز کردن PhotoEditor
function openMyPhotoEditor() {
  if (!window.ZVPhoto) { 
    toast('کامپوننت ویرایش عکس بارگذاری نشده', 'error'); 
    return; 
  }
  ZVPhoto.open({
    endpoint: 'uploadMyProfilePhoto',
    token: currentToken,
    onDone: function(url) {
      currentUser.avatar = url;
      localStorage.setItem('zv_administrator_user', JSON.stringify(currentUser));
      const av = $('userAvatar'); 
      if (av) av.innerHTML = '<img src="' + url + '" onerror="this.style.display=\'none\'">';
      toast('عکس پروفایل بروزرسانی شد', 'success');
      loadProfile();
    }
  });
}
document.addEventListener('keydown', function(e) { if (e.key === 'Enter' && $('loginPage').style.display !== 'none') doLogin(); });
