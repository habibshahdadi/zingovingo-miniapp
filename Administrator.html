<style>
:root{

if(!window.google||!google.script||!google.script.run){rej(new Error('پل ارتباطی zv-api.js بارگذاری نشده است.'));return;}

function toast(msg,type,action){
var t=document.createElement('div');
t.className='toast '+(type||'');
t.innerHTML=icon(type==='ok'?'check':type==='err'?'x':type==='warn'?'undo':'zap','width:16px;height:16px')+'<span>'+esc(msg)+'</span>'+(action?'<button type="button">'+esc(action.label)+'</button>':'');
if(action)t.querySelector('button').onclick=function(){action.fn();t.remove();};
$('#toasts').appendChild(t);
setTimeout(function(){t.remove();},action?8000:3800);
}
function openModal(html,wide,dark){

function closeAllZsel(except){$$('.zsel.open').forEach(function(w){if(w!==except)w.classList.remove('open');});}
function zselSync(sel){if(sel&&typeof sel._zvSync==='function')sel._zvSync();}
function enhanceSelects(root){
$$('select',root||document).forEach(function(sel){
if(sel._zvDone)return;
sel._zvDone=true;
var wrap=document.createElement('div');
wrap.className='zsel';
sel.parentNode.insertBefore(wrap,sel);
wrap.appendChild(sel);
var b=document.createElement('button');
b.type='button';b.className='zsel-btn';
var pan=document.createElement('div');
pan.className='zsel-pan';
wrap.appendChild(b);wrap.appendChild(pan);
function label(){var o=sel.options[sel.selectedIndex];b.innerHTML='<span>'+esc(o?o.text:'—')+'</span>'+icon('chevD');}
function build(){
pan.innerHTML=Array.prototype.map.call(sel.options,function(o,i){
return '<div class="zsel-opt'+(i===sel.selectedIndex?' on':'')+(o.value?'':' muted')+'" data-i="'+i+'">'+esc(o.text)+'</div>';
}).join('');
}
b.addEventListener('click',function(e){
e.preventDefault();e.stopPropagation();
var open=wrap.classList.contains('open');
closeAllZsel();
if(!open){build();wrap.classList.add('open');
var cur=pan.querySelector('.zsel-opt.on');
if(cur)pan.scrollTop=Math.max(0,cur.offsetTop-90);
}
});
pan.addEventListener('click',function(e){
var o=e.target.closest('.zsel-opt');
if(!o)return;
e.stopPropagation();
sel.selectedIndex=Number(o.dataset.i);
sel.dispatchEvent(new Event('input',{bubbles:true}));
sel.dispatchEvent(new Event('change',{bubbles:true}));
label();wrap.classList.remove('open');
});
sel._zvSync=label;
label();
});
}
function decorate(root){enhanceSelects(root||document);}
function fillCities(sel,prov,keep){
if(!sel)return;
var list=citiesOf(prov);
var opts='<option value="">'+(prov?'انتخاب شهر':'ابتدا استان را انتخاب کنید')+'</option>';
list.forEach(function(c){opts+='<option value="'+esc(c)+'"'+(String(keep)===c?' selected':'')+'>'+esc(c)+'</option>';});
if(keep&&list.indexOf(keep)<0)opts+='<option value="'+esc(keep)+'" selected>'+esc(keep)+'</option>';
sel.innerHTML=opts;
zselSync(sel);
}

function setLoginErr(m){var e=$('#loginError');e.textContent=m;e.style.display='block';}
function doLogin(){
var u=$('#loginUser').value.trim(),p=$('#loginPass').value;
if(!u||!p){setLoginErr('نام کاربری و رمز عبور را وارد کنید.');return;}
$('#loginError').style.display='none';
var b=$('#loginBtn');b.disabled=true;b.textContent='در حال ورود…';
api('adminLogin',u,p).then(function(r){
TOKEN=r.token;USER=r.user;localStorage.setItem('zv_admin_token',TOKEN);
return loadData();
}).then(showApp).catch(function(e){setLoginErr(e.message);}).then(function(){b.disabled=false;b.textContent='ورود به مرکز مدیریت';});
}
function confirmLogout(){
confirmBox('خروج از پنل','آیا برای خروج از پنل مطمئن هستید؟',function(){
api('adminLogout',TOKEN).catch(function(){}).then(function(){
localStorage.removeItem('zv_admin_token');TOKEN='';USER=null;location.reload();
});
},'بله، خروج از پنل','خیر، ماندن در پنل');
}
function loadData(){return api('admCCBootstrap',TOKEN).then(function(r){USER=r.user;DB=r.data||{};applyFavicon();});}

/* ═════════ 12) TABLE ═════════ */
function rowsFor(e){
var cfg=CFG[e],rows=(DB[e]||[]).slice();
var q=en(PS.q||'').trim().toLowerCase();
if(q&&cfg.search)rows=rows.filter(function(r){return cfg.search.some(function(k){return en(String(r[k]==null?'':r[k])).toLowerCase().indexOf(q)>=0;});});
(cfg.filters||[]).forEach(function(f){
var v=(PS.filters||{})[f.k];
if(v)rows=rows.filter(function(r){return String(r[f.k]==null?'':r[f.k])===String(v);});
});
if(PS.sort){
var col=cfg.cols.find(function(c){return c.k===PS.sort.k;});
var gv=function(r){return col&&col.sv?col.sv(r):r[PS.sort.k];};
rows.sort(function(a,b){
var x=gv(a),y=gv(b);
var c=(typeof x==='number'||typeof y==='number')?num(x)-num(y):String(x==null?'':x).localeCompare(String(y==null?'':y),'fa');
return c*PS.sort.d;
});
}
return rows;
}

function csvParse(t){
t=t.replace(/^\uFEFF/,'');
var rows=[],row=[],cur='',q=false;
for(var i=0;i<t.length;i++){
var c=t[i];
if(q){if(c==='"'){if(t[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=c;}
else{if(c==='"')q=true;else if(c===','||c===';'){row.push(cur);cur='';}else if(c==='\n'){row.push(cur);rows.push(row);row=[];cur='';}else if(c!=='\r')cur+=c;}
}
if(cur!==''||row.length){row.push(cur);rows.push(row);}
return rows.filter(function(r){return r.some(function(x){return String(x).trim()!=='';});});
}

function spark(vals,color){
vals=vals&&vals.length?vals:[0,0];
var w=120,h=34,n=Math.max(1,vals.length-1);
var max=Math.max.apply(null,vals.concat([1])),min=Math.min.apply(null,vals.concat([0]));
var pts=vals.map(function(v,i){return [(i/n)*w,h-4-((v-min)/((max-min)||1))*(h-8)];});
var line=pts.map(function(p){return p[0].toFixed(1)+','+p[1].toFixed(1);}).join(' ');
return '<svg class="spark" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none"><polygon points="0,'+h+' '+line+' '+w+','+h+'" fill="'+color+'" opacity=".15"/><polyline points="'+line+'" fill="none" stroke="'+color+'" stroke-width="2"/></svg>';
}

function histGet(){try{return JSON.parse(localStorage.getItem(HKEY)||'[]');}catch(e){return [];}}
function histSet(a){try{localStorage.setItem(HKEY,JSON.stringify(a.slice(0,15)));}catch(e){}}
function histPush(q){
q=String(q||'').trim();
if(q.length<2)return;
var a=histGet().filter(function(x){return x.q.toLowerCase()!==q.toLowerCase();});
a.unshift({q:q,at:new Date().toISOString()});
histSet(a);
}
function histDel(q){histSet(histGet().filter(function(x){return x.q!==q;}));cmdkSearch();}
function histClear(){
if(!histGet().length){toast('سابقه‌ای برای پاکسازی وجود ندارد.','warn');return;}
histSet([]);cmdkSearch();toast('سوابق جستجو پاک شد.','ok');
}

var raw=$('#ckInput').value.trim(),q=en(raw).toLowerCase(),out=[];
$('#ckClearBtn').style.display=histGet().length?'inline-flex':'none';

(hist.length?'<button class="ck-clear" data-act="ck-hist-clear">'+icon('trash','width:12px;height:12px')+' پاکسازی همه</button>':'')+'</div>';

return '<div class="cki" data-act="ck-hist" data-q="'+esc(x.q)+'">'+icon('search','width:15px;height:15px;color:var(--muted)')+

function isMobile(){return !!MQ.matches;}
function store(k,v){try{localStorage.setItem(k,v);}catch(e){}}
function read(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function applyRail(on,persist){
S.rail=!!on;root.classList.toggle('zv-rail',S.rail);
if(persist!==false)store(RKEY,S.rail?'1':'0');

}
function syncRail(){

function ensureTip(){
if(S.tip&&S.tip.parentNode)return S.tip;
var t=document.createElement('div');t.id='zvTip';document.body.appendChild(t);S.tip=t;return t;
}
function showTip(el){
if(!S.rail||isMobile()||!el)return;
var sp=el.querySelector('span'),label=sp?sp.textContent:(el.title||'');
label=String(label||'').trim();if(!label)return;
var bd=el.querySelector('.bdg'),extra='';
if(bd){var bt=String(bd.textContent||'').trim();if(bt)extra='<b>'+esc(bt)+'</b>';}
var t=ensureTip();t.innerHTML=esc(label)+extra;t.classList.add('on');
var r=el.getBoundingClientRect(),tw=t.offsetWidth,th=t.offsetHeight;
var left=r.left-tw-12;if(left<8)left=r.right+12;

t.style.left=left+'px';t.style.top=top+'px';
}

function logoCandidates(){
var out=[],s=(window.DB&&DB.settings)||{};
if(s.LOGO_URL)out.push({u:String(s.LOGO_URL),k:'drive'});
if(S.pub&&S.pub.LOGO_URL)out.push({u:String(S.pub.LOGO_URL),k:'drive'});
out.push({u:'LOGO.png',k:'default'});
var seen={},uniq=[];out.forEach(function(x){if(!seen[x.u]){seen[x.u]=1;uniq.push(x);}});
return uniq;
}
function kindLabel(){
if(S.kind==='drive')return{t:'بارگذاری‌شده در Drive',c:'drive'};
if(S.kind==='default')return{t:'LOGO.png مخزن GitHub',c:''};
return{t:'نشان پیش‌فرض داخلی',c:'default'};
}
function paintMarks(url){
$$('.brand .mark').forEach(function(m){
if(S.markHtml==null)S.markHtml=m.innerHTML;
m.classList.add('zv-logo');
m.innerHTML='<img src="'+esc(url)+'" alt="ZingoVingo" draggable="false">';
});
var lb=$('.lbox');
if(lb){var h=$('.zv-login-logo',lb);
if(!h){h=document.createElement('div');h.className='zv-login-logo';lb.insertBefore(h,lb.firstChild);}
h.innerHTML='<img src="'+esc(url)+'" alt="ZingoVingo" draggable="false">';}
var pv=$('#zvLogoImg');if(pv){pv.style.opacity='1';pv.src=url;}
}
function restoreMarks(){
$$('.brand .mark').forEach(function(m){m.classList.remove('zv-logo');m.innerHTML=S.markHtml!=null?S.markHtml:MARK_SVG;});
var h=$('.zv-login-logo');if(h)h.remove();
}
function paintLogoMeta(){
var src=$('#zvLogoSrc'),tag=$('#zvLogoTag'),inp=$('#zvLogoUrlInput'),k=kindLabel();
if(src)src.textContent=S.logo||'LOGO.png';
if(tag){tag.textContent=k.t;tag.className='zv-logo-tag '+k.c;}
if(inp&&document.activeElement!==inp)inp.value=((window.DB&&DB.settings)||{}).LOGO_URL||'';
}
function resolveLogo(i){
var list=logoCandidates();i=i||0;
if(i>=list.length){S.logo='';S.kind='none';restoreMarks();paintLogoMeta();return;}
var c=list[i],im=new Image();
im.onload=function(){S.logo=c.u;S.kind=c.k;paintMarks(c.u);paintLogoMeta();};
im.onerror=function(){resolveLogo(i+1);};
im.src=c.u;
}
function applyLogo(){resolveLogo(0);}
function fetchPub(){
if(S.tried)return Promise.resolve(S.pub);
S.tried=true;
return api('getPublicBranding').then(function(r){
S.pub=r||{};
var f=$('#zvFavicon');
if(f&&S.pub.FAVICON_URL&&!(((window.DB&&DB.settings)||{}).FAVICON_URL))f.setAttribute('href',S.pub.FAVICON_URL);
return S.pub;
}).catch(function(){S.pub={};return S.pub;});
}
function ensureFile(){
if(S.file&&S.file.parentNode)return S.file;
var i=document.createElement('input');
i.type='file';i.id='logoFile';i.hidden=true;
i.accept='image/png,image/svg+xml,image/jpeg,image/webp';
document.body.appendChild(i);S.file=i;return i;
}
function logoLoad(file){
if(!file)return;
if(!/^image\//.test(file.type)){toast('فرمت فایل تصویر نیست.','err');return;}
if(file.size>4*1024*1024){toast('حجم لوگو باید کمتر از ۴ مگابایت باشد.','err');return;}
var rd=new FileReader();
rd.onload=function(ev){
var raw=ev.target.result;
var send=function(out){
toast('در حال بارگذاری لوگو…','');
return api('admCCUploadLogo',out,TOKEN).then(function(r){
DB.settings=DB.settings||{};DB.settings.LOGO_URL=r.url||'';
S.logo=r.url||'';S.kind='drive';paintMarks(S.logo);paintLogoMeta();
toast('لوگوی سامانه به‌روزرسانی شد.','ok');
}).catch(function(e){toast(e.message,'err');});
};
if(/svg/i.test(file.type)){send(raw);return;}
var im=new Image();
im.onload=function(){
var O=256,c=document.createElement('canvas');c.width=c.height=O;
var ctx=c.getContext('2d');ctx.clearRect(0,0,O,O);
var pad=8,box=O-pad*2,sc=Math.min(box/im.naturalWidth,box/im.naturalHeight);
var w=im.naturalWidth*sc,h=im.naturalHeight*sc;
ctx.drawImage(im,(O-w)/2,(O-h)/2,w,h);
send(c.toDataURL('image/png'));
};
im.onerror=function(){toast('خواندن تصویر ناموفق بود.','err');};
im.src=raw;
};
rd.readAsDataURL(file);
}
function logoSaveUrl(v){
return api('admCCSaveLogoUrl',String(v||'').trim(),TOKEN).then(function(r){
DB.settings=DB.settings||{};DB.settings.LOGO_URL=r.url||'';
applyLogo();
toast(r.url?'نشانی لوگو ذخیره شد.':'لوگو به LOGO.png مخزن بازگشت.','ok');
});
}

function loadMeta(){if(META)return Promise.resolve(META);return api('devMeta',TOKEN).then(function(r){META=r;return r;});}
function opts(list,sel){return (list||[]).map(function(x){return '<option value="'+esc(x)+'"'+(String(x)===String(sel)?' selected':'')+'>'+esc(x)+'</option>';}).join('');}
function modOpts(sel){return (M().modules||[]).map(function(m){return '<option value="'+esc(m.id)+'"'+(m.id===sel?' selected':'')+'>'+esc(m.name)+'</option>';}).join('');}
function modName(id){var m=(M().modules||[]).find(function(x){return x.id===id;});return m?m.name:id;}
function priColor(p){return p==='بحرانی'?'var(--red)':p==='فوری'?'var(--amber)':p==='مهم'?'var(--violet)':'var(--slate)';}
function stColor(s){return s==='منتشر شد'?'green':s==='در حال ساخت'?'amber':s==='پذیرفته شده'?'teal':s==='در بررسی'?'violet':s==='رد شده'?'red':'blue';}
function priPill(p){return '<span class="pill" style="background:color-mix(in srgb,'+priColor(p)+' 14%,transparent);color:'+priColor(p)+'">'+esc(p||'عادی')+'</span>';}
function stPill(s){return '<span class="pill p-'+stColor(s)+'">'+esc(s||'جدید')+'</span>';}

/* ═════════ جدول و صفحه ═════════ */

return '<div class="tw"><table class="tb"><thead><tr><th>Request-ID</th><th>ماژول</th><th>نوع</th><th>مسئله</th><th>اثر</th><th>دفعات</th><th>اولویت</th><th>وضعیت</th><th>شعبه</th><th>ثبت</th><th style="text-align:left">عملیات</th></tr></thead><tbody>'+
items.map(function(r){
return '<tr><td><b class="ltr">'+esc(r.id)+'</b></td>'+
'<td>'+esc(r.moduleName)+'<br><small class="sub ltr">'+esc(r.module)+'</small></td>'+
'<td><span class="zvd-tag">'+esc(r.kind)+'</span></td>'+
'<td class="zvd-cell">'+esc(String(r.fields.problem||r.note).slice(0,150))+(String(r.fields.problem||'').length>150?'…':'')+'</td>'+
'<td>'+esc(r.impact)+'</td><td>'+esc(r.frequency)+'</td>'+
'<td>'+priPill(r.priority)+'</td><td>'+stPill(r.status)+'</td>'+
'<td>'+esc(r.branchLabel)+'</td>'+
'<td>'+jDT(r.createdAt)+'<br><small class="sub">'+esc(r.createdByName||r.createdBy)+'</small></td>'+
'<td><div class="ra">'+ibtn('zvd-view','eye','جزئیات',' data-id="'+esc(r.id)+'"')+
(res.canModerate?ibtn('zvd-del','trash','حذف',' data-id="'+esc(r.id)+'"'):'')+
'</div></td></tr>';
}).join('')+'</tbody></table></div>';
}
function devPage(){
return loadMeta().then(function(m){

LIST=res;
var s=res.stats||{},bs=s.byStatus||{},bm=s.byModule||{};
var total=res.scopeTotal||0;
var acts=btn('zvd-new','ثبت پیشنهاد توسعه','plus','btn-p')+btn('zvd-refresh','بروزرسانی','undo','btn-s');
var h=pageHead('درخواست‌های توسعه',fa(res.total)+' مورد از '+fa(total)+' · شیت DevelopmentRequests'+(m.isAdmin?' · همه شعب':' · شعبه '+esc(m.branchId)),acts);
var kk=[['کل درخواست‌ها',fa(total),'zap','var(--blue)'],['جدید',fa(bs['جدید']||0),'clock','var(--amber)'],
['در حال ساخت',fa(bs['در حال ساخت']||0),'svc','var(--violet)'],['منتشر شده',fa(bs['منتشر شد']||0),'check','var(--green)'],

h+='<div class="grid kpis" style="margin-bottom:16px">'+kk.map(function(x){

mods.map(function(k){return '<div class="rank"><div class="info"><b>'+esc(modName(k))+'</b><small class="ltr">'+esc(k)+'</small></div><span class="zvd-bar" style="flex:0 0 120px"><i style="width:'+Math.round(bm[k]/mx*100)+'%"></i></span><span class="v">'+fa(bm[k])+'</span></div>';}).join('')+'</div>';
}
h+='<div class="toolbar"><div class="sw">'+icon('search')+'<input class="inp" data-zvd-q placeholder="جستجو در شناسه، متن، ثبت‌کننده…" value="'+esc(FILTER.q||'')+'"></div>'+

'<select class="sel" data-zvd-f="status"><option value="">وضعیت: همه</option>'+opts(m.statuses,FILTER.status)+'</select>'+
'<select class="sel" data-zvd-f="priority"><option value="">اولویت: همه</option>'+opts(m.priorities,FILTER.priority)+'</select>'+
'<select class="sel" data-zvd-f="kind"><option value="">نوع: همه</option>'+opts(m.kinds,FILTER.kind)+'</select>'+
'<label class="notechk" style="margin:0"><input type="checkbox" data-zvd-mine'+(FILTER.mine?' checked':'')+'> فقط درخواست‌های من</label></div>';
return h+devRowsHtml(res);
});
});
}

'<div>'+icon('edit','width:13px;height:13px')+' آخرین تغییر: '+jDT(v.updatedAt)+' · '+esc(v.updatedBy||'—')+'</div>'+

'</div>';
if(r.canModerate){
body+='<div class="sec-t">تغییر وضعیت (ادمین)</div><div class="field"><select data-zvd-status="'+esc(v.id)+'">'+opts(r.statuses,v.status)+'</select><span class="hint">با انتخاب «منتشر شد»، ستون ReleasedAt مقدار می‌گیرد.</span></div>';
}
body+='<div class="sec-t">متن ثبت‌شده در شیت (Note)</div><div class="zvd-note">'+esc(v.note)+'</div>';

foot+='<button class="btn btn-s" data-act="dclose">بستن</button>';
openDrawer('<div class="dh"><h3>درخواست '+esc(v.id)+'</h3><button class="ibtn" data-act="dclose">'+icon('x')+'</button></div><div class="db">'+body+'</div><div class="df">'+foot+'</div>');
if(typeof decorate==='function')decorate($('#drawer'));

/* ═════════ منو / رندر ═════════ */
function patchMenu(){
if(!window.MENU)return;
if(MENU.some(function(m){return m.id===PAGE_ID;}))return;
var at=-1;
for(var i=0;i<MENU.length;i++)if(MENU[i].sec==='در حال توسعه'){at=i+1;break;}
var item={id:PAGE_ID,l:'درخواست‌های توسعه',ic:'logs',bc:'v'};
if(at<0){MENU.push({sec:'در حال توسعه'});MENU.push(item);}else MENU.splice(at,0,item);
if(window.TITLES)TITLES[PAGE_ID]=['درخواست‌های توسعه','پیشنهادهای ساخت‌یافته · شیت DevelopmentRequests'];
}
var _render=window.render;
window.render=function(){
var p=(window.PS&&PS.page)||'dashboard';
if(p!==PAGE_ID)return _render.apply(this,arguments);
if(window.CH)CH.forEach(function(c){try{c.destroy();}catch(e){}});
var t=(window.TITLES&&TITLES[PAGE_ID])||['درخواست‌های توسعه',''];
$('#tbTitle').textContent=t[0];$('#tbCrumb').textContent='ZingoVingo · '+t[1];
var tb=$('#themeBtn');if(tb)tb.innerHTML=icon(root_dark()?'sun':'moon');
Promise.resolve(devPage()).then(function(h){
$('#page').innerHTML=h;
if(typeof decorate==='function')decorate($('#page'));
if(typeof window.renderNav==='function')window.renderNav();
if(typeof paintSideUser==='function')paintSideUser();
if(typeof notifications==='function'){var d=$('#bellDot');if(d)d.hidden=!notifications().some(function(n){return !n.read;});}
}).catch(function(e){
$('#page').innerHTML='<div class="card"><div class="empty"><div class="ei">'+icon('x')+'</div><h4>خطا در بارگذاری</h4><p class="sub">'+esc(e.message)+'</p></div></div>';
});
};

/* ═════════ رویدادها ═════════ */
document.addEventListener('submit',function(e){
var f=e.target;
if(!f.dataset||f.dataset.form!=='zvd-submit')return;
e.preventDefault();
var g=function(n){return f.elements[n]?String(f.elements[n].value).trim():'';};
var payload={module:g('module'),kind:g('kind'),priority:g('priority'),
problem:g('problem'),proposal:g('proposal'),expected:g('expected'),
impact:g('impact'),frequency:g('frequency'),audience:g('audience'),
deadline:g('deadline'),example:g('example')};
var r=(META&&META.rules)||{};
if(payload.problem.length<(r.problemMin||20)){toast('«مسئله فعلی» حداقل '+fa(r.problemMin||20)+' نویسه باشد.','err');return;}
if(payload.proposal.length<(r.proposalMin||20)){toast('«راهکار پیشنهادی» حداقل '+fa(r.proposalMin||20)+' نویسه باشد.','err');return;}
if(payload.expected.length<(r.expectedMin||10)){toast('«معیار پذیرش» حداقل '+fa(r.expectedMin||10)+' نویسه باشد.','err');return;}
if(payload.priority==='بحرانی'&&payload.example.length<10){toast('برای اولویت بحرانی، نمونه واقعی الزامی است.','err');return;}
var sub=f.querySelector('[type="submit"]');if(sub)sub.disabled=true;
api('devSubmit',payload,TOKEN).then(function(res){
