function branchName(id){const b=(DB.branches||[]).find(x=>x.branchId===id);return b?b.name:'—'}
function groupName(id){const g=(DB.groups||[]).find(x=>x.groupId===id);return g?g.name:'—'}
function workerName(id){const w=(DB.workers||[]).find(x=>x.workerId===id);return w?fullName(w):''}
function offerUsed(code){return (DB.redemptions||[]).filter(r=>String(r.code).toUpperCase()===String(code).toUpperCase()&&r.usageStatus==='استفاده شد').length}
function toast(msg,type,action){const t=document.createElement('div');t.className='toast '+(type||'');t.innerHTML=icon(type==='ok'?'check':type==='err'?'x':type==='warn'?'undo':'zap','width:16px;height:16px')+'<span>'+esc(msg)+'</span>'+(action?'<button>'+esc(action.label)+'</button>':'');if(action)t.querySelector('button').onclick=()=>{action.fn();t.remove()};$('#toasts').appendChild(t);setTimeout(()=>t.remove(),action?8000:3800)}
function openModal(html,w){$('#modal').className='modal'+(w?' w':'');$('#modal').innerHTML=html;$('#mback').classList.add('show');document.body.style.overflow='hidden'}
function closeModal(){$('#mback').classList.remove('show');document.body.style.overflow=''}
function openDrawer(html){$('#drawer').innerHTML=html;$('#drawer').classList.add('show');$('#scrim').classList.add('show');document.body.style.overflow='hidden'}
function closeDrawer(){$('#drawer').classList.remove('show');$('#scrim').classList.remove('show');document.body.style.overflow=''}
function closeOverlays(){closeDrawer();$('#sidebar').classList.remove('open');$('#scrim').classList.remove('show');$('#notifPanel').style.display='none'}

function setLoginErr(m){const e=$('#loginError');e.textContent=m;e.style.display='block'}
async function doLogin(){const u=$('#loginUser').value.trim(),p=$('#loginPass').value;if(!u||!p)return setLoginErr('نام کاربری و رمز عبور را وارد کنید.');$('#loginError').style.display='none';$('#loginBtn').disabled=true;$('#loginBtn').textContent='در حال ورود…';try{const r=await api('adminLogin',u,p);TOKEN=r.token;USER=r.user;localStorage.setItem('zv_administrator_token',TOKEN);await loadData();showApp()}catch(e){setLoginErr(e.message)}finally{$('#loginBtn').disabled=false;$('#loginBtn').textContent='ورود به مرکز مدیریت'}}

function go(page){PS.page=page;PS.sel=new Set();PS.pn=1;PS.q='';PS.filters={};PS.sort=null;PS.view=page==='cards'?'kanban':'table';PS.tab=PS.tab||'services';PS.thread=null;PS.week=PS.week||new Date();render()}

function rowsFor(entity){const cfg=CFG[entity];let rows=(DB[entity]||[]).slice();const q=en((PS.q||'').trim().toLowerCase());if(q&&cfg.search)rows=rows.filter(r=>cfg.search.some(k=>en(String(r[k]??'')).toLowerCase().includes(q)));(cfg.filters||[]).forEach(f=>{const v=(PS.filters||{})[f.k];if(v)rows=rows.filter(r=>String(r[f.k]??'')===String(v))});const s=PS.sort;if(s)rows.sort((a,b)=>{const col=cfg.cols.find(c=>c.k===s.k);const gv=r=>col&&col.sv?col.sv(r):r[s.k];const x=gv(a),y=gv(b);const nx=num(x),ny=num(y);let c;if(typeof x==='number'||typeof y==='number')c=nx-ny;else c=String(x??'').localeCompare(String(y??''),'fa');return c*s.d});return rows}
function entityPage(entity){const cfg=CFG[entity];const all=rowsFor(entity),size=12,pages=Math.max(1,Math.ceil(all.length/size));PS.pn=Math.min(PS.pn||1,pages);const rows=all.slice((PS.pn-1)*size,PS.pn*size);const views=(DB.views||{})[entity]||[];

function plannerPage(){const start=new Date(PS.week||new Date());start.setDate(start.getDate()-((start.getDay()+1)%7));const days=Array.from({length:7},(_,i)=>{const d=new Date(start);d.setDate(start.getDate()+i);return d}),keys=days.map(gKey);let cards=(DB.cards||[]).filter(c=>keys.includes(c.execDate));if(PS.pWorker)cards=cards.filter(c=>c.workerId===PS.pWorker);let h=pageHead('برنامه هفتگی',jDisp(days[0])+' تا '+jDisp(days[6]),'<div style="display:flex;gap:6px"><button class="btn btn-s btn-sm" data-act="week" data-d="-7">هفته قبل</button><button class="btn btn-p btn-sm" data-act="week" data-d="0">امروز</button><button class="btn btn-s btn-sm" data-act="week" data-d="7">هفته بعد</button><select class="sel" data-pworker><option value="">همه نیروها</option>'+(DB.workers||[]).filter(w=>w.type==='worker').map(w=>'<option value="'+w.workerId+'"'+(PS.pWorker===w.workerId?' selected':'')+'>'+esc(fullName(w))+'</option>').join('')+'</select></div>')+'<div class="planner"><div class="pgrid"><div class="phd">ساعت</div>'+days.map(d=>'<div class="phd'+(gKey(d)===gKey(new Date())?' today':'')+'">'+new Intl.DateTimeFormat('fa-IR',{weekday:'short'}).format(d)+'<br><small>'+jDisp(d)+'</small></div>').join('');for(let hr=6;hr<23;hr++){h+='<div class="ptm">'+fa(String(hr).padStart(2,'0'))+':۰۰</div>'+days.map(d=>'<div class="pcl">'+cards.filter(c=>c.execDate===gKey(d)&&num(String(c.execTime).split(':')[0])===hr).map(c=>'<button class="pev" data-act="viewCard" data-id="'+c.rowIndex+'"><b>'+fa(c.execTime)+' '+esc(c.cardId)+'</b><small>'+esc(c.customerName)+'</small></button>').join('')+'</div>').join('')}h+='</div></div>';return h}
