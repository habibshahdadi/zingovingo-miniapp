<script>
'use strict';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];

function exportReport(){const d=S.data.report;if(!d)return;const csv='\uFEFF'+['تاریخ,شناسه,مشتری,خدمت,مبلغ,وضعیت',...d.transactions.map(t=>[t.date,t.requestId,t.customer,t.service,t.amount,t.status].map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(','))].join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='report.csv';a.click()}
async function loadLogs(){const rows=await api('getEmployeeLogs','','','',S.token);S.data.logs=rows;$('#page').innerHTML=pageHead('لاگ‌ها',faD(rows.length)+' رویداد')+'<div id="tableArea"></div>';redrawFns.logs=()=>drawTable('logs',[{k:'date',l:'زمان'},{k:'employeeId',l:'کد'},{k:'employeeName',l:'کاربر'},{k:'action',l:'عملیات'},{k:'details',l:'جزئیات'},{k:'result',l:'نتیجه',r:r=>pill(r.result)}],S.data.logs,{search:['employeeName','action','details'],filters:[{k:'result',l:'نتیجه',opts:['success','error']}],noSel:true});redraw('logs')}
async function loadSettings(){const rows=await api('getSystemSettings',S.token);S.data.settings=rows;let rules=[];try{rules=await api('adm_getPricingRules',S.token)}catch(e){}$('#page').innerHTML=pageHead('تنظیمات','پیکربندی سامانه')+'<div class="card" style="margin-bottom:16px"><h3 style="margin-bottom:12px">تنظیمات عمومی</h3><div class="fgrid">'+rows.map(s=>'<div class="field"><label>'+esc(s.key)+'</label><input data-setting="'+esc(s.key)+'" value="'+esc(s.value)+'"></div>').join('')+'</div><div style="margin-top:14px"><button class="btn btn-p" data-act="saveSettings">ذخیره تنظیمات</button></div></div><div class="card" style="margin-bottom:16px"><h3 style="margin-bottom:12px">تصاویر برند</h3><div class="fgrid">'+['LOGO_URL','LANDING_MEDIA_URL','BRAND_SYMBOL_URL'].map(k=>{const cur=(rows.find(r=>r.key===k)||{}).value||'';return '<div class="field"><label>'+k+'</label><input id="img_'+k+'" value="'+esc(cur)+'"><input type="file" accept="image/*" onchange="uploadSettingFile(this,\''+k+'\')"></div>'}).join('')+'</div></div><div class="card"><h3 style="margin-bottom:12px">نرخ‌های قیمت‌گذاری</h3><div class="fgrid">'+rules.map(r=>'<div class="field"><label>'+esc(r.variable||r.keyEn)+' — '+esc(r.keyFa||'')+' <small style="color:var(--muted)">('+esc(r.unit)+')</small></label><input data-rule="'+r.rowIndex+'" type="number" step="any" value="'+esc(r.value)+'"></div>').join('')+'</div><div style="margin-top:14px"><button class="btn btn-p" data-act="saveRules">ذخیره نرخ‌ها</button></div></div>'}
async function saveSettings(){const inputs=$$('[data-setting]');for(const inp of inputs){await api('updateSetting',inp.dataset.setting,inp.value,S.token)}toast('تنظیمات ذخیره شد.')}
async function saveRules(){const inputs=$$('[data-rule]');for(const inp of inputs){await api('adm_updatePricingRule',Number(inp.dataset.rule),num(inp.value),S.token)}toast('نرخ‌ها ذخیره شد.')}
function uploadSettingFile(input,key){const f=input.files[0];if(!f)return;const rd=new FileReader();rd.onload=e=>api('uploadImage',e.target.result,f.name,S.token).then(r=>{$('#img_'+key).value=r.url;api('updateSetting',key,r.url,S.token);toast('آپلود شد.')}).catch(e=>toast(e.message,'err'));rd.readAsDataURL(f)}
function uploadSetting(key){const inp=$('#img_'+key);if(inp)api('updateSetting',key,inp.value,S.token).then(()=>toast('ذخیره شد.'))}
async function loadProfile(){const p=await api('getUserProfile',S.token);$('#page').innerHTML=pageHead('پروفایل من','حساب کاربری','<button class="btn btn-s" data-act="myPhoto">تغییر عکس</button>')+'<div class="card" style="margin-bottom:16px"><div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap">'+avatar(p.fullName,p.avatar)+'<div><b style="font-size:17px">'+esc(p.fullName)+'</b><div class="sub">'+esc(p.role)+' · '+esc(p.employeeId)+'</div></div></div></div><div class="card"><div class="fgrid">'+[['fullName','نام کامل'],['phone','موبایل'],['email','ایمیل'],['specialty','تخصص'],['nationalCode','کد ملی'],['emergencyContact','تماس اضطراری']].map(k=>'<div class="field"><label>'+k[1]+'</label><input id="pf_'+k[0]+'" value="'+esc(p[k[0]]||'')+'"></div>').join('')+'<div class="field full"><label>آدرس</label><textarea id="pf_address">'+esc(p.address||'')+'</textarea></div><div class="field"><label>رمز عبور جدید</label><input id="pf_password" type="password"></div></div><div style="margin-top:14px"><button class="btn btn-p" data-act="saveProfile">ذخیره تغییرات</button></div></div>'}
async function saveProfile(){const u={fullName:$('#pf_fullName').value,contact:$('#pf_phone').value,email:$('#pf_email').value,specialization:$('#pf_specialty').value,nationalId:$('#pf_nationalCode').value,emergency:$('#pf_emergencyContact').value,address:$('#pf_address').value};const pass=$('#pf_password').value;if(pass)u.password=pass;await api('updateUserProfile',u,S.token);toast('پروفایل ذخیره شد.');loadProfile()}
function openPhoto(entity,id,username){if(!window.ZVPhoto)return toast('ویرایشگر عکس بارگذاری نشده.','err');ZVPhoto.open({endpoint:'uploadProfilePhotoFor',token:S.token,target:{entity,id,username},onDone:()=>{toast('عکس ذخیره شد.');go(S.page)}})}
function openMyPhoto(){if(!window.ZVPhoto)return toast('ویرایشگر عکس بارگذاری نشده.','err');ZVPhoto.open({endpoint:'uploadMyProfilePhotoV2',token:S.token,onDone:url=>{S.user.avatar=url;$('#sideAv').innerHTML='<img src="'+esc(url)+'">';toast('عکس ذخیره شد.');loadProfile()}})}
function openCmdk(){$('#cmdk').classList.add('show');$('#ckInput').value='';$('#ckList').innerHTML='';setTimeout(()=>$('#ckInput').focus(),50)}
async function cmdkSearch(){const q=$('#ckInput').value.trim();if(!q){$('#ckList').innerHTML='';return}try{const rows=await api('adm_globalSearch',q,S.token);$('#ckList').innerHTML=rows.length?rows.map(r=>'<div class="cki" data-act="ckGo" data-page="'+esc(r.page)+'" data-id="'+esc(r.id)+'"><span>'+esc(r.icon||'•')+'</span><span>'+esc(r.title)+'</span><small>'+esc(r.subtitle)+'</small></div>').join(''):'<div class="empty">نتیجه‌ای نیست</div>'}catch(e){$('#ckList').innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
function cmdkGo(page,id){$('#cmdk').classList.remove('show');go(page);setTimeout(()=>{if(page==='orders')viewOrder(id);else if(page==='cards')viewCard(id);else if(page==='customers'){const c=S.data.customers.find(x=>x.code===id);if(c)customerForm(c.rowIndex)}},600)}
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openCmdk()}if(e.key==='Escape'){$('#cmdk').classList.remove('show');closeModal();closeDrawer()}if(e.key==='Enter'&&$('#loginView').style.display!=='none')doLogin()});
$('#mback').addEventListener('click',e=>{if(e.target.id==='mback')closeModal()});
(function(){const t=localStorage.getItem('zv_admin_theme');if(t)document.documentElement.dataset.theme=t;bindTableEvents();restore()})();
</script>
</body>
</html>
