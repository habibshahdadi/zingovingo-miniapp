<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<base target="_top">
<title>ZingoVingo Shared UI System V3</title>

<!-- ═══ فونت‌ها ═══ -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@900&display=swap" rel="stylesheet">

<!-- ═══ Chart.js با fallback ═══ -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"
        crossorigin="anonymous"
        onerror="console.warn('[ZV] Chart.js load failed')"></script>

<!-- ═══ لایه سازگاری (اختیاری — اگر zv-compat.js موجود است) ═══ -->
<script src="zv-compat.js" onerror="console.warn('[ZV] zv-compat.js not loaded')"></script>
<script src="zv-api.js" onerror="console.warn('[ZV] zv-api.js not loaded')"></script>

<!-- ═══ تله خطا: فقط خطای واقعی برنامه قرمز می‌شود ═══ -->
<script>
window.__zvErrors = [];
window.__zvModern = (function () {
  try { new Function('a', 'return a?.b ?? 0'); return true; } catch (e) { return false; }
})();
window.addEventListener('error', function (ev) {
  var t = ev && ev.target;
  /* الف) منبع بارگذاری نشد (404 / شبکه) → فقط کنسول */
  if (t && t !== window && t.tagName && /^(SCRIPT|LINK|IMG|IFRAME|SOURCE)$/.test(String(t.tagName).toUpperCase())) {
    console.warn('[ZV] asset failed:', t.src || t.href);
    return;
  }
  var msg = String((ev && ev.message) || '').trim();
  /* ب) خطای مبهم cross-origin بدون شماره خط → بی‌خطر، فقط کنسول */
  if (!ev.lineno && (/^Script error\.?$/i.test(msg) || msg === '')) {
    console.warn('[ZV] cross-origin script error ignored');
    return;
  }
  /* ج) خطای واقعی برنامه → نوار قرمز */
  window.__zvErrors.push(msg + ' @ ' + (ev.lineno || 0) + ':' + (ev.colno || 0));
  var b = document.getElementById('zvFatal');
  if (b) { b.style.display = 'block'; b.textContent = 'خطای اسکریپت: ' + window.__zvErrors.join(' | '); }
}, true);
window.addEventListener('unhandledrejection', function (ev) {
  console.warn('[ZV] promise rejected:', ev && ev.reason);
});
</script>

<style>
/* ═══════════════════════════════════════════════════
   1) DESIGN TOKENS
   ═══════════════════════════════════════════════════ */
:root {
  --navy:#0B1736; --navy2:#13234D; --navy3:#1B2F63;
  --brand:#FF6B1A; --brand2:#FF8A3D; --brandDeep:#E4570B;
  --blue:#2E63E7; --violet:#7C4DFF; --teal:#0FA3A3;
  --green:#0E9F6E; --amber:#D97706; --red:#E02D3C; --pink:#E0447C; --slate:#64748B;
  --bg:#F3F5FB; --surface:#fff; --surface2:#F6F8FD;
  --ink:#101A33; --muted:#5C6784; --line:#E2E7F3; --line2:#D3DAEC;
  --scrim:rgba(7,13,31,.58);
  --sh:0 6px 22px rgba(11,23,54,.07);
  --sh2:0 16px 44px rgba(11,23,54,.16);
  --r:16px; --tr:180ms ease;
  --grad:linear-gradient(135deg,#FF6B1A,#FF8A3D 55%,#FFB25E);
  --hero:linear-gradient(120deg,#0B1736,#16295B 45%,#3B2E7E 78%,#7C4DFF 130%);
  --glass:rgba(148,163,184,.16);
  --glassBrd:rgba(100,116,139,.28);
  --panBg:rgba(17,26,48,.9);
}
[data-theme=dark] {
  --bg:#070D1F; --surface:#0E1830; --surface2:#121F3D;
  --ink:#E9EEFC; --muted:#93A0C2; --line:#1D2B4F; --line2:#27375F;
  --scrim:rgba(2,6,18,.74);
  --sh:0 8px 26px rgba(0,0,0,.42);
  --sh2:0 18px 50px rgba(0,0,0,.58);
  --glass:rgba(203,213,225,.11);
  --glassBrd:rgba(148,163,184,.26);
}

/* ═══════════════════════════════════════════════════
   2) BASE
   ═══════════════════════════════════════════════════ */
* { box-sizing:border-box; margin:0; padding:0; }
html { scroll-behavior:smooth; }
body {
  font-family: 'Vazirmatn', Tahoma, sans-serif;
  background: var(--bg);
  color: var(--ink);
  font-size: 13.5px;
  line-height: 1.8;
  min-height: 100vh;
  overflow-x: hidden;
}
body:before {
  content: "";
  position: fixed; inset: 0; z-index: -2;
  background:
    radial-gradient(700px 420px at 92% -6%, rgba(255,107,26,.14), transparent 60%),
    radial-gradient(640px 460px at -8% 108%, rgba(46,99,231,.13), transparent 60%),
    radial-gradient(520px 380px at 55% 118%, rgba(124,77,255,.09), transparent 60%);
}
button, input, select, textarea { font:inherit; color:inherit; }
a { color:inherit; text-decoration:none; }
:focus-visible { outline:3px solid rgba(255,107,26,.45); outline-offset:2px; border-radius:8px; }
::-webkit-scrollbar { width:10px; height:10px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:linear-gradient(180deg,var(--line2),var(--slate)); border-radius:9px; border:2px solid var(--bg); }
::-webkit-scrollbar-thumb:hover { background:linear-gradient(180deg,var(--brand2),var(--brandDeep)); }
svg.ic { width:18px; height:18px; flex:0 0 auto; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }

/* ═══════════════════════════════════════════════════
   3) BRAND FONT (Nunito Black)
   ═══════════════════════════════════════════════════ */
.zv-brand,
.brand h1, .brand h2,
.lbox h1,
.portal-hero .brand,
.zv-logo-word,
.inv .inv-h h2 {
  font-family: 'Nunito', 'Vazirmatn', Tahoma, sans-serif !important;
  font-weight: 900 !important;
  letter-spacing: -0.5px;
}
.zv-brand span,
.brand h1 span, .brand h2 span,
.lbox h1 span,
.portal-hero .brand span,
.zv-logo-word span,
.inv .inv-h h2 span {
  font-family: 'Nunito', sans-serif !important;
  font-weight: 900 !important;
}

/* ═══════════════════════════════════════════════════
   4) FATAL ERROR BAR
   ═══════════════════════════════════════════════════ */
#zvFatal {
  display:none; position:fixed; top:0; left:0; right:0;
  z-index:9999; background:#E02D3C; color:#fff;
  padding:10px 16px; font-size:12px; direction:ltr; text-align:left;
}

/* ═══════════════════════════════════════════════════
   5) BUTTONS
   ═══════════════════════════════════════════════════ */
.btn {
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  min-height:38px; padding:8px 16px; border-radius:11px;
  border:1px solid transparent; font-size:12.5px; font-weight:800;
  cursor:pointer; transition:all var(--tr); white-space:nowrap;
}
.btn:hover { transform:translateY(-1px); }
.btn:disabled { opacity:.55; cursor:not-allowed; transform:none; }
.btn-p { background:var(--grad); color:#fff; box-shadow:0 6px 18px rgba(255,107,26,.35); }
.btn-s { background:var(--surface2); border-color:var(--line); color:var(--ink); }
.btn-s:hover { border-color:var(--brand); color:var(--brandDeep); }
.btn-d { background:rgba(224,45,60,.12); color:var(--red); }
.btn-sm { min-height:30px; padding:5px 11px; font-size:11.5px; }
.btn-i { width:31px; height:31px; min-height:31px; padding:0; border-radius:9px; }

/* ═══════════════════════════════════════════════════
   6) CARDS
   ═══════════════════════════════════════════════════ */
.card {
  background:var(--surface); border:1px solid var(--line);
  border-radius:var(--r); box-shadow:var(--sh); padding:18px;
}
.grid { display:grid; gap:16px; }
.kpis { grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); }

/* KPI */
.kpi {
  background:var(--surface); border:1px solid var(--line);
  border-radius:var(--r); padding:16px; box-shadow:var(--sh);
  position:relative; overflow:hidden; transition:transform var(--tr);
}
.kpi:hover { transform:translateY(-3px); }
.kpi .top { display:flex; justify-content:space-between; align-items:center; }
.kpi .chip { width:38px; height:38px; border-radius:12px; display:grid; place-items:center; }
.kpi .l { font-size:11.5px; color:var(--muted); font-weight:700; margin-top:10px; }
.kpi .v { font-size:22px; font-weight:900; font-variant-numeric:tabular-nums; margin-top:2px; }
.kpi .s { font-size:10.5px; color:var(--muted); }
.kpi svg.spark { position:absolute; bottom:0; left:0; width:100%; height:34px; opacity:.55; pointer-events:none; }

/* ═══════════════════════════════════════════════════
   7) HERO / WELCOME BANNER
   ═══════════════════════════════════════════════════ */
.hero {
  background:var(--hero); color:#fff;
  border-radius:20px; padding:26px 28px;
  position:relative; overflow:hidden; margin-bottom:18px;
}
.hero:before {
  content:""; position:absolute; inset:0;
  background:
    radial-gradient(420px 220px at 88% 20%, rgba(255,107,26,.42), transparent 60%),
    radial-gradient(300px 200px at 10% 110%, rgba(15,163,163,.32), transparent 60%);
}
.hero:after {
  content:""; position:absolute; inset:0; opacity:.17;
  background-image:radial-gradient(rgba(255,255,255,.85) 1px, transparent 1px);
  background-size:22px 22px;
}
.hero > * { position:relative; z-index:1; }
.hero h2 { font-size:21px; font-weight:900; }
.hero p { color:#C9D4F2; font-size:12px; margin-top:4px; }
.hero .acts { display:flex; gap:9px; margin-top:16px; flex-wrap:wrap; }
.hero .btn-s { background:rgba(255,255,255,.13); border-color:rgba(255,255,255,.22); color:#fff; }
.hero .dchip {
  position:absolute; left:26px; top:24px;
  background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.24);
  padding:7px 14px; border-radius:12px; font-size:12px; font-weight:800;
  display:inline-flex; align-items:center; gap:7px;
}

/* Welcome Banner (alternate style for dashboards) */
.zv-welcome-banner {
  background:linear-gradient(115deg,#0B1736,#203968);
  color:#fff; border-radius:18px; padding:22px 25px;
  margin-bottom:18px; display:flex; justify-content:space-between;
  align-items:center; gap:15px; overflow:hidden; position:relative;
}
.zv-welcome-banner h2 { font-size:17px; margin:0 0 7px; color:#fff; }
.zv-welcome-banner p { font-size:11px; color:#d2d9e8; margin:0; line-height:1.9; }
.zv-welcome-banner .welcome-icon { font-size:48px; opacity:.8; padding:0 10px; }

/* ═══════════════════════════════════════════════════
   8) LOGIN BOX
   ═══════════════════════════════════════════════════ */
.login {
  min-height:100vh; display:grid; place-items:center; padding:20px;
  background:linear-gradient(135deg,var(--navy),#1a2a4d);
}
.lbox {
  background:rgba(243,245,251,.55);
  backdrop-filter:blur(18px) saturate(160%);
  -webkit-backdrop-filter:blur(18px) saturate(160%);
  border:1px solid rgba(255,255,255,.35);
  border-radius:22px; padding:34px;
  width:min(430px,100%);
  box-shadow:0 20px 60px rgba(0,0,0,.25);
}
.lbox h1 {
  text-align:center; color:#fff;
  font-size:27px; font-weight:900;
  font-family:'Nunito','Vazirmatn',sans-serif;
  letter-spacing:-0.5px;
}
.lbox h1 span { color:var(--brand); }
.lbox .sub { text-align:center; color:var(--muted); font-size:12px; margin:6px 0 20px; }
.errbox {
  display:none; background:rgba(224,45,60,.1); color:var(--red);
  padding:10px; border-radius:10px; font-size:12px; margin-bottom:12px;
}

/* ═══════════════════════════════════════════════════
   9) APP LAYOUT
   ═══════════════════════════════════════════════════ */
#app { display:none; grid-template-columns:266px minmax(0,1fr); min-height:100vh; }
.sidebar {
  background:linear-gradient(180deg,#0A1531,#0B1736 42%,#0E1D42);
  color:#C7D1E8; position:sticky; top:0; height:100vh;
  overflow-y:auto; display:flex; flex-direction:column; z-index:60;
}
.brand { display:flex; gap:11px; align-items:center; padding:20px; }
.mark {
  width:42px; height:42px; border-radius:14px;
  background:var(--grad); display:grid; place-items:center; color:#fff;
  box-shadow:0 6px 18px rgba(255,107,26,.45);
}
.brand h1 {
  font-family:'Nunito','Vazirmatn',sans-serif;
  font-size:19px; font-weight:900; color:#fff; letter-spacing:-0.5px;
}
.brand h1 span { color:var(--brand2); }
.brand small { display:block; font-size:10px; color:#7E8DB1; }
.nav { flex:1; padding:6px 12px 12px; }
.nav-sec { font-size:10px; font-weight:800; color:#6E7DA3; margin:15px 10px 6px; }
.nav-item {
  display:flex; align-items:center; gap:11px; padding:9.5px 12px;
  margin:2px 0; border-radius:11px; color:#B9C4DE; font-size:12.5px;
  font-weight:700; cursor:pointer; transition:all var(--tr); position:relative;
}
.nav-item:hover { background:rgba(255,255,255,.06); color:#fff; }
.nav-item.on {
  background:linear-gradient(90deg,rgba(255,107,26,.2),rgba(255,107,26,.05));
  color:#fff;
}
.nav-item.on:before {
  content:""; position:absolute; right:-12px; top:8px; bottom:8px;
  width:3.5px; border-radius:4px; background:var(--grad);
}
.bdg {
  margin-right:auto; background:var(--brand); color:#fff;
  font-size:10px; font-weight:900; min-width:20px; height:20px;
  padding:0 6px; border-radius:12px; display:grid; place-items:center;
}
.bdg.b { background:var(--blue); }
.bdg.r { background:var(--red); }
.side-foot { padding:14px; border-top:1px solid rgba(255,255,255,.07); }
.uchip {
  display:flex; gap:10px; align-items:center; padding:9px 10px;
  border-radius:12px; background:rgba(255,255,255,.05);
}
.uchip b { color:#fff; font-size:12.5px; display:block; }
.uchip small { color:#7E8DB1; font-size:10px; }

/* Avatar */
.av {
  width:36px; height:36px; border-radius:50%;
  background:var(--grad); color:#fff;
  display:grid; place-items:center; font-weight:900;
  overflow:hidden; flex:0 0 auto; cursor:pointer;
}
.av img { width:100%; height:100%; object-fit:cover; }
.av.lg {
  width:96px; height:96px; font-size:32px;
  border:3px solid var(--surface); box-shadow:0 0 0 2px var(--line);
}

/* Main */
.main { min-width:0; display:flex; flex-direction:column; }
.topbar {
  position:sticky; top:0; z-index:50;
  display:flex; align-items:center; gap:12px; padding:12px 26px;
  background:color-mix(in srgb,var(--surface) 86%,transparent);
  backdrop-filter:blur(14px); border-bottom:1px solid var(--line);
}
.topbar h2 { font-size:17px; font-weight:900; }
.crumb { font-size:11px; color:var(--muted); }
.sp { flex:1; }
.sbtn {
  display:flex; align-items:center; gap:9px; padding:8px 14px;
  border:1px solid var(--line); border-radius:11px;
  background:var(--surface2); color:var(--muted);
  cursor:pointer; font-size:12px; min-width:210px;
}
.sbtn kbd {
  margin-right:auto; background:var(--surface); border:1px solid var(--line2);
  border-radius:6px; padding:1px 7px; font-size:10px;
}
.ibtn {
  width:38px; height:38px; border-radius:11px;
  border:1px solid var(--line); background:var(--surface);
  display:grid; place-items:center; cursor:pointer;
  color:var(--muted); position:relative;
}
.ibtn:hover { color:var(--brand); border-color:var(--brand); }
.ibtn .dot {
  position:absolute; top:7px; left:8px; width:8px; height:8px;
  border-radius:50%; background:var(--red); border:2px solid var(--surface);
}
.menu-btn { display:none; }
#page { padding:24px 26px 60px; max-width:1560px; width:100%; margin:0 auto; }

/* ═══════════════════════════════════════════════════
   10) PAGE HEADER & TOOLBAR
   ═══════════════════════════════════════════════════ */
.ph { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:18px; }
.ph h1 { font-size:20px; font-weight:900; }
.ph .sub { font-size:11.5px; color:var(--muted); }
.toolbar { display:flex; gap:9px; align-items:center; flex-wrap:wrap; margin-bottom:14px; }
.inp, .sel {
  min-height:37px; padding:7px 12px; border:1px solid var(--line);
  border-radius:10px; background:var(--surface); font-size:12px;
}
.inp:focus, .sel:focus { border-color:var(--brand); outline:none; box-shadow:0 0 0 3px rgba(255,107,26,.12); }
.sw { position:relative; min-width:230px; flex:1; max-width:340px; }
.sw .ic { position:absolute; right:11px; top:10px; width:16px; height:16px; color:var(--muted); }
.sw input { width:100%; padding-right:36px; }

/* Bulk actions */
.bulk {
  display:none; align-items:center; gap:10px; flex-wrap:wrap;
  background:linear-gradient(90deg,rgba(255,107,26,.1),rgba(124,77,255,.07));
  border:1px solid rgba(255,107,26,.3); padding:9px 14px;
  border-radius:12px; margin-bottom:12px; font-size:12px;
}
.bulk.show { display:flex; }

/* ═══════════════════════════════════════════════════
   11) TABLE
   ═══════════════════════════════════════════════════ */
.tw { overflow:auto; border:1px solid var(--line); border-radius:14px; background:var(--surface); }
table.tb { width:100%; border-collapse:collapse; font-size:12.5px; min-width:780px; }
.tb th {
  position:sticky; top:0; background:var(--surface2); color:var(--muted);
  font-size:11px; font-weight:900; text-align:right; padding:11px 13px;
  border-bottom:1px solid var(--line); white-space:nowrap; z-index:2; cursor:pointer;
}
.tb td { padding:10px 13px; border-bottom:1px solid var(--line); vertical-align:middle; white-space:nowrap; }
.tb tbody tr:hover { background:color-mix(in srgb,var(--brand) 4%,var(--surface)); }
.num { font-variant-numeric:tabular-nums; }
.ltr { direction:ltr; text-align:right; }
.ra { display:flex; gap:5px; justify-content:flex-end; }
input[type=checkbox] { width:16px; height:16px; accent-color:var(--brand); cursor:pointer; }

/* ═══════════════════════════════════════════════════
   12) PILL / BADGE
   ═══════════════════════════════════════════════════ */
.pill {
  display:inline-flex; align-items:center; gap:6px;
  padding:3.5px 11px; border-radius:20px; font-size:11px;
  font-weight:800; white-space:nowrap;
}
.pill:before { content:""; width:6px; height:6px; border-radius:50%; background:currentColor; }
.p-blue { background:rgba(46,99,231,.12); color:var(--blue); }
.p-green { background:rgba(14,159,110,.13); color:var(--green); }
.p-amber { background:rgba(217,119,6,.13); color:var(--amber); }
.p-red { background:rgba(224,45,60,.12); color:var(--red); }
.p-violet { background:rgba(124,77,255,.12); color:var(--violet); }
.p-teal { background:rgba(15,163,163,.13); color:var(--teal); }
.p-gray { background:rgba(100,116,139,.14); color:var(--slate); }
.p-brand { background:rgba(255,107,26,.13); color:var(--brandDeep); }
.p-pink { background:rgba(224,68,124,.12); color:var(--pink); }

/* ═══════════════════════════════════════════════════
   13) PAGER & EMPTY
   ═══════════════════════════════════════════════════ */
.pager { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 4px 0; font-size:11.5px; color:var(--muted); flex-wrap:wrap; }
.empty { text-align:center; padding:52px 20px; color:var(--muted); }
.empty .ei {
  width:74px; height:74px; margin:0 auto 14px; border-radius:22px;
  background:linear-gradient(135deg,rgba(255,107,26,.14),rgba(124,77,255,.12));
  display:grid; place-items:center; color:var(--brand);
}
.empty .ei .ic { width:32px; height:32px; }
.empty h4 { color:var(--ink); font-size:14px; margin-bottom:4px; }

/* ═══════════════════════════════════════════════════
   14) TABS
   ═══════════════════════════════════════════════════ */
.tabs { display:flex; gap:5px; border-bottom:1px solid var(--line); margin-bottom:16px; overflow-x:auto; }
.tab { padding:9px 16px; font-size:12.5px; font-weight:800; color:var(--muted); cursor:pointer; border-bottom:2.5px solid transparent; white-space:nowrap; }
.tab.on { color:var(--brandDeep); border-bottom-color:var(--brand); }

/* ═══════════════════════════════════════════════════
   15) CHARTS
   ═══════════════════════════════════════════════════ */
.charts { grid-template-columns:repeat(auto-fit,minmax(330px,1fr)); }
.cbox { background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:18px; box-shadow:var(--sh); }
.cbox h3 { font-size:13px; font-weight:900; margin-bottom:12px; display:flex; align-items:center; gap:8px; }
.cwrap { position:relative; height:250px; }

/* ═══════════════════════════════════════════════════
   16) RANK / TIMELINE
   ═══════════════════════════════════════════════════ */
.rank { display:flex; align-items:center; gap:11px; padding:9px 10px; border-radius:11px; background:var(--surface2); margin-bottom:7px; font-size:12px; }
.rank .rk {
  width:24px; height:24px; border-radius:50%; background:var(--grad);
  color:#fff; display:grid; place-items:center; font-size:10.5px; font-weight:900; flex:0 0 auto;
}
.rank .info { flex:1; min-width:0; }
.rank b { display:block; font-size:12px; }
.rank small { color:var(--muted); font-size:10px; }
.rank .v { font-weight:900; color:var(--brandDeep); }

/* ═══════════════════════════════════════════════════
   17) KANBAN
   ═══════════════════════════════════════════════════ */
.kanban { display:flex; gap:13px; overflow-x:auto; padding-bottom:14px; align-items:flex-start; }
.kcol {
  min-width:272px; width:272px; flex:0 0 auto;
  background:var(--surface2); border:1px solid var(--line);
  border-radius:15px; padding:10px;
}
.kcol.over { border-color:var(--brand); background:rgba(255,107,26,.07); }
.kch { display:flex; align-items:center; gap:8px; padding:4px 6px 10px; font-size:12px; font-weight:900; }
.kch i { width:9px; height:9px; border-radius:50%; }
.kch span {
  margin-right:auto; background:var(--surface); border:1px solid var(--line);
  border-radius:12px; font-size:10.5px; padding:1px 9px; color:var(--muted);
}
.kcard {
  background:var(--surface); border:1px solid var(--line);
  border-radius:12px; padding:11px 12px; margin-bottom:9px;
  cursor:grab; box-shadow:var(--sh);
}
.kcard b { font-size:12.5px; display:block; margin:3px 0; }
.kcard small { display:block; color:var(--muted); font-size:10.5px; }
.kfoot { display:flex; justify-content:space-between; align-items:center; margin-top:9px; padding-top:8px; border-top:1px dashed var(--line); }
.ka { font-size:11px; font-weight:900; color:var(--brandDeep); }

/* ═══════════════════════════════════════════════════
   18) SCRIM / DRAWER / MODAL
   ═══════════════════════════════════════════════════ */
.scrim {
  position:fixed; inset:0; background:var(--scrim);
  backdrop-filter:blur(3px); z-index:90;
  opacity:0; pointer-events:none; transition:opacity .22s;
}
.scrim.show { opacity:1; pointer-events:auto; }
.drawer {
  position:fixed; top:0; left:0; height:100vh; width:min(520px,100%);
  background:var(--surface); z-index:95;
  transform:translateX(-103%); transition:transform .28s cubic-bezier(.3,.9,.3,1);
  display:flex; flex-direction:column;
  border-right:1px solid var(--line); box-shadow:var(--sh2);
}
.drawer.show { transform:none; }
.dh, .mh {
  display:flex; align-items:center; gap:11px; padding:17px 20px;
  border-bottom:1px solid var(--line); flex:0 0 auto;
}
.dh h3, .mh h3 { font-size:15px; font-weight:900; flex:1; }
.db { flex:1; overflow-y:auto; padding:18px 20px; min-height:0; }
.df { padding:13px 20px; border-top:1px solid var(--line); display:flex; gap:8px; flex-wrap:wrap; flex:0 0 auto; }
.mback {
  position:fixed; inset:0; z-index:100; background:var(--scrim);
  backdrop-filter:blur(4px); display:none;
  align-items:flex-start; justify-content:center; padding:5vh 16px; overflow-y:auto;
}
.mback.show { display:flex; }
.modal {
  background:var(--surface); border:1px solid var(--line);
  border-radius:20px; width:min(640px,100%); box-shadow:var(--sh2);
  max-height:90vh; display:flex; flex-direction:column; overflow:hidden;
}
.modal.w { width:min(1020px,100%); }
.modal > form { display:flex; flex-direction:column; min-height:0; flex:1; overflow:hidden; }
.mb { padding:20px 22px; overflow-y:auto; flex:1 1 auto; min-height:0; }
.mf { padding:14px 22px; border-top:1px solid var(--line); display:flex; gap:9px; flex-wrap:wrap; flex:0 0 auto; }

/* Dark Modal */
.modal.dk {
  background:linear-gradient(165deg,#0D1830,#15264C);
  border-color:#2A3B66; color:#fff;
}
.modal.dk .mh, .modal.dk .mf { border-color:#2A3B66; }
.modal.dk .mh h3 { color:#fff; }
.modal.dk .field label { color:#D3DCF5; }
.modal.dk .field input, .modal.dk .field textarea {
  background:rgba(255,255,255,.08); border-color:#33477A; color:#fff;
}
.modal.dk .field input::placeholder, .modal.dk .field textarea::placeholder { color:#8494BC; }
.modal.dk .field input[readonly] {
  background:rgba(255,107,26,.14); border-color:rgba(255,107,26,.4);
  color:#FFC79E; font-weight:800;
}
.modal.dk .btn-s { background:rgba(255,255,255,.09); border-color:#33477A; color:#fff; }
.modal.dk .hint { color:#93A3C8; }
.modal.dk .sec-t { color:var(--brand2); }

/* Dark Modal — Selects */
.modal.dk select {
  background:rgba(203,213,225,.13) !important;
  border-color:#3E5384 !important; color:#fff !important;
  -webkit-appearance:none; appearance:none;
}
.modal.dk select option { background:#111A30 !important; color:#fff !important; }
.modal.dk .zsel-opt { color:#fff !important; }
.modal.dk .zsel-opt:hover { background:rgba(255,107,26,.24); }
.modal.dk .zsel-opt.on { background:rgba(255,107,26,.34); }
.modal.dk .zsel-pan { background:rgba(17,26,48,.98) !important; }

/* ═══════════════════════════════════════════════════
   19) FORMS
   ═══════════════════════════════════════════════════ */
.fgrid { display:grid; grid-template-columns:1fr 1fr; gap:13px; }
.fgrid .full { grid-column:1/-1; }
.field { display:flex; flex-direction:column; gap:6px; min-width:0; }
.field label { font-size:11.5px; font-weight:800; color:var(--muted); }
.req { color:var(--red); }
.field input, .field textarea {
  min-height:40px; padding:9px 12px; border:1px solid var(--line);
  border-radius:10px; background:var(--surface2); font-size:12.5px; width:100%;
}
.field textarea { min-height:78px; resize:vertical; }
.field input:focus, .field textarea:focus {
  border-color:var(--brand); outline:none;
  box-shadow:0 0 0 3px rgba(255,107,26,.14);
}
.field .hint { font-size:10px; color:var(--muted); }

/* KV (Key-Value) */
.kv { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.kvi { background:var(--surface2); border:1px solid var(--line); border-radius:11px; padding:9px 12px; min-width:0; }
.kvi small { display:block; font-size:10px; color:var(--muted); }
.kvi b { font-size:12.5px; font-weight:800; word-break:break-word; }
.kvi.full { grid-column:1/-1; }
.sec-t { font-size:12px; font-weight:900; color:var(--brandDeep); margin:18px 0 10px; }

/* ═══════════════════════════════════════════════════
   20) GLASS SELECT (zsel)
   ═══════════════════════════════════════════════════ */
select { background:var(--glass); border:1px solid var(--glassBrd); color:inherit; }
select option { background:#111A30; color:#fff; }
.zsel { position:relative; width:100%; }
.zsel > select {
  position:absolute !important; width:1px !important; height:1px !important;
  min-height:0 !important; opacity:0; pointer-events:none;
  padding:0 !important; border:0 !important; margin:0 !important;
}
.zsel-btn {
  display:flex; align-items:center; justify-content:space-between; gap:8px;
  width:100%; min-height:40px; padding:9px 12px;
  border:1px solid var(--glassBrd); border-radius:10px;
  background:var(--glass);
  backdrop-filter:blur(12px) saturate(150%);
  -webkit-backdrop-filter:blur(12px) saturate(150%);
  color:inherit; font-size:12.5px; font-weight:600;
  cursor:pointer; text-align:right; transition:all var(--tr);
}
.zsel-btn span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.zsel-btn:hover { border-color:var(--brand); }
.zsel.open .zsel-btn { border-color:var(--brand); box-shadow:0 0 0 3px rgba(255,107,26,.16); }
.zsel-btn .ic { width:15px; height:15px; opacity:.75; transition:transform var(--tr); }
.zsel.open .zsel-btn .ic { transform:rotate(180deg); }
.zsel-pan {
  display:none; position:absolute; top:calc(100% + 6px); right:0; left:0;
  z-index:190; max-height:250px; overflow-y:auto; padding:6px;
  border-radius:13px; border:1px solid rgba(203,213,225,.22);
  background:var(--panBg);
  backdrop-filter:blur(20px) saturate(170%);
  -webkit-backdrop-filter:blur(20px) saturate(170%);
  box-shadow:0 20px 48px rgba(3,7,20,.5);
}
.zsel.open .zsel-pan { display:block; animation:zselIn .14s ease; }
@keyframes zselIn { from{opacity:0;transform:translateY(-5px)} to{opacity:1;transform:none} }
.zsel-opt {
  display:flex; align-items:center; gap:8px; padding:8px 11px;
  border-radius:9px; color:#fff; font-size:12.5px; font-weight:600;
  cursor:pointer; transition:background var(--tr);
}
.zsel-opt:hover { background:rgba(255,107,26,.24); }
.zsel-opt.on { background:rgba(255,107,26,.34); font-weight:800; }
.zsel-opt.muted { color:#A9B6D4; font-weight:500; }
.zsel-pan::-webkit-scrollbar { width:8px; }
.zsel-pan::-webkit-scrollbar-track { background:rgba(255,255,255,.05); border-radius:8px; }
.zsel-pan::-webkit-scrollbar-thumb { background:rgba(255,107,26,.55); border-radius:8px; border:0; }
.zsel-pan::-webkit-scrollbar-thumb:hover { background:var(--brand); }
.toolbar .zsel, .bulk .zsel { width:auto; min-width:158px; }
.toolbar .zsel-btn, .bulk .zsel-btn { min-height:37px; font-size:12px; }
.modal.dk .zsel-btn { background:rgba(203,213,225,.13); border-color:#3E5384; color:#fff; }

/* ═══════════════════════════════════════════════════
   21) COMMAND PALETTE (cmdk)
   ═══════════════════════════════════════════════════ */
#cmdk {
  position:fixed; inset:0; z-index:120;
  background:var(--scrim); backdrop-filter:blur(5px);
  display:none; justify-content:center; padding:11vh 16px;
}
#cmdk.show { display:flex; }
.ck {
  width:min(660px,100%); background:var(--surface);
  border:1px solid var(--line); border-radius:18px;
  box-shadow:var(--sh2); overflow:hidden; height:fit-content;
}
.ck-top { display:flex; align-items:center; gap:9px; border-bottom:1px solid var(--line); padding:4px 14px 4px 6px; }
.ck-top input { flex:1; border:0; background:transparent; padding:15px 6px; font-size:15px; outline:none; }
.ck-clear {
  display:inline-flex; align-items:center; gap:6px;
  border:1px solid var(--line); background:var(--surface2);
  color:var(--muted); border-radius:9px; padding:6px 10px;
  font-size:11px; font-weight:800; cursor:pointer; white-space:nowrap;
}
.ck-clear:hover { border-color:var(--red); color:var(--red); }
.ckl { max-height:400px; overflow-y:auto; padding:8px; }
.ckg { display:flex; align-items:center; justify-content:space-between; font-size:10px; font-weight:900; color:var(--muted); padding:9px 12px 5px; }
.cki { display:flex; gap:11px; align-items:center; padding:9px 12px; border-radius:11px; cursor:pointer; font-size:12.5px; }
.cki:hover { background:rgba(255,107,26,.09); }
.cki small { color:var(--muted); margin-right:auto; font-size:10.5px; }
.ck-x {
  width:24px; height:24px; flex:0 0 24px; border-radius:7px;
  border:1px solid var(--line); background:var(--surface2);
  color:var(--muted); display:grid; place-items:center; cursor:pointer;
}
.ck-x:hover { border-color:var(--red); color:var(--red); background:rgba(224,45,60,.1); }
.ck-hist .cki { background:var(--surface2); margin-bottom:5px; }

/* ═══════════════════════════════════════════════════
   22) TOASTS
   ═══════════════════════════════════════════════════ */
#toasts {
  position:fixed; bottom:18px; left:18px; z-index:200;
  display:flex; flex-direction:column-reverse; gap:9px;
  max-width:min(390px,90vw);
}
.toast {
  display:flex; align-items:center; gap:10px;
  background:var(--navy); color:#fff; padding:12px 16px;
  border-radius:13px; font-size:12.5px; box-shadow:var(--sh2);
  border-right:4px solid var(--blue);
}
.toast.ok { border-right-color:var(--green); }
.toast.err { border-right-color:var(--red); }
.toast.warn { border-right-color:var(--amber); }
.toast button {
  background:rgba(255,255,255,.16); border:0; color:#fff;
  font-weight:900; font-size:11.5px; padding:5px 12px;
  border-radius:8px; cursor:pointer; margin-right:auto;
}

/* ═══════════════════════════════════════════════════
   23) NOTIFICATION PANEL
   ═══════════════════════════════════════════════════ */
#notifPanel {
  position:fixed; top:66px; left:22px; z-index:85;
  width:min(380px,94vw); background:var(--surface);
  border:1px solid var(--line); border-radius:16px;
  box-shadow:var(--sh2); display:none; overflow:hidden;
}
#notifPanel.show { display:block; }
.nph { display:flex; justify-content:space-between; align-items:center; padding:13px 16px; border-bottom:1px solid var(--line); font-weight:900; }
.npl { max-height:400px; overflow-y:auto; }
.npi { display:flex; gap:11px; padding:12px 16px; border-bottom:1px solid var(--line); cursor:pointer; }
.npi:hover { background:var(--surface2); }
.npi .ni {
  width:34px; height:34px; border-radius:11px;
  display:grid; place-items:center; flex:0 0 auto;
  background:rgba(255,107,26,.12); color:var(--brand);
}
.npi b { font-size:12px; display:block; }
.npi small { color:var(--muted); font-size:10.5px; display:block; }

/* ═══════════════════════════════════════════════════
   24) PHOTO EDITOR
   ═══════════════════════════════════════════════════ */
.pe-frame {
  position:relative; width:min(300px,100%); aspect-ratio:1;
  margin:12px auto; border-radius:14px; overflow:hidden;
  background:#0B1736; touch-action:none; cursor:grab;
}
.pe-frame img { position:absolute; max-width:none; user-select:none; pointer-events:none; }
.pe-row { display:flex; align-items:center; gap:10px; margin-top:12px; font-size:12px; }
.pe-row input[type=range] { flex:1; accent-color:var(--brand); }

/* ═══════════════════════════════════════════════════
   25) FAVICON PREVIEW
   ═══════════════════════════════════════════════════ */
.fav-preview {
  display:flex; align-items:center; gap:12px;
  background:var(--surface2); border:1px solid var(--line);
  border-radius:12px; padding:11px 13px; margin-bottom:12px;
}
.fav-preview img {
  width:48px; height:48px; border-radius:10px;
  object-fit:contain; background:#fff; border:1px solid var(--line);
}

/* ═══════════════════════════════════════════════════
   26) WEEKLY PLANNER
   ═══════════════════════════════════════════════════ */
.pl-grid { display:grid; grid-template-columns:60px repeat(7,minmax(135px,1fr)); min-width:1030px; }
.pl-h { background:var(--surface2); padding:8px 5px; text-align:center; border-bottom:1px solid var(--line); font-size:11px; font-weight:900; }
.pl-h.today { background:rgba(255,107,26,.12); }
.pl-t { height:64px; padding:5px; border-bottom:1px solid var(--line); color:var(--muted); font-size:10px; text-align:center; background:var(--surface2); }
.pl-c { height:64px; padding:3px; border-bottom:1px solid var(--line); border-right:1px solid var(--line); overflow:hidden; }
.pl-e {
  display:block; width:100%; border:0; border-right:3px solid var(--brand);
  border-radius:6px; background:rgba(255,107,26,.11);
  padding:3px 5px; margin-bottom:3px; text-align:right;
  cursor:pointer; overflow:hidden;
}
.pl-e b { display:block; font-size:9.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.pl-e small { display:block; font-size:8.5px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

/* ═══════════════════════════════════════════════════
   27) THREAD / SUPPORT
   ═══════════════════════════════════════════════════ */
.thread {
  display:flex; justify-content:space-between; gap:10px;
  align-items:flex-start; border:1px solid var(--line);
  border-radius:12px; padding:12px; margin-bottom:8px;
  background:var(--surface);
}

/* ═══════════════════════════════════════════════════
   28) PRINT & MISC
   ═══════════════════════════════════════════════════ */
#printArea { display:none; }
.loading { text-align:center; padding:44px; color:var(--muted); }
.spinner {
  display:inline-block; width:30px; height:30px;
  border:3px solid var(--line); border-top-color:var(--brand);
  border-radius:50%; animation:spin 1s linear infinite;
}
@keyframes spin { to{transform:rotate(360deg)} }

/* ═══════════════════════════════════════════════════
   29) RESPONSIVE
   ═══════════════════════════════════════════════════ */
@media(max-width:1120px) {
  #app { grid-template-columns:1fr; }
  .sidebar {
    position:fixed; right:0; top:0; width:272px;
    transform:translateX(105%); transition:transform .28s;
    z-index:96; box-shadow:var(--sh2);
  }
  .sidebar.open { transform:none; }
  .menu-btn { display:grid; }
}
@media(max-width:760px) {
  #page { padding:16px 14px 70px; }
  .topbar { padding:10px 14px; }
  .sbtn { min-width:0; }
  .sbtn span, .sbtn kbd, .crumb { display:none; }
  .fgrid, .kv { grid-template-columns:1fr; }
  .hero .dchip { display:none; }
  .kcol { width:83vw; min-width:83vw; }
  .drawer { width:100%; }
  .topbar .btn-p span { display:none; }
  #notifPanel { left:3vw; }
  .toolbar .zsel, .bulk .zsel { width:100%; }
}
@media print {
  body > * { display:none !important; }
  #printArea { display:block !important; font-family:Vazirmatn,Tahoma,sans-serif; }
}
@media(prefers-reduced-motion:reduce) {
  *, *::before, *::after {
    animation-duration:.01ms !important;
    transition-duration:.01ms !important;
    scroll-behavior:auto !important;
  }
}
</style>
</head>

</div>

<!-- ═══ APP ═══ -->

        </svg>

<script>
/* ═══════════════════════════════════════════════════
   ZV-UI Shared JavaScript Utilities
   ═══════════════════════════════════════════════════ */
'use strict';

/* ─── Selectors ─── */
var $ = function(s, r) { return (r || document).querySelector(s); };
var $$ = function(s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };

/* ─── Escaping ─── */
function esc(v) {
  var m = { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' };
  return String(v == null ? '' : v).replace(/[&<>"']/g, function(c) { return m[c]; });
}

/* ─── Persian digits ─── */
function fa(v) {
  return String(v == null ? '' : v).replace(/\d/g, function(d) { return '۰۱۲۳۴۵۶۷۸۹'[Number(d)]; });
}
function en(v) {
  return String(v == null ? '' : v)
    .replace(/[۰-۹]/g, function(d) { return String('۰۱۲۳۴۵۶۷۸۹'.indexOf(d)); })
    .replace(/[٠-٩]/g, function(d) { return String('٠١٢٣٤٥٦٧٨٩'.indexOf(d)); });
}

/* ─── Numbers ─── */
function num(v) {
  var n = Number(en(v).replace(/[٬,\s]/g, ''));
  return isFinite(n) ? n : 0;
}
var NF = new Intl.NumberFormat('fa-IR');
function money(n) { return NF.format(Math.round(num(n))) + ' ریال'; }
function moneyC(n) {
  n = num(n);
  if (Math.abs(n) >= 1e9) return fa((n / 1e9).toFixed(1)) + ' میلیارد';
  if (Math.abs(n) >= 1e6) return fa((n / 1e6).toFixed(1)) + ' میلیون';
  return NF.format(Math.round(n));
}

/* ─── Name helpers ─── */
function fullName(r) {
  if (!r) return '—';
  var n = [r.firstName, r.lastName].filter(Boolean).join(' ');
  return n || r.name || r.username || '—';
}

/* ─── Debounce ─── */
function debounce(fn, ms) {
  var t;
  return function() {
    var a = arguments, s = this;
    clearTimeout(t);
    t = setTimeout(function() { fn.apply(s, a); }, ms);
  };
}

/* ─── Jalali conversion ─── */
function g2j(gy, gm, gd) {
  var leap = (gy % 4 === 0 && gy % 100 !== 0) || gy % 400 === 0;
  var gdm = [0, 31, leap ? 29 : 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
  var gy2 = gm > 2 ? gy + 1 : gy;
  var days = 355666 + 365 * gy + Math.floor((gy2 + 3) / 4) - Math.floor((gy2 + 99) / 100) + Math.floor((gy2 + 399) / 400) + gd;
  for (var i = 1; i < gm; i++) days += gdm[i];
  var jy = -1595 + 33 * Math.floor(days / 12053); days %= 12053;
  jy += 4 * Math.floor(days / 1461); days %= 1461;
  if (days > 365) { jy += Math.floor((days - 1) / 365); days = (days - 1) % 365; }
  var jm, jd;
  if (days < 186) { jm = 1 + Math.floor(days / 31); jd = 1 + days % 31; }
  else { jm = 7 + Math.floor((days - 186) / 30); jd = 1 + (days - 186) % 30; }
  return [jy, jm, jd];
}
function j2g(jy, jm, jd) {
  jy += 1595;
  var days = -355668 + 365 * jy + Math.floor(jy / 33) * 8 + Math.floor(((jy % 33) + 3) / 4) + jd + (jm < 7 ? (jm - 1) * 31 : (jm - 7) * 30 + 186);
  var gy = 400 * Math.floor(days / 146097); days %= 146097;
  if (days > 36524) { gy += 100 * Math.floor(--days / 36524); days %= 36524; if (days >= 365) days++; }
  gy += 4 * Math.floor(days / 1461); days %= 1461;
  if (days > 365) { gy += Math.floor((days - 1) / 365); days = (days - 1) % 365; }
  var gd = days + 1;
  var leap = gy % 4 === 0 && (gy % 100 !== 0 || gy % 400 === 0);
  var ms = [0, 31, leap ? 29 : 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
  var gm = 1;
  while (gm <= 12 && gd > ms[gm]) { gd -= ms[gm]; gm++; }
  return [gy, gm, gd];
}
function jLeap(y) { var g = j2g(y, 12, 30), j = g2j(g[0], g[1], g[2]); return j[0] === y && j[1] === 12 && j[2] === 30; }
function jDays(y, m) { return m <= 6 ? 31 : (m <= 11 ? 30 : (jLeap(y) ? 30 : 29)); }
function parseJ(s) {
  var m = en(s).trim().replace(/[.\-]/g, '/').match(/^(\d{4})\/(\d{1,2})\/(\d{1,2})$/);
  if (!m) return null;
  var y = Number(m[1]), mo = Number(m[2]), d = Number(m[3]);
  if (mo < 1 || mo > 12 || d < 1 || d > jDays(y, mo)) return null;
  return [y, mo, d];
}
function jStore(s) {
  var p = parseJ(s); if (!p) return '';
  var g = j2g(p[0], p[1], p[2]);
  return g[0] + '-' + String(g[1]).padStart(2, '0') + '-' + String(g[2]).padStart(2, '0');
}
function jDisp(v) {
  if (!v) return '—';
  var d = new Date(v); if (isNaN(d.getTime())) return esc(v);
  var j = g2j(d.getFullYear(), d.getMonth() + 1, d.getDate());
  return fa(j[0] + '/' + String(j[1]).padStart(2, '0') + '/' + String(j[2]).padStart(2, '0'));
}
function jInput(v) {
  if (!v) return '';
  var d = new Date(v); if (isNaN(d.getTime())) return '';
  var j = g2j(d.getFullYear(), d.getMonth() + 1, d.getDate());
  return j[0] + '/' + String(j[1]).padStart(2, '0') + '/' + String(j[2]).padStart(2, '0');
}
function jDT(v) {
  if (!v) return '—';
  var d = new Date(v); if (isNaN(d.getTime())) return jDisp(v);
  return jDisp(v) + ' · ' + fa(String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'));
}
function gKey(v) {
  var d = new Date(v);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
var JM = ['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
function jMonthKey(v) {
  var d = new Date(v); var j = g2j(d.getFullYear(), d.getMonth() + 1, 1);
  return j[0] + '-' + String(j[1]).padStart(2, '0');
}
function lastMonths(n) {
  var out = [], now = new Date();
  for (var i = n - 1; i >= 0; i--) {
    var x = new Date(now.getFullYear(), now.getMonth() - i, 1);
    var j = g2j(x.getFullYear(), x.getMonth() + 1, 1);
    out.push({ key: j[0] + '-' + String(j[1]).padStart(2, '0'), label: JM[j[1] - 1] });
  }
  return out;
}

/* ─── Icon helper ─── */
var IC = {
  dash: '<rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>',
  x: '<path d="M18 6 6 18M6 6l12 12"/>',
  check: '<path d="m4.5 12.5 5 5 10-11"/>',
  edit: '<path d="M17 3a2.8 2.8 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5z"/>',
  trash: '<path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>',
  eye: '<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/>',
  sun: '<circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M2 12h2.5M19.5 12H22"/>',
  moon: '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>',
  bell: '<path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/>',
  chevD: '<path d="m6 9 6 6 6-6"/>'
};
function icon(n, s) {
  return '<svg class="ic" viewBox="0 0 24 24"' + (s ? ' style="' + s + '"' : '') + '>' + (IC[n] || IC.dash) + '</svg>';
}

/* ─── Avatar helper ─── */
function av(name, url, cls, act, extra) {
  var a = act ? ' data-act="' + act + '"' + (extra || '') : '';
  var inner = url ? '<img src="' + esc(url) + '" alt="">' : esc(String(name || '؟').trim().charAt(0));
  return '<span class="av ' + (cls || '') + '"' + a + '>' + inner + '</span>';
}

/* ─── Pill helper ─── */
var STC = {
  'جدید':'blue','ثبت اولیه':'violet','تبدیل به کارت':'teal','در حال انجام':'amber',
  'تکمیل شده':'green','لغو شده':'red','تعلیق':'gray','تخصیص به شعبه':'teal',
  'تخصیص به گروه':'pink','تخصیص به کارگر':'violet','ارجاع به سرپرست':'pink',
  'فعال':'green','غیرفعال':'gray','Administrator':'brand','Manager':'violet',
  'success':'green','error':'red','مرد':'blue','زن':'pink'
};
function pill(s) {
  return '<span class="pill p-' + (STC[s] || 'gray') + '">' + esc(s || '—') + '</span>';
}

/* ─── KV helper ─── */
function kv(p) {
  return '<div class="kv">' + p.map(function(x) {
    return '<div class="kvi' + (x[2] ? ' full' : '') + '"><small>' + esc(x[0]) + '</small><b>' + (x[1] == null ? '—' : x[1]) + '</b></div>';
  }).join('') + '</div>';
}

/* ─── Theme toggle ─── */
function toggleTheme() {
  var t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = t;
  try { localStorage.setItem('zv_admin_theme', t); } catch (e) {}
}

/* ─── Sparkline ─── */
function spark(vals, color) {
  vals = vals && vals.length ? vals : [0, 0];
  var w = 120, h = 34, n = Math.max(1, vals.length - 1);
  var max = Math.max.apply(null, vals.concat([1])), min = Math.min.apply(null, vals.concat([0]));
  var pts = vals.map(function(v, i) { return [(i / n) * w, h - 4 - ((v - min) / ((max - min) || 1)) * (h - 8)]; });
  var line = pts.map(function(p) { return p[0].toFixed(1) + ',' + p[1].toFixed(1); }).join(' ');
  return '<svg class="spark" viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none">' +
    '<polygon points="0,' + h + ' ' + line + ' ' + w + ',' + h + '" fill="' + color + '" opacity=".15"/>' +
    '<polyline points="' + line + '" fill="none" stroke="' + color + '" stroke-width="2"/></svg>';
}

/* ─── CSS variable resolver ─── */
function cssVar(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function resolveColor(c) { return c.indexOf('var(') === 0 ? cssVar(c.slice(4, -1)) : c; }

/* ─── Glass Select enhancer ─── */
function closeAllZsel(except) {
  $$('.zsel.open').forEach(function(w) { if (w !== except) w.classList.remove('open'); });
}
function zselSync(sel) { if (sel && typeof sel._zvSync === 'function') sel._zvSync(); }
function enhanceSelects(root) {
  $$('select', root || document).forEach(function(sel) {
    if (sel._zvDone) return;
    sel._zvDone = true;
    var wrap = document.createElement('div');
    wrap.className = 'zsel';
    sel.parentNode.insertBefore(wrap, sel);
    wrap.appendChild(sel);
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'zsel-btn';
    var pan = document.createElement('div');
    pan.className = 'zsel-pan';
    wrap.appendChild(b); wrap.appendChild(pan);
    function label() {
      var o = sel.options[sel.selectedIndex];
      b.innerHTML = '<span>' + esc(o ? o.text : '—') + '</span>' + icon('chevD');
    }
    function build() {
      pan.innerHTML = Array.prototype.map.call(sel.options, function(o, i) {
        return '<div class="zsel-opt' + (i === sel.selectedIndex ? ' on' : '') + (o.value ? '' : ' muted') + '" data-i="' + i + '">' + esc(o.text) + '</div>';
      }).join('');
    }
    b.addEventListener('click', function(e) {
      e.preventDefault(); e.stopPropagation();
      var open = wrap.classList.contains('open');
      closeAllZsel();
      if (!open) { build(); wrap.classList.add('open');
        var cur = pan.querySelector('.zsel-opt.on');
        if (cur) pan.scrollTop = Math.max(0, cur.offsetTop - 90);
      }
    });
    pan.addEventListener('click', function(e) {
      var o = e.target.closest('.zsel-opt');
      if (!o) return;
      e.stopPropagation();
      sel.selectedIndex = Number(o.dataset.i);
      sel.dispatchEvent(new Event('input', { bubbles: true }));
      sel.dispatchEvent(new Event('change', { bubbles: true }));
      label(); wrap.classList.remove('open');
    });
    sel._zvSync = label;
    label();
  });
}
function decorate(root) { enhanceSelects(root || document); }

/* ─── Initialize ─── */
(function init() {
  var th = localStorage.getItem('zv_admin_theme');
  if (th) document.documentElement.dataset.theme = th;
  decorate(document);
})();
</script>
