<!-- ZingoVingo Shared UI System V1 | Shared visual layer only; panel layout stays in each panel -->
<style>
:root{
 --zv-navy:#0B1736;--zv-navy-2:#172747;--zv-orange:#FF6B1A;--zv-orange-hover:#e95b10;
 --zv-white:#fff;--zv-bg:#f3f5f9;--zv-surface:#fff;--zv-ink:#17213b;--zv-muted:#74809a;
 --zv-line:#e7eaf1;--zv-green:#15966b;--zv-red:#d94c55;--zv-blue:#4775d1;
 --zv-radius-sm:9px;--zv-radius:14px;--zv-radius-lg:18px;
 --zv-shadow:0 8px 24px rgba(11,23,54,.06);--zv-shadow-hover:0 13px 30px rgba(11,23,54,.11);
 --zv-transition:180ms ease;
}
html{scroll-behavior:smooth}
body{background:var(--zv-bg);color:var(--zv-ink);font-family:IRANSans,Tahoma,Arial,sans-serif}
button,input,select,textarea{font:inherit}
button,[role=button],a{ -webkit-tap-highlight-color:transparent }
:where(button,input,select,textarea,a,[tabindex]):focus-visible{outline:3px solid rgba(255,107,26,.35);outline-offset:2px}
.zv-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:9px 15px;border:1px solid transparent;border-radius:var(--zv-radius-sm);font-size:13px;font-weight:700;cursor:pointer;transition:background var(--zv-transition),color var(--zv-transition),border-color var(--zv-transition),box-shadow var(--zv-transition),transform var(--zv-transition)}
.zv-btn:hover{transform:translateY(-1px);box-shadow:0 5px 13px rgba(11,23,54,.10)}
.zv-btn:active{transform:translateY(0)}.zv-btn:disabled{opacity:.55;cursor:not-allowed;transform:none;box-shadow:none}
.zv-btn-primary{background:var(--zv-orange);color:#fff}.zv-btn-primary:hover{background:var(--zv-orange-hover)}
.zv-btn-secondary{background:#eef1f7;color:var(--zv-navy)}.zv-btn-secondary:hover{background:#e3e8f1}
.zv-btn-dark{background:var(--zv-navy);color:#fff}.zv-btn-danger{background:#fff0f0;color:var(--zv-red)}
.zv-card{background:var(--zv-surface);border:1px solid var(--zv-line);border-radius:var(--zv-radius);box-shadow:var(--zv-shadow);padding:18px;transition:box-shadow var(--zv-transition),transform var(--zv-transition)}
.zv-card-hover:hover{box-shadow:var(--zv-shadow-hover);transform:translateY(-2px)}
.zv-card-title{font-size:14px;font-weight:800;color:var(--zv-navy);margin:0 0 12px}
.zv-muted{color:var(--zv-muted);font-size:12px}
.zv-field{display:flex;flex-direction:column;gap:7px}.zv-field label{font-size:12px;color:#58647d;font-weight:600}
.zv-input,.zv-select,.zv-textarea{width:100%;min-height:42px;padding:10px 12px;border:1px solid #dfe4ed;border-radius:var(--zv-radius-sm);background:#fff;color:var(--zv-ink);font-size:13px;transition:border-color var(--zv-transition),box-shadow var(--zv-transition)}
.zv-input:hover,.zv-select:hover,.zv-textarea:hover{border-color:#b9c3d5}
.zv-input:focus,.zv-select:focus,.zv-textarea:focus{outline:0;border-color:var(--zv-orange);box-shadow:0 0 0 3px rgba(255,107,26,.12)}
.zv-textarea{min-height:100px;resize:vertical}
.zv-table-wrap{width:100%;overflow:auto;border:1px solid var(--zv-line);border-radius:12px;background:#fff}
.zv-table{width:100%;border-collapse:collapse;white-space:nowrap;font-size:12px}.zv-table th{background:#f7f8fb;color:#66728c;font-weight:700;text-align:right;padding:12px}.zv-table td{padding:12px;border-top:1px solid #edf0f5}.zv-table tbody tr{transition:background var(--zv-transition)}.zv-table tbody tr:hover{background:#fafbfe}
.zv-badge{display:inline-flex;align-items:center;gap:5px;padding:5px 9px;border-radius:20px;font-size:10px;font-weight:700;background:#eef2f8;color:#52617c}.zv-badge-success{background:#e7f7f1;color:#13835d}.zv-badge-warning{background:#fff0e6;color:#c45a17}.zv-badge-danger{background:#ffeded;color:#c3424c}.zv-badge-info{background:#edf2ff;color:#4567bb}
.zv-stat{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#fff;border:1px solid var(--zv-line);border-radius:15px;padding:17px;box-shadow:var(--zv-shadow)}.zv-stat-label{font-size:11px;color:var(--zv-muted)}.zv-stat-value{display:block;font-size:25px;font-weight:900;color:var(--zv-navy);margin-top:7px}.zv-stat-icon{width:43px;height:43px;border-radius:13px;background:#fff1e9;color:var(--zv-orange);display:grid;place-items:center}
.zv-sidebar{background:var(--zv-navy);color:#fff}.zv-nav-item{display:flex;align-items:center;gap:11px;width:100%;padding:12px 13px;border:0;border-radius:10px;background:transparent;color:#c8d0e1;text-align:right;cursor:pointer;transition:background var(--zv-transition),color var(--zv-transition)}.zv-nav-item:hover,.zv-nav-item.active{background:#ffffff17;color:#fff}.zv-nav-item.active{border-right:3px solid var(--zv-orange)}
.zv-modal-backdrop{position:fixed;inset:0;z-index:110;background:rgba(7,17,39,.68);display:flex;align-items:center;justify-content:center;padding:16px;opacity:0;visibility:hidden;transition:opacity var(--zv-transition),visibility var(--zv-transition)}.zv-modal-backdrop.is-open{opacity:1;visibility:visible}.zv-modal{width:min(560px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:18px;box-shadow:0 22px 70px #0003;transform:translateY(10px);transition:transform var(--zv-transition)}.zv-modal-backdrop.is-open .zv-modal{transform:translateY(0)}
.zv-toast{position:fixed;left:18px;bottom:18px;z-index:150;padding:12px 16px;border-radius:11px;background:var(--zv-navy);color:#fff;box-shadow:var(--zv-shadow);font-size:12px;opacity:0;transform:translateY(8px);pointer-events:none;transition:all var(--zv-transition)}.zv-toast.show{opacity:1;transform:translateY(0)}
.zv-loading{display:flex;align-items:center;justify-content:center;gap:10px;color:var(--zv-muted);padding:25px}.zv-spinner{width:22px;height:22px;border:3px solid #e7eaf1;border-top-color:var(--zv-orange);border-radius:50%;animation:zv-spin .8s linear infinite}@keyframes zv-spin{to{transform:rotate(360deg)}}
.zv-profile-head{display:flex;align-items:center;gap:16px}.zv-profile-avatar{width:112px;height:112px;flex:0 0 112px;border-radius:50%;overflow:hidden;background:#fff0e7;color:#bd4a0d;display:grid;place-items:center;font-size:36px;font-weight:900;cursor:pointer;border:3px solid #fff;box-shadow:0 0 0 1px var(--zv-line);transition:box-shadow var(--zv-transition),transform var(--zv-transition)}.zv-profile-avatar:hover{box-shadow:0 0 0 3px rgba(255,107,26,.35);transform:scale(1.02)}.zv-profile-avatar img{width:100%;height:100%;object-fit:cover}
@media(max-width:700px){.zv-card{padding:14px}.zv-stat{padding:14px}.zv-stat-value{font-size:21px}.zv-profile-head{align-items:flex-start;flex-direction:column}.zv-profile-avatar{width:92px;height:92px;flex-basis:92px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
