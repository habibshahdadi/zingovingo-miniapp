<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<base target="_top">
<title>پنل کارمند | ZingoVingo</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="zv-api.js"></script>
<style>
/* دقیقاً همان استایل‌های BranchManager.html در اینجا کپی شده‌اند تا ظاهر یکسان باشد */
:root{--navy:#0B1736;--navy-light:#1a2a4d;--orange:#FF6B1A;--orange-light:#ff8533;--bg:#f4f6fb;--text:#172033;--muted:#657086;--line:#dfe4ee;--white:#fff;--green:#067647;--danger:#b42318;--blue:#1849a9;--yellow:#f79009;--shadow:0 2px 10px #17203308;--radius:14px}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:Tahoma,Arial,sans-serif;line-height:1.7;font-size:14px}
button,input,select,textarea{font-family:inherit;font-size:13px}
.login-page{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--navy) 0%,#1a2a4d 100%)}
.login-box{background:#fff;border-radius:20px;padding:40px;width:min(420px,92%);box-shadow:0 20px 60px #0003}
.login-box h1{color:var(--navy);text-align:center;margin-bottom:8px;font-size:28px}
.login-box h1 span{color:var(--orange)}
.login-box .subtitle{text-align:center;color:var(--muted);margin-bottom:24px;font-size:13px}
.login-box .field{margin-bottom:14px}
.login-box label{display:block;margin-bottom:6px;font-weight:700;font-size:13px}
.login-box input,.login-box select{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;outline:none}
.login-box input:focus,.login-box select:focus{border-color:var(--orange);box-shadow:0 0 0 3px #ff6b1a1c}
.login-box .btn{width:100%;padding:13px;margin-top:8px}
.login-error{background:#fef3f2;color:var(--danger);padding:10px;border-radius:8px;margin-bottom:12px;font-size:13px;display:none}
.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
.sidebar{background:var(--navy);color:#fff;padding:0;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column}
.brand{padding:20px;border-bottom:1px solid var(--navy-light)}
.brand h2{font-size:22px;font-weight:900}
.brand h2 span{color:var(--orange)}
.brand small{color:#8896b3;font-size:11px}
.nav-menu{flex:1;padding:12px 0}
.nav-item{display:flex;align-items:center;gap:10px;padding:12px 20px;cursor:pointer;color:#c8d2e6;font-size:14px;border-right:3px solid transparent;transition:all .2s}
.nav-item:hover{background:var(--navy-light);color:#fff}
.nav-item.active{background:var(--navy-light);color:#fff;border-right-color:var(--orange)}
.sidebar-footer{padding:16px 20px;border-top:1px solid var(--navy-light);font-size:12px}
.user-info{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.user-avatar{width:36px;height:36px;border-radius:50%;background:var(--orange);display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;font-size:14px;overflow:hidden}
.user-avatar img{width:100%;height:100%;object-fit:cover}
.user-name{font-weight:700;font-size:13px}
.user-role{color:#8896b3;font-size:11px}
.logout-btn{background:transparent;border:1px solid var(--navy-light);color:#c8d2e6;padding:8px;border-radius:8px;cursor:pointer;width:100%;font-size:12px}
.logout-btn:hover{background:var(--navy-light);color:#fff}
.main{padding:24px;overflow-x:hidden}
.page-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:10px}
.page-title{font-size:20px;color:var(--navy);font-weight:900}
.btn{border:0;border-radius:10px;padding:9px 16px;font:inherit;font-weight:700;cursor:pointer;transition:all .2s}
.btn-primary{background:var(--orange);color:#fff}.btn-primary:hover{background:var(--orange-light)}
.btn-secondary{background:#eef1f7;color:var(--navy)}.btn-secondary:hover{background:#dfe4ee}
.btn-danger{background:#fef3f2;color:var(--danger)}.btn-danger:hover{background:#fee4e2}
.btn-sm{padding:5px 10px;font-size:12px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:16px;box-shadow:var(--shadow)}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:20px}
.stat-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:18px;position:relative;overflow:hidden}
.stat-card::before{content:'';position:absolute;top:0;right:0;width:4px;height:100%;background:var(--orange)}
.stat-card.green::before{background:var(--green)}.stat-card.blue::before{background:var(--blue)}.stat-card.yellow::before{background:var(--yellow)}.stat-card.red::before{background:var(--danger)}
.stat-label{font-size:12px;color:var(--muted);margin-bottom:6px}
.stat-value{font-size:24px;font-weight:900;color:var(--navy);font-variant-numeric:tabular-nums}
.table-wrap{overflow-x:auto;border-radius:var(--radius);border:1px solid var(--line)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#f8f9fc;padding:12px;text-align:right;font-weight:700;color:var(--navy);border-bottom:2px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:hover{background:#fafbfd}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700}
.badge-new{background:#eff6ff;color:var(--blue)}.badge-progress{background:#fff7ed;color:#9a3412}
.badge-done{background:#ecfdf3;color:var(--green)}.badge-cancel{background:#fef3f2;color:var(--danger)}
.badge-active{background:#ecfdf3;color:var(--green)}.badge-inactive{background:#fef3f2;color:var(--danger)}
.badge-role{background:var(--navy-light);color:#fff;padding:2px 8px;border-radius:10px;font-size:10px}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:16px}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12px;font-weight:700;color:var(--muted)}
input,select,textarea{font:inherit;border:1px solid #cfd6e3;border-radius:8px;padding:9px 11px;background:#fff;outline:none;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--orange);box-shadow:0 0 0 3px #ff6b1a1c}
textarea{min-height:80px;resize:vertical}
.modal{display:none;position:fixed;inset:0;background:#071127a8;z-index:100;padding:18px;align-items:center;justify-content:center}
.modal.open{display:flex}
.modal-box{width:min(900px,100%);background:#fff;border-radius:var(--radius);padding:24px;max-height:90vh;overflow-y:auto}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.modal-header h2{font-size:18px;color:var(--navy)}
.modal-close{background:transparent;border:0;font-size:22px;cursor:pointer;color:var(--muted);padding:4px 10px}
.modal-footer{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}
.form-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.form-grid .full{grid-column:1/-1}
.form-grid .half{grid-column:span 2}
.toast{position:fixed;bottom:20px;left:20px;background:var(--navy);color:#fff;padding:12px 20px;border-radius:10px;z-index:200;display:none;box-shadow:0 10px 30px #0003;font-size:13px}
.toast.show{display:block;animation:slideIn .3s}
.toast.success{background:var(--green)}.toast.error{background:var(--danger)}
@keyframes slideIn{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
.employee-profile{display:grid;grid-template-columns:200px 1fr;gap:20px}
.employee-avatar-large{width:200px;height:200px;border-radius:50%;background:var(--orange);display:flex;align-items:center;justify-content:center;font-size:60px;color:#fff;font-weight:900;overflow:hidden;cursor:pointer}
.employee-avatar-large img{width:100%;height:100%;object-fit:cover}
.employee-details{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.detail-item{background:#f8f9fc;padding:12px;border-radius:10px}
.detail-label{font-size:11px;color:var(--muted);margin-bottom:4px}
.detail-value{font-weight:700;color:var(--navy)}
.loading{text-align:center;padding:40px;color:var(--muted)}
.spinner{display:inline-block;width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--orange);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.menu-toggle{display:none;background:var(--navy);color:#fff;border:0;padding:8px 12px;border-radius:8px;cursor:pointer}
@media(max-width:900px){body.employee-menu-open{overflow:hidden}body.employee-menu-open:after{content:"";position:fixed;inset:0;background:#07112780;z-index:40}.app{grid-template-columns:1fr}.sidebar{position:fixed;right:-280px;width:260px;z-index:50;transition:right .3s}.sidebar.open{right:0}.menu-toggle{display:block}.form-grid{grid-template-columns:1fr}.employee-profile{grid-template-columns:1fr}}

/* انتخابگر مستقل تقویم شمسی؛ بدون وابستگی به CDN */
.ja-date-wrap{position:relative;width:100%}.ja-date-input{padding-left:48px!important;direction:ltr;text-align:right;unicode-bidi:plaintext}
.ja-date-btn{position:absolute;left:6px;top:50%;transform:translateY(-50%);border:0;border-radius:8px;background:#eef1f7;color:var(--navy);padding:6px 9px;cursor:pointer;z-index:2}
.ja-date-pop{display:none;position:absolute;top:calc(100% + 7px);right:0;width:min(300px,calc(100vw - 48px));background:#fff;border:1px solid var(--line);border-radius:13px;padding:11px;box-shadow:0 12px 32px #17203325;z-index:120}
.ja-date-pop.open{display:block}.ja-cal-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:9px;color:var(--navy);font-weight:800}.ja-cal-head button{border:0;background:#eef1f7;border-radius:8px;padding:5px 11px;cursor:pointer}.ja-cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}.ja-cal-grid button{border:0;border-radius:7px;padding:7px 0;background:#f4f6fb;cursor:pointer;color:var(--text);font:inherit;font-size:12px}.ja-cal-grid button:hover{background:#ffe4d6}.ja-cal-grid .day-label{background:#fff;color:var(--muted);font-weight:700}.ja-cal-grid .today{outline:1px solid var(--orange)}
</style>
</head>
<body>

<div id="loginPage" class="login-page">
  <div class="login-box">
    <h1>Zingo<span>Vingo</span></h1>
    <div class="subtitle">پنل کارمند شعبه</div>
    <div id="loginError" class="login-error"></div>
    <div class="field"><label>نام کاربری</label><input id="loginUser" autocomplete="username"></div>
    <div class="field"><label>رمز عبور</label><input id="loginPass" type="password" autocomplete="current-password"></div>
    <button class="btn btn-primary" onclick="doLogin()">ورود به پنل</button>
  </div>
</div>

<div id="appContainer" class="app" style="display:none">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><h2>Zingo<span>Vingo</span></h2><small>پنل کارمند</small></div>
    <nav class="nav-menu" id="navMenu"></nav>
    <div class="sidebar-footer">
      <div class="user-info"><div class="user-avatar" id="userAvatar">?</div><div><div class="user-name" id="userName">—</div><div class="user-role" id="userRole">کارمند</div></div></div>
      <button class="logout-btn" onclick="doLogout()">🚪 خروج</button>
    </div>
  </aside>
  <main class="main">
    <button class="menu-toggle" id="mobileMenuToggle" type="button" onclick="toggleEmployeeMenu()">☰ منو</button>
    <div id="pageContent"><div class="loading"><div class="spinner"></div></div></div>
  </main>
</div>

<div id="toast" class="toast"></div>
<div id="modal" class="modal"><div class="modal-box" id="modalBox"></div></div>

<script>
fetch('PhotoEditor.html').then(function (r) { return r.text(); }).then(function (html) {
  var wrap = document.createElement('div'); wrap.innerHTML = html; document.body.appendChild(wrap);
  Array.prototype.slice.call(wrap.querySelectorAll('script')).forEach(function (old) {
    var s = document.createElement('script'); s.textContent = old.textContent; document.body.appendChild(s);
  });
}).catch(function (e) { console.warn('PhotoEditor بارگذاری نشد:', e); });
</script>


<script>
const $ = id => document.getElementById(id);
const money = n => new Intl.NumberFormat('en-US').format(Math.round(Number(n)||0)) + ' ریال';
const toFa = n => new Intl.NumberFormat('fa-IR').format(n);
let currentToken = localStorage.getItem('zv_emp_token') || null;
let currentUser = null;

const MENU_ITEMS = [
  { id: 'dashboard', label: '📊 داشبورد' },
  { id: 'orders', label: '📋 سفارشات' },
  { id: 'cards', label: '🎫 کارت‌ها' },
  { id: 'groups', label: '👥 گروه‌ها' },
  { id: 'workers', label: '👷 نیروها' },
  { id: 'jobApplicants', label: '📝 ثبت کارجو' },
  { id: 'reports', label: '📈 گزارشات' },
  { id: 'profile', label: '👤 پروفایل من' }
];

function toast(msg, type='info') { const t = $('toast'); t.textContent = msg; t.className = 'toast show ' + type; setTimeout(() => t.classList.remove('show'), 3500); }
function openModal(html) { $('modalBox').innerHTML = html; $('modal').classList.add('open'); }
function closeModal() { $('modal').classList.remove('open'); }
$('modal').addEventListener('click', e => { if (e.target === $('modal')) closeModal(); });
function statusBadge(s) { return '<span class="badge badge-' + (/جدید|ثبت/.test(s)?'new':/تکمیل/.test(s)?'done':/لغو/.test(s)?'cancel':'progress') + '">' + s + '</span>'; }

function doLogin() {
  const u = $('loginUser').value.trim(), p = $('loginPass').value;
  if (!u || !p) { $('loginError').textContent = 'نام کاربری و رمز را وارد کنید'; $('loginError').style.display = 'block'; return; }
  $('loginError').style.display = 'none';
  google.script.run.withSuccessHandler(r => {
    if (r && r.success) {
      currentToken = r.token; currentUser = r.user;
      localStorage.setItem('zv_emp_token', r.token);
      localStorage.setItem('zv_emp_user', JSON.stringify(r.user));
      showApp(r.user);
    } else { $('loginError').textContent = r.message || 'خطا'; $('loginError').style.display = 'block'; }
  }).withFailureHandler(e => { $('loginError').textContent = e.message; $('loginError').style.display = 'block'; }).employeeLogin(u, p);
}

function doLogout() {
  if (currentToken) google.script.run.employeeLogout(currentToken);
  localStorage.removeItem('zv_emp_token'); localStorage.removeItem('zv_emp_user');
  location.reload();
}

function toggleEmployeeMenu() {
  const side = $('sidebar');
  if (!side) return;
  side.classList.toggle('open');
  document.body.classList.toggle('employee-menu-open', side.classList.contains('open'));
}
function closeEmployeeMenu() {
  const side = $('sidebar');
  if (side) side.classList.remove('open');
  document.body.classList.remove('employee-menu-open');
}
// بستن منوی موبایل با لمس بیرون از منو یا انتخاب هر بخش
 document.addEventListener('click', function(e) {
  const side = $('sidebar');
  if (!side || !side.classList.contains('open')) return;
  if (e.target.closest('#sidebar') || e.target.closest('#mobileMenuToggle')) return;
  closeEmployeeMenu();
}, true);

function showApp(user) {
  currentUser = user;
  $('loginPage').style.display = 'none'; $('appContainer').style.display = 'grid';
  $('userName').textContent = user.name;
  $('userRole').innerHTML = 'کارمند <span class="badge-role">' + (user.branchId || '—') + '</span>';
  const av = $('userAvatar');
  if (user.avatar) av.innerHTML = '<img src="' + user.avatar + '">'; else av.textContent = user.name ? user.name.charAt(0) : '?';
  
  $('navMenu').innerHTML = MENU_ITEMS.map(i => '<div class="nav-item" data-page="' + i.id + '">' + i.label + '</div>').join('');
  $('navMenu').querySelectorAll('.nav-item').forEach(item => {
    item.addEventListener('click', () => {
      $('navMenu').querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
      item.classList.add('active');
      const selectedPage = item.dataset.page;
      closeEmployeeMenu();
      loadPage(selectedPage);
    });
  });
  loadPage('dashboard');
}

(function checkSession() {
  const saved = localStorage.getItem('zv_emp_user');
  if (currentToken && saved) { currentUser = JSON.parse(saved); showApp(currentUser); }
})();

function loadPage(page) {
  $('pageContent').innerHTML = '<div class="loading"><div class="spinner"></div></div>';
  const loaders = { dashboard: loadDashboard, orders: loadOrders, cards: loadCards, groups: loadGroups, workers: loadWorkers, jobApplicants: loadJobApplicants, reports: loadReports, profile: loadProfile };
  (loaders[page] || loadDashboard)();
}

function loadDashboard() {
  google.script.run.withSuccessHandler(stats => {
    $('pageContent').innerHTML = '<div class="page-header"><h1 class="page-title">داشبورد کارمند (' + (currentUser.branchId || '—') + ')</h1></div>' +
      '<div class="stats-grid">' +
      '<div class="stat-card"><div class="stat-label">کل سفارشات شعبه</div><div class="stat-value">' + toFa(stats.totalOrders) + '</div></div>' +
      '<div class="stat-card yellow"><div class="stat-label">در انتظار</div><div class="stat-value">' + toFa(stats.pendingOrders) + '</div></div>' +
      '<div class="stat-card green"><div class="stat-label">تکمیل شده</div><div class="stat-value">' + toFa(stats.completedOrders) + '</div></div>' +
      '<div class="stat-card blue"><div class="stat-label">درآمد کل</div><div class="stat-value">' + money(stats.totalRevenue) + '</div></div>' +
      '</div>';
  }).getEmployeeDashboard(currentToken);
}

function loadOrders() {
  $('pageContent').innerHTML = '<div class="page-header"><h1 class="page-title">سفارشات شعبه</h1></div><div class="card"><div id="ordersTable"></div></div>';
  fetchOrders();
}

function fetchOrders() {
  const filters = {
    fromDate: $('ordFrom')?.value || '', toDate: $('ordTo')?.value || '',
    customerId: $('ordCustId')?.value || '', requestId: $('ordReqId')?.value || '',
    groupId: $('ordGroupId')?.value || '', status: $('ordStatus')?.value || 'همه'
  };
  $('ordersTable').innerHTML = '<div class="loading"><div class="spinner"></div></div>';
  google.script.run.withSuccessHandler(rows => {
    if (!rows.length) { $('ordersTable').innerHTML = '<div style="padding:20px;text-align:center;color:var(--muted)">سفارشی با این فیلترها یافت نشد</div>'; return; }
    $('ordersTable').innerHTML = '<div class="table-wrap"><table><thead><tr><th>تاریخ</th><th>کد</th><th>مشتری</th><th>موبایل</th><th>خدمت</th><th>مبلغ</th><th>گروه</th><th>ثبت‌کننده</th><th>وضعیت</th><th>عملیات</th></tr></thead><tbody>' +
      rows.map(r => '<tr><td>' + r.date + '</td><td><strong>' + r.requestId + '</strong></td><td>' + r.customer + '</td><td style="direction:ltr">' + r.phone + '</td><td>' + r.service + '</td><td>' + money(r.finalPrice) + '</td><td>' + (r.groupName || '—') + '</td><td>' + (r.operatorName || 'مشتری') + '</td><td>' + statusBadge(r.status) + '</td><td><button class="btn btn-sm btn-secondary" onclick="changeOrderStatus(\'' + r.requestId + '\',\'' + r.status + '\')">تغییر وضعیت</button> <button class="btn btn-sm btn-primary" onclick="openConvertModal(\'' + r.requestId + '\')">🎫</button></td></tr>').join('') + '</tbody></table></div>';
  }).withFailureHandler(e => { $('ordersTable').innerHTML = '<div style="padding:20px;text-align:center;color:var(--danger)">' + e.message + '</div>'; }).getEmployeeOrders(filters, currentToken);
}

function changeOrderStatus(requestId, currentStatus) {
  const statuses = ['جدید', 'ثبت اولیه', 'در حال بررسی', 'در حال انجام', 'تکمیل شده', 'لغو شده'];
  openModal('<div class="modal-header"><h2>تغییر وضعیت</h2><button class="modal-close" onclick="closeModal()">✕</button></div>' +
    '<div class="field"><label>وضعیت جدید</label><select id="newOrderStatus">' + statuses.map(s => '<option ' + (s===currentStatus?'selected':'') + '>' + s + '</option>').join('') + '</select></div>' +
    '<div class="modal-footer"><button class="btn btn-secondary" onclick="closeModal()">انصراف</button><button class="btn btn-primary" onclick="applyOrderStatus(\'' + requestId + '\')">اعمال</button></div>');
}
function applyOrderStatus(requestId) {
  google.script.run.withSuccessHandler(r => { closeModal(); toast(r.message, 'success'); loadOrders(); }).withFailureHandler(e => toast(e.message, 'error')).updateEmployeeOrderStatus(requestId, $('newOrderStatus').value, currentToken);
}

function openConvertModal(requestId) {
  google.script.run.withSuccessHandler(workers => {
    let opts = '<option value="">بدون تخصیص (استخر شعبه)</option>';
    workers.forEach(w => opts += '<option value="' + w.id + '">' + w.name + '</option>');
    openModal('<div class="modal-header"><h2>تبدیل به کارت</h2><button class="modal-close" onclick="closeModal()">✕</button></div>' +
      '<div class="field"><label>تخصیص به نیرو</label><select id="targetWorker">' + opts + '</select></div>' +
      '<div class="modal-footer"><button class="btn btn-secondary" onclick="closeModal()">انصراف</button><button class="btn btn-primary" onclick="executeConvert(\'' + requestId + '\')">تأیید</button></div>');
  }).getEmployeeWorkersForDropdown(currentToken);
}
function executeConvert(requestId) {
  google.script.run.withSuccessHandler(r => { closeModal(); toast(r.message, 'success'); loadOrders(); }).withFailureHandler(e => toast(e.message, 'error')).employeeConvertOrderToCard(requestId, $('targetWorker').value, currentToken);
}

function loadCards() {
  $('pageContent').innerHTML = 
    '<div class="page-header"><h1 class="page-title">کارت‌های شعبه</h1></div>' +

function escapeHtml(v){return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function applicantNormalizeDigits(v){return String(v||'').replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));}
function applicantG2J(gy,gm,gd){const gdm=[0,31,((gy%4===0&&gy%100!==0)||gy%400===0)?29:28,31,30,31,30,31,31,30,31,30,31];let gy2=gm>2?gy+1:gy;let days=355666+365*gy+Math.floor((gy2+3)/4)-Math.floor((gy2+99)/100)+Math.floor((gy2+399)/400)+gd;for(let i=1;i<gm;i++)days+=gdm[i];let jy=-1595+33*Math.floor(days/12053);days%=12053;jy+=4*Math.floor(days/1461);days%=1461;if(days>365){jy+=Math.floor((days-1)/365);days=(days-1)%365}let jm,jd;if(days<186){jm=1+Math.floor(days/31);jd=1+days%31}else{jm=7+Math.floor((days-186)/30);jd=1+(days-186)%30}return[jy,jm,jd]}
function applicantJ2G(jy,jm,jd){jy+=1595;let days=-355668+365*jy+Math.floor(jy/33)*8+Math.floor(((jy%33)+3)/4)+jd+(jm<7?(jm-1)*31:(jm-7)*30+186);let gy=400*Math.floor(days/146097);days%=146097;if(days>36524){gy+=100*Math.floor(--days/36524);days%=36524;if(days>=365)days++}gy+=4*Math.floor(days/1461);days%=1461;if(days>365){gy+=Math.floor((days-1)/365);days=(days-1)%365}let gd=days+1;const leap=gy%4===0&&(gy%100!==0||gy%400===0);const months=[0,31,leap?29:28,31,30,31,30,31,31,30,31,30,31];let gm=1;while(gm<=12&&gd>months[gm]){gd-=months[gm];gm++}return[gy,gm,gd]}
function applicantIsJalaliLeap(y){const g=applicantJ2G(y,12,30);const j=applicantG2J(g[0],g[1],g[2]);return j[0]===y&&j[1]===12&&j[2]===30;}
function applicantJalaliParts(value){const v=applicantNormalizeDigits(value).replace(/[.\-]/g,'/').trim();const m=v.match(/^(13\d{2}|14\d{2})\/(\d{1,2})\/(\d{1,2})$/);if(!m)return null;const y=+m[1],mo=+m[2],d=+m[3];if(mo<1||mo>12||d<1||d>(mo<=6?31:mo<=11?30:(applicantIsJalaliLeap(y)?30:29)))return null;return[y,mo,d]}
function applicantFaDigits(v){return String(v).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[+d]);}
function applicantFormatDateInput(el){let digits=applicantNormalizeDigits(el.value).replace(/\D/g,'').slice(0,8);if(digits.length>4)digits=digits.slice(0,4)+'/'+digits.slice(4);if(digits.length>7)digits=digits.slice(0,7)+'/'+digits.slice(7);el.value=digits;}
function calculateApplicantAge(){const b=applicantJalaliParts($('jaBirthDate').value);if(!b){$('jaAge').value='';return;}const now=new Date(),t=applicantG2J(now.getFullYear(),now.getMonth()+1,now.getDate());let age=t[0]-b[0];if(t[1]<b[1]||(t[1]===b[1]&&t[2]<b[2]))age--; $('jaAge').value=age>=0&&age<120?applicantFaDigits(age):'';}
function initApplicantJalaliDates(){
 const names=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
 document.querySelectorAll('.ja-jalali-date').forEach((el,index)=>{
   if(el.dataset.jaDateReady==='1') return;
   el.dataset.jaDateReady='1';
   el.type='text';el.inputMode='numeric';el.autocomplete='off';el.classList.add('ja-date-input');
   const wrap=document.createElement('div');wrap.className='ja-date-wrap';el.parentNode.insertBefore(wrap,el);wrap.appendChild(el);
   const btn=document.createElement('button');btn.type='button';btn.className='ja-date-btn';btn.textContent='▦';btn.setAttribute('aria-label','باز کردن تقویم شمسی');wrap.appendChild(btn);
   const pop=document.createElement('div');pop.className='ja-date-pop';wrap.appendChild(pop);
   let now=new Date(),jy,jm;[jy,jm]=applicantG2J(now.getFullYear(),now.getMonth()+1,now.getDate());
   function render(){
     const today=applicantG2J(now.getFullYear(),now.getMonth()+1,now.getDate());
     const max=jm<=6?31:jm<=11?30:(applicantIsJalaliLeap(jy)?30:29);
     const first=applicantJ2G(jy,jm,1);const weekday=(new Date(first[0],first[1]-1,first[2]).getDay()+1)%7;
     let html=`<div class="ja-cal-head"><button type="button" data-prev>‹</button><span>${names[jm-1]} ${applicantFaDigits(jy)}</span><button type="button" data-next>›</button></div><div class="ja-cal-grid">`;
     ['ش','ی','د','س','چ','پ','ج'].forEach(x=>html+=`<button type="button" class="day-label" disabled>${x}</button>`);
     for(let i=0;i<weekday;i++)html+='<span></span>';
     for(let d=1;d<=max;d++)html+=`<button type="button" data-day="${d}" class="${today[0]===jy&&today[1]===jm&&today[2]===d?'today':''}">${applicantFaDigits(d)}</button>`;
     html+='</div>';pop.innerHTML=html;
     pop.querySelector('[data-prev]').onclick=()=>{jm--;if(jm<1){jm=12;jy--}render()};pop.querySelector('[data-next]').onclick=()=>{jm++;if(jm>12){jm=1;jy++}render()};
     pop.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{el.value=`${jy}/${String(jm).padStart(2,'0')}/${String(+b.dataset.day).padStart(2,'0')}`;pop.classList.remove('open');el.dispatchEvent(new Event('input',{bubbles:true}));el.dispatchEvent(new Event('change',{bubbles:true}));});
   }
   btn.addEventListener('click',()=>{document.querySelectorAll('.ja-date-pop.open').forEach(x=>x.classList.remove('open'));const parts=applicantJalaliParts(el.value);if(parts){jy=parts[0];jm=parts[1];}else{const d=new Date();[jy,jm]=applicantG2J(d.getFullYear(),d.getMonth()+1,d.getDate());}render();pop.classList.toggle('open');});
   el.addEventListener('input',()=>{const pos=el.selectionStart;applicantFormatDateInput(el);try{el.setSelectionRange(el.value.length,el.value.length)}catch(e){} if(el.id==='jaBirthDate')calculateApplicantAge();});
   el.addEventListener('blur',()=>{if(!el.value.trim())return;const parts=applicantJalaliParts(el.value);if(!parts){toast('تاریخ معتبر نیست؛ قالب صحیح ۱۴۰۵/۰۸/۱۲ است.','error');if(el.id==='jaBirthDate')$('jaAge').value='';return;}el.value=`${parts[0]}/${String(parts[1]).padStart(2,'0')}/${String(parts[2]).padStart(2,'0')}`;if(el.id==='jaBirthDate')calculateApplicantAge();});
 });
 document.addEventListener('click',e=>{if(!e.target.closest('.ja-date-wrap'))document.querySelectorAll('.ja-date-pop.open').forEach(x=>x.classList.remove('open'));});
}


function submitJobApplicant(ev){
  ev.preventDefault();
  const national=$('jaNationalId').value.replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d));
  const phone=$('jaPhone').value.replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d));
  if(!/^\d{10}$/.test(national)) return toast('کد ملی باید ۱۰ رقم باشد.','error');
  if(!/^09\d{9}$/.test(phone)) return toast('شماره تماس باید با 09 و ۱۱ رقم وارد شود.','error');
  if(!applicantJalaliParts($('jaBirthDate').value)) return toast('تاریخ تولد را با تقویم شمسی انتخاب کنید.','error');
  
  calculateApplicantAge();

  const data={
    firstName:$('jaFirstName').value.trim(), lastName:$('jaLastName').value.trim(), gender:$('jaGender').value,
    nationalId:national, birthDate:$('jaBirthDate').value.trim(), age:$('jaAge').value, maritalStatus:$('jaMarital').value,
    specialty:$('jaSpecialty').value.trim(), experience:$('jaExperience').value.trim(), otherSkills:$('jaSkills').value.trim(),
    education:$('jaEducation').value, fieldOfStudy:$('jaFieldOfStudy').value.trim(), residence:$('jaResidence').value.trim(),
    phone:phone, messenger:$('jaMessenger').value, messengerId:$('jaMessengerId').value.trim(),
    source:$('jaSource').value, referrer:$('jaReferrer').value.trim(), requestedPosition:$('jaRequestedPosition').value.trim()
  };
  
  const btn=$('jaSubmitBtn'); btn.disabled=true; btn.textContent='در حال ثبت…';
  google.script.run.withSuccessHandler(r=>{
    btn.disabled=false; btn.textContent='ثبت پرونده متقاضی';
    toast('پرونده با شماره '+r.caseNumber+' ثبت شد.','success');
    $('jobApplicantForm').reset(); $('jaAge').value=''; $('jaNextId').textContent='پس از ثبت';
    $('jaToday').textContent=new Intl.DateTimeFormat('fa-IR-u-ca-persian',{year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
    searchJobApplicants();
  }).withFailureHandler(e=>{
    btn.disabled=false; btn.textContent='ثبت پرونده متقاضی';
    toast(e.message||'ثبت پرونده ناموفق بود.','error');
  }).saveEmployeeJobApplicant(data, currentToken);
}

function searchJobApplicants(){
  const filters={caseNumber:$('jaFilterCase').value.trim(),dateFrom:$('jaFilterFrom').value.trim(),dateTo:$('jaFilterTo').value.trim(),status:$('jaFilterStatus').value,specialty:$('jaFilterSpecialty').value.trim(),requestedPosition:$('jaFilterPosition').value.trim(),ageFrom:applicantNormalizeDigits($('jaFilterAgeFrom').value.trim()),ageTo:applicantNormalizeDigits($('jaFilterAgeTo').value.trim())};
  $('jaRecent').innerHTML='<div class="loading">در حال جستجوی پرونده‌ها…</div>';
  google.script.run.withSuccessHandler(renderAllJobApplicants).withFailureHandler(e=>$('jaRecent').innerHTML='<div class="loading" style="color:var(--danger)">'+escapeHtml(e.message||'جستجو ناموفق بود')+'</div>').searchEmployeeJobApplicants(filters,currentToken);
}
function resetJobApplicantFilters(){['jaFilterCase','jaFilterFrom','jaFilterTo','jaFilterSpecialty','jaFilterPosition','jaFilterAgeFrom','jaFilterAgeTo'].forEach(id=>$(id).value='');$('jaFilterStatus').value='';searchJobApplicants();}
function renderAllJobApplicants(rows){
  if(!rows||!rows.length){$('jaRecent').innerHTML='<div style="padding:18px;text-align:center;color:var(--muted)">پرونده‌ای با این فیلترها پیدا نشد.</div>';return;}
  $('jaRecent').innerHTML=`<div class="small" style="margin-bottom:8px">تعداد پرونده‌های پیدا شده: ${toFa(rows.length)}</div><div class="table-wrap"><table><thead><tr><th>شماره پرونده</th><th>نام متقاضی</th><th>تخصص</th><th>موقعیت درخواستی</th><th>سن</th><th>تاریخ ثبت</th><th>بررسی اولیه</th><th>وضعیت پرونده</th><th>عملیات</th></tr></thead><tbody>${rows.map((r,i)=>`<tr><td><strong>${escapeHtml(r.caseNumber)}</strong></td><td>${escapeHtml(r.fullName)}</td><td>${escapeHtml(r.specialty)}</td><td>${escapeHtml(r.requestedPosition)}</td><td>${escapeHtml(r.age)}</td><td>${escapeHtml(r.createdAt)}</td><td>${escapeHtml(r.initialReview)}</td><td>${escapeHtml(r.status)}</td><td><button class="btn btn-secondary btn-sm" type="button" onclick="toggleApplicantOperation('${escapeHtml(r.caseNumber)}')">عملیات</button></td></tr><tr id="ja-op-${i}" style="display:none"><td colspan="9"><div class="card" style="margin:8px 0;background:#f8f9fc"><strong>عملیات پرونده ${escapeHtml(r.caseNumber)}</strong><div class="form-grid" style="margin-top:12px">
  <div class="field"><label>بررسی اولیه</label><select id="ja-op-review-${i}">${jaOptions(['بررسی نشده','تأیید اولیه','رد اولیه','نیازمند بررسی بیشتر'],r.initialReview)}</select></div>
  <div class="field"><label>تاریخ مصاحبه تلفنی</label><input id="ja-op-phone-date-${i}" class="ja-jalali-date" value="${escapeHtml(r.phoneInterviewDate)}" placeholder="۱۴۰۵/۰۸/۱۲"></div>
  <div class="field"><label>تاریخ مصاحبه حضوری</label><input id="ja-op-person-date-${i}" class="ja-jalali-date" value="${escapeHtml(r.inPersonInterviewDate)}" placeholder="۱۴۰۵/۰۸/۱۲"></div>
  <div class="field"><label>نتیجه مصاحبه تلفنی</label><select id="ja-op-phone-result-${i}">${jaOptions(['انجام نشده','تأیید','رد','نیازمند پیگیری'],r.phoneInterviewResult)}</select></div>
  <div class="field"><label>نتیجه مصاحبه حضوری</label><select id="ja-op-person-result-${i}">${jaOptions(['انجام نشده','تأیید','رد','نیازمند پیگیری'],r.inPersonInterviewResult)}</select></div>
  <div class="field"><label>وضعیت پرونده</label><select id="ja-op-status-${i}">${jaOptions(['جدید','در حال بررسی','در انتظار مصاحبه','تأیید شده','رد شده','استخدام شده','بایگانی'],r.status)}</select></div>
  </div><div style="display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:12px"><button class="btn btn-secondary btn-sm" type="button" onclick="cancelApplicantOperation(${i})">لغو</button><button class="btn btn-primary btn-sm" type="button" onclick="saveApplicantOperation(${i},'${escapeHtml(r.caseNumber)}')">ذخیره تغییرات</button></div></div></td></tr>`).join('')}</tbody></table></div>`;
  window.jaRenderedApplicants=rows;
}
function jaOptions(options,selected){return options.map(x=>'<option value="'+escapeHtml(x)+'" '+(x===selected?'selected':'')+'>'+escapeHtml(x)+'</option>').join('');}
function toggleApplicantOperation(caseNo){const rows=window.jaRenderedApplicants||[];const i=rows.findIndex(x=>x.caseNumber===caseNo);if(i<0)return;const tr=$('ja-op-'+i);const opening=tr.style.display==='none';tr.style.display=opening?'table-row':'none';if(opening)initApplicantJalaliDates();}
function cancelApplicantOperation(i){const tr=$('ja-op-'+i);if(tr)tr.style.display='none';}
function saveApplicantOperation(i,caseNo){
 const changes={initialReview:$('ja-op-review-'+i).value,phoneInterviewDate:$('ja-op-phone-date-'+i).value.trim(),inPersonInterviewDate:$('ja-op-person-date-'+i).value.trim(),phoneInterviewResult:$('ja-op-phone-result-'+i).value,inPersonInterviewResult:$('ja-op-person-result-'+i).value,status:$('ja-op-status-'+i).value};
 for(const key of ['phoneInterviewDate','inPersonInterviewDate'])if(changes[key]&&!applicantJalaliParts(changes[key]))return toast('تاریخ مصاحبه معتبر نیست.','error');
 const btn=$('ja-op-'+i).querySelector('.btn-primary');btn.disabled=true;btn.textContent='در حال ذخیره…';
 google.script.run.withSuccessHandler(()=>{toast('تغییرات پرونده ذخیره شد.','success');searchJobApplicants();}).withFailureHandler(e=>{btn.disabled=false;btn.textContent='ذخیره تغییرات';toast(e.message||'ذخیره تغییرات ناموفق بود.','error');}).updateEmployeeJobApplicantOperations(caseNo,changes,currentToken);
}

function renderRecentJobApplicants(rows){
  if(!rows||!rows.length){$('jaRecent').innerHTML='<div style="padding:18px;text-align:center;color:var(--muted)">هنوز پرونده‌ای توسط شما ثبت نشده است.</div>';return;}
  $('jaRecent').innerHTML='<div class="table-wrap"><table><thead><tr><th>شماره پرونده</th><th>نام متقاضی</th><th>تخصص</th><th>شماره تماس</th><th>تاریخ ثبت</th><th>وضعیت</th></tr></thead><tbody>'+rows.map(r=>'<tr><td><strong>'+escapeHtml(r.caseNumber)+'</strong></td><td>'+escapeHtml(r.fullName)+'</td><td>'+escapeHtml(r.specialty)+'</td><td style="direction:ltr">'+escapeHtml(r.phone)+'</td><td>'+escapeHtml(r.createdAt)+'</td><td>'+escapeHtml(r.status)+'</td></tr>').join('')+'</tbody></table></div>';
}

function loadReports() {
  $('pageContent').innerHTML = '<div class="page-header"><h1 class="page-title">گزارشات شعبه</h1></div>' +
    '<div class="card"><div class="filters"><div class="field"><label>از تاریخ</label><input id="repFrom" placeholder="1405/01/01"></div><div class="field"><label>تا تاریخ</label><input id="repTo" placeholder="1405/12/29"></div><div class="field" style="justify-content:flex-end"><button class="btn btn-primary" onclick="fetchReports()">نمایش</button></div></div><div id="repContent"></div></div>';
}
function fetchReports() {
  google.script.run.withSuccessHandler(rep => {
    $('repContent').innerHTML = '<div class="stats-grid"><div class="stat-card"><div class="stat-label">تعداد</div><div class="stat-value">' + toFa(rep.count) + '</div></div><div class="stat-card green"><div class="stat-label">درآمد</div><div class="stat-value">' + money(rep.totalRevenue) + '</div></div></div>' +
      '<div class="card" style="margin-top:16px"><h3>توزیع وضعیت</h3>' + Object.entries(rep.byStatus).map(kv => '<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)"><span>' + kv[0] + '</span><strong>' + toFa(kv[1]) + '</strong></div>').join('') + '</div>' +
      '<div class="card" style="margin-top:16px"><h3>ریز تراکنش‌ها</h3><div class="table-wrap"><table><thead><tr><th>تاریخ</th><th>کد</th><th>خدمت</th><th>مبلغ</th><th>وضعیت</th></tr></thead><tbody>' + rep.transactions.map(t => '<tr><td>' + t.date + '</td><td>' + t.requestId + '</td><td>' + t.service + '</td><td>' + money(t.amount) + '</td><td>' + statusBadge(t.status) + '</td></tr>').join('') + '</tbody></table></div></div>';
  }).getEmployeeReports(currentToken, $('repFrom').value, $('repTo').value);
}

function loadProfile() {
  google.script.run.withSuccessHandler(p => {
    $('pageContent').innerHTML = '<div class="page-header"><h1 class="page-title">پروفایل من</h1></div>' +
      '<div class="card"><div class="employee-profile"><div class="employee-avatar-large">' + (p.avatar ? '<img src="'+p.avatar+'">' : (p.name||'?').charAt(0)) + '</div>' +
      '<div class="employee-details">' +
      '<div class="detail-item"><div class="detail-label">شناسه یکتا</div><div class="detail-value">' + p.empId + '</div></div>' +
      '<div class="detail-item"><div class="detail-label">نام</div><div class="detail-value">' + p.name + '</div></div>' +
      '<div class="detail-item"><div class="detail-label">نام کاربری</div><div class="detail-value">' + p.username + '</div></div>' +
      '<div class="detail-item"><div class="detail-label">نقش</div><div class="detail-value">' + p.role + '</div></div>' +
      '<div class="detail-item"><div class="detail-label">کد شعبه</div><div class="detail-value">' + p.branchId + '</div></div>' +
      '</div></div></div>' +
      '<div class="card" style="margin-top:16px"><h3 style="margin-bottom:12px;color:var(--navy)">تغییر رمز عبور</h3>' +
      '<div class="field" style="max-width:300px"><label>رمز عبور جدید</label><input id="newPass" type="password" placeholder="رمز جدید"></div>' +
      '<button class="btn btn-primary" style="margin-top:10px" onclick="updateProfile()">بروزرسانی رمز</button></div>';
  }).getEmployeeProfile(currentToken);
}
function updateProfile() {
  const pass = $('newPass').value;
  if (!pass) return toast('رمز عبور را وارد کنید', 'error');
  google.script.run.withSuccessHandler(() => { toast('رمز عبور بروزرسانی شد', 'success'); $('newPass').value = ''; }).withFailureHandler(e => toast(e.message, 'error')).updateEmployeeProfile({ password: pass }, currentToken);
}

document.addEventListener('keydown', e => { if (e.key === 'Enter' && $('loginPage').style.display !== 'none') doLogin(); });
