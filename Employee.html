:focus-visible{outline:3px solid rgba(255,107,26,.45);outline-offset:2px;border-radius:8px}

.charts{grid-template-columns:repeat(auto-fit,minmax(330px,1fr))}

.ka{font-size:11px;font-weight:900;color:var(--brandDeep)}

.fgrid .full{grid-column:1/-1}

'use strict';
/* ═════════ 1) UTILITIES ═════════ */
var $=function(s,r){return (r||document).querySelector(s);};
var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));};
function esc(v){var m={'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'};return String(v==null?'':v).replace(/[&<>"']/g,function(c){return m[c];});}
function fa(v){return String(v==null?'':v).replace(/\d/g,function(d){return '۰۱۲۳۴۵۶۷۸۹'[Number(d)];});}
function en(v){return String(v==null?'':v).replace(/[۰-۹]/g,function(d){return String('۰۱۲۳۴۵۶۷۸۹'.indexOf(d));}).replace(/[٠-٩]/g,function(d){return String('٠١٢٣٤٥٦٧٨٩'.indexOf(d));});}

function debounce(fn,ms){var t;return function(){var a=arguments,s=this;clearTimeout(t);t=setTimeout(function(){fn.apply(s,a);},ms);};}
function g2j(gy,gm,gd){var leap=(gy%4===0&&gy%100!==0)||gy%400===0;var gdm=[0,31,leap?29:28,31,30,31,30,31,31,30,31,30,31];var gy2=gm>2?gy+1:gy;var days=355666+365*gy+Math.floor((gy2+3)/4)-Math.floor((gy2+99)/100)+Math.floor((gy2+399)/400)+gd;for(var i=1;i<gm;i++)days+=gdm[i];var jy=-1595+33*Math.floor(days/12053);days%=12053;jy+=4*Math.floor(days/1461);days%=1461;if(days>365){jy+=Math.floor((days-1)/365);days=(days-1)%365;}var jm,jd;if(days<186){jm=1+Math.floor(days/31);jd=1+days%31;}else{jm=7+Math.floor((days-186)/30);jd=1+(days-186)%30;}return[jy,jm,jd];}

function jLeap(y){var g=j2g(y,12,30),j=g2j(g[0],g[1],g[2]);return j[0]===y&&j[1]===12&&j[2]===30;}

function parseJ(s){var m=en(s).trim().replace(/[.\-]/g,'/').match(/^(\d{4})\/(\d{1,2})\/(\d{1,2})$/);if(!m)return null;var y=Number(m[1]),mo=Number(m[2]),d=Number(m[3]);if(mo<1||mo>12||d<1||d>jDays(y,mo))return null;return[y,mo,d];}

function jDisp(v){if(!v)return '—';var d=new Date(v);if(isNaN(d.getTime()))return esc(v);var j=g2j(d.getFullYear(),d.getMonth()+1,d.getDate());return fa(j[0]+'/'+String(j[1]).padStart(2,'0')+'/'+String(j[2]).padStart(2,'0'));}

function jDT(v){if(!v)return '—';var d=new Date(v);if(isNaN(d.getTime()))return jDisp(v);return jDisp(v)+' · '+fa(String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'));}

var JM=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];

function M(){return META||{modules:[],kinds:[],priorities:[],statuses:[],impacts:[],frequencies:[],audiences:[],deadlines:[],rules:{problemMin:20,proposalMin:20,expectedMin:10,exampleMax:600}};}
function loadMeta(){if(META)return Promise.resolve(META);return api('devMeta',TOKEN).then(function(r){META=r;return r;});}
function opts(list,sel){return (list||[]).map(function(x){return '<option value="'+esc(x)+'"'+(String(x)===String(sel)?' selected':'')+'>'+esc(x)+'</option>';}).join('');}
function modOpts(sel){return (M().modules||[]).map(function(m){return '<option value="'+esc(m.id)+'"'+(m.id===sel?' selected':'')+'>'+esc(m.name)+'</option>';}).join('');}
function modName(id){var m=(M().modules||[]).find(function(x){return x.id===id;});return m?m.name:id;}
function priColor(p){return p==='بحرانی'?'var(--red)':p==='فوری'?'var(--amber)':p==='مهم'?'var(--violet)':'var(--slate)';}
function stColor(s){return s==='منتشر شد'?'green':s==='در حال ساخت'?'amber':s==='پذیرفته شده'?'teal':s==='در بررسی'?'violet':s==='رد شده'?'red':'blue';}
function priPill(p){return '<span class="pill" style="background:color-mix(in srgb,'+priColor(p)+' 14%,transparent);color:'+priColor(p)+'">'+esc(p||'عادی')+'</span>';}
function stPill(s){return '<span class="pill p-'+stColor(s)+'">'+esc(s||'جدید')+'</span>';}

return '<div class="tw"><table class="tb"><thead><tr><th>Request-ID</th><th>ماژول</th><th>نوع</th><th>مسئله</th><th>اثر</th><th>دفعات</th><th>اولویت</th><th>وضعیت</th><th>شعبه</th><th>ثبت</th><th style="text-align:left">عملیات</th></tr></thead><tbody>'+
items.map(function(r){
return '<tr><td><b class="ltr">'+esc(r.id)+'</b></td>'+
'<td>'+esc(r.moduleName)+'<br><small class="sub ltr">'+esc(r.module)+'</small></td>'+
'<td><span class="zvd-tag">'+esc(r.kind)+'</span></td>'+
'<td class="zvd-cell">'+esc(String(r.fields.problem||r.note).slice(0,150))+(String(r.fields.problem||'').length>150?'…':'')+'</td>'+

function patchMenu(){
if(!window.MENU)return;
if(MENU.some(function(m){return m.id===PAGE_ID;}))return;
var at=-1;
for(var i=0;i<MENU.length;i++)if(MENU[i].sec==='در حال توسعه'){at=i+1;break;}
var item={id:PAGE_ID,l:'درخواست‌های توسعه',ic:'logs',bc:'v'};
if(at<0){MENU.push({sec:'در حال توسعه'});MENU.push(item);}else MENU.splice(at,0,item);
if(window.TITLES)TITLES[PAGE_ID]=['درخواست‌های توسعه','پیشنهادهای ساخت‌یافته · شیت DevelopmentRequests'];
}
var _render=window.render;
window.render=function(){
var p=(window.PS&&PS.page)||'dashboard';
if(p!==PAGE_ID)return _render.apply(this,arguments);
if(window.CH)CH.forEach(function(c){try{c.destroy();}catch(e){}});
var t=(window.TITLES&&TITLES[PAGE_ID])||['درخواست‌های توسعه',''];
$('#tbTitle').textContent=t[0];$('#tbCrumb').textContent='ZingoVingo · '+t[1];
var tb=$('#themeBtn');if(tb)tb.innerHTML=icon(root_dark()?'sun':'moon');
Promise.resolve(devPage()).then(function(h){
$('#page').innerHTML=h;
if(typeof decorate==='function')decorate($('#page'));

if(typeof paintSideUser==='function')paintSideUser();
if(typeof notifications==='function'){var d=$('#bellDot');if(d)d.hidden=!notifications().some(function(n){return !n.read;});}
}).catch(function(e){
$('#page').innerHTML='<div class="card"><div class="empty"><div class="ei">'+icon('x')+'</div><h4>خطا در بارگذاری</h4><p class="sub">'+esc(e.message)+'</p></div></div>';
});
};

if(!list.length)return '<div class="card"><div class="empty"><div class="ei">'+icon('zap')+'</div><h4>درخواستی ثبت نشده است</h4><p class="sub">با «ثبت نیازمندی» اولین درخواست ساخت‌یافته را ایجاد کنید.</p></div></div>';
return '<div class="card"><h3 style="margin-bottom:12px;display:flex;gap:8px;align-items:center">'+icon('logs','width:15px;height:15px;color:var(--brand)')+' درخواست‌های توسعه ('+fa(list.length)+')</h3>'+
devRowsHtml({items:list,canModerate:!!(META&&META.canModerate)})+
'<div style="margin-top:12px">'+btn('zvd-page','مدیریت کامل درخواست‌ها','list','btn-s btn-sm')+'</div></div>';
};

/* ═════════ رویدادها ═════════ */
document.addEventListener('submit',function(e){
var f=e.target;
if(!f.dataset||f.dataset.form!=='zvd-submit')return;
e.preventDefault();
var g=function(n){return f.elements[n]?String(f.elements[n].value).trim():'';};
var payload={module:g('module'),kind:g('kind'),priority:g('priority'),
problem:g('problem'),proposal:g('proposal'),expected:g('expected'),
impact:g('impact'),frequency:g('frequency'),audience:g('audience'),
deadline:g('deadline'),example:g('example')};
var r=(META&&META.rules)||{};
if(payload.problem.length<(r.problemMin||20)){toast('«مسئله فعلی» حداقل '+fa(r.problemMin||20)+' نویسه باشد.','err');return;}
if(payload.proposal.length<(r.proposalMin||20)){toast('«راهکار پیشنهادی» حداقل '+fa(r.proposalMin||20)+' نویسه باشد.','err');return;}
if(payload.expected.length<(r.expectedMin||10)){toast('«معیار پذیرش» حداقل '+fa(r.expectedMin||10)+' نویسه باشد.','err');return;}
if(payload.priority==='بحرانی'&&payload.example.length<10){toast('برای اولویت بحرانی، نمونه واقعی الزامی است.','err');return;}
var sub=f.querySelector('[type="submit"]');if(sub)sub.disabled=true;
api('devSubmit',payload,TOKEN).then(function(res){
closeModal();toast('درخواست ثبت شد · '+res.id,'ok');
go(PAGE_ID);
return devDrawer(res.id);
}).catch(function(err){if(sub)sub.disabled=false;toast(err.message||String(err),'err');});
});
var qDeb=null;
document.addEventListener('input',function(e){
var t=e.target;
if(!t.matches||!t.matches('[data-zvd-q]'))return;
FILTER.q=t.value;clearTimeout(qDeb);qDeb=setTimeout(function(){render();},300);
});
document.addEventListener('change',function(e){
var t=e.target;
if(t.matches&&t.matches('[data-zvd-f]')){FILTER[t.getAttribute('data-zvd-f')]=t.value;render();return;}
if(t.matches&&t.matches('[data-zvd-mine]')){FILTER.mine=!!t.checked;render();return;}
if(t.matches&&t.matches('[data-zvd-status]')){
var id=t.getAttribute('data-zvd-status');
api('devSetStatus',id,t.value,TOKEN).then(function(){toast('وضعیت به‌روزرسانی شد.','ok');return devDrawer(id);})
.catch(function(err){toast(err.message,'err');devDrawer(id);});
}
});

/* ═════════ راه‌اندازی ═════════ */
patchMenu();
if(window.TITLES)TITLES[PAGE_ID]=['درخواست‌های توسعه','پیشنهادهای ساخت‌یافته · شیت DevelopmentRequests'];
loadMeta().then(function(){if(typeof window.renderNav==='function')window.renderNav();}).catch(function(){});
var _load=window.loadData;
if(typeof _load==='function')window.loadData=function(){return _load.apply(this,arguments).then(function(r){patchMenu();return r;});};
window.ZVDev={open:devModal,page:devPage,view:devDrawer,meta:function(){return META;},filter:FILTER};
})();
</script>
</body>
</html>
