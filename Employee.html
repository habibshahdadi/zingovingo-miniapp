<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<base target="_top">
<title>پنل کارمند | ZingoVingo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@900&display=swap" rel="stylesheet">
<script>
window.__zvErrors = [];
window.__zvModern = (function () { try { new Function('a', 'return a?.b ?? 0'); return true; } catch (e) { return false; } })();
window.addEventListener('error', function (ev) {
  var t = ev && ev.target;
  if (t && t !== window && t.tagName && /^(SCRIPT|LINK|IMG|IFRAME|SOURCE)$/.test(String(t.tagName).toUpperCase())) { console.warn('[ZV] asset failed:', t.src || t.href); return; }
  var msg = String((ev && ev.message) || '').trim();
  if (!ev.lineno && (/^Script error\.?$/i.test(msg) || msg === '')) { console.warn('[ZV] cross-origin script error ignored'); return; }
  window.__zvErrors.push(msg + ' @ ' + (ev.lineno || 0) + ':' + (ev.colno || 0));
  var b = document.getElementById('zvFatal');
  if (b) { b.style.display = 'block'; b.textContent = 'خطای اسکریپت: ' + window.__zvErrors.join(' | '); }
}, true);
</script>
<style>
:root{
--navy:#0B1736;--navy2:#13234D;--navy3:#1B2F63;--brand:#FF6B1A;--brand2:#FF8A3D;--brandDeep:#E4570B;
--blue:#2E63E7;--violet:#7C4DFF;--teal:#0FA3A3;--green:#0E9F6E;--amber:#D97706;--red:#E02D3C;--pink:#E0447C;--slate:#64748B;
--bg:#F3F5FB;--surface:#fff;--surface2:#F6F8FD;--ink:#101A33;--muted:#5C6784;--line:#E2E7F3;--line2:#D3DAEC;
--scrim:rgba(7,13,31,.58);--sh:0 6px 22px rgba(11,23,54,.07);--sh2:0 16px 44px rgba(11,23,54,.16);
--r:16px;--tr:180ms ease;--grad:linear-gradient(135deg,#FF6B1A,#FF8A3D 55%,#FFB25E);
--hero:linear-gradient(120deg,#0B1736,#16295B 45%,#3B2E7E 78%,#7C4DFF 130%);
--glass:rgba(148,163,184,.16);--glassBrd:rgba(100,116,139,.28);--panBg:rgba(17,26,48,.9);
}
[data-theme=dark]{--bg:#070D1F;--surface:#0E1830;--surface2:#121F3D;--ink:#E9EEFC;--muted:#93A0C2;--line:#1D2B4F;--line2:#27375F;--scrim:rgba(2,6,18,.74);--sh:0 8px 26px rgba(0,0,0,.42);--sh2:0 18px 50px rgba(0,0,0,.58);--glass:rgba(203,213,225,.11);--glassBrd:rgba(148,163,184,.26)}
.brand h1, .lbox h1 { font-family: 'Nunito', 'Vazirmatn', sans-serif !important; font-weight: 900 !important; letter-spacing: -0.5px; }
.brand h1 span, .lbox h1 span { font-family: 'Nunito', sans-serif !important; font-weight: 900 !important; }
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Vazirmatn,Tahoma,sans-serif;background:var(--bg);color:var(--ink);font-size:13.5px;line-height:1.8;min-height:100vh;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;z-index:-2;background:radial-gradient(700px 420px at 92% -6%,rgba(255,107,26,.14),transparent 60%),radial-gradient(640px 460px at -8% 108%,rgba(46,99,231,.13),transparent 60%),radial-gradient(520px 380px at 55% 118%,rgba(124,77,255,.09),transparent 60%)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid rgba(255,107,26,.45);outline-offset:2px;border-radius:8px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--line2),var(--slate));border-radius:9px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:linear-gradient(180deg,var(--brand2),var(--brandDeep))}
svg.ic{width:18px;height:18px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#zvFatal{display:none;position:fixed;top:0;left:0;right:0;z-index:999;background:#E02D3C;color:#fff;padding:10px 16px;font-size:12px;direction:ltr;text-align:left}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:38px;padding:8px 16px;border-radius:11px;border:1px solid transparent;font-size:12.5px;font-weight:800;cursor:pointer;transition:all var(--tr);white-space:nowrap}
.btn:hover{transform:translateY(-1px)}
.btn:disabled{opacity:.55;cursor:not-allowed;transform:none}
.btn-p{background:var(--grad);color:#fff;box-shadow:0 6px 18px rgba(255,107,26,.35)}
.btn-s{background:var(--surface2);border-color:var(--line);color:var(--ink)}
.btn-s:hover{border-color:var(--brand);color:var(--brandDeep)}
.btn-d{background:rgba(224,45,60,.12);color:var(--red)}
.btn-sm{min-height:30px;padding:5px 11px;font-size:11.5px}
.btn-i{width:31px;height:31px;min-height:31px;padding:0;border-radius:9px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:18px}
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--sh);position:relative;overflow:hidden;transition:transform var(--tr)}
.kpi:hover{transform:translateY(-3px)}
.kpi .top{display:flex;justify-content:space-between;align-items:center}
.kpi .chip{width:38px;height:38px;border-radius:12px;display:grid;place-items:center}
.kpi .l{font-size:11.5px;color:var(--muted);font-weight:700;margin-top:10px}
.kpi .v{font-size:22px;font-weight:900;font-variant-numeric:tabular-nums;margin-top:2px}
.kpi .s{font-size:10.5px;color:var(--muted)}
.hero{background:var(--hero);color:#fff;border-radius:20px;padding:26px 28px;position:relative;overflow:hidden;margin-bottom:18px}
.hero:before{content:"";position:absolute;inset:0;background:radial-gradient(420px 220px at 88% 20%,rgba(255,107,26,.42),transparent 60%),radial-gradient(300px 200px at 10% 110%,rgba(15,163,163,.32),transparent 60%)}
.hero:after{content:"";position:absolute;inset:0;opacity:.17;background-image:radial-gradient(rgba(255,255,255,.85) 1px,transparent 1px);background-size:22px 22px}
.hero>*{position:relative;z-index:1}
.hero h2{font-size:21px;font-weight:900}
.hero p{color:#C9D4F2;font-size:12px;margin-top:4px}
.hero .dchip{position:absolute;left:26px;top:24px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.24);padding:7px 14px;border-radius:12px;font-size:12px;font-weight:800;display:inline-flex;align-items:center;gap:7px}
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,var(--navy),#1a2a4d)}
.lbox{background:var(--surface);border-radius:22px;padding:34px;width:min(430px,100%);box-shadow:0 20px 60px #0004}
.lbox h1{text-align:center;color:var(--ink);font-size:27px}
.lbox h1 span{color:var(--brand)}
.lbox .sub{text-align:center;color:var(--muted);font-size:12px;margin:6px 0 20px}
.errbox{display:none;background:rgba(224,45,60,.1);color:var(--red);padding:10px;border-radius:10px;font-size:12px;margin-bottom:12px}
#app{display:none;grid-template-columns:266px minmax(0,1fr);min-height:100vh}
.sidebar{background:linear-gradient(180deg,#0A1531,#0B1736 42%,#0E1D42);color:#C7D1E8;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;z-index:60}
.brand{display:flex;gap:11px;align-items:center;padding:20px}
.mark{width:42px;height:42px;border-radius:14px;background:var(--grad);display:grid;place-items:center;color:#fff;box-shadow:0 6px 18px rgba(255,107,26,.45)}
.brand h1{font-size:19px;color:#fff}
.brand h1 span{color:var(--brand2)}
.brand small{display:block;font-size:10px;color:#7E8DB1}
.nav{flex:1;padding:6px 12px 12px}
.nav-item{display:flex;align-items:center;gap:11px;padding:9.5px 12px;margin:2px 0;border-radius:11px;color:#B9C4DE;font-size:12.5px;font-weight:700;cursor:pointer;transition:all var(--tr);position:relative}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff}
.nav-item.on{background:linear-gradient(90deg,rgba(255,107,26,.2),rgba(255,107,26,.05));color:#fff}
.nav-item.on:before{content:"";position:absolute;right:-12px;top:8px;bottom:8px;width:3.5px;border-radius:4px;background:var(--grad)}
.side-foot{padding:14px;border-top:1px solid rgba(255,255,255,.07)}
.uchip{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:12px;background:rgba(255,255,255,.05)}
.uchip b{color:#fff;font-size:12.5px;display:block}
.uchip small{color:#7E8DB1;font-size:10px}
.av{width:36px;height:36px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;font-weight:900;overflow:hidden;flex:0 0 auto;cursor:pointer}
.av img{width:100%;height:100%;object-fit:cover}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:12px;padding:12px 26px;background:color-mix(in srgb,var(--surface) 86%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.topbar h2{font-size:17px;font-weight:900}
.crumb{font-size:11px;color:var(--muted)}
.sp{flex:1}
.ibtn{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--muted);transition:all var(--tr);position:relative}
.ibtn:hover{color:var(--brand);border-color:var(--brand)}
.menu-btn{display:none}
#page{padding:24px 26px 60px;max-width:1560px;width:100%;margin:0 auto}
.ph{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.ph h1{font-size:20px;font-weight:900}
.ph .sub{font-size:11.5px;color:var(--muted)}
.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.inp,.sel{min-height:37px;padding:7px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:12px}
.inp:focus,.sel:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 3px rgba(255,107,26,.12)}
.tw{overflow:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
table.tb{width:100%;border-collapse:collapse;font-size:12.5px;min-width:780px}
.tb th{position:sticky;top:0;background:var(--surface2);color:var(--muted);font-size:11px;font-weight:900;text-align:right;padding:11px 13px;border-bottom:1px solid var(--line);white-space:nowrap;z-index:2}
.tb td{padding:10px 13px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
.tb tbody tr:hover{background:color-mix(in srgb,var(--brand) 4%,var(--surface))}
.num{font-variant-numeric:tabular-nums}
.ltr{direction:ltr;text-align:right}
.ra{display:flex;gap:5px;justify-content:flex-end}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3.5px 11px;border-radius:20px;font-size:11px;font-weight:800;white-space:nowrap}
.pill:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-blue{background:rgba(46,99,231,.12);color:var(--blue)}
.p-green{background:rgba(14,159,110,.13);color:var(--green)}
.p-amber{background:rgba(217,119,6,.13);color:var(--amber)}
.p-red{background:rgba(224,45,60,.12);color:var(--red)}
.p-violet{background:rgba(124,77,255,.12);color:var(--violet)}
.p-gray{background:rgba(100,116,139,.14);color:var(--slate)}
.p-brand{background:rgba(255,107,26,.13);color:var(--brandDeep)}
.pager{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 4px 0;font-size:11.5px;color:var(--muted);flex-wrap:wrap}
.empty{text-align:center;padding:52px 20px;color:var(--muted)}
.empty .ei{width:74px;height:74px;margin:0 auto 14px;border-radius:22px;background:linear-gradient(135deg,rgba(255,107,26,.14),rgba(124,77,255,.12));display:grid;place-items:center;color:var(--brand)}
.empty .ei .ic{width:32px;height:32px}
.empty h4{color:var(--ink);font-size:14px;margin-bottom:4px}
.scrim{position:fixed;inset:0;background:var(--scrim);backdrop-filter:blur(3px);z-index:90;opacity:0;pointer-events:none;transition:opacity .22s}
.scrim.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;left:0;height:100vh;width:min(520px,100%);background:var(--surface);z-index:95;transform:translateX(-103%);transition:transform .28s cubic-bezier(.3,.9,.3,1);display:flex;flex-direction:column;border-right:1px solid var(--line);box-shadow:var(--sh2)}
.drawer.show{transform:none}
.dh,.mh{display:flex;align-items:center;gap:11px;padding:17px 20px;border-bottom:1px solid var(--line);flex:0 0 auto}
.dh h3,.mh h3{font-size:15px;font-weight:900;flex:1}
.db{flex:1;overflow-y:auto;padding:18px 20px;min-height:0}
.df{padding:13px 20px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;flex:0 0 auto}
.mback{position:fixed;inset:0;z-index:100;background:var(--scrim);backdrop-filter:blur(4px);display:none;align-items:flex-start;justify-content:center;padding:5vh 16px;overflow-y:auto}
.mback.show{display:flex}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:20px;width:min(640px,100%);box-shadow:var(--sh2);max-height:90vh;display:flex;flex-direction:column;overflow:hidden}
.modal.w{width:min(1020px,100%)}
.modal>form{display:flex;flex-direction:column;min-height:0;flex:1;overflow:hidden}
.mb{padding:20px 22px;overflow-y:auto;flex:1 1 auto;min-height:0}
.mf{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:9px;flex-wrap:wrap;flex:0 0 auto}
.modal.dk{background:linear-gradient(165deg,#0D1830,#15264C);border-color:#2A3B66;color:#fff}
.modal.dk .mh,.modal.dk .mf{border-color:#2A3B66}
.modal.dk .mh h3{color:#fff}
.modal.dk .field label{color:#D3DCF5}
.modal.dk .field input,.modal.dk .field textarea{background:rgba(255,255,255,.08);border-color:#33477A;color:#fff}
.modal.dk .field input::placeholder,.modal.dk .field textarea::placeholder{color:#8494BC}
.modal.dk .btn-s{background:rgba(255,255,255,.09);border-color:#33477A;color:#fff}
.modal.dk .hint{color:#93A3C8}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.fgrid .full{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:11.5px;font-weight:800;color:var(--muted)}
.req{color:var(--red)}
.field input,.field textarea{min-height:40px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface2);font-size:12.5px;width:100%}
.field textarea{min-height:78px;resize:vertical}
.field input:focus,.field textarea:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 3px rgba(255,107,26,.14)}
.field .hint{font-size:10px;color:var(--muted)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kvi{background:var(--surface2);border:1px solid var(--line);border-radius:11px;padding:9px 12px;min-width:0}
.kvi small{display:block;font-size:10px;color:var(--muted)}
.kvi b{font-size:12.5px;font-weight:800;word-break:break-word}
.kvi.full{grid-column:1/-1}
.sec-t{font-size:12px;font-weight:900;color:var(--brandDeep);margin:18px 0 10px;display:flex;align-items:center;gap:8px}
.sec-t::after{content:'';flex:1;height:1px;background:var(--line)}
#toasts{position:fixed;bottom:18px;left:18px;z-index:200;display:flex;flex-direction:column-reverse;gap:9px;max-width:min(390px,90vw)}
.toast{display:flex;align-items:center;gap:10px;background:var(--navy);color:#fff;padding:12px 16px;border-radius:13px;font-size:12.5px;box-shadow:var(--sh2);border-right:4px solid var(--blue)}
.toast.ok{border-right-color:var(--green)}
.toast.err{border-right-color:var(--red)}
.toast.warn{border-right-color:var(--amber)}
.toast button{background:rgba(255,255,255,.16);border:0;color:#fff;font-weight:900;font-size:11.5px;padding:5px 12px;border-radius:8px;cursor:pointer;margin-right:auto}
.loading{text-align:center;padding:44px;color:var(--muted)}
.spinner{display:inline-block;width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:1120px){
#app{grid-template-columns:1fr}
.sidebar{position:fixed;right:0;top:0;width:272px;transform:translateX(105%);transition:transform .28s;z-index:96;box-shadow:var(--sh2)}
.sidebar.open{transform:none}
.menu-btn{display:grid}
}
@media(max-width:760px){
#page{padding:16px 14px 70px}
.topbar{padding:10px 14px}
.fgrid,.kv{grid-template-columns:1fr}
.hero .dchip{display:none}
.drawer{width:100%}
.topbar .btn-p span{display:none}
}
</style>
</head>
<body>
<div id="zvFatal"></div>
<div id="loginView" class="login">
<div class="lbox">
<h1 class="zv-brand">Zingo<span>Vingo</span></h1>
<div class="sub">پنل کارمند شعبه</div>
<div id="loginError" class="errbox"></div>
<div class="field" style="margin-bottom:12px"><label>نام کاربری</label><input id="loginUser" autocomplete="username"></div>
<div class="field" style="margin-bottom:16px"><label>رمز عبور</label><input id="loginPass" type="password" autocomplete="current-password"></div>
<button class="btn btn-p" style="width:100%" id="loginBtn" data-act="login">ورود به پنل</button>
</div>
</div>
<div id="app">
<aside class="sidebar" id="sidebar">
<div class="brand">
<div class="mark"><svg class="ic" viewBox="0 0 24 24" style="width:22px;height:22px"><path d="M13 2 4.5 13.5H11L9.5 22 19 10h-6.5L13 2z" fill="currentColor" stroke="none"/></svg></div>
<div><h1 class="zv-brand">Zingo<span>Vingo</span></h1><small>پنل کارمند</small></div>
</div>
<nav class="nav" id="nav"></nav>
<div class="side-foot">
<div class="uchip">
<div class="av" id="sideAv"></div>
<div style="flex:1;min-width:0"><b id="sideName"></b><small id="sideRole"></small></div>
<button class="ibtn" data-act="logout" title="خروج"><svg class="ic" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg></button>
</div>
</div>
</aside>
<div class="main">
<header class="topbar">
<button class="ibtn menu-btn" data-act="menu"><svg class="ic" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
<div><h2 id="tbTitle">داشبورد</h2><div class="crumb" id="tbCrumb"></div></div>
<div class="sp"></div>
<button class="ibtn" data-act="theme" id="themeBtn"></button>
</header>
<main id="page"></main>
</div>
</div>
<div class="scrim" id="scrim" data-act="scrim"></div>
<aside class="drawer" id="drawer"></aside>
<div class="mback" id="mback"><div class="modal" id="modal"></div></div>
<div id="toasts"></div>

<script>
/* ================= 1) UTILITIES & ICONS ================= */
const $=s=>document.querySelector(s);
const $$=s=>Array.prototype.slice.call(document.querySelectorAll(s));
function esc(v){var m={'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'};return String(v==null?'':v).replace(/[&<>"']/g,function(c){return m[c];});}
function fa(v){return String(v==null?'':v).replace(/\d/g,function(d){return '۰۱۲۳۴۵۶۷۸۹'[Number(d)];});}
function en(v){return String(v==null?'':v).replace(/[۰-۹]/g,function(d){return String('۰۱۲۳۴۵۶۷۸۹'.indexOf(d));}).replace(/[٠-٩]/g,function(d){return String('٠١٢٣٤٥٦٧٨٩'.indexOf(d));});}
function num(v){var n=Number(en(v).replace(/[٬,\s]/g,''));return isFinite(n)?n:0;}
var NF=new Intl.NumberFormat('fa-IR');
function money(n){return NF.format(Math.round(num(n)))+' ریال';}
function fullName(r){if(!r)return '—';var n=[r.firstName,r.lastName].filter(Boolean).join(' ');return n||r.name||r.username||'—';}

const IC={

/* ================= 2) STATE & API ================= */
var TOKEN=localStorage.getItem('zv_emp_token')||'';
var USER=null;

function api(fn, ...args) {
    return new Promise((resolve, reject) => {
        google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fn](...args);
    });
}

function toast(msg,type,action){
var t=document.createElement('div');
t.className='toast '+(type||'');
t.innerHTML=icon(type==='ok'?'check':type==='err'?'x':'zap','width:16px;height:16px')+'<span>'+esc(msg)+'</span>'+(action?'<button type="button">'+esc(action.label)+'</button>':'');
if(action)t.querySelector('button').onclick=function(){action.fn();t.remove();};
$('#toasts').appendChild(t);
setTimeout(function(){t.remove();},action?8000:3800);
}

function openModal(html,wide,dark){
var m=$('#modal');
m.className='modal'+(wide?' w':'')+(dark?' dk':'');
m.innerHTML=html;
$('#mback').classList.add('show');
document.body.style.overflow='hidden';
}
function closeModal(){$('#mback').classList.remove('show');document.body.style.overflow='';}
function openDrawer(html){
$('#drawer').innerHTML=html;
$('#drawer').classList.add('show');
$('#scrim').classList.add('show');
document.body.style.overflow='hidden';
}
function closeDrawer(){$('#drawer').classList.remove('show');$('#scrim').classList.remove('show');document.body.style.overflow='';}
function closeOverlays(){closeDrawer();$('#sidebar').classList.remove('open');$('#scrim').classList.remove('show');}

function kv(p){return '<div class="kv">'+p.map(function(x){return '<div class="kvi'+(x[2]?' full':'')+'"><small>'+esc(x[0])+'</small><b>'+(x[1]==null?'—':x[1])+'</b></div>';}).join('')+'</div>';}
function pageHead(t,s,a){return '<div class="ph"><div><h1>'+esc(t)+'</h1><div class="sub">'+esc(s)+'</div></div><div style="display:flex;gap:8px;flex-wrap:wrap">'+(a||'')+'</div></div>';}
function btn(act,label,ic,cls,extra){return '<button class="btn '+(cls||'btn-s')+'" data-act="'+act+'"'+(extra||'')+'>'+(ic?icon(ic,'width:15px;height:15px'):'')+' '+esc(label)+'</button>';}
function ibtn(act,ic,title,extra){return '<button class="btn btn-s btn-i" title="'+esc(title)+'" data-act="'+act+'"'+(extra||'')+'>'+icon(ic,'width:14px;height:14px')+'</button>';}

function renderNav(){
$('#nav').innerHTML=MENU.map(function(m){
return '<div class="nav-item'+(PS.page===m.id?' on':'')+'" data-act="go" data-page="'+m.id+'">'+icon(m.ic,'width:17px;height:17px')+'<span>'+esc(m.l)+'</span></div>';
}).join('');

function toggleTheme(){
var t=document.documentElement.dataset.theme==='dark'?'light':'dark';
document.documentElement.dataset.theme=t;localStorage.setItem('zv_emp_theme',t);
$('#themeBtn').innerHTML=icon(t==='dark'?'sun':'moon');
}

var PS={page:'dashboard'};
function go(p){
PS.page=p;
$('#sidebar').classList.remove('open');$('#scrim').classList.remove('show');
render();
}

function render(){
var p=PS.page||'dashboard',t=TITLES[p]||TITLES.dashboard;
$('#tbTitle').textContent=t[0];
$('#tbCrumb').textContent='ZingoVingo · '+t[1];
$('#themeBtn').innerHTML=icon(document.documentElement.dataset.theme==='dark'?'sun':'moon');

if($('#sideName')) $('#sideName').textContent=USER?USER.name:'—';
if($('#sideRole')) $('#sideRole').textContent='کارمند';
if($('#sideAv') && USER) $('#sideAv').innerHTML=USER.avatar?'<img src="'+esc(USER.avatar)+'" alt="">':esc(String(USER.name||'؟').trim().charAt(0));

var out='';
if(p==='dashboard') out=loadDashboardUI();
else if(p==='orders') out=loadOrdersUI();
else if(p==='cards') out=loadCardsUI();
else if(p==='groups') out=loadGroupsUI();
else if(p==='workers') out=loadWorkersUI();
else if(p==='applicants') out=loadApplicantsUI();
else if(p==='support') out=loadSupportUI();
else if(p==='reports') out=loadReportsUI();
else if(p==='profile') out=loadProfileUI();

Promise.resolve(out).then(function(h){
$('#page').innerHTML=h;
renderNav();
if(p==='applicants') initApplicantFilters();
}).catch(function(e){
$('#page').innerHTML='<div class="card"><div class="empty"><div class="ei">'+icon('x')+'</div><h4>خطا در بارگذاری</h4><p class="sub">'+esc(e.message)+'</p></div></div>';
});
}

function initApplicantFilters(){
    // Populate branches (mock or fetched if available, here we use a generic list or fetch)
    // For safety, we'll just leave "همه شعب" or fetch if API exists. 
    // Assuming we filter client-side or backend handles it.
    fetchApplicants();
}

function fetchApplicants(){
const filters = {
    branch: $('jaFilterBranch')?.value || '',
    status: $('jaFilterStatus')?.value || '',
    specialty: $('jaFilterSpecialty')?.value || ''
};
$('#applicantsContent').innerHTML = '<div class="loading"><div class="spinner"></div></div>';
api('searchEmployeeJobApplicants', filters, TOKEN).then(rows => {
    // Client-side branch filter fallback if backend doesn't support it
    if(filters.branch) {
        rows = rows.filter(r => r.branchId === filters.branch || r.branch === filters.branch);
    }
    
    if(!rows.length) { $('#applicantsContent').innerHTML = '<div class="card"><div class="empty"><h4>پرونده‌ای یافت نشد</h4></div></div>'; return; }
    let h = '<div class="tw"><table class="tb"><thead><tr><th>شماره پرونده</th><th>نام متقاضی</th><th>تخصص</th><th>موقعیت</th><th>سن</th><th>تاریخ ثبت</th><th>وضعیت</th><th>عملیات</th></tr></thead><tbody>';
    rows.forEach((r, i) => {
        let statusClass = r.status==='تأیید شده'||r.status==='استخدام شده'?'green':r.status==='رد شده'||r.status==='بایگانی'?'red':'amber';
        h += '<tr><td><b>'+esc(r.caseNumber)+'</b></td><td>'+esc(r.fullName)+'</td><td>'+esc(r.specialty)+'</td><td>'+esc(r.requestedPosition)+'</td><td>'+esc(r.age)+'</td><td>'+esc(r.createdAt)+'</td><td><span class="pill p-'+statusClass+'">'+esc(r.status)+'</span></td>';
        h += '<td><div class="ra">'+ibtn('edit-applicant', 'edit', 'ویرایش کامل', 'data=\''+JSON.stringify(r).replace(/'/g,"&#39;")+'\'') + '</div></td></tr>';
    });
    h += '</tbody></table></div>';
    $('#applicantsContent').innerHTML = h;
}).catch(e => { $('#applicantsContent').innerHTML = '<div class="card"><div class="empty"><h4 style="color:var(--red)">'+esc(e.message)+'</h4></div></div>'; });
}

        h += '<span class="pill p-'+statusClass+'">'+statusText+'</span></div>';
        h += '<div style="background:var(--surface2);padding:12px;border-radius:8px;margin-bottom:10px;font-size:13px;white-space:pre-wrap">'+esc(r.message)+'</div>';

        h += '<div style="margin-top:10px;display:flex;gap:8px">'+btn('reply-support', r.reply?'ویرایش پاسخ':'پاسخ', 'msg', 'btn-p', 'data-id="'+esc(r.conversationId)+'" data-subject="'+esc(r.subject)+'"')+'</div></div>';
    });
    $('#supportContent').innerHTML = h;
}).catch(e => { $('#supportContent').innerHTML = '<div class="card"><div class="empty"><h4 style="color:var(--red)">'+esc(e.message)+'</h4></div></div>'; });
}

$('#reportsContent').innerHTML = '<div class="loading"><div class="spinner"></div></div>';
api('getEmployeeReports', TOKEN, $('repFrom')?.value||'', $('repTo')?.value||'').then(rep => {
    let h = '<div class="grid kpis" style="margin-bottom:18px">';
    h += '<div class="kpi"><div class="l">کل کارت‌ها</div><div class="v">'+fa(rep.totalCards)+'</div></div>';
    h += '<div class="kpi"><div class="l">تکمیل شده</div><div class="v">'+fa(rep.completedCards)+'</div></div>';
    h += '<div class="kpi"><div class="l">درآمد</div><div class="v">'+money(rep.totalRevenue)+'</div></div>';
    h += '</div>';
    h += '<div class="card"><h3 style="margin-bottom:12px">توزیع وضعیت</h3>';
    Object.entries(rep.byStatus).forEach(kv => {
        h += '<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)"><span>'+esc(kv[0])+'</span><strong>'+fa(kv[1])+'</strong></div>';
    });
    h += '</div>';
    $('#reportsContent').innerHTML = h;
}).catch(e => { $('#reportsContent').innerHTML = '<div class="card"><div class="empty"><h4 style="color:var(--red)">'+esc(e.message)+'</h4></div></div>'; });
}

function loadProfileUI(){
return api('getEmployeeProfile', TOKEN).then(p => {
    let h = '<div class="ph"><div><h1>پروفایل من</h1></div></div>';
    h += '<div class="card"><div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">';
    h += '<div style="width:100px;height:100px;border-radius:50%;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;font-size:38px;font-weight:900;overflow:hidden">';
    h += p.avatar ? '<img src="'+esc(p.avatar)+'" style="width:100%;height:100%;object-fit:cover">' : esc((p.name||'?').charAt(0));
    h += '</div><div><b style="font-size:18px">'+esc(p.name)+'</b><div style="color:var(--muted);font-size:11px;margin-top:6px">کارمند · '+esc(p.empId)+'</div></div></div></div>';
    h += '<div class="card"><h3 style="margin-bottom:12px">تغییر رمز عبور</h3>';
    h += '<div class="field" style="max-width:300px"><label>رمز عبور جدید</label><input id="newPass" type="password" placeholder="رمز جدید"></div>';
    h += btn('update-profile', 'بروزرسانی رمز', 'check', 'btn-p', 'style="margin-top:10px"');
    h += '</div>';
    return h;
});
}

/* ================= 5) ACTIONS & MODALS ================= */
document.addEventListener('click', function(e){
    const t = e.target.closest('[data-act]');
    if(!t) return;
    const act = t.dataset.act;
    
    if(act === 'logout') {
        if(TOKEN) api('employeeLogout', TOKEN);
        localStorage.removeItem('zv_emp_token'); localStorage.removeItem('zv_emp_user');
        location.reload();
    }
    else if(act === 'theme') {
        toggleTheme();
    }
    else if(act === 'menu') {
        $('#sidebar').classList.toggle('open');
        $('#scrim').classList.toggle('show', $('#sidebar').classList.contains('open'));
    }
    else if(act === 'scrim') {
        closeOverlays();
    }
    else if(act === 'go') {
        go(t.dataset.page);
    }
    else if(act === 'fetch-orders') {
        fetchOrders();
    }
    else if(act === 'change-status') {
        const statuses = ['جدید', 'ثبت اولیه', 'در حال بررسی', 'در حال انجام', 'تکمیل شده', 'لغو شده'];
        let opts = statuses.map(s => '<option '+(s===t.dataset.status?'selected':'')+'>'+s+'</option>').join('');
        openModal('<div class="mh"><h3>تغییر وضعیت سفارش</h3><button class="ibtn" data-act="mclose">'+icon('x')+'</button></div>'+
        '<div class="mb"><div class="field"><label>وضعیت جدید</label><select id="newOrderStatus">'+opts+'</select></div></div>'+
        '<div class="mf"><button class="btn btn-s" data-act="mclose">انصراف</button><button class="btn btn-p" data-act="apply-order-status" data-id="'+t.dataset.id+'">اعمال</button></div>', true, true);
    }
    else if(act === 'apply-order-status') {
        api('updateEmployeeOrderStatus', t.dataset.id, $('#newOrderStatus').value, TOKEN).then(() => {
            closeModal(); toast('وضعیت تغییر یافت', 'ok'); fetchOrders();
        }).catch(e => toast(e.message, 'err'));
    }
    else if(act === 'convert-card') {
        api('getGroupsForDropdownEmp', TOKEN).then(groups => {
            let opts = '<option value="">-- انتخاب گروه --</option>' + groups.map(g => '<option value="'+g.groupId+'">'+esc(g.name)+' ('+esc(g.groupId)+')</option>').join('');
            openModal('<div class="mh"><h3>تبدیل به کارت</h3><button class="ibtn" data-act="mclose">'+icon('x')+'</button></div>'+
            '<div class="mb"><div class="fgrid"><div class="field"><label>تخصیص به گروه *</label><select id="targetGroup" data-act="load-group-workers">'+opts+'</select></div>'+
            '<div class="field"><label>تخصیص به نیرو</label><select id="targetWorker" disabled><option value="">ابتدا گروه را انتخاب کنید</option></select></div></div></div>'+
            '<div class="mf"><button class="btn btn-s" data-act="mclose">انصراف</button><button class="btn btn-p" data-act="execute-convert" data-id="'+t.dataset.id+'">تأیید</button></div>', true, true);
        }).catch(e => toast(e.message, 'err'));
    }
    else if(act === 'load-group-workers') {
        const groupId = $('#targetGroup').value;
        if(!groupId) { $('#targetWorker').disabled=true; $('#targetWorker').innerHTML='<option value="">ابتدا گروه را انتخاب کنید</option>'; return; }
        api('getWorkersByGroupEmp', groupId, TOKEN).then(workers => {
            let opts = '<option value="">بدون تخصیص (استخر گروه)</option>' + workers.map(w => '<option value="'+w.id+'">'+esc(w.name)+' ('+esc(w.operations)+')</option>').join('');
            $('#targetWorker').innerHTML = opts;
            $('#targetWorker').disabled = false;
        }).catch(e => toast(e.message, 'err'));
    }
    else if(act === 'execute-convert') {
        const groupId = $('#targetGroup').value;
        const workerId = $('#targetWorker').value;
        if(!groupId) { toast('لطفاً یک گروه انتخاب کنید', 'err'); return; }
        api('employeeConvertOrderToCard', t.dataset.id, groupId, workerId, TOKEN).then(() => {
            closeModal(); toast('کارت با موفقیت ایجاد شد', 'ok'); fetchOrders();
        }).catch(e => toast(e.message, 'err'));
    }
    else if(act === 'fetch-groups') {
        fetchGroups();
    }
    else if(act === 'new-group') {
        openModal('<div class="mh"><h3>گروه جدید</h3><button class="ibtn" data-act="mclose">'+icon('x')+'</button></div>'+
        '<div class="mb"><div class="fgrid"><div class="field"><label>نام گروه *</label><input id="gName"></div>'+
        '<div class="field"><label>سرپرست</label><input id="gSup"></div>'+
        '<div class="field"><label>منطقه</label><input id="gArea"></div>'+
        '<div class="field"><label>وضعیت</label><select id="gStatus"><option>فعال</option><option>غیرفعال</option></select></div></div></div>'+
        '<div class="mf"><button class="btn btn-s" data-act="mclose">انصراف</button><button class="btn btn-p" data-act="save-group">ذخیره</button></div>', true, true);
    }
    else if(act === 'save-group') {
        const data = { name: $('#gName').value, supervisorName: $('#gSup').value, area: $('#gArea').value, status: $('#gStatus').value };
        api('saveEmployeeGroup', data, TOKEN).then(() => {
            closeModal(); toast('ذخیره شد', 'ok'); fetchGroups();
        }).catch(e => toast(e.message, 'err'));
    }
    else if(act === 'delete-group') {
        if(!confirm('حذف شود؟')) return;
        api('deleteEmployeeGroup', t.dataset.row, TOKEN).then(() => {
            toast('حذف شد', 'ok'); fetchGroups();
        }).catch(e => toast(e.message, 'err'));
    }
    else if(act === 'edit-group') {
        const g = JSON.parse(t.dataset.data.replace(/&#39;/g, "'"));
        openModal('<div class="mh"><h3>ویرایش گروه</h3><button class="ibtn" data-act="mclose">'+icon('x')+'</button></div>'+
        '<div class="mb"><div class="fgrid"><div class="field"><label>نام گروه *</label><input id="gName" value="'+esc(g.name)+'"></div>'+
        '<div class="field"><label>سرپرست</label><input id="gSup" value="'+esc(g.supervisorName)+'"></div>'+
        '<div class="field"><label>منطقه</label><input id="gArea" value="'+esc(g.area)+'"></div>'+
        '<div class="field"><label>وضعیت</label><select id="gStatus"><option '+(g.status==='فعال'?'selected':'')+'>فعال</option><option '+(g.status==='غیرفعال'?'selected':'')+'>غیرفعال</option></select></div></div></div>'+
        '<div class="mf"><button class="btn btn-s" data-act="mclose">انصراف</button><button class="btn btn-p" data-act="save-group-edit" data-row="'+g.rowIndex+'">ذخیره</button></div>', true, true);
    }
    else if(act === 'save-group-edit') {
        const data = { rowIndex: t.dataset.row, name: $('#gName').value, supervisorName: $('#gSup').value, area: $('#gArea').value, status: $('#gStatus').value };
        api('saveEmployeeGroup', data, TOKEN).then(() => {
            closeModal(); toast('ذخیره شد', 'ok'); fetchGroups();
        }).catch(e => toast(e.message, 'err'));
    }
    else if(act === 'fetch-workers') {
        fetchWorkers();
    }
    else if(act === 'new-worker') {
        openModal('<div class="mh"><h3>نیروی جدید</h3><button class="ibtn" data-act="mclose">'+icon('x')+'</button></div>'+
        '<div class="mb"><div class="fgrid"><div class="field"><label>نام *</label><input id="wFirst"></div>'+
        '<div class="field"><label>نام خانوادگی *</label><input id="wLast"></div>'+
        '<div class="field"><label>یوزرنیم *</label><input id="wUser"></div>'+
        '<div class="field"><label>رمز عبور *</label><input id="wPass" type="password"></div>'+
        '<div class="field"><label>نوع</label><select id="wOps"><option value="worker">worker</option><option value="Supervisor">Supervisor</option><option value="operator">operator</option></select></div>'+
        '<div class="field"><label>سمت</label><input id="wJob"></div>'+
        '<div class="field"><label>موبایل</label><input id="wContact"></div>'+
        '<div class="field"><label>وضعیت</label><select id="wStatus"><option>فعال</option><option>غیرفعال</option></select></div></div></div>'+
        '<div class="mf"><button class="btn btn-s" data-act="mclose">انصراف</button><button class="btn btn-p" data-act="save-worker">ذخیره</button></div>', true, true);
    }
    else if(act === 'save-worker') {
        const data = { firstName: $('#wFirst').value, lastName: $('#wLast').value, username: $('#wUser').value, password: $('#wPass').value, operations: $('#wOps').value, jobTitle: $('#wJob').value, contact: $('#wContact').value, status: $('#wStatus').value };
        api('saveEmployeeWorker', data, TOKEN).then(() => {
            closeModal(); toast('ذخیره شد', 'ok'); fetchWorkers();
        }).catch(e => toast(e.message, 'err'));
    }
    else if(act === 'delete-worker') {
        if(!confirm('حذف شود؟')) return;
        api('deleteEmployeeWorker', t.dataset.row, TOKEN).then(() => {
            toast('حذف شد', 'ok'); fetchWorkers();
        }).catch(e => toast(e.message, 'err'));
    }
    else if(act === 'edit-worker') {
        const w = JSON.parse(t.dataset.data.replace(/&#39;/g, "'"));
        openModal('<div class="mh"><h3>ویرایش نیرو</h3><button class="ibtn" data-act="mclose">'+icon('x')+'</button></div>'+
        '<div class="mb"><div class="fgrid"><div class="field"><label>نام *</label><input id="wFirst" value="'+esc(w.firstName)+'"></div>'+
        '<div class="field"><label>نام خانوادگی *</label><input id="wLast" value="'+esc(w.lastName)+'"></div>'+
        '<div class="field"><label>یوزرنیم</label><input id="wUser" value="'+esc(w.username)+'" readonly></div>'+
        '<div class="field"><label>رمز عبور (خالی=بدون تغییر)</label><input id="wPass" type="password"></div>'+
        '<div class="field"><label>نوع</label><select id="wOps"><option value="worker" '+(w.operations==='worker'?'selected':'')+'>worker</option><option value="Supervisor" '+(w.operations==='Supervisor'?'selected':'')+'>Supervisor</option><option value="operator" '+(w.operations==='operator'?'selected':'')+'>operator</option></select></div>'+
        '<div class="field"><label>سمت</label><input id="wJob" value="'+esc(w.jobTitle)+'"></div>'+
        '<div class="field"><label>موبایل</label><input id="wContact" value="'+esc(w.contact)+'"></div>'+
        '<div class="field"><label>وضعیت</label><select id="wStatus"><option '+(w.status==='فعال'?'selected':'')+'>فعال</option><option '+(w.status==='غیرفعال'?'selected':'')+'>غیرفعال</option></select></div></div></div>'+
        '<div class="mf"><button class="btn btn-s" data-act="mclose">انصراف</button><button class="btn btn-p" data-act="save-worker-edit" data-row="'+w.rowIndex+'">ذخیره</button></div>', true, true);
    }
    else if(act === 'save-worker-edit') {
        const data = { rowIndex: t.dataset.row, firstName: $('#wFirst').value, lastName: $('#wLast').value, username: $('#wUser').value, password: $('#wPass').value, operations: $('#wOps').value, jobTitle: $('#wJob').value, contact: $('#wContact').value, status: $('#wStatus').value };
        api('saveEmployeeWorker', data, TOKEN).then(() => {
            closeModal(); toast('ذخیره شد', 'ok'); fetchWorkers();
        }).catch(e => toast(e.message, 'err'));
    }
    else if(act === 'fetch-applicants') {
        fetchApplicants();
    }
    else if(act === 'new-applicant') {
        toast('لطفاً از فرم عمومی ثبت درخواست همکاری استفاده کنید', 'warn');
    }
    else if(act === 'edit-applicant') {
        const r = JSON.parse(t.dataset.data.replace(/&#39;/g, "'"));
        openModal('<div class="mh"><h3>ویرایش پرونده '+esc(r.caseNumber)+'</h3><button class="ibtn" data-act="mclose">'+icon('x')+'</button></div>'+
        '<div class="mb"><div class="fgrid">'+
        '<div class="field"><label>نام *</label><input id="ja-first" value="'+esc(r.firstName)+'"></div>'+
        '<div class="field"><label>نام خانوادگی *</label><input id="ja-last" value="'+esc(r.lastName)+'"></div>'+
        '<div class="field"><label>تخصص *</label><input id="ja-spec" value="'+esc(r.specialty)+'"></div>'+
        '<div class="field"><label>موقعیت</label><input id="ja-pos" value="'+esc(r.requestedPosition)+'"></div>'+
        '<div class="field"><label>تاریخ مصاحبه تلفنی</label><input id="ja-phone-date" value="'+esc(r.phoneInterviewDate)+'"></div>'+
        '<div class="field"><label>نتیجه مصاحبه تلفنی</label><select id="ja-phone-res"><option '+(r.phoneInterviewResult==='انجام نشده'?'selected':'')+'>انجام نشده</option><option '+(r.phoneInterviewResult==='تأیید'?'selected':'')+'>تأیید</option><option '+(r.phoneInterviewResult==='رد'?'selected':'')+'>رد</option></select></div>'+
        '<div class="field"><label>وضعیت پرونده</label><select id="ja-status"><option '+(r.status==='جدید'?'selected':'')+'>جدید</option><option '+(r.status==='در حال بررسی'?'selected':'')+'>در حال بررسی</option><option '+(r.status==='تأیید شده'?'selected':'')+'>تأیید شده</option><option '+(r.status==='رد شده'?'selected':'')+'>رد شده</option><option '+(r.status==='استخدام شده'?'selected':'')+'>استخدام شده</option></select></div>'+
        '<div class="field full"><label>توضیحات</label><textarea id="ja-notes">'+esc(r.notes)+'</textarea></div>'+
        '</div></div>'+
        '<div class="mf"><button class="btn btn-s" data-act="mclose">انصراف</button><button class="btn btn-p" data-act="save-applicant" data-case="'+esc(r.caseNumber)+'">ذخیره</button></div>', true, true);
    }
    else if(act === 'save-applicant') {
        const changes = {
            firstName: $('#ja-first').value, lastName: $('#ja-last').value, specialty: $('#ja-spec').value,
            requestedPosition: $('#ja-pos').value, phoneInterviewDate: $('#ja-phone-date').value,
            phoneInterviewResult: $('#ja-phone-res').value, status: $('#ja-status').value, notes: $('#ja-notes').value
        };
        api('updateEmployeeJobApplicantFull', t.dataset.case, changes, TOKEN).then(() => {
            closeModal(); toast('ذخیره شد', 'ok'); fetchApplicants();
        }).catch(e => toast(e.message, 'err'));
    }
    else if(act === 'fetch-support') {
        fetchSupport();
    }
    else if(act === 'reply-support') {
        openModal('<div class="mh"><h3>پاسخ به: '+esc(t.dataset.subject)+'</h3><button class="ibtn" data-act="mclose">'+icon('x')+'</button></div>'+
        '<div class="mb"><div class="field"><label>متن پاسخ</label><textarea id="replyText" style="min-height:120px"></textarea></div></div>'+
        '<div class="mf"><button class="btn btn-s" data-act="mclose">انصراف</button><button class="btn btn-p" data-act="send-reply" data-id="'+t.dataset.id+'">ارسال</button></div>', true, true);
    }
    else if(act === 'send-reply') {
        const text = $('#replyText').value;
        if(!text) { toast('متن پاسخ را وارد کنید', 'err'); return; }
        api('replyToCustomerConversation', t.dataset.id, text, TOKEN).then(() => {
            closeModal(); toast('پاسخ ثبت شد', 'ok'); fetchSupport();
        }).catch(e => toast(e.message, 'err'));
    }
    else if(act === 'fetch-reports') {
        fetchReports();
    }
    else if(act === 'update-profile') {
        const pass = $('#newPass').value;
        if(!pass) { toast('رمز عبور را وارد کنید', 'err'); return; }
        api('updateEmployeeProfile', {password: pass}, TOKEN).then(() => {
            toast('رمز عبور بروزرسانی شد', 'ok'); $('#newPass').value=''; render();
        }).catch(e => toast(e.message, 'err'));
    }
});

/* ================= 6) INIT ================= */
(function init(){
    var th=localStorage.getItem('zv_emp_theme');
    if(th) document.documentElement.dataset.theme=th;
    $('#themeBtn').innerHTML=icon(document.documentElement.dataset.theme==='dark'?'sun':'moon');
    
    const saved = localStorage.getItem('zv_emp_user');
    if(TOKEN && saved) { 
        USER = JSON.parse(saved); 
        $('#loginView').style.display='none';
        $('#app').style.display='grid';
        render();
    }
})();
</script>
