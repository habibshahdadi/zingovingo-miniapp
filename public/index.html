<script>
'use strict';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const NF=new Intl.NumberFormat('fa-IR');const money=n=>NF.format(Math.round(num(n)))+' ریال';const moneyC=n=>{n=num(n);if(Math.abs(n)>=1e9)return fa((n/1e9).toFixed(1))+' میلیارد';if(Math.abs(n)>=1e6)return fa((n/1e6).toFixed(1))+' میلیون';return NF.format(n)};

const jDisp=v=>{if(!v)return'—';const d=new Date(v);if(isNaN(d))return esc(v);return new Intl.DateTimeFormat('fa-IR-u-ca-persian',{year:'numeric',month:'2-digit',day:'2-digit'}).format(d)};

function j2g(jy,jm,jd){jy+=1595;let days=-355668+365*jy+Math.floor(jy/33)*8+Math.floor(((jy%33)+3)/4)+jd+(jm<7?(jm-1)*31:(jm-7)*30+186);let gy=400*Math.floor(days/146097);days%=146097;if(days>36524){gy+=100*Math.floor(--days/36524);days%=36524;if(days>=365)days++}gy+=4*Math.floor(days/1461);days%=1461;if(days>365){gy+=Math.floor((days-1)/365);days=(days-1)%365}let gd=days+1;const leap=gy%4===0&&(gy%100!==0||gy%400===0),ms=[0,31,leap?29:28,31,30,31,30,31,31,30,31,30,31];let gm=1;while(gm<=12&&gd>ms[gm]){gd-=ms[gm];gm++}return[gy,gm,gd]}

>ساعت</label><input type="time" name="execTime" value="'+esc(d.execTime||'10:00')+'"></div><div class="fld full"><label>آدرس *</label><textarea name="address">'+esc(d.address||'')+'</textarea></div><div class="fld full"><label>توضیحات</label><textarea name="notes">'+esc(d.notes||'')+'</textarea></div><div class="fld full"><label>کد تخفیف</label><input name="offerCode" value="'+esc(d.offerCode||'')+'" data-q placeholder="ZV.140507"></div></div></div><div class="pp" id="wP"><h4>پیش‌فاکتور زنده</h4><div class="ppn">محاسبه سمت سرور انجام می‌شود.</div></div></div></div><div class="mf"><button class="btn btn-p" type="submit">ثبت نهایی</button><button type="button" class="btn btn-s" data-act="close">انصراف</button></div></form>',true);window._wEdit=r;rebuildWizard();quoteDeb()}

function dashboard(){const os=S.data.orders||[],cs=S.data.cards||[],cus=S.data.customers||[],nowK=gKey(new Date());const rev=os.filter(o=>o.status!=='لغو شده').reduce((s,o)=>s+num(o.finalPrice),0),pending=os.filter(o=>/جدید|ثبت اولیه/.test(o.status)).length,active=cs.filter(c=>!/تکمیل|لغو/.test(c.status)).length;const k=[['کل سفارش‌ها',fa(os.length),'▤','var(--blue)'],['درآمد کل',moneyC(rev)+' ریال','◷','var(--brand)'],['در انتظار',fa(pending),'◔','var(--amber)'],['کارت فعال',fa(active),'▦','var(--violet)'],['مشتریان',fa(cus.length),'◉','var(--green)'],['تکمیل شده',fa(os.filter(o=>/تکمیل/.test(o.status)).length),'✓','var(--teal)']];let h='<div class="hero rv"><h2>سلام '+esc(S.user.name)+' 👋</h2><p>نقش: '+esc(S.user.role)+' · داده‌ها از بک‌اند دریافت شده‌اند.</p><div class="acts">'+(writable('orders')?'<button class="btn btn-p" data-act="new" data-e="orders">＋ سفارش جدید</button>':'')+'<button class="btn btn-s" data-act="go" data-page="reports">گزارش‌ها</button><button class="btn btn-s" data-act="go" data-page="cards">کارت‌ها</button></div></div><div class="grid kpis" style="margin-bottom:15px">'+k.map(x=>'<div class="kpi rv"><div class="l">'+x[0]+'</div><div class="v" style="color:'+x[3]+'">'+x[1]+'</div><div class="s">به‌روزرسانی زنده از سرور</div></div>').join('')+'</div>';const byStatus={};os.forEach(o=>byStatus[o.status]=(byStatus[o.status]||0)+1);h+='<div class="grid charts"><div class="cbox rv"><h3>توزیع وضعیت سفارش‌ها</h3>'+donut(Object.entries(byStatus).map(([l,v])=>({l,v})))+'</div><div class="cbox rv"><h3>آخرین سفارش‌ها</h3>'+os.slice(0,6).map(o=>'<div class="rank"><div class="info"><b>'+esc(o.customerName)+' — '+esc(o.service)+'</b><small>'+esc(o.requestId)+' · '+jDisp(o.createdAt)+'</small></div><span class="v">'+moneyC(o.finalPrice)+'</span>'+pill(o.status)+'</div>').join('')+'</div></div>';return h}

function donut(items){const total=items.reduce((s,i)=>s+i.v,0)||1,C=2*Math.PI*52;let off=0;const segs=items.map((it,i)=>{const len=it.v/total*C,s='<circle cx="75" cy="75" r="52" fill="none" stroke="'+PAL[i%8]+'" stroke-width="21" stroke-dasharray="'+len+' '+(C-len)+'" stroke-dashoffset="'+(-off)+'" transform="rotate(-90 75 75)"><title>'+esc(it.l)+': '+fa(it.v)+'</title></circle>';off+=len;return s}).join('');return '<div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap"><svg viewBox="0 0 150 150" style="width:150px"><circle cx="75" cy="75" r="52" fill="none" stroke="var(--line)" stroke-width="21"/>'+segs+'<text x="75" y="80" text-anchor="middle" font-size="20" font-weight="900" fill="var(--ink)">'+fa(total)+'</text></svg><div style="flex:1">'+items.map((it,i)=>'<div style="display:flex;justify-content:space-between;font-size:11px;margin:4px 0"><span><i style="display:inline-block;width:9px;height:9px;border-radius:3px;background:'+PAL[i%8]+';margin-left:6px"></i>'+esc(it.l)+'</span><b>'+fa(it.v)+'</b></div>').join('')+'</div></div>'}

function csvParse(t){const rows=[];let row=[],cur='',q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c==='"'){if(t[i+1]==='"'){cur+='"';i++}else q=false}else cur+=c}else{if(c==='"')q=true;else if(c===','){row.push(cur);cur=''}else if(c==='\n'){row.push(cur);rows.push(row);row=[];cur=''}else if(c!=='\r')cur+=c}}if(cur||row.length){row.push(cur);rows.push(row)}return rows.filter(r=>r.some(x=>String(x).trim()))}

document.addEventListener('change',async e=>{const t=e.target;if(t.matches('[data-search]')){S.q=t.value;S.pn=1;await render()}if(t.matches('[data-filter]')){let v=t.value;if(['from','to'].includes(t.dataset.filter))v=jStore(v)||v;S.filters[t.dataset.filter]=v;S.pn=1;await render()}if(t.matches('[data-sel]')){t.checked?S.sel.add(t.dataset.sel):S.sel.delete(t.dataset.sel);await render()}if(t.matches('[data-selall]')){const rows=rowsFor(S.page).slice((S.pn-1)*12,S.pn*12);rows.forEach(r=>t.checked?S.sel.add(r.id):S.sel.delete(r.id));await render()}if(t.id==='file'){const f=t.files[0];t.value='';if(f)await handleFile(f)}if(t.matches('[data-q]')){if(t.name==='serviceId')rebuildWizard();quoteDeb()}});
document.addEventListener('input',e=>{if(e.target.matches('[data-q]'))quoteDeb()});
document.addEventListener('submit',async e=>{e.preventDefault();const f=e.target,k=f.dataset.form;try{if(k==='login'){const r=await api('POST','/api/login',{username:f.username.value,password:f.password.value});S.token=r.token;localStorage.setItem('zv_token',r.token);await boot()}else if(k==='entity')await submitEntity(f);else if(k==='order')await submitOrder(f);else if(k==='reply'){await api('POST','/api/threads/'+f.dataset.id+'/reply',{body:f.body.value});await boot()}else if(k==='support'){await api('POST','/api/support',{subject:f.subject.value,message:f.message.value});closeModal();await boot();toast('ارسال شد.')}else if(k==='supportreply'){await api('PATCH','/api/support/'+f.dataset.id,{reply:f.reply.value,status:'answered',repliedBy:S.user.name});closeModal();await boot();toast('پاسخ ثبت شد.')}else if(k==='settings'){await api('PATCH','/api/settings',{settings:{brand:f.brand.value,currency:f.currency.value}});await boot();toast('ذخیره شد.')}else if(k==='rules'){const rules={};[...f.elements].filter(x=>x.name).forEach(x=>rules[x.name]=num(x.value));await api('PATCH','/api/settings',{rules});await boot();toast('نرخ‌ها ذخیره شد.')}else if(k==='profile'){const o={};[...f.elements].filter(x=>x.name&&x.value).forEach(x=>o[x.name]=x.value);await api('PATCH','/api/profile',o);await boot();toast('پروفایل ذخیره شد.')}}catch(err){toast(err.message,'err')}});
let drag=null;document.addEventListener('dragstart',e=>{const c=e.target.closest('.kcard');if(c){drag=c.dataset.card;e.dataTransfer.setData('text',drag)}});document.addEventListener('dragover',e=>{const c=e.target.closest('.kcol');if(c){e.preventDefault();c.classList.add('over')}});document.addEventListener('dragleave',e=>{const c=e.target.closest('.kcol');if(c)c.classList.remove('over')});document.addEventListener('drop',async e=>{const c=e.target.closest('.kcol');if(!c||!drag)return;e.preventDefault();c.classList.remove('over');try{await api('POST','/api/cards/'+drag+'/status',{status:c.dataset.col});await boot();toast('وضعیت کارت تغییر کرد.')}catch(err){toast(err.message,'err')}drag=null});
$('#scrim').onclick=closeDrawer;$('#mback').onclick=e=>{if(e.target.id==='mback')closeModal()};document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();closeDrawer()}});
(async function(){const th=localStorage.getItem('zv_theme');if(th)document.documentElement.dataset.theme=th;if(S.token){try{await boot()}catch(e){S.token='';localStorage.removeItem('zv_token');render()}}else render()})();
</script>
</body>
</html>
