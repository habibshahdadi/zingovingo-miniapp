<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#070D1F">
<title>پنل متخصص | ZingoVingo</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23FF6B1A'/%3E%3Cpath d='M13 2 4.5 13.5H11L9.5 22 19 10h-6.5L13 2z' fill='%230B1736'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&family=Nunito:wght@800;900&display=swap" rel="stylesheet">
<style>
:root{
--navy:#0B1736;--navy2:#13234D;--navy3:#1B2F63;
--brand:#FF6B1A;--brand2:#FF8A3D;--brandDeep:#E4570B;--brandSoft:#FFB25E;
--teal:#0FA3A3;--tealL:#2BD9C8;--blue:#2E63E7;--blueL:#5B9BFF;--violet:#7C4DFF;--violetL:#A78BFA;
--pink:#E0447C;--amber:#D97706;--amberL:#FFC24D;--green:#0E9F6E;--greenL:#46D07C;--red:#E02D3C;--redL:#FF6257;
--cyan:#22C9E0;--acid:#9BE24A;
--bg:#070D1F;--bg2:#0A1428;--surf:#0E1830;--surf2:#132241;--surf3:#0B1730;--surf4:#182B52;
--line:#1D2B4F;--line2:#2C3F६B;--line2:#2C3F6B;--ink:#E9EEFC;--ink2:#C6D2EE;--mut:#93A0C2;--mut2:#6E7DA3;
--scrim:rgba(3,7,20,.72);--sh:0 10px 30px rgba(0,0,0,.42);--sh2:0 22px 60px rgba(0,0,0,.58);
--grad:linear-gradient(135deg,#FF6B1A,#FF8A3D 55%,#FFB25E);
--gradData:linear-gradient(135deg,#2BD9C8,#2E63E7);
--hero:linear-gradient(125deg,#0B1736,#16295B 40%,#3B2E7E 76%,#7C4DFF 128%);
--glass:rgba(148,163,184,.13);--glassBrd:rgba(148,163,184,.26);
--r:16px;--tr:180ms cubic-bezier(.3,.9,.3,1);--sbw:274px;
}
[data-theme=light]{
--bg:#EEF1F8;--bg2:#E5EAF5;--surf:#fff;--surf2:#F5F7FC;--surf3:#F0F3FA;--surf4:#E8EDF8;
--line:#E2E7F3;--line2:#CBD5E9;--ink:#101A33;--ink2:#2C3A5C;--mut:#5C6784;--mut2:#8592B0;
--scrim:rgba(11,23,54,.5);--sh:0 8px 24px rgba(11,23,54,.09);--sh2:0 20px 50px rgba(11,23,54,.18);
--glass:rgba(100,116,139,.1);--glassBrd:rgba(100,116,139,.24);
--brandDeep:#C2470A;--tealL:#0FA3A3;--blueL:#2E63E7;--violetL:#7C4DFF;--amberL:#D97706;--greenL:#0E9F6E;--redL:#E02D3C;
}
*{margin:0;padding:0;box-sizing:border-box}
*{scrollbar-width:thin;scrollbar-color:var(--brandDeep) var(--surf3)}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track{background:var(--surf3);border-radius:9px}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--brand2),var(--brandDeep));border-radius:9px;border:2.5px solid var(--surf3)}
::-webkit-scrollbar-thumb:hover{background:linear-gradient(180deg,var(--brandSoft),var(--brand))}
::-webkit-scrollbar-corner{background:var(--surf3)}
::selection{background:rgba(255,107,26,.32);color:var(--ink)}
html{font-size:15px;scroll-behavior:smooth}
body{font-family:'Vazirmatn',Tahoma,sans-serif;background:var(--bg);color:var(--ink);line-height:1.78;min-height:100vh;overflow-x:hidden}
body.lock{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:none;cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2.5px solid var(--brand);outline-offset:2px;border-radius:8px}
b,strong{font-weight:800}
.ltr{direction:ltr;unicode-bidi:embed}
.num{font-variant-numeric:tabular-nums}
.brand-word{font-family:'Nunito','Vazirmatn',sans-serif;font-weight:900;letter-spacing:-.5px}
.brand-word span{color:var(--brand2)}
/* ── background ── */
#bgfx{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#bgfx i{position:absolute;border-radius:50%;filter:blur(100px);opacity:.42;display:block}
#bgfx .f1{width:640px;height:640px;top:-16%;right:-9%;background:radial-gradient(circle,#FF6B1A,transparent 66%);animation:drift 34s ease-in-out infinite alternate}
#bgfx .f2{width:560px;height:560px;bottom:-20%;left:4%;background:radial-gradient(circle,#2E63E7,transparent 66%);animation:drift 42s ease-in-out infinite alternate-reverse}
#bgfx .f3{width:440px;height:440px;top:36%;left:-12%;background:radial-gradient(circle,#7C4DFF,transparent 66%);opacity:.3;animation:drift 50s ease-in-out infinite alternate}
#bgfx .f4{width:380px;height:380px;top:8%;left:38%;background:radial-gradient(circle,#0FA3A3,transparent 68%);opacity:.24;animation:drift 38s ease-in-out infinite alternate-reverse}
[data-theme=light] #bgfx i{opacity:.2}
body::after{content:"";position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.055;mix-blend-mode:overlay;
background-image:radial-gradient(rgba(255,255,255,.9) 1px,transparent 1.3px);background-size:26px 26px}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(70px,46px) scale(1.14)}}
#app{position:relative;z-index:2}
/* ── sidebar ── */
#sidebar{position:fixed;top:0;right:0;bottom:0;width:var(--sbw);z-index:60;display:flex;flex-direction:column;gap:12px;
padding:16px 14px;background:linear-gradient(180deg,rgba(10,21,49,.94),rgba(11,23,54,.94) 45%,rgba(26,20,64,.94));
backdrop-filter:blur(16px) saturate(1.25);border-left:1px solid var(--line);overflow-y:auto;overflow-x:hidden;
transition:width 260ms cubic-bezier(.3,.9,.3,1)}
[data-theme=light] #sidebar{background:linear-gradient(180deg,#0A1531,#0B1736 45%,#1A1440)}
.sbrand{display:flex;align-items:center;gap:11px;padding:4px 6px;min-height:48px}
.smark{width:44px;height:44px;flex:0 0 44px;border-radius:14px;background:var(--grad);display:grid;place-items:center;color:#221503;
box-shadow:0 6px 20px rgba(255,107,26,.42);animation:glow 3.6s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 6px 18px rgba(255,107,26,.34)}50%{box-shadow:0 6px 30px rgba(255,178,94,.6)}}
.sbrand b{font-size:19px;color:#fff;display:block;line-height:1.3}
.sbrand small{display:block;font-size:10px;color:#93A0C2}
.nav{display:flex;flex-direction:column;gap:4px;margin-top:2px}
.navsec{font-size:9.5px;font-weight:800;color:#6E7DA3;margin:13px 10px 5px;letter-spacing:.4px}
.navi{display:flex;align-items:center;gap:11px;padding:9.5px 12px;border-radius:12px;font-size:12.5px;font-weight:700;
color:#B9C4DE;border:1px solid transparent;position:relative;transition:var(--tr);text-align:right;width:100%}
.navi:hover{color:#fff;background:rgba(255,255,255,.06);transform:translateX(-2px)}
.navi.on{color:#fff;background:linear-gradient(90deg,rgba(255,107,26,.24),rgba(124,77,255,.1));border-color:rgba(255,107,26,.34)}
.navi.on::before{content:"";position:absolute;right:-14px;top:22%;bottom:22%;width:3.5px;border-radius:4px;background:var(--grad)}
.navi .ic{flex:none}
.nbdg{margin-inline-start:auto;min-width:21px;height:21px;padding:0 6px;border-radius:99px;background:var(--grad);color:#221503;
font-size:10.5px;font-weight:900;display:grid;place-items:center}
.nbdg.t{background:linear-gradient(135deg,#2BD9C8,#0FA3A3);color:#04211C}
.nbdg.v{background:linear-gradient(135deg,#A78BFA,#7C4DFF);color:#fff}
.nbdg.r{background:linear-gradient(135deg,#FF6257,#E02D3C);color:#fff}
.ndot{margin-inline-start:auto;width:8px;height:8px;border-radius:50%;background:var(--brandSoft)}
.sspace{flex:1;min-height:8px}
.srow{display:flex;align-items:center;gap:9px;padding:9px 12px;border:1px solid rgba(255,255,255,.1);border-radius:12px;background:rgba(255,255,255,.04)}
.srow .lbl{font-size:11.5px;font-weight:700;flex:1;color:#D6DEF3}
.srow .lbl small{display:block;font-size:9.5px;color:#8E9BC4;font-weight:500}
.pdot{width:8px;height:8px;border-radius:50%;background:var(--greenL);flex:none;animation:pulse 2.1s infinite}
.pdot.off{background:#6E7DA3;animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(70,208,124,.5)}70%{box-shadow:0 0 0 8px rgba(70,208,124,0)}100%{box-shadow:0 0 0 0 rgba(70,208,124,0)}}
.wchip{padding:10px 13px;border-radius:13px;border:1px solid rgba(255,174,26,.32);background:linear-gradient(135deg,rgba(255,174,26,.15),rgba(255,107,26,.05))}
.wchip .wl{display:flex;align-items:center;gap:6px;font-size:10.5px;color:#C6D2EE}
.wchip .wv{font-size:16px;font-weight:900;color:var(--brandSoft);margin-top:2px;font-variant-numeric:tabular-nums}
.wchip .wv small{font-size:10.5px;font-weight:600;color:#93A0C2}
.pchip{padding:9px 13px;border-radius:13px;border:1px solid rgba(124,77,255,.34);background:linear-gradient(135deg,rgba(124,77,255,.16),rgba(46,99,231,.06));display:flex;align-items:center;gap:9px}
.pchip .pt{flex:1;min-width:0}
.pchip .pt b{display:block;font-size:12px;color:#fff}
.pchip .pt small{display:block;font-size:9.5px;color:#A9B6D4}
.pchip .pv{font-size:17px;font-weight:900;color:var(--violetL)}
.sme{display:flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid rgba(255,255,255,.1);border-radius:13px;background:rgba(255,255,255,.05)}
.sme .who{flex:1;min-width:0}
.sme .who b{display:block;font-size:12.5px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sme .who span{display:block;font-size:9.5px;color:#8E9BC4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sfoot{font-size:9.5px;color:#5F6E93;text-align:center;padding-bottom:2px}
.avw{position:relative;flex:none}
.avw .pdot{position:absolute;bottom:0;left:0;border:2px solid #0E1830}
/* rail */
html.rail{--sbw:80px}
html.rail .sbrand{justify-content:center;padding:4px 0}
html.rail .sbrand>div:last-child{display:none}
html.rail .navsec{font-size:0;height:1px;margin:12px 8px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.2),transparent);overflow:hidden}
html.rail .navi{justify-content:center;gap:0;padding:11px 0}
html.rail .navi>span{display:none}
html.rail .navi .nbdg{position:absolute;top:4px;left:6px;margin:0;min-width:9px;width:9px;height:9px;padding:0;font-size:0;box-shadow:0 0 0 2px #0B1736}
html.rail .navi .ndot{position:absolute;top:6px;left:8px;margin:0}
html.rail .srow,html.rail .wchip,html.rail .pchip{padding:8px 6px;justify-content:center}
html.rail .srow .lbl,html.rail .wchip .wl,html.rail .wchip .wv,html.rail .pchip .pt,html.rail .pchip .pv,html.rail .sme .who,html.rail .sme .ibtn,html.rail .sfoot{display:none}
html.rail .sme{justify-content:center;padding:8px 4px}
#tip{position:fixed;z-index:300;pointer-events:none;background:linear-gradient(135deg,#0B1736,#3B2E7E);color:#fff;font-size:11.5px;font-weight:800;
padding:7px 12px;border-radius:10px;white-space:nowrap;border:1px solid rgba(255,138,61,.4);box-shadow:0 12px 30px rgba(0,0,0,.5);opacity:0;transition:opacity 140ms}
#tip.on{opacity:1}
#tip b{color:var(--brandSoft);margin-right:6px;font-size:10.5px}
/* ── main / topbar ── */
#main{margin-right:var(--sbw);min-height:100vh;transition:margin-right 260ms cubic-bezier(.3,.9,.3,1)}
#topbar{position:sticky;top:0;z-index:50;height:66px;display:flex;align-items:center;gap:10px;padding:0 22px;
background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.tbt h2{font-size:16.5px;font-weight:900;line-height:1.35}
.tbt p{font-size:10.5px;color:var(--mut);line-height:1.4}
.tbsp{flex:1}
.ibtn{width:39px;height:39px;border-radius:11px;border:1px solid var(--line);background:var(--surf);color:var(--mut);
display:grid;place-items:center;position:relative;transition:var(--tr);flex:none}
.ibtn:hover{color:var(--brand);border-color:rgba(255,107,26,.5);transform:translateY(-1px)}
.ibtn.on{color:var(--brandSoft);border-color:rgba(255,174,26,.45);background:rgba(255,174,26,.1)}
.bbell{position:absolute;top:-5px;left:-5px;min-width:18px;height:18px;padding:0 4px;border-radius:99px;background:var(--red);
color:#fff;font-size:9.5px;font-weight:900;display:grid;place-items:center;border:2px solid var(--bg)}
.vr{width:1px;height:26px;background:var(--line);margin:0 2px}
.avbtn{display:flex;align-items:center;gap:9px;padding:5px 10px 5px 6px;border-radius:12px;border:1px solid var(--line);background:var(--surf);transition:var(--tr)}
.avbtn:hover{border-color:rgba(255,107,26,.5)}
.avbtn b{font-size:12.5px}
#menuBtn,#railBtn .ra{transition:transform 260ms}
#menuBtn{display:none}
html.rail #railBtn .ra{transform:scaleX(-1)}
.bmini{display:none;align-items:center;gap:8px;font-weight:900;font-size:15px}
.bmini .smark{width:32px;height:32px;flex-basis:32px;border-radius:9px}
#content{padding:22px;max-width:1400px;margin:0 auto}
.vhead{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.vhead h2{font-size:22px;font-weight:900;line-height:1.4}
.vhead .grad{background:linear-gradient(100deg,#FFB25E,#2BD9C8);-webkit-background-clip:text;background-clip:text;color:transparent}
.vhead p{font-size:12.5px;color:var(--mut)}
.vhead .sp{flex:1}
/* ── atoms ── */
.card{background:linear-gradient(180deg,var(--surf2),var(--surf));border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
[data-theme=light] .card{background:var(--surf)}
.pad{padding:17px}
.chead{display:flex;align-items:center;gap:9px;margin-bottom:12px;flex-wrap:wrap}
.chead h3{font-size:14.5px;font-weight:900;flex:1;min-width:120px}
.chead .ic{color:var(--tealL)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 17px;border-radius:12px;
font-size:12.5px;font-weight:800;border:1px solid transparent;transition:var(--tr);white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn.sm{height:33px;padding:0 12px;font-size:11.5px;border-radius:10px;gap:6px}
.btn.p{background:var(--grad);color:#221503;box-shadow:0 6px 18px rgba(255,107,26,.3)}
.btn.p:hover:not(:disabled){filter:brightness(1.07);transform:translateY(-1px);box-shadow:0 10px 26px rgba(255,107,26,.42)}
.btn.v{background:linear-gradient(135deg,#A78BFA,#7C4DFF);color:#fff;box-shadow:0 6px 18px rgba(124,77,255,.32)}
.btn.v:hover:not(:disabled){filter:brightness(1.08);transform:translateY(-1px)}
.btn.t{background:linear-gradient(135deg,#2BD9C8,#0FA3A3);color:#04211C;box-shadow:0 6px 18px rgba(15,163,163,.28)}
.btn.t:hover:not(:disabled){filter:brightness(1.07);transform:translateY(-1px)}
.btn.g{background:linear-gradient(135deg,#46D07C,#0E9F6E);color:#06220F;box-shadow:0 6px 18px rgba(14,159,110,.28)}
.btn.g:hover:not(:disabled){filter:brightness(1.07);transform:translateY(-1px)}
.btn.gh{border-color:var(--line2);color:var(--ink);background:var(--surf2)}
.btn.gh:hover:not(:disabled){border-color:rgba(255,107,26,.55);color:var(--brand);background:rgba(255,107,26,.08)}
.btn.d{border-color:rgba(224,45,60,.42);color:var(--redL);background:rgba(224,45,60,.08)}
.btn.d:hover:not(:disabled){background:rgba(224,45,60,.16);border-color:var(--redL)}
.chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 13px;border-radius:99px;font-size:11.5px;font-weight:800;
border:1px solid var(--line);color:var(--mut);background:var(--surf3);transition:var(--tr)}
.chip:hover{color:var(--ink);border-color:var(--line2)}
.chip.on{color:#04211C;background:linear-gradient(135deg,#2BD9C8,#0FA3A3);border-color:transparent;box-shadow:0 4px 14px rgba(15,163,163,.3)}
.chip .cnt{font-size:10px;opacity:.9;background:rgba(0,0,0,.16);border-radius:99px;padding:0 6px;min-width:19px;text-align:center}
.chip:not(.on) .cnt{background:var(--surf4)}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;font-weight:900;padding:3px 10px;border-radius:99px;border:1px solid;white-space:nowrap}
.badge i{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.b-new{color:var(--brandSoft);background:rgba(255,174,26,.13);border-color:rgba(255,174,26,.38)}
.b-new i{animation:pulse 1.9s infinite}
.b-quoted{color:var(--blueL);background:rgba(46,99,231,.14);border-color:rgba(46,99,231,.4)}
.b-accepted{color:var(--tealL);background:rgba(15,163,163,.14);border-color:rgba(15,163,163,.4)}
.b-doing{color:var(--violetL);background:rgba(124,77,255,.15);border-color:rgba(124,77,255,.42)}
.b-doing i{animation:pulse 1.6s infinite}
.b-done{color:var(--greenL);background:rgba(14,159,110,.14);border-color:rgba(14,159,110,.4)}
.b-declined{color:var(--redL);background:rgba(224,45,60,.12);border-color:rgba(224,45,60,.4)}
.b-gray{color:var(--mut);background:var(--surf3);border-color:var(--line)}
.inp{width:100%;height:42px;padding:0 13px;border-radius:12px;border:1px solid var(--line);background:var(--surf3);font-size:13px;transition:var(--tr);color:var(--ink)}
.inp:focus{outline:none;border-color:rgba(255,107,26,.65);box-shadow:0 0 0 3px rgba(255,107,26,.15)}
.inp.bad{border-color:var(--redL);box-shadow:0 0 0 3px rgba(224,45,60,.15)}
.inp[readonly]{background:rgba(255,107,26,.09);border-color:rgba(255,107,26,.3);color:var(--brandSoft);font-weight:800}
textarea.inp{height:auto;min-height:86px;padding:10px 13px;resize:vertical;line-height:1.95}
select.inp{appearance:none;-webkit-appearance:none;cursor:pointer;padding-left:34px}
select.inp option{background:#0E1830;color:#E9EEFC}
.selw{position:relative}
.selw .ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--mut)}
.sw{width:44px;height:25px;border-radius:99px;background:var(--surf4);border:1px solid var(--line2);position:relative;transition:var(--tr);flex:none}
.sw .knob{position:absolute;top:2px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--mut2);transition:var(--tr)}
.sw[aria-checked=true]{background:linear-gradient(135deg,#2BD9C8,#0FA3A3);border-color:transparent}
.sw[aria-checked=true] .knob{left:calc(100% - 21px);background:#04211C}
.ck{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--line2);background:var(--surf3);display:grid;place-items:center;transition:var(--tr);flex:none;color:#221503}
.ck .ic{opacity:0;transform:scale(.4);transition:var(--tr)}
.ck[aria-checked=true]{background:var(--grad);border-color:var(--brand)}
.ck[aria-checked=true] .ic{opacity:1;transform:scale(1)}
.ck.part{background:rgba(255,174,26,.26);border-color:var(--brandSoft);color:var(--brandSoft)}
.ck.part .ic{opacity:1;transform:scale(1)}
.tile{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none;border:1px solid}
.banner{display:flex;align-items:flex-start;gap:10px;padding:11px 14px;border-radius:12px;font-size:12px;border:1px solid;line-height:1.85}
.banner .ic{flex:none;margin-top:3px}
.banner.info{background:rgba(46,99,231,.1);border-color:rgba(46,99,231,.34);color:var(--blueL)}
.banner.warn{background:rgba(255,174,26,.1);border-color:rgba(255,174,26,.34);color:var(--brandSoft)}
.banner.ok{background:rgba(15,163,163,.11);border-color:rgba(15,163,163,.38);color:var(--tealL)}
.banner.bad{background:rgba(224,45,60,.1);border-color:rgba(224,45,60,.38);color:var(--redL)}
.banner.vio{background:rgba(124,77,255,.11);border-color:rgba(124,77,255,.38);color:var(--violetL)}
.banner b{color:inherit}
.banner .sp{flex:1}
.empty{padding:44px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.empty h4{font-size:15px;font-weight:900}
.empty p{font-size:12.5px;color:var(--mut);max-width:360px}
.stag>*{animation:up .5s cubic-bezier(.2,.9,.25,1) both;animation-delay:calc(var(--d,0)*55ms)}
@keyframes up{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
.mchip{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;color:var(--mut);background:var(--surf3);border:1px solid var(--line);padding:3px 9px;border-radius:8px}
.mchip .ic{width:13px;height:13px}
.mchip.hot{color:var(--redL);border-color:rgba(224,45,60,.4);background:rgba(224,45,60,.08)}
.mchip.money{color:var(--brandSoft);border-color:rgba(255,174,26,.32)}
.mchip.ok{color:var(--tealL);border-color:rgba(15,163,163,.35)}
.bar{height:7px;border-radius:99px;background:var(--surf4);overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;border-radius:99px;background:var(--gradData);transition:width .85s cubic-bezier(.2,.9,.25,1)}
.stars{display:inline-flex;gap:1px;color:var(--brandSoft)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(198px,1fr));gap:14px;margin-bottom:18px}
.kpi{padding:15px 16px;display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden;transition:var(--tr)}
.kpi.click{cursor:pointer}
.kpi.click:hover{transform:translateY(-3px);border-color:rgba(255,107,26,.5)}
.kpi .top{display:flex;align-items:center;gap:10px}
.kpi .lbl{font-size:11.5px;color:var(--mut);font-weight:700}
.kpi .val{font-size:21px;font-weight:900;line-height:1.3;font-variant-numeric:tabular-nums}
.kpi .val small{font-size:11px;font-weight:600;color:var(--mut)}
.kpi .sub{font-size:10.5px;color:var(--mut)}
.up{color:var(--greenL);font-weight:800}
.dn{color:var(--redL);font-weight:800}
.grid2{display:grid;grid-template-columns:1.85fr 1fr;gap:16px;align-items:start}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.cwrap{position:relative}
#chartSvg{width:100%;height:auto;display:block}
#chartSvg .bar-g{transform-box:fill-box;transform-origin:50% 100%;animation:grow .7s cubic-bezier(.2,.9,.25,1) both}
@keyframes grow{from{transform:scaleY(0)}}
#chartSvg .hit{cursor:pointer}
#ctip{position:absolute;background:var(--surf);border:1px solid var(--line2);border-radius:10px;padding:6px 11px;font-size:11px;
pointer-events:none;transform:translate(-50%,-100%);white-space:nowrap;box-shadow:var(--sh2);opacity:0;transition:opacity .12s;z-index:5}
#ctip b{color:var(--brandSoft);display:block;font-size:12.5px}
.cnote{font-size:10px;color:var(--mut2);text-align:left;margin-top:2px}
.ctotal{font-size:13px;font-weight:900;color:var(--brandSoft)}
.sched{display:flex;align-items:center;gap:11px;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surf3);flex-wrap:wrap}
.sched+.sched{margin-top:9px}
.sched .si{flex:1;min-width:150px}
.sched .si b{display:block;font-size:12.5px}
.sched .si span{font-size:10.5px;color:var(--mut)}
.tchip{font-size:10.5px;font-weight:800;color:var(--cyan);background:rgba(34,201,224,.11);border:1px solid rgba(34,201,224,.32);padding:3px 9px;border-radius:8px;white-space:nowrap}
.ringw{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.ringw .rt{flex:1;min-width:150px}
.ringw .rt b{font-size:13.5px;display:block}
.ringw .rt p{font-size:11.5px;color:var(--mut);margin:3px 0 9px}
.leg{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:9px;font-size:11.5px;transition:var(--tr)}
.leg:hover{background:var(--surf2)}
.leg .dot{width:10px;height:10px;border-radius:3px;flex:none}
.leg .nm{flex:1}
.leg .pc{color:var(--mut);font-size:10.5px}
#donut [data-seg]{transition:.2s}
#donut [data-seg].dim{opacity:.22}
.act{display:flex;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
.act:last-child{border-bottom:none}
.act .at{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none;border:1px solid var(--line)}
.act p{font-size:11.5px;line-height:1.75;flex:1}
.act time{font-size:10px;color:var(--mut2);white-space:nowrap}
/* toolbar / orders */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:13px;align-items:center}
.swrap{position:relative;flex:1;min-width:220px}
.swrap .ic{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--mut)}
.swrap .inp{padding-right:38px;padding-left:36px}
.sclear{position:absolute;left:7px;top:50%;transform:translateY(-50%);width:27px;height:27px;border-radius:8px;display:grid;place-items:center;color:var(--mut)}
.sclear:hover{color:var(--redL);background:rgba(224,45,60,.1)}
.hidden{display:none!important}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:13px}
.bulk{position:sticky;top:76px;z-index:20;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:9px 14px;margin-bottom:13px;
border-radius:12px;background:color-mix(in srgb,var(--surf2) 92%,transparent);border:1px solid rgba(255,174,26,.42);backdrop-filter:blur(8px);animation:up .25s both}
.bulk b{font-size:12px;color:var(--brandSoft)}
.bulk .sp{flex:1}
.lhead{display:flex;align-items:center;gap:10px;margin-bottom:11px;font-size:11.5px;color:var(--mut)}
.ogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(336px,1fr));gap:14px}
.oc{padding:15px;display:flex;flex-direction:column;gap:10px;cursor:pointer;transition:var(--tr);position:relative;animation:up .4s both;animation-delay:calc(var(--d,0)*42ms)}
.oc:hover{transform:translateY(-3px);border-color:rgba(255,107,26,.55);box-shadow:var(--sh2)}
.oc.sel{border-color:rgba(255,174,26,.65);box-shadow:0 0 0 3px rgba(255,174,26,.14)}
.oc.fresh{animation:up .4s both,fresh 1.5s ease 2}
@keyframes fresh{0%,100%{box-shadow:var(--sh)}50%{box-shadow:0 0 0 4px rgba(255,174,26,.32)}}
.octop{display:flex;align-items:flex-start;gap:10px}
.octop .tt{flex:1;min-width:0}
.octop .tt b{display:block;font-size:13.5px;font-weight:800;line-height:1.5}
.octop .tt .code{font-size:9.5px;color:var(--mut2);font-weight:700}
.occust{display:flex;align-items:center;gap:8px;font-size:11.5px}
.occust .nm{font-weight:800}
.occust .cr{color:var(--brandSoft);display:inline-flex}
.occust .rate{margin-inline-start:auto;display:inline-flex;align-items:center;gap:4px;color:var(--mut);font-size:10.5px}
.ocdesc{font-size:11.5px;color:var(--mut);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.9}
.ocmeta{display:flex;gap:7px;flex-wrap:wrap}
.ocfoot{display:flex;align-items:center;gap:8px;margin-top:auto;padding-top:4px}
.ocfoot .ago{font-size:10px;color:var(--mut2)}
.ocfoot .qs{font-size:10px;color:var(--mut);display:inline-flex;align-items:center;gap:4px}
.ocfoot .sp{flex:1}
/* drawer */
#dscrim{position:fixed;inset:0;z-index:70;background:var(--scrim);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:.3s}
#drawer{position:fixed;top:0;bottom:0;left:0;width:500px;max-width:100vw;z-index:71;display:flex;flex-direction:column;
background:linear-gradient(180deg,var(--surf2),var(--surf));border-right:1px solid var(--line2);box-shadow:var(--sh2);
transform:translateX(-103%);transition:transform .34s cubic-bezier(.2,.9,.25,1)}
#dwrap.open #dscrim{opacity:1;pointer-events:auto}
#dwrap.open #drawer{transform:none}
.dhead{display:flex;align-items:center;gap:11px;padding:15px 18px;border-bottom:1px solid var(--line);flex:none}
.dhead .tt{flex:1;min-width:0}
.dhead .tt h3{font-size:14.5px;font-weight:900;line-height:1.5}
.dhead .tt span{font-size:10px;color:var(--mut)}
.dbody{flex:1;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.dfoot{flex:none;padding:13px 18px;border-top:1px solid var(--line);background:var(--surf3);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.dfoot .net{flex:1;min-width:120px}
.dfoot .net small{display:block;font-size:10px;color:var(--mut)}
.dfoot .net b{font-size:16px;color:var(--brandSoft);font-variant-numeric:tabular-nums}
.steps{display:flex;position:relative;padding:4px 2px 0}
.steps::before{content:"";position:absolute;top:13px;right:11%;left:11%;height:2px;background:var(--surf4);border-radius:2px}
.steps .prog{position:absolute;top:13px;right:11%;height:2px;background:var(--grad);border-radius:2px;transition:width .5s}
.step{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;position:relative;z-index:1}
.step .sd{width:20px;height:20px;border-radius:50%;background:var(--surf4);border:2px solid var(--line2);display:grid;place-items:center;color:#221503}
.step span{font-size:9.5px;color:var(--mut2);font-weight:700}
.step.pass .sd{background:var(--teal);border-color:var(--teal);color:#04211C}
.step.pass span{color:var(--mut)}
.step.cur .sd{background:var(--grad);border-color:var(--brand);animation:pulse 1.9s infinite}
.step.cur span{color:var(--brandSoft);font-weight:900}
.step.fail .sd{background:var(--red);border-color:var(--red);color:#fff}
.step.fail span{color:var(--redL)}
.dcust{display:flex;align-items:center;gap:11px;padding:12px;border:1px solid var(--line);border-radius:13px;background:var(--surf3);flex-wrap:wrap}
.dcust .who{flex:1;min-width:130px}
.dcust .who b{font-size:13px;display:flex;align-items:center;gap:6px}
.dcust .who span{font-size:10.5px;color:var(--mut);display:flex;align-items:center;gap:5px}
.phone{display:flex;align-items:center;gap:7px;font-size:12px;width:100%;padding-top:8px;border-top:1px dashed var(--line)}
.phone .ic{color:var(--mut)}
.phone .mn{font-size:9.5px;color:var(--mut2)}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.mtile{padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surf3)}
.mtile .ml{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--mut);margin-bottom:3px}
.mtile .ml .ic{width:14px;height:14px;color:var(--tealL)}
.mtile b{font-size:11.5px;font-weight:800;line-height:1.6;display:block}
.dsec h4{font-size:11.5px;font-weight:900;color:var(--mut);margin-bottom:7px;display:flex;align-items:center;gap:7px}
.dsec h4 .ic{width:15px;height:15px;color:var(--tealL)}
.ddesc{font-size:12.5px;line-height:2.05;color:var(--ink2);background:var(--surf3);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.attrow{display:flex;gap:10px;flex-wrap:wrap}
.att{width:94px}
.att .th{width:94px;height:66px;border-radius:10px;overflow:hidden;border:1px solid var(--line2);cursor:zoom-in;transition:var(--tr);padding:0;display:block}
.att .th:hover{border-color:var(--cyan);transform:scale(1.05)}
.att .th svg{width:100%;height:100%;display:block}
.att small{display:block;font-size:9px;color:var(--mut2);text-align:center;margin-top:3px}
.frow{display:flex;flex-direction:column;gap:6px}
.frow>label{font-size:11px;font-weight:800;color:var(--mut)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.fgrid .full{grid-column:1/-1}
.pwrap{position:relative}
.pwrap .inp{height:52px;font-size:18px;text-align:center;padding-left:96px;padding-right:52px;font-weight:800}
.pwrap .unit{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:10.5px;color:var(--mut)}
.pwrap .stp{position:absolute;top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:9px;border:1px solid var(--line2);
display:grid;place-items:center;color:var(--tealL);background:var(--surf)}
.pwrap .stp:hover{border-color:var(--tealL);background:rgba(15,163,163,.13)}
.pwrap .stp.minus{right:9px}
.pwrap .stp.plus{left:56px}
.pfmt{text-align:center;font-size:11.5px;color:var(--brandSoft);font-weight:800;min-height:18px}
.qchips{display:flex;gap:7px;flex-wrap:wrap}
.qchip{height:28px;padding:0 11px;border-radius:99px;font-size:10px;font-weight:800;border:1px dashed var(--line2);color:var(--mut);transition:var(--tr)}
.qchip:hover{color:var(--brandSoft);border-color:var(--brandSoft);background:rgba(255,174,26,.09)}
.qchip.lock{opacity:.55;border-style:solid}
.war{display:flex;align-items:center;gap:9px}
.war .selw{flex:1}
.fee{border:1.5px dashed var(--line2);border-radius:12px;padding:11px 13px;background:var(--surf3);display:flex;flex-direction:column;gap:5px}
.feer{display:flex;justify-content:space-between;font-size:11.5px;color:var(--mut);gap:10px}
.feer.net{border-top:1px dashed var(--line);padding-top:6px;margin-top:2px;color:var(--ink);font-weight:900;font-size:13.5px}
.feer.net b{color:var(--brandSoft)}
.feer .neg{color:var(--redL)}
.feer .pos{color:var(--greenL)}
.err{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--redL);font-weight:800}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(5px)}75%{transform:translateX(-5px)}}
.qcard{border:1px solid rgba(46,99,231,.38);background:rgba(46,99,231,.07);border-radius:13px;padding:13px 14px;display:flex;flex-direction:column;gap:7px}
.qcard .qp{font-size:19px;font-weight:900;color:var(--brandSoft)}
.qcard .qp small{font-size:10.5px;color:var(--mut);font-weight:600}
.qmeta{display:flex;gap:8px;flex-wrap:wrap}
.qmsg{border-inline-start:3px solid var(--tealL);background:var(--surf2);border-radius:8px;padding:8px 12px;font-size:11.5px;line-height:1.95;color:var(--ink2)}
.wait{display:flex;align-items:center;gap:9px;font-size:12px;font-weight:800}
.wd{display:inline-flex;gap:4px}
.wd i{width:6px;height:6px;border-radius:50%;background:currentColor;animation:wb 1.2s infinite}
.wd i:nth-child(2){animation-delay:.15s}.wd i:nth-child(3){animation-delay:.3s}
@keyframes wb{0%,100%{transform:none;opacity:.4}50%{transform:translateY(-4px);opacity:1}}
.paidtag{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;font-weight:900;color:var(--greenL)}
/* corridor */
.corr{position:relative;height:42px;margin:6px 0 2px}
.corr .track{position:absolute;top:17px;right:0;left:0;height:8px;border-radius:99px;background:var(--surf4);border:1px solid var(--line)}
.corr .fill{position:absolute;top:17px;right:0;height:8px;border-radius:99px;background:linear-gradient(90deg,#0FA3A3,#FF6B1A)}
.corr .tick{position:absolute;top:9px;width:2px;height:24px;background:var(--mut2);border-radius:2px}
.corr input[type=range]{position:absolute;top:7px;right:0;left:0;width:100%;height:28px;-webkit-appearance:none;appearance:none;background:transparent;cursor:pointer;margin:0}
.corr input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:var(--grad);border:3px solid var(--surf);box-shadow:0 3px 12px rgba(255,107,26,.55);cursor:grab}
.corr input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:var(--brand);border:3px solid var(--surf);box-shadow:0 3px 12px rgba(255,107,26,.55);cursor:grab}
.corrlbl{display:flex;justify-content:space-between;font-size:9.5px;color:var(--mut);font-weight:800}
.gate{display:inline-flex;align-items:center;gap:5px;font-size:9.5px;font-weight:900;padding:2px 8px;border-radius:99px}
.g0{background:rgba(110,125,163,.18);color:var(--mut)}
.g1{background:rgba(46,99,231,.16);color:var(--blueL)}
.g2{background:rgba(255,174,26,.16);color:var(--brandSoft)}
.g3{background:rgba(124,77,255,.18);color:var(--violetL)}
/* rates */
.svcsum{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}
.sumchip{display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:11px;border:1px solid var(--line);background:var(--surf);font-size:11.5px;font-weight:800}
.sumchip .ic{color:var(--tealL);width:16px;height:16px}
.sumchip b{color:var(--brandSoft)}
.svclist{display:flex;flex-direction:column;gap:11px}
.svc{display:flex;align-items:center;gap:13px;padding:13px 15px;flex-wrap:wrap;transition:var(--tr);position:relative}
.svc.over{border-color:var(--brandSoft);box-shadow:0 0 0 3px rgba(255,174,26,.16)}
.svc.off{opacity:.55}
.grip{cursor:grab;color:var(--mut2);padding:4px;border-radius:6px;flex:none}
.grip:hover{color:var(--brandSoft);background:rgba(255,174,26,.1)}
.grip:active{cursor:grabbing}
.svci{flex:1;min-width:180px}
.svci b{font-size:13.5px;display:block}
.svci span{font-size:10.5px;color:var(--mut);display:block}
.svci .rel{font-size:9.5px;color:var(--mut2)}
.corrcell{min-width:210px;flex:1;max-width:280px}
.corrcell .cr1{display:flex;justify-content:space-between;font-size:9.5px;color:var(--mut);font-weight:800;margin-bottom:2px}
.corrcell .cr1 b{color:var(--tealL)}
.corrcell .cr1 .ceil{color:var(--brandSoft);cursor:pointer;border-bottom:1px dashed currentColor}
.pe{display:flex;flex-direction:column;align-items:center;gap:3px}
.perow{display:flex;align-items:center;gap:6px}
.peb{width:31px;height:31px;border-radius:9px;border:1px solid var(--line2);display:grid;place-items:center;color:var(--tealL);background:var(--surf3);transition:var(--tr);flex:none}
.peb:hover{border-color:var(--tealL);background:rgba(15,163,163,.13)}
.pe .inp{width:116px;height:38px;text-align:center;font-size:14px;font-weight:800}
.pefmt{font-size:10px;color:var(--brandSoft);font-weight:800;position:relative}
.pefmt .tick2{position:absolute;right:-17px;top:0;color:var(--greenL);opacity:0}
.pefmt.saved .tick2{animation:tk 1.3s ease}
@keyframes tk{0%{opacity:0;transform:translateY(4px)}20%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}
.svcct{display:flex;align-items:center;gap:11px}
.delb{width:33px;height:33px;border-radius:9px;display:grid;place-items:center;color:var(--mut2);border:1px solid transparent;transition:var(--tr)}
.delb:hover{color:var(--redL);border-color:rgba(224,45,60,.4);background:rgba(224,45,60,.08)}
/* plans */
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(232px,1fr));gap:14px}
.plan{padding:18px;display:flex;flex-direction:column;gap:9px;position:relative;overflow:hidden;transition:var(--tr)}
.plan::before{content:"";position:absolute;top:0;right:0;left:0;height:5px;background:var(--pc)}
.plan.on{border-color:var(--pc);box-shadow:0 12px 34px color-mix(in srgb,var(--pc) 22%,transparent)}
.plan:hover{transform:translateY(-3px)}
.plan .pct{font-size:32px;font-weight:900;color:var(--pc);line-height:1.1}
.plan h4{font-size:15px;font-weight:900}
.plan ul{list-style:none;font-size:11px;color:var(--mut);display:flex;flex-direction:column;gap:5px;flex:1}
.plan ul li{display:flex;gap:6px;align-items:flex-start}
.plan ul li .ic{width:13px;height:13px;flex:none;margin-top:4px;color:var(--greenL)}
.plan .price{font-size:16px;font-weight:900;font-variant-numeric:tabular-nums}
.plan .price small{font-size:10px;color:var(--mut);font-weight:600}
.plan .req{font-size:10px;color:var(--mut2);border-top:1px dashed var(--line);padding-top:8px}
.ptable{width:100%;border-collapse:collapse;font-size:11.5px}
.ptable th{background:var(--surf3);color:var(--mut);font-size:10px;font-weight:900;text-align:right;padding:9px 11px;border-bottom:1px solid var(--line);white-space:nowrap}
.ptable td{padding:9px 11px;border-bottom:1px solid var(--line);vertical-align:middle}
.ptable tbody tr:hover{background:var(--surf2)}
.tw{overflow:auto;border:1px solid var(--line);border-radius:13px;background:var(--surf)}
/* profile */
.phero{overflow:hidden;margin-bottom:16px}
.pcover{height:124px;position:relative;background:var(--hero);overflow:hidden}
.pcover .ic{position:absolute;color:rgba(255,255,255,.11)}
.pcover .c1{width:112px;height:112px;top:-24px;right:8%;transform:rotate(14deg)}
.pcover .c2{width:72px;height:72px;bottom:-14px;right:34%;transform:rotate(-12deg)}
.pcover .c3{width:92px;height:92px;top:-10px;left:12%;transform:rotate(22deg)}

function gateOf(s){let g=GATES[0];GATES.forEach(x=>{if(s.jobs>=x.jobs&&s.rating>=x.rating)g=x});return g}
function effPct(s){return Math.min(planPct(),gateOf(s).pct)}

function overallScore(){const sv=S.services.filter(s=>s.active);if(!sv.length)return 0;
const jobs=sv.reduce((a,s)=>a+s.jobs,0),rt=sv.reduce((a,s)=>a+s.rating,0)/sv.length;
const acc=acceptance().pct,comp=completeness();

function dismissToast(id){const el=document.getElementById(id);if(!el)return;clearTimeout(el._t);delete toastActs[id];el.classList.add("out");setTimeout(()=>el.remove(),300)}
function confetti(x,y){if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;const fx=$("#fx");if(!fx)return;
const cols=["#FF6B1A","#FFB25E","#0FA3A3","#2E63E7","#7C4DFF","#E0447C","#9BE24A"];
for(let i=0;i<20;i++){const p=document.createElement("i");p.className="conf";const s=5+Math.random()*7;
p.style.cssText=`left:${x}px;top:${y}px;width:${s}px;height:${s*(.5+Math.random())}px;background:${cols[i%cols.length]}`;fx.appendChild(p);
const a=(-Math.PI/2)+(Math.random()-.5)*2.3,v=100+Math.random()*170,dx=Math.cos(a)*v,dy=Math.sin(a)*v;
p.animate([{transform:"translate(0,0) rotate(0deg)",opacity:1},{transform:`translate(${dx}px,${dy+180}px) rotate(${(Math.random()-.5)*760}deg)`,opacity:0}],
{duration:950+Math.random()*550,easing:"cubic-bezier(.15,.6,.4,1)"}).onfinish=()=>p.remove()}}

function barSVG(vals,labels,todayIdx){

const steps=[5e5,1e6,2e6,3e6,5e6,1e7],st=steps.find(s=>s>=max/3.5)||1e7;
let grid="";for(let v=0;v<=max;v+=st){const y=pT+iH-(v/max)*iH;grid+=`<line x1="${pL}" y1="${y}" x2="${W-pR}" y2="${y}" stroke="var(--line)" stroke-width="1" ${v?'stroke-dasharray="3 4"':""}/><text x="${W-pR+8}" y="${y+4}" font-size="10" fill="var(--mut2)">${v?fmtD(v/1e6)+"م":"۰"}</text>`}
let bars="";vals.forEach((v,i)=>{const x=W-pR-(i+1)*step+(step-bw)/2,h=Math.max(v>0?6:3,(v/max)*iH),y=pT+iH-h,td=i===todayIdx,fut=i>todayIdx;
bars+=`<g class="bar-g" style="animation-delay:${i*60}ms"><rect x="${x}" y="${y}" width="${bw}" height="${h}" rx="7" fill="${td?"url(#gA)":"url(#gT)"}" opacity="${fut?.28:1}"/></g><text x="${x+bw/2}" y="${H-13}" text-anchor="middle" font-size="10.5" fill="${td?"var(--brandSoft)":"var(--mut2)"}" font-weight="${td?800:500}">${labels[i]}</text>${td?`<text x="${x+bw/2}" y="${y-6}" text-anchor="middle" font-size="9.5" fill="var(--brandSoft)" font-weight="800">امروز</text>`:""}<rect class="hit" data-bar="${i}" x="${x-4}" y="${pT}" width="${bw+8}" height="${iH}" fill="transparent"/>`});
return `<svg id="chartSvg" viewBox="0 0 ${W} ${H}" role="img" aria-label="نمودار درآمد"><defs><linearGradient id="gT" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2BD9C8"/><stop offset="1" stop-color="#1B47B8"/></linearGradient><linearGradient id="gA" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFC24D"/><stop offset="1" stop-color="#E4570B"/></linearGradient></defs>${grid}${bars}</svg>`}

function renderOrders(){const box=$("#odyn");if(!box)return;
const base=baseOrders(),list=filtered(),cnt={};FILTERS.forEach(([f])=>cnt[f]=base.filter(o=>matchF(o,f)).length);
const all=list.length&&list.every(o=>U.sel.has(o.id)),some=list.some(o=>U.sel.has(o.id));
box.innerHTML=`<div class="chips">${FILTERS.map(([f,t])=>`<button class="chip ${U.filter===f?"on":""}" data-act="filter" data-f="${f}">${t}<span class="cnt">${fmt(cnt[f])}</span></button>`).join("")}</div>
${U.sel.size?`<div class="bulk">${ICON("check",16)}<b>${fmt(U.sel.size)} سفارش انتخاب شده</b><span class="sp"></span><button class="btn d sm" data-act="bulkDecline">${ICON("x",13)} رد گروهی</button><button class="btn gh sm" data-act="clearSel">لغو انتخاب</button></div>`:""}

${list.length?`<div class="ogrid">${list.map((o,i)=>cardHTML(o,i)).join("")}</div>`:`<div class="card empty">${emptySVG()}<h4>سفارشی مطابق فیلترها نیست</h4><p>عبارت جستجو یا فیلترها را تغییر دهید تا سفارش‌های بیشتری ببینید.</p><button class="btn gh sm" data-act="clearFilters">${ICON("refresh",14)} پاک کردن فیلترها</button></div>`}`}
function bulkDecline(){const ids=[...U.sel],snap=[];
ids.forEach(id=>{const o=S.orders.find(x=>x.id===id);if(o&&(o.status==="new"||o.status==="quoted")){snap.push({id,status:o.status,quote:o.quote});clearDec(id);o.status="declined";o.declineNote="توسط شما رد شد"}});
if(!snap.length){toast("warn","فقط سفارش‌های «جدید» یا «پیشنهاد داده‌شده» قابل رد کردن هستند.");return}
U.sel.clear();logAct("x","#FF6257",fmt(snap.length)+" سفارش گروهی رد شد");beep(SND.pop);save();refresh();
toast("warn",fmt(snap.length)+" سفارش رد شد.",{label:"بازگردانی",fn:()=>{snap.forEach(s=>{const o=S.orders.find(x=>x.id===s.id);if(o){o.status=s.status;o.quote=s.quote;o.declineNote=null;if(s.status==="quoted")scheduleDec(s.id)}});save();refresh();toast("success","سفارش‌ها بازگردانی شدند.")}})}

function stepVal(p){return p<200000?10000:p<1000000?50000:100000}
function defQty(o,sv){return o.qty||(sv&&sv.unit==="هر متر"?60:1)}
function makeDraft(o){const sv=svcByCat(o.cat),qty=o.quote&&o.quote.qty?o.quote.qty:defQty(o,sv);
const lo=sv?sv.floor*qty:400000,hi=sv?ceilOf(sv)*qty:lo;
const base=o.quote?o.quote.price:(sv?clamp(sv.myRate*qty,lo,hi):Math.round((o.budget?(o.budget[0]+o.budget[1])/2:lo)));
return{qty,price:Math.round(base),hrs:o.quote?o.quote.hrs:"۱ تا ۲ ساعت",warOn:o.quote?o.quote.warOn:true,warDays:o.quote?o.quote.warDays:30,note:o.quote?o.quote.note:""}}
function bounds(){const o=S.orders.find(x=>x.id===U.drawerId),sv=o?svcByCat(o.cat):null,d=U.draft;
if(!sv||!d)return null;const q=Math.max(1,d.qty||1);return{sv,q,lo:sv.floor*q,hi:ceilOf(sv)*q}}
function openDrawer(id){const o=S.orders.find(x=>x.id===id);if(!o)return;U.drawerId=id;U.editing=false;U.draft=makeDraft(o);$("#dwrap").classList.add("open");renderDrawer();lock()}
function openOrder(id){if(U.drawerId===id&&$("#dwrap").classList.contains("open"))return;openDrawer(id)}
function closeDrawer(){if(!U.drawerId)return;U.drawerId=null;U.editing=false;U.draft=null;$("#dwrap").classList.remove("open");lock()}
function updateFee(){const d=U.draft,b=bounds();if(!d||!b)return;
const p=d.price||0,set=(s,v)=>{const e=$(s);if(e)e.textContent=v};
set("#qpFmt",money(p));set("#feeP",money(p));set("#feeC","− "+money(p-netOf(p)));set("#feeN",money(netOf(p)));set("#footN",money(netOf(p)));
set("#unitRate",money(Math.round(p/b.q))+" / "+b.sv.unit.replace("هر ",""));
const f=$("#qFill");if(f)f.style.width=clamp((p-b.lo)/Math.max(1,b.hi-b.lo)*100,0,100)+"%";
const rg=$("#qRange");if(rg&&document.activeElement!==rg)rg.value=clamp(p,b.lo,Math.max(b.hi,b.lo+1000));
checkQuote()}
function checkQuote(){const d=U.draft,b=bounds();if(!d||!b)return;
const err=$("#qErr"),btn=$("#qSubmit"),inp=$("#qp"),hit=$("#ceilHit");
let msg="";
if(d.price<b.lo)msg=`مبلغ پیشنهاد از نرخ مصوب اتحادیه (${money(b.lo)}) کمتر است.`;
else if(d.price>b.hi)msg=`مبلغ پیشنهاد از سقف مجاز شما (${money(b.hi)}) بیشتر است.`;
if(err){err.classList.toggle("hidden",!msg);if(msg)err.querySelector("span").textContent=msg}
if(inp)inp.classList.toggle("bad",!!msg);
if(btn)btn.disabled=!!msg;
if(hit){
if(d.price>b.hi){const g=gateOf(b.sv),np=PLANS.find(x=>x.pct>=g.pct&&x.pct>planPct())||PLANS[3];
const nc=Math.round(b.sv.floor*(1+Math.min(np.pct,g.pct)/100)/1000)*1000*b.q;
hit.innerHTML=`<div class="banner vio">${ICON("crown2",17)}<div style="flex:1"><b>به سقف پلن رسیدید.</b> با پلن «${np.name}» سقف این خدمت به ${money(nc)} می‌رسد — ${money(nc-b.hi)} فضای بیشتر در همین سفارش.</div><button class="btn v sm" data-act="buyPlan" data-plan="${np.id}">خرید ${np.name}</button></div>`}
else hit.innerHTML=""}}
function setPrice(v){if(!U.draft)return;U.draft.price=Math.max(0,Math.round(v));const i=$("#qp");if(i&&document.activeElement!==i)i.value=U.draft.price;updateFee()}
function setQty(v){const b=bounds();if(!b||!U.draft)return;U.draft.qty=Math.max(1,Math.round(v)||1);
const nb=bounds();U.draft.price=clamp(Math.round(b.sv.myRate*nb.q),nb.lo,nb.hi);renderDrawer()}
function quoteForm(o){const d=U.draft,b=bounds();
if(!b)return `<div class="banner bad">${ICON("alert",17)}<span>برای این دسته خدمتی تعریف نشده است. ابتدا در «نرخ‌های من» خدمت مربوطه را اضافه کنید.</span><button class="btn gh sm" data-act="nav" data-view="rates">افزودن خدمت</button></div>`;
const g=gateOf(b.sv),ep=effPct(b.sv),pos=clamp((d.price-b.lo)/Math.max(1,b.hi-b.lo)*100,0,100);
const chips=[[b.lo,"کف مصوب: "+fmt(b.lo)],[clamp(b.sv.myRate*b.q,b.lo,b.hi),"نرخ من: "+fmt(clamp(b.sv.myRate*b.q,b.lo,b.hi))],[b.hi,"سقف مجاز: "+fmt(b.hi)]];
if(o.budget){const bm=clamp(Math.round((o.budget[0]+o.budget[1])/2),b.lo,b.hi);chips.push([bm,"میانه بودجه: "+fmt(bm)])}
return `<div class="dsec"><h4>${ICON("send",15)} ${U.editing?"ویرایش پیشنهاد قیمت":"پیشنهاد قیمت شما"}</h4>
<div style="display:flex;flex-direction:column;gap:13px">
<div class="corrlbl"><span>کف اتحادیه: <b>${fmt(b.sv.floor)}</b> / ${esc(b.sv.unit.replace("هر ",""))}</span><span>سقف شما: <b style="color:var(--brandSoft)">${fmt(ceilOf(b.sv))}</b> <span class="gate g${g.rank}">${g.name} ${faStr(ep)}٪</span></span></div>
<div class="corr"><div class="track"></div><div class="fill" id="qFill" style="width:${pos}%"></div><div class="tick" style="right:0"></div><div class="tick" style="left:0"></div>
<input type="range" id="qRange" min="${b.lo}" max="${Math.max(b.hi,b.lo+1000)}" step="1000" value="${clamp(d.price,b.lo,Math.max(b.hi,b.lo+1000))}" aria-label="مبلغ در بازه مجاز"></div>
${ep<g.pct?`<div class="banner vio" style="font-size:11.5px">${ICON("crown2",15)}<span>کیفیت این خدمت سطح «${g.name}» (${faStr(g.pct)}٪) است ولی پلن شما ${faStr(planPct())}٪ اجازه می‌دهد.</span><button class="btn v sm" data-act="buyPlan" data-plan="${(PLANS.find(x=>x.pct>=g.pct&&x.pct>planPct())||PLANS[3]).id}">ارتقا</button></div>`:""}

<div class="frow"><label>نرخ واحد محاسبه‌شده</label><input class="inp" id="unitRate" value="${money(Math.round(d.price/b.q))}" readonly></div>

function addSkill(){const i=$("#skInp");if(!i||!U.pTmp)return;const v=i.value.trim();if(!v)return;
if(U.pTmp.skills.length>=8){toast("warn","حداکثر ۸ مهارت می‌توانید ثبت کنید.");return}
if(U.pTmp.skills.includes(v)){toast("info","این مهارت قبلاً ثبت شده.");return}
U.pTmp.skills.push(v);i.value="";$("#skList").innerHTML=skillList();i.focus();beep(SND.tick)}
function saveProfile(){if(!U.pTmp)return;
const name=$("#pfName").value.trim(),title=$("#pfTitle").value.trim(),phone=String(parseNum($("#pfPhone").value)).padStart(11,"0"),area=$("#pfArea").value.trim(),bio=$("#pfBio").value.trim(),err=$("#pfErr");
const bad=(m,s)=>{err.classList.remove("hidden");err.querySelector("span").textContent=m;if(s){$(s).classList.add("bad");$(s).focus()}beep(SND.err)};
$$(".modal .inp").forEach(i=>i.classList.remove("bad"));
if(!name)return bad("نام را وارد کنید.","#pfName");
if(!title)return bad("عنوان تخصص را وارد کنید.","#pfTitle");
if(!/^09\d{9}$/.test(phone))return bad("شماره موبایل باید ۱۱ رقم و با ۰۹ شروع شود.","#pfPhone");
if(!area)return bad("محدوده فعالیت را وارد کنید.","#pfArea");
const before=completeness();
Object.assign(S.profile,{name,title,phone,area,bio,avatar:U.pTmp.avatar,skills:U.pTmp.skills,hours:[$("#pfFrom").value,$("#pfTo").value]});
logAct("user","#0FA3A3","پروفایل به‌روزرسانی شد");beep(SND.send);save();closeModal();renderChrome();renderView();
toast("success","پروفایل شما به‌روزرسانی شد.");
if(before<100&&completeness()===100){confetti(innerWidth/2,innerHeight/2);toast("success","🎉 پروفایل شما ۱۰۰٪ کامل شد!");notify("system","پروفایل شما کامل شد؛ نشان «متخصص تأییدشده» فعال است.")}}
$("#avFile").addEventListener("change",e=>{const f=e.target.files&&e.target.files[0];e.target.value="";if(!f||!U.pTmp)return;
if(!f.type.startsWith("image/")){toast("danger","فقط فایل تصویری مجاز است.");return}
if(f.size>2.5*1024*1024){toast("danger","حجم تصویر باید کمتر از ۲ مگابایت باشد.");return}
const rd=new FileReader();rd.onload=()=>{const img=new Image();img.onload=()=>{try{
const side=Math.min(img.width,img.height),cv=document.createElement("canvas");cv.width=cv.height=256;
const cx=cv.getContext("2d");cx.fillStyle="#0E1830";cx.fillRect(0,0,256,256);
cx.drawImage(img,(img.width-side)/2,(img.height-side)/2,side,side,0,0,256,256);
U.pTmp.avatar={type:"upload",data:cv.toDataURL("image/jpeg",.86)};refreshAvPick();beep(SND.tick);
toast("success","تصویر آماده شد؛ برای اعمال، «ذخیره تغییرات» را بزنید.")}catch(_){toast("danger","پردازش تصویر ممکن نشد.")}};
img.onerror=()=>toast("danger","تصویر خوانده نشد.");img.src=rd.result};
rd.onerror=()=>toast("danger","خواندن فایل ممکن نشد.");rd.readAsDataURL(f)});
function resetData(){confirmModal("بازنشانی داده‌ها","همه تغییرات شما (پروفایل، نرخ‌ها، سفارش‌ها، اشتراک و کیف پول) پاک و داده‌های نمونه بازیابی می‌شود. این کار قابل بازگشت نیست.","بازنشانی کن",()=>{
Object.values(decT).forEach(clearTimeout);for(const k in decT)delete decT[k];clearTimeout(simT);
try{localStorage.removeItem(LS)}catch(e){}
S=seed();Object.assign(U,{view:"dashboard",filter:"all",q:"",sort:"new",urgent:false,preset:"",freshId:null,chartMode:"week",notifOpen:false,settleMode:"team",rateQ:""});
U.sel.clear();U.drawerId=null;U.editing=false;U.draft=null;
$("#dwrap").classList.remove("open");persist();renderChrome();renderView();lock();
S.orders.filter(o=>o.status==="quoted").forEach(o=>scheduleDec(o.id,15000+Math.random()*15000));queueSim(true);
toast("success","داده‌های نمایشی بازنشانی شد.")})}

/* ═══════════ 21. LIVE SIM ═══════════ */
let simT=null;
function queueSim(first){clearTimeout(simT);if(S.poolIdx>=S.pool.length)return;
simT=setTimeout(()=>{if(S.settings.available)spawn();queueSim()},first?24000:42000+Math.random()*26000)}
function spawn(){const tpl=S.pool[S.poolIdx];if(!tpl)return;S.poolIdx++;
const o=JSON.parse(JSON.stringify(tpl));o.created=now();o.status="new";S.orders.unshift(o);U.freshId=o.id;
setTimeout(()=>{if(U.freshId===o.id)U.freshId=null},5200);
notify("order","سفارش جدید «"+o.title+"» در "+o.area+" ثبت شد.",o.id);
logAct("bolt","#FFAE1A","سفارش جدید «"+o.title+"» دریافت شد");beep(SND.new);save();refresh();
toast("info","سفارش جدید: <b>"+esc(o.title)+"</b> · "+esc(o.area),{label:"مشاهده",fn:()=>{setView("orders");openDrawer(o.id)}})}

/* ═══════════ 22. EVENTS ═══════════ */
document.addEventListener("click",e=>{

case"theme":{const t=document.documentElement.dataset.theme==="dark"?"light":"dark";document.documentElement.dataset.theme=t;try{localStorage.setItem("zv_wrk_theme",t)}catch(_){}renderChrome();renderView();beep(SND.tick);break}
case"sound":S.settings.sound=!S.settings.sound;save();renderChrome();if(U.view==="profile")renderView();if(S.settings.sound)beep(SND.pop);toast("info",S.settings.sound?"اعلان صوتی روشن شد.":"اعلان صوتی خاموش شد.");break;

if(n.orderId&&S.orders.find(o=>o.id===n.orderId)){setView("orders");openDrawer(n.orderId)}else if(n.type==="plan")setView("plans")}break}

case"supToggle":S.team.isSupervisor=!S.team.isSupervisor;save();el.setAttribute("aria-checked",S.team.isSupervisor);renderView();beep(SND.tick);toast("info",S.team.isSupervisor?"شما سرپرست تیم شدید؛ اختیار نرخ‌گذاری تیمی فعال است.":"نقش شما به عضو تیم تغییر کرد.");break;
case"reset":resetData();break;
case"statNew":U.filter="new";U.preset="";setView("orders");break;

case"urgToggle":U.urgent=!U.urgent;U.preset="";el.classList.toggle("on",U.urgent);{const p=$("#presetSel");if(p)p.value=""}renderOrders();break;

case"closeDrawer":closeDrawer();break;
case"quickP":setPrice(+el.dataset.v);beep(SND.tick);break;
case"stepQ":setPrice(U.draft.price+(+el.dataset.dir)*stepVal(U.draft.price));beep(SND.tick);break;
case"tpl":{const t=TPL[+el.dataset.i];if(U.draft)U.draft.note=t;const ta=$("#qn");if(ta)ta.value=t;break}
case"warToggle":if(U.draft){U.draft.warOn=!U.draft.warOn;el.setAttribute("aria-checked",U.draft.warOn);const s=$("#qwd");if(s)s.disabled=!U.draft.warOn;beep(SND.tick)}break;
case"submitQuote":submitQuote(id);break;

case"finishWork":finishWork(id,e);break;
case"attOpen":{const k=el.dataset.kind;openModal(`<div class="mhead">${ICON("camera",19)}<h3>${ATT_CAP[k]||"تصویر محل"}</h3><button class="ibtn" data-act="closeModal" aria-label="بستن">${ICON("x",16)}</button></div><div class="lbsvg">${sketch(k)}</div><div class="lbcap">تصویر ارسالی مشتری · برای بستن، بیرون تصویر کلیک کنید</div>`,"lb");break}

document.addEventListener("input",e=>{const t=e.target;
if(t.id==="q"){U.q=t.value;$("#qclear").classList.toggle("hidden",!U.q);renderOrders();return}

if(t.id==="qRange"){setPrice(+t.value);return}

document.addEventListener("change",e=>{const t=e.target;

if(t.id==="presetSel"){U.preset=t.value;

else if(t.value==="rich"){U.urgent=false;U.sort="budget";U.filter="all"}else U.urgent=false;
