<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<base target="_top">
<title>پنل متخصص | ZingoVingo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&family=Nunito:wght@900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js" crossorigin="anonymous" onerror="console.warn('[ZV] chart offline')"></script>
<style>
:root{--navy:#0B1736;--brand:#FF6B1A;--brand2:#FF8A3D;--brandDeep:#E4570B;--brandSoft:#FFB25E;
--blue:#2E63E7;--violet:#7C4DFF;--teal:#0FA3A3;--green:#0E9F6E;--amber:#D97706;--red:#E02D3C;--pink:#E0447C;--slate:#64748B;--cyan:#22C9E0;
--bg:#F3F5FB;--surface:#fff;--surface2:#F6F8FD;--surface3:#EDF1F9;--ink:#101A33;--muted:#5C6784;--line:#E2E7F3;--line2:#D3DAEC;
--scrim:rgba(7,13,31,.58);--sh:0 6px 22px rgba(11,23,54,.07);--sh2:0 16px 44px rgba(11,23,54,.16);
--r:16px;--tr:180ms ease;--grad:linear-gradient(135deg,#FF6B1A,#FF8A3D 55%,#FFB25E);
--hero:linear-gradient(120deg,#0B1736,#16295B 40%,#3B2E7E 74%,#7C4DFF 128%);--panBg:#0D1A38}
[data-theme=dark]{--bg:#070D1F;--surface:#0E1830;--surface2:#121F3D;--surface3:#0B1730;--ink:#E9EEFC;--muted:#93A0C2;--line:#1D2B4F;--line2:#27375F;
--scrim:rgba(2,6,18,.74);--sh:0 8px 26px rgba(0,0,0,.42);--sh2:0 18px 50px rgba(0,0,0,.58);--brandDeep:#FFB25E}
*{box-sizing:border-box;margin:0;padding:0}html{scroll-behavior:smooth}
*{scrollbar-width:thin;scrollbar-color:var(--brandDeep) var(--surface3)}
::-webkit-scrollbar{width:11px;height:11px}::-webkit-scrollbar-track{background:var(--surface3)}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--brand2),var(--brandDeep));border-radius:9px;border:2.5px solid var(--surface3)}
::selection{background:rgba(255,107,26,.28)}
body{font-family:'Vazirmatn',Tahoma,sans-serif;background:var(--bg);color:var(--ink);font-size:13.5px;line-height:1.8;min-height:100vh;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;z-index:-2;background:radial-gradient(700px 420px at 92% -6%,rgba(255,107,26,.14),transparent 60%),radial-gradient(640px 460px at -8% 108%,rgba(46,99,231,.13),transparent 60%),radial-gradient(520px 380px at 55% 118%,rgba(124,77,255,.09),transparent 60%)}
body:after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.05;background-image:radial-gradient(rgba(100,116,139,.9) 1px,transparent 1.3px);background-size:26px 26px}
button,input,select,textarea{font:inherit;color:inherit}a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid rgba(255,107,26,.45);outline-offset:2px;border-radius:8px}
svg.ic{width:18px;height:18px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.bw,.brand h1,.lbox h1{font-family:'Nunito','Vazirmatn',sans-serif!important;font-weight:900!important;letter-spacing:-.5px}
.bw span,.brand h1 span,.lbox h1 span{color:var(--brand2)}
.num{font-variant-numeric:tabular-nums}.ltr{direction:ltr;text-align:right}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:38px;padding:8px 16px;border-radius:11px;border:1px solid transparent;font-size:12.5px;font-weight:800;cursor:pointer;transition:all var(--tr);white-space:nowrap}
.btn:hover{transform:translateY(-1px)}.btn:disabled{opacity:.55;cursor:not-allowed;transform:none}
.btn-p{background:var(--grad);color:#fff;box-shadow:0 6px 18px rgba(255,107,26,.35)}
.btn-v{background:linear-gradient(135deg,#7C4DFF,#9E7BFF);color:#fff}
.btn-t{background:linear-gradient(135deg,#2BD9C8,#0FA3A3);color:#04211C}
.btn-g{background:linear-gradient(135deg,#46D07C,#0E9F6E);color:#06220F}
.btn-s{background:var(--surface2);border-color:var(--line);color:var(--ink)}.btn-s:hover{border-color:var(--brand);color:var(--brandDeep)}
.btn-d{background:rgba(224,45,60,.12);color:var(--red)}
.btn-sm{min-height:30px;padding:5px 11px;font-size:11.5px}
.btn-i{width:31px;height:31px;min-height:31px;padding:0;border-radius:9px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:18px}
.grid{display:grid;gap:16px}.kpis{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--sh);transition:transform var(--tr);position:relative;overflow:hidden}
.kpi:hover{transform:translateY(-3px)}.kpi .top{display:flex;justify-content:space-between;align-items:center}
.kpi .chip{width:38px;height:38px;border-radius:12px;display:grid;place-items:center}
.kpi .l{font-size:11.5px;color:var(--muted);font-weight:700;margin-top:10px}
.kpi .v{font-size:20px;font-weight:900;font-variant-numeric:tabular-nums;margin-top:2px}
.kpi .s{font-size:10.5px;color:var(--muted)}
.kpi.click{cursor:pointer}.kpi.click:hover{border-color:rgba(255,107,26,.5)}
.hero{background:var(--hero);color:#fff;border-radius:20px;padding:26px 28px;position:relative;overflow:hidden;margin-bottom:18px}
.hero:before{content:"";position:absolute;inset:0;background:radial-gradient(420px 220px at 88% 18%,rgba(255,107,26,.4),transparent 60%),radial-gradient(320px 200px at 8% 112%,rgba(15,163,163,.3),transparent 60%)}
.hero:after{content:"";position:absolute;inset:0;opacity:.16;background-image:radial-gradient(rgba(255,255,255,.85) 1px,transparent 1px);background-size:22px 22px}
.hero>*{position:relative;z-index:1}.hero h2{font-size:21px;font-weight:900}.hero p{color:#D3DCF5;font-size:12px;margin-top:4px}
.hero .acts{display:flex;gap:9px;margin-top:16px;flex-wrap:wrap}.hero .btn-s{background:rgba(255,255,255,.13);border-color:rgba(255,255,255,.22);color:#fff}
.hero .dchip{position:absolute;left:26px;top:24px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.24);padding:7px 14px;border-radius:12px;font-size:12px;font-weight:800;display:inline-flex;align-items:center;gap:7px}
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,var(--navy),#3B2E7E)}
.lbox{background:var(--surface);border-radius:22px;padding:32px;width:min(430px,100%);box-shadow:0 20px 60px #0004}
.lbox h1{text-align:center;color:var(--ink);font-size:27px}.lbox .sub{text-align:center;color:var(--muted);font-size:12px;margin:6px 0 20px}
.errbox{display:none;background:rgba(224,45,60,.1);color:var(--red);padding:10px;border-radius:10px;font-size:12px;margin-bottom:12px}
.democred{background:rgba(46,99,231,.08);border:1px dashed rgba(46,99,231,.4);border-radius:11px;padding:10px 12px;font-size:11.5px;color:var(--blue);margin-bottom:16px;display:flex;align-items:center;gap:8px;justify-content:space-between}
.democred b{font-family:monospace;font-size:13px}
#app{display:none;grid-template-columns:272px minmax(0,1fr);min-height:100vh}
.sidebar{background:linear-gradient(180deg,#0A1531,#0B1736 40%,#1A1440);color:#C7D1E8;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;z-index:60}
.brand{display:flex;gap:11px;align-items:center;padding:20px}
.mark{width:42px;height:42px;border-radius:14px;background:var(--grad);display:grid;place-items:center;color:#fff;box-shadow:0 6px 18px rgba(255,107,26,.45)}
.brand h1{font-size:19px;color:#fff}.brand small{display:block;font-size:10px;color:#8E9BC4}
.nav{flex:1;padding:6px 12px 12px}.nav-sec{font-size:10px;font-weight:800;color:#7C89B4;margin:15px 10px 6px}
.nav-item{display:flex;align-items:center;gap:11px;padding:9.5px 12px;margin:2px 0;border-radius:11px;color:#B9C4DE;font-size:12.5px;font-weight:700;cursor:pointer;transition:all var(--tr);position:relative}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff}
.nav-item.on{background:linear-gradient(90deg,rgba(255,107,26,.22),rgba(124,77,255,.12));color:#fff}
.nav-item.on:before{content:"";position:absolute;right:-12px;top:8px;bottom:8px;width:3.5px;border-radius:4px;background:var(--grad)}
.bdg{margin-right:auto;background:var(--brand);color:#fff;font-size:10px;font-weight:900;min-width:20px;height:20px;padding:0 6px;border-radius:12px;display:grid;place-items:center}
.bdg.r{background:var(--red)}.bdg.t{background:var(--teal)}.bdg.v{background:var(--violet)}
.side-foot{padding:14px;border-top:1px solid rgba(255,255,255,.08)}
.uchip{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:12px;background:rgba(255,255,255,.05)}
.uchip b{color:#fff;font-size:12.5px;display:block}.uchip small{color:#8E9BC4;font-size:10px}
.av{width:36px;height:36px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;font-weight:900;overflow:hidden;flex:0 0 auto;cursor:pointer}
.av img{width:100%;height:100%;object-fit:cover}
.av.lg{width:120px;height:120px;font-size:38px;border:3px solid var(--surface);box-shadow:0 0 0 2px var(--line)}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:12px;padding:12px 26px;background:color-mix(in srgb,var(--surface) 86%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.topbar h2{font-size:17px;font-weight:900}.crumb{font-size:11px;color:var(--muted)}.sp{flex:1}
.ibtn{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--muted);position:relative;transition:all var(--tr)}
.ibtn:hover{color:var(--brand);border-color:var(--brand)}
.demo-badge{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:99px;font-size:10.5px;font-weight:900;background:rgba(124,77,255,.14);color:var(--violet);border:1px solid rgba(124,77,255,.4)}
.demo-badge i{width:7px;height:7px;border-radius:50%;background:var(--violet);animation:blink 1.4s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.branch-chip{display:flex;align-items:center;gap:8px;padding:6px 12px;border:1px solid var(--line);border-radius:11px;background:var(--surface2);font-size:11.5px;font-weight:800;color:var(--brandDeep)}
.menu-btn{display:none}
#page{padding:24px 26px 60px;max-width:1620px;width:100%;margin:0 auto}
.ph{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.ph h1{font-size:20px;font-weight:900}.ph .sub,.sub{font-size:11.5px;color:var(--muted)}
.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.inp,.sel{min-height:37px;padding:7px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:12px}
.inp:focus,.sel:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 3px rgba(255,107,26,.12)}
.sw{position:relative;min-width:220px;flex:1;max-width:340px}.sw .ic{position:absolute;right:11px;top:10px;width:16px;height:16px;color:var(--muted)}.sw input{width:100%;padding-right:36px}
.tw{overflow:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
table.tb{width:100%;border-collapse:collapse;font-size:12.5px;min-width:800px}
.tb th{position:sticky;top:0;background:var(--surface2);color:var(--muted);font-size:11px;font-weight:900;text-align:right;padding:11px 13px;border-bottom:1px solid var(--line);white-space:nowrap;z-index:2}
.tb td{padding:10px 13px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
.tb tbody tr:hover{background:color-mix(in srgb,var(--brand) 4%,var(--surface))}
.ra{display:flex;gap:5px;justify-content:flex-end}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3.5px 11px;border-radius:20px;font-size:11px;font-weight:800;white-space:nowrap}
.pill:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-blue{background:rgba(46,99,231,.12);color:var(--blue)}.p-green{background:rgba(14,159,110,.13);color:var(--green)}
.p-amber{background:rgba(217,119,6,.13);color:var(--amber)}.p-red{background:rgba(224,45,60,.12);color:var(--red)}
.p-violet{background:rgba(124,77,255,.12);color:var(--violet)}.p-teal{background:rgba(15,163,163,.13);color:var(--teal)}
.p-gray{background:rgba(100,116,139,.14);color:var(--slate)}.p-brand{background:rgba(255,107,26,.13);color:var(--brandDeep)}.p-pink{background:rgba(224,68,124,.12);color:var(--pink)}
.empty{text-align:center;padding:48px 20px;color:var(--muted)}
.empty .ei{width:74px;height:74px;margin:0 auto 14px;border-radius:22px;background:linear-gradient(135deg,rgba(255,107,26,.14),rgba(124,77,255,.14));display:grid;place-items:center;color:var(--brand)}
.empty .ei .ic{width:32px;height:32px}.empty h4{color:var(--ink);font-size:14px;margin-bottom:4px}
.charts{grid-template-columns:repeat(auto-fit,minmax(330px,1fr))}
.cbox{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--sh)}
.cbox h3{font-size:13px;font-weight:900;margin-bottom:12px;display:flex;align-items:center;gap:8px}.cwrap{position:relative;height:250px}
.fbar{display:flex;align-items:flex-end;gap:8px;height:200px;padding:10px 4px 0}
.fbar .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.fbar .b i{width:100%;max-width:40px;border-radius:7px 7px 0 0;background:var(--grad);transition:height .8s cubic-bezier(.3,.9,.3,1)}
.fbar .b span{font-size:9.5px;color:var(--muted)}
.fdonut{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.fdonut .lg{flex:1;min-width:150px}
.fdonut .lg div{display:flex;align-items:center;gap:8px;font-size:11.5px;padding:5px 0}
.fdonut .lg i{width:11px;height:11px;border-radius:3px;flex:none}
.rank{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:11px;background:var(--surface2);margin-bottom:7px;font-size:12px}
.rank .info{flex:1;min-width:0}.rank b{display:block;font-size:12px}.rank small{color:var(--muted);font-size:10px}.rank .v{font-weight:900;color:var(--brandDeep)}
.bar{height:8px;border-radius:8px;background:var(--surface2);border:1px solid var(--line);overflow:hidden;min-width:70px}
.bar i{display:block;height:100%;width:0;background:var(--grad);transition:width .9s cubic-bezier(.3,.9,.3,1)}
.banner{display:flex;align-items:flex-start;gap:10px;padding:11px 14px;border-radius:12px;font-size:12px;border:1px solid;line-height:1.9;margin-bottom:14px}
.banner .ic{flex:none;margin-top:3px}.banner .sp{flex:1}
.banner.info{background:rgba(46,99,231,.09);border-color:rgba(46,99,231,.3);color:var(--blue)}
.banner.warn{background:rgba(217,119,6,.1);border-color:rgba(217,119,6,.32);color:var(--amber)}
.banner.ok{background:rgba(15,163,163,.1);border-color:rgba(15,163,163,.34);color:var(--teal)}
.banner.bad{background:rgba(224,45,60,.09);border-color:rgba(224,45,60,.34);color:var(--red)}
.banner.vio{background:rgba(124,77,255,.1);border-color:rgba(124,77,255,.34);color:var(--violet)}
.scrim{position:fixed;inset:0;background:var(--scrim);backdrop-filter:blur(3px);z-index:90;opacity:0;pointer-events:none;transition:opacity .22s}.scrim.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;left:0;height:100vh;width:min(560px,100%);background:var(--surface);z-index:95;transform:translateX(-103%);transition:transform .28s cubic-bezier(.3,.9,.3,1);display:flex;flex-direction:column;border-right:1px solid var(--line);box-shadow:var(--sh2)}
.drawer.show{transform:none}
.dh,.mh{display:flex;align-items:center;gap:11px;padding:17px 20px;border-bottom:1px solid var(--line);flex:0 0 auto}
.dh h3,.mh h3{font-size:15px;font-weight:900;flex:1}
.db{flex:1;overflow-y:auto;padding:18px 20px;min-height:0}
.df{padding:13px 20px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;flex:0 0 auto}
.mback{position:fixed;inset:0;z-index:100;background:var(--scrim);backdrop-filter:blur(4px);display:none;align-items:flex-start;justify-content:center;padding:5vh 16px;overflow-y:auto}.mback.show{display:flex}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:20px;width:min(680px,100%);box-shadow:var(--sh2);max-height:90vh;display:flex;flex-direction:column;overflow:hidden}
.modal.w{width:min(1020px,100%)}.modal>form{display:flex;flex-direction:column;min-height:0;flex:1;overflow:hidden}
.mb{padding:20px 22px;overflow-y:auto;flex:1 1 auto;min-height:0}
.mf{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:9px;flex-wrap:wrap;flex:0 0 auto;align-items:center}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.fgrid .full{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}.field label{font-size:11.5px;font-weight:800;color:var(--muted)}.req{color:var(--red)}
.field input,.field textarea,.field select{min-height:40px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface2);font-size:12.5px;width:100%}
.field textarea{min-height:78px;resize:vertical}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 3px rgba(255,107,26,.14)}
.hint{font-size:10px;color:var(--muted)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kvi{background:var(--surface2);border:1px solid var(--line);border-radius:11px;padding:9px 12px;min-width:0}
.kvi small{display:block;font-size:10px;color:var(--muted)}.kvi b{font-size:12.5px;font-weight:800;word-break:break-word;white-space:pre-wrap}.kvi.full{grid-column:1/-1}
.sec-t{font-size:12px;font-weight:900;color:var(--brandDeep);margin:16px 0 10px;display:flex;align-items:center;gap:8px}
.sec-t:after{content:"";flex:1;height:1px;background:var(--line)}
select{background:var(--surface2);border:1px solid var(--line);color:inherit}
.jdw{position:relative;width:100%}.jdw input{padding-left:42px!important;direction:ltr;text-align:right}
.jdb{position:absolute;left:6px;top:50%;transform:translateY(-50%);border:0;border-radius:8px;background:rgba(255,107,26,.14);color:var(--brandDeep);padding:6px 8px;cursor:pointer;z-index:2;display:grid;place-items:center}
.jdb:hover{background:var(--brand);color:#fff}
.jpop{display:none;position:fixed;z-index:400;width:min(320px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:11px;box-shadow:var(--sh2)}
.jpop.open{display:block}
.jh{display:flex;align-items:center;justify-content:space-between;gap:4px;margin-bottom:9px;font-weight:800;font-size:13px}
.jh button{border:0;background:var(--surface2);border-radius:8px;padding:5px 9px;cursor:pointer;font-size:14px}
.jh button:hover{background:var(--brand);color:#fff}.jh .yr{flex:1;text-align:center;cursor:pointer;border-radius:6px;padding:2px 6px}
.jg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}
.jg button{border:0;border-radius:7px;padding:7px 0;background:var(--surface2);cursor:pointer;font:inherit;font-size:12px;color:var(--ink)}
.jg button:hover{background:rgba(255,107,26,.18);color:var(--brandDeep)}
.jg .dl{background:transparent;color:var(--muted);font-weight:700;cursor:default}
.jg .today{outline:2px solid var(--brand);outline-offset:-2px}.jg .on{background:var(--grad);color:#fff;font-weight:800}
#toasts{position:fixed;bottom:18px;left:18px;z-index:200;display:flex;flex-direction:column-reverse;gap:9px;max-width:min(400px,90vw)}
.toast{display:flex;align-items:center;gap:10px;background:var(--navy);color:#fff;padding:12px 16px;border-radius:13px;font-size:12.5px;box-shadow:var(--sh2);border-right:4px solid var(--blue)}

function decorate(root){$$('select',root||document).forEach(function(sel){if(sel._zv)return;sel._zv=true;sel.className+=' sel';});}
var JD={inp:null,y:0,m:0};
function jdInit(root){$$('input[data-jd]',root||document).forEach(function(inp){
if(inp._jd)return;inp._jd=true;inp.autocomplete='off';if(!inp.placeholder)inp.placeholder='۱۴۰۵/۰۹/۰۱';
var w=document.createElement('div');w.className='jdw';inp.parentNode.insertBefore(w,inp);w.appendChild(inp);
var b=document.createElement('button');b.type='button';b.className='jdb';b.innerHTML=icon('cal','width:14px;height:14px');w.appendChild(b);
b.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();jdOpen(inp);});
inp.addEventListener('input',function(){var v=en(inp.value).replace(/\D/g,'').slice(0,8);if(v.length>4)v=v.slice(0,4)+'/'+v.slice(4);if(v.length>7)v=v.slice(0,7)+'/'+v.slice(7);inp.value=v;});});}
function jdOpen(inp){JD.inp=inp;var p=parseJ(inp.value),n=new Date(),j=g2j(n.getFullYear(),n.getMonth()+1,n.getDate());
JD.y=p?p[0]:j[0];JD.m=p?p[1]:j[1];jdRender();
var pop=$('#jpop');pop.classList.add('open');var r=inp.getBoundingClientRect();
pop.style.left=Math.min(Math.max(8,r.left),window.innerWidth-328)+'px';
var t=r.bottom+6;pop.style.top=Math.max(8,t)+'px';}
function jdClose(){$('#jpop').classList.remove('open');JD.inp=null;}
function jdRender(){var pop=$('#jpop');if(!pop)return;
var n=new Date(),t=g2j(n.getFullYear(),n.getMonth()+1,n.getDate()),mx=jDays(JD.y,JD.m),f=j2g(JD.y,JD.m,1);
var wd=(new Date(f[0],f[1]-1,f[2]).getDay()+1)%7,sel=JD.inp?parseJ(JD.inp.value):null;
var h='<div class="jh"><button type="button" data-j="py">«</button><button type="button" data-j="pm">‹</button><span class="yr">'+JM[JD.m-1]+' '+fa(JD.y)+'</span><button type="button" data-j="nm">›</button><button type="button" data-j="ny">»</button></div><div class="jg">';
['ش','ی','د','س','چ','پ','ج'].forEach(function(x){h+='<button type="button" class="dl" disabled>'+x+'</button>';});
for(var i=0;i<wd;i++)h+='<span></span>';
for(var d=1;d<=mx;d++){var isT=t[0]===JD.y&&t[1]===JD.m&&t[2]===d,isS=sel&&sel[0]===JD.y&&sel[1]===JD.m&&sel[2]===d;
h+='<button type="button" data-day="'+d+'" class="'+(isT?'today ':'')+(isS?'on':'')+'">'+fa(d)+'</button>';}
pop.innerHTML=h+'</div>';}
(function(){var pop=$('#jpop');if(!pop)return;
pop.addEventListener('click',function(e){e.stopPropagation();
var nav=e.target.closest('[data-j]');
if(nav){e.preventDefault();var k=nav.dataset.j;
if(k==='py')JD.y--;else if(k==='ny')JD.y++;
else if(k==='pm'){JD.m--;if(JD.m<1){JD.m=12;JD.y--;}}
else if(k==='nm'){JD.m++;if(JD.m>12){JD.m=1;JD.y++;}}
jdRender();return;}
var day=e.target.closest('[data-day]');
if(day&&JD.inp){e.preventDefault();JD.inp.value=JD.y+'/'+String(JD.m).padStart(2,'0')+'/'+String(day.dataset.day).padStart(2,'0');
JD.inp.dispatchEvent(new Event('change',{bubbles:true}));jdClose();}});})();

function rcSvc(sid){return (DB.rc&&DB.rc.services||[]).filter(function(x){return x.id===sid;})[0]||null;}
function svcById(id){return DB.serv.filter(function(s){return s.id===id;})[0];}
function svcName(s){return s.nameFa||s.nameEn||s.name||s.id;}
function floorOf(s){var r=rcSvc(s.id);return r?num(r.floor):num(s.rate);}
function ceilOf(s){var r=rcSvc(s.id);return r?num(r.ceiling):floorOf(s);}
function myRate(s){var r=rcSvc(s.id);return r?num(r.rate):floorOf(s);}
function effPct(sid){var r=rcSvc(sid);return r?num(r.markup):0;}
function planPct(){return DB.rc?num((DB.rc.entitlement||{}).markup):0;}

function rateSet(sid,v,silent){
var s=svcById(sid);if(!s)return;
var fl=floorOf(s),ce=ceilOf(s),cl=Math.max(fl,Math.round(num(v))),hit=false;
if(cl>ce){cl=ce;hit=true;}
var row=$('[data-row="'+sid+'"]');if(!row)return;
var inp=row.querySelector('[data-ratein]');if(inp&&document.activeElement!==inp)inp.value=cl;
var rg=row.querySelector('[data-rate]');if(rg&&document.activeElement!==rg)rg.value=cl;
var f=row.querySelector('[data-fill]');if(f)f.style.width=Math.round((cl-fl)/Math.max(ce-fl,1)*100)+'%';
var fm=row.querySelector('[data-fmt]');if(fm)fm.textContent=money(cl);
var hn=row.querySelector('[data-hint]');if(hn)hn.textContent=ce<=fl?'برای افزایش نرخ، پلن لازم است':'معادل '+toman(cl);
if(hit&&!silent)toast('نرخ به سقف مجاز ('+money(ce)+') محدود شد.','warn');
return cl;}

.catch(function(x){if(sub)sub.disabled=false;throw x;});}

var sb=f.elements.body.value.trim();if(!sb){toast('متن پیام الزامی است.','err');return;}
if(sub)sub.disabled=true;
return api('workerCreateThread',{channel:'SUPPORT',subject:f.elements.subject.value,body:sb},TOKEN)
.then(function(r){closeModal();toast('پیام به پشتیبانی ارسال شد.','ok');go('messages');
return loadInbox().then(function(){render();if(r&&r.threadId)return chatOpen(r.threadId);});})
.catch(function(x){if(sub)sub.disabled=false;throw x;});}
if(k==='dev-new'){
var note=f.elements.note.value.trim();if(note.length<10){toast('شرح درخواست حداقل ۱۰ کاراکتر باشد.','err');return;}
if(sub)sub.disabled=true;
return api('workerSubmitDevRequest',{module:f.elements.module.value,kind:f.elements.kind.value,priority:f.elements.priority.value,note:note},TOKEN)
.then(function(r){closeModal();toast('درخواست ثبت شد · '+(r&&r.id||''),'ok');return loadDev().then(render);})
.catch(function(x){if(sub)sub.disabled=false;throw x;});}
if(k==='plan-buy'){
var cyc=num(f.elements.cycle.value),method=f.elements.method.value;
if(sub)sub.disabled=true;
return api('workerBuyPlan',{planId:f.dataset.id,cycle:cyc,method:method},TOKEN)
.then(function(r){closeModal();toast(r.message,'ok');return render();})
.catch(function(x){if(sub)sub.disabled=false;throw x;});}
if(k==='log-hours'){
var cid2=f.elements.cardId.value,wid=f.elements.workerId.value,hv=num(f.elements.hours.value);
if(!cid2||!wid){toast('کارت و نیرو را انتخاب کنید.','err');return;}
if(!(hv>0)){toast('ساعت اجرا را وارد کنید.','err');return;}
if(sub)sub.disabled=true;
return api('workerLogHours',{cardId:cid2,workerId:wid,hours:hv},TOKEN)
.then(function(r){toast(r.message||'ثبت شد.','ok');f.reset();if(sub)sub.disabled=false;return render();})
.catch(function(x){if(sub)sub.disabled=false;throw x;});}
if(k==='profile'){
var u=f.elements.username.value.trim(),pw=f.elements.password.value;
if(!u){toast('نام کاربری الزامی است.','err');return;}
if(pw&&pw.length<4){toast('رمز عبور جدید حداقل ۴ کاراکتر باشد.','err');return;}
var pp={username:u,description:f.elements.description.value};if(pw)pp.password=pw;
if(sub)sub.disabled=true;
return api('updateWorkerProfile',pp,TOKEN).then(function(){
USER.username=u;USER.description=pp.description;toast('پروفایل ذخیره شد.','ok');
return api('getWorkerProfile',TOKEN).then(function(np){USER=np;paintUser();render();});})
.catch(function(x){if(sub)sub.disabled=false;throw x;});}};
try{var r=run();if(r&&typeof r.catch==='function')r.catch(function(x){toast(x.message||String(x),'err');});}
catch(x){toast(x.message||String(x),'err');}});
document.addEventListener('keydown',function(e){
if(e.key==='Escape'){if($('#jpop').classList.contains('open')){jdClose();return;}closeModal();closeDrawer();return;}
if(e.key==='Enter'&&$('#loginView').style.display!=='none'&&(e.target.id==='loginUser'||e.target.id==='loginPass'))doLogin();});
window.addEventListener('scroll',function(){if($('#jpop').classList.contains('open')&&JD.inp)jdOpen(JD.inp);},true);
/* رویدادهای زنده شبیه‌ساز */
ZVDemo.onEvent=function(ev){
if(ev.type==='msg'){toast('پیام جدید در گفتگو: '+ev.payload.subject,'info',{label:'مشاهده',fn:function(){if(PS.page==='messages'){loadInbox().then(render);}}});loadInbox().then(function(){renderNav();});}
if(ev.type==='card'){toast('کارت جدید به شما تخصیص یافت: '+ev.payload.title,'ok',{label:'مشاهده',fn:function(){go('cards');}});loadCards().then(function(){renderNav();});}
if(ev.type==='plan'){toast('✅ واحد مالی پلن «'+ev.payload.planName+'» را تأیید کرد. سقف افزایش نرخ '+fa(ev.payload.markup)+'٪ فعال شد.','ok',{label:'مشاهده نرخ‌ها',fn:function(){go('rates');}});loadRateCtx();}
};

(function init(){
var th=localStorage.getItem('zv_worker_theme');if(th)document.documentElement.dataset.theme=th;
$('#themeBtn').innerHTML=icon(document.documentElement.dataset.theme==='dark'?'sun':'moon');
$('#loginMode').innerHTML=DEMO?'<span style="color:var(--violet);font-weight:800">● حالت دمو فعال است</span> — داده‌ها شبیه‌سازی و در مرورگر ذخیره می‌شوند':'اتصال به سرور ZingoVingo';
if(!TOKEN){$('#loginView').style.display='grid';return;}
$('#loginView').style.display='none';$('#app').style.display='grid';
if(DEMO)$('#demoBadge').style.display='inline-flex';
$('#page').innerHTML='<div class="loading"><div class="spinner"></div><p style="margin-top:12px">در حال دریافت داده‌ها…</p></div>';
loadBrand();
bootstrap().then(function(){showApp();if(DEMO)ZVDemo.startLive();}).catch(function(){
localStorage.removeItem('zv_worker_token');TOKEN='';USER=null;
$('#app').style.display='none';$('#loginView').style.display='grid';});
})();
</script>
