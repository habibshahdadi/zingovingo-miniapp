*{scrollbar-width:thin;scrollbar-color:var(--brandDeep) var(--surface3)}

for(var i=0;i<wd;i++)h+='<span></span>';

function cardKeys(c){var s=en(c.executeDateTime||'');var m=s.match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/);
var k='',t='';if(m){var g=j2g(+m[1],+m[2],+m[3]);k=g[0]+'-'+String(g[1]).padStart(2,'0')+'-'+String(g[2]).padStart(2,'0');}
var tm=s.match(/(\d{1,2}):(\d{2})/);if(tm)t=String(+tm[1]).padStart(2,'0')+':'+tm[2];return {_k:k,_t:t};}
function isDone(s){return /تکمیل|انجام شده|completed/i.test(String(s||''));}
function isCancel(s){return /لغو|مرجوع|cancel/i.test(String(s||''));}
function isActive(s){return !isDone(s)&&!isCancel(s);}
function newCards(){return (DB.cards||[]).filter(function(c){return /^جدید/.test(String(c.status||''));});}
function unreadTotal(){return (DB.inbox||[]).reduce(function(a,t){return a+(t.state!=='CLOSED'?t.unread:0);},0);}
function svcName(s){return s.name||s.nameFa||s.nameEn||s.id;}
function svcById(id){return DB.serv.filter(function(s){return s.id===id;})[0];}
function rcOf(sid){var rc=DB.rc||{};var m=(rc.rates||{})[sid];return m||null;}
function floorOf(s){var rc=DB.rc||{};var f=(rc.floors||{})[s.id];return num(f)>0?num(f):num(s.rate);}
function floorSrc(){return (DB.rc&&DB.rc.floors)?'نرخ مصوب شهر (CityRates)':'نرخ پایه خدمت (Services.Base-Rate)';}
function planPct(){var rc=DB.rc||{};return num((rc.entitlement||{}).markup);}
function doneCount(){var r=DB.rep;if(r&&num(r.completedCards)>=0)return num(r.completedCards);
return (DB.cards||[]).filter(function(c){return isDone(c.status);}).length;}
function gateFor(jobs,rating){var g=GATES[0];GATES.forEach(function(x){
if(jobs>=x.jobs&&(rating==null||rating>=x.rating))g=x;});return g;}
function effPct(sid){var rc=DB.rc||{};var q=(rc.quality||{})[sid];
var jobs=q?num(q.completed):doneCount(),rating=q?num(q.rating):null;
return Math.min(planPct(),gateFor(jobs,rating).pct);}
function ceilOf(s){return Math.round(floorOf(s)*(1+effPct(s.id)/100)/1000)*1000;}
function myRate(s){var m=rcOf(s.id);var v=m?num(m.rate):floorOf(s);
return Math.max(floorOf(s),Math.min(v,Math.max(ceilOf(s),floorOf(s))));}

function rateSet(sid,v,silent){
var s=svcById(sid);if(!s)return;
var fl=floorOf(s),ce=ceilOf(s),cl=Math.max(fl,Math.round(num(v))),hit=false;
if(cl>ce){cl=ce;hit=true;}
var row=$('[data-row="'+sid+'"]');if(!row)return;
var inp=row.querySelector('[data-ratein]');if(inp&&document.activeElement!==inp)inp.value=cl;
var rg=row.querySelector('[data-rate]');if(rg&&document.activeElement!==rg)rg.value=cl;
var f=row.querySelector('[data-fill]');if(f)f.style.width=Math.round((cl-fl)/Math.max(ce-fl,1)*100)+'%';
var fm=row.querySelector('[data-fmt]');if(fm)fm.textContent=money(cl);
var hn=row.querySelector('[data-hint]');if(hn)hn.textContent=ce<=fl?'برای افزایش نرخ، پلن لازم است':'معادل '+toman(cl);
if(hit&&!silent)toast('نرخ به سقف مجاز ('+money(ce)+') محدود شد.','warn');
return cl;}

var PE={x:0,y:0,z:1,w:0,h:0,ready:false,drag:false,sx:0,sy:0};
function photoModal(){
PE={x:0,y:0,z:1,w:0,h:0,ready:false,drag:false,sx:0,sy:0};
openModal('<div class="mh"><h3>تغییر تصویر پروفایل</h3><button class="ibtn" data-act="mclose">'+icon('x')+'</button></div>'+
'<div class="mb"><div class="pe-frame" id="peFrame"><img id="peImg" alt=""></div>'+
'<div class="pe-row"><span>زوم</span><input type="range" id="peZoom" min="1" max="5" step="0.01" value="1"><span id="peZV">۱۰۰٪</span></div>'+
'<div style="margin-top:12px">'+btn('photo-pick','انتخاب تصویر','up','btn-s')+'</div>'+
'<p class="hint" style="margin-top:8px">تصویر را بکشید و زوم کنید؛ خروجی مربعی ۴۸۰×۴۸۰ ذخیره می‌شود.</p></div>'+
'<div class="mf"><button class="btn btn-p" id="peSave" data-act="photo-save">'+icon('check','width:14px;height:14px')+' ذخیره</button>'+
'<button class="btn btn-s" data-act="mclose">انصراف</button></div>',false,true);
var fr=$('#peFrame');
fr.addEventListener('pointerdown',function(e){if(!PE.ready)return;PE.drag=true;PE.sx=e.clientX-PE.x;PE.sy=e.clientY-PE.y;fr.setPointerCapture(e.pointerId);});
fr.addEventListener('pointermove',function(e){if(!PE.drag)return;PE.x=e.clientX-PE.sx;PE.y=e.clientY-PE.sy;peLayout();});
['pointerup','pointercancel'].forEach(function(n){fr.addEventListener(n,function(){PE.drag=false;});});
fr.addEventListener('wheel',function(e){if(!PE.ready)return;e.preventDefault();PE.z=Math.min(5,Math.max(1,PE.z*(e.deltaY<0?1.08:0.92)));$('#peZoom').value=PE.z;peLayout();},{passive:false});
$('#peZoom').addEventListener('input',function(e){PE.z=num(e.target.value);peLayout();});}
function peLayout(){var i=$('#peImg');if(!i||!PE.ready)return;var F=300,w=PE.w*PE.z,h=PE.h*PE.z;
i.style.width=w+'px';i.style.height=h+'px';i.style.left=((F-w)/2+PE.x)+'px';i.style.top=((F-h)/2+PE.y)+'px';
$('#peZV').textContent=fa(Math.round(PE.z*100))+'٪';}
function peLoad(f){
if(!f||!/^image\/(jpeg|png|webp)$/i.test(f.type)){toast('فرمت تصویر معتبر نیست.','err');return;}
if(f.size>8*1024*1024){toast('حجم باید کمتر از ۸ مگابایت باشد.','err');return;}
var rd=new FileReader();
rd.onload=function(e){var im=new Image();im.onload=function(){var a=im.naturalWidth/im.naturalHeight;
PE.w=a>=1?300*a:300;PE.h=PE.w/a;PE.x=0;PE.y=0;PE.z=1;PE.ready=true;$('#peImg').src=im.src;$('#peZoom').value=1;peLayout();};
im.onerror=function(){toast('خواندن تصویر ناموفق بود.','err');};im.src=e.target.result;};
rd.readAsDataURL(f);}
function peSave(){
if(!PE.ready){toast('ابتدا تصویر انتخاب کنید.','err');return;}
var F=300,O=480,s=O/F,w=PE.w*PE.z,h=PE.h*PE.z;
var c=document.createElement('canvas');c.width=c.height=O;var x=c.getContext('2d');
x.fillStyle='#fff';x.fillRect(0,0,O,O);x.drawImage($('#peImg'),((F-w)/2+PE.x)*s,((F-h)/2+PE.y)*s,w*s,h*s);
var b=$('#peSave');b.disabled=true;
api('uploadWorkerProfilePhotoV2',c.toDataURL('image/jpeg',0.9),TOKEN).then(function(r){
USER.avatar=r.url;closeModal();paintUser();toast('تصویر پروفایل ذخیره شد.','ok');render();})
.catch(function(e){b.disabled=false;toast(e.message,'err');});}
/* ═════ 19) RAIL / TIP ═════ */
var TIP=null,TIPT=null;
function isMobile(){return window.matchMedia&&window.matchMedia('(max-width:1120px)').matches;}
function applyRail(on){document.documentElement.classList.toggle('zv-rail',!!on);try{localStorage.setItem(RKEY,on?'1':'0');}catch(e){}if(!on)hideTip();}
function toggleRail(){if(isMobile()){var s=$('#sidebar'),sc=$('#scrim'),o=!s.classList.contains('open');s.classList.toggle('open',o);sc.classList.toggle('show',o);return;}
applyRail(!document.documentElement.classList.contains('zv-rail'));}
function showTip(el){if(!document.documentElement.classList.contains('zv-rail')||isMobile()||!el)return;
var sp=el.querySelector('span'),l=sp?sp.textContent:'';l=String(l||'').trim();if(!l)return;
if(!TIP){TIP=document.createElement('div');TIP.id='zvTip';document.body.appendChild(TIP);}
var b=el.querySelector('.bdg'),ex=b&&b.textContent.trim()?'<b>'+esc(b.textContent.trim())+'</b>':'';
TIP.innerHTML=esc(l)+ex;TIP.classList.add('on');
var r=el.getBoundingClientRect(),w=TIP.offsetWidth,h=TIP.offsetHeight,left=r.left-w-12;if(left<8)left=r.right+12;
TIP.style.left=left+'px';TIP.style.top=Math.max(8,Math.min(r.top+(r.height-h)/2,window.innerHeight-h-8))+'px';}
function hideTip(){if(TIP)TIP.classList.remove('on');}
/* ═════ 20) ACTIONS ═════ */
var ACT={
'login':doLogin,'logout':doLogout,'rail':toggleRail,'theme':toggleTheme,
'menu':function(){var s=$('#sidebar'),sc=$('#scrim'),o=!s.classList.contains('open');s.classList.toggle('open',o);sc.classList.toggle('show',o);},
'scrim':closeAll,'mclose':closeModal,'dclose':closeDrawer,
'go':function(d){go(d.page);},
'refresh':function(){return reloadAll().then(function(){render();toast('داده‌ها از سامانه بروزرسانی شد.','ok');});},
'retry-cards':function(){return loadCards().then(function(){return loadStatuses();}).then(render);},
'retry-serv':function(){return loadServices().then(render);},
'retry-inbox':function(){return loadInbox().then(render);},
'retry-dev':function(){return loadDev().then(render);},
'cards-view':function(d){PS.view=d.mode;render();},
'cards-clear':function(){PS.q='';PS.st='همه';render();},
'card-detail':function(d){cardDetail(d.id);},

'card-refer':function(d){cardStatusModal(d.id,'ارجاع به سرپرست');},
'card-msg':function(d){closeDrawer();msgSupModal(d.id||'');},
'card-print':function(d){printCard(d.id);},
'week':function(d){var n=num(d.d);PS.week=n?new Date((PS.week||new Date()).getTime()+n*864e5):new Date();render();},
'rate-step':function(d){var s=svcById(d.id);if(!s)return;var row=$('[data-row="'+d.id+'"]'),inp=row?row.querySelector('[data-ratein]'):null;
var v=num(inp?inp.value:myRate(s)),st=v<2000000?10000:v<10000000?50000:100000;rateSet(d.id,v+(+d.dir)*st);},
'rate-save':function(d){return rateSave(d.id);},
'rate-bulk':function(d){rateBulk(+d.p);},
'rate-ceil':rateCeil,
'rep-run':runReports,'rep-csv':repCsv,
'rep-clear':function(){PS.from='';PS.to='';PS.rep=null;render();},
'msg-sup':function(){msgSupModal('');},'msg-support':msgSupportModal,
'chat-open':function(d){return chatOpen(d.id);},
'chat-status':function(d){return api('workerSetThreadStatus',d.id,d.state,TOKEN).then(function(){
toast(d.state==='CLOSED'?'گفتگو بسته شد.':'گفتگو باز شد.','ok');
var open=$('#mback').classList.contains('show');
return (open?chatOpen(d.id):Promise.resolve()).then(loadInbox).then(function(){if(PS.page==='messages')render();});})
.catch(function(e){toast(e.message,'err');});},
'dev-new':devNewModal,
'dev-del':function(d){confirmBox('حذف درخواست','درخواست <b>'+esc(d.id)+'</b> حذف شود؟',function(){
api('workerDeleteDevRequest',d.id,TOKEN).then(function(){toast('حذف شد.','ok');return loadDev().then(render);}).catch(function(e){toast(e.message,'err');});});},
'photo-edit':photoModal,'photo-pick':function(){$('#peFile').click();},'photo-save':peSave};
document.addEventListener('click',function(e){
if(!e.target.closest('.jdw')&&!e.target.closest('#jpop'))jdClose();
var el=e.target.closest('[data-act]');
if(el){var fn=ACT[el.dataset.act];
if(fn){e.preventDefault();e.stopPropagation();
try{var r=fn(el.dataset,el,e);if(r&&typeof r.catch==='function')r.catch(function(x){toast(x.message||String(x),'err');});}
catch(x){toast(x.message||String(x),'err');}return;}}
if(!e.target.closest('.zsel'))zClose();
if(e.target.id==='mback')closeModal();});
var sDeb=debounce(function(){render();},280),mDeb=debounce(function(){render();},260),rDeb=debounce(function(){render();},260);
document.addEventListener('input',function(e){var t=e.target;
if(t.matches('[data-search]')){PS.q=t.value;sDeb();return;}
if(t.matches('[data-msearch]')){PS.mq=t.value;mDeb();return;}
if(t.matches('[data-rsearch]')){PS.rq=t.value;rDeb();return;}
if(t.matches('[data-rate]')){rateSet(t.dataset.rate,t.value,true);return;}
if(t.matches('[data-ratein]')){var s=svcById(t.dataset.ratein);if(!s)return;
var row=t.closest('[data-row]'),f=row?row.querySelector('[data-fmt]'):null;
if(f)f.textContent=money(num(t.value));return;}});
document.addEventListener('change',function(e){var t=e.target;
if(t.matches('[data-cst]')){PS.st=t.value;render();return;}
if(t.matches('[data-mch]')){PS.mch=t.value;render();return;}
if(t.matches('[data-mst]')){PS.mst=t.value;render();return;}
if(t.id==='peFile'){var f=t.files[0];t.value='';peLoad(f);return;}});
document.addEventListener('focusout',function(e){var t=e.target;
if(t.matches&&t.matches('[data-ratein]')){rateSet(t.dataset.ratein,t.value,true);}});
document.addEventListener('submit',function(e){
var f=e.target,k=f.dataset.form;if(!k)return;e.preventDefault();
var sub=f.querySelector('[type="submit"]');
var run=function(){
if(k==='card-status'){
var st=f.elements.status.value,note=f.elements.note.value.trim();
if(/ارجاع/.test(st)&&!note){toast('برای ارجاع، دلیل الزامی است.','err');return;}
if(sub)sub.disabled=true;
var p=/ارجاع به سرپرست/.test(st)?api('referCardToSupervisor',f.dataset.id,note,TOKEN):api('updateWorkerCardStatus',f.dataset.id,st,note,TOKEN);
return p.then(function(){closeModal();closeDrawer();toast('وضعیت ثبت شد.','ok');
return Promise.all([loadCards(),loadRep()]).then(function(){return loadStatuses();}).then(render);})
.catch(function(x){if(sub)sub.disabled=false;throw x;});}
if(k==='chat-reply'){
var b=f.elements.body.value.trim();if(!b){toast('متن پاسخ الزامی است.','err');return;}
if(sub)sub.disabled=true;
return apiOpt('workerReplyThread',f.dataset.id,b,TOKEN).then(function(r){
if(r)return r;return api('workerReplyConversation',f.dataset.id,b,TOKEN);})
.then(function(){toast('ارسال شد.','ok');return chatOpen(f.dataset.id).then(loadInbox).then(function(){if(PS.page==='messages')render();});})
.catch(function(x){if(sub)sub.disabled=false;throw x;});}
if(k==='msg-sup'){
var cid=f.elements.cardId.value,body=f.elements.body.value.trim(),sj=f.elements.subject.value;
if(!cid){toast('کارت مرتبط را انتخاب کنید.','err');return;}
if(!body){toast('متن پیام الزامی است.','err');return;}
if(sub)sub.disabled=true;
return apiOpt('workerCreateThread',{channel:'SUP',cardId:cid,subject:sj,body:body},TOKEN).then(function(r){
if(r)return r;return api('workerCreateConversation',cid,sj,body,TOKEN);})
.then(function(r){closeModal();toast('گفتگو ایجاد شد.','ok');go('messages');
return loadInbox().then(function(){render();if(r&&r.threadId)return chatOpen(r.threadId);});})
.catch(function(x){if(sub)sub.disabled=false;throw x;});}
if(k==='msg-support'){
var sb=f.elements.body.value.trim();if(!sb){toast('متن پیام الزامی است.','err');return;}
if(sub)sub.disabled=true;
return api('workerCreateThread',{channel:'SUPPORT',subject:f.elements.subject.value,body:sb},TOKEN)
.then(function(r){closeModal();toast('پیام به پشتیبانی ارسال شد.','ok');go('messages');
return loadInbox().then(function(){render();if(r&&r.threadId)return chatOpen(r.threadId);});})
.catch(function(x){if(sub)sub.disabled=false;throw x;});}
if(k==='dev-new'){
var note=f.elements.note.value.trim();if(note.length<10){toast('شرح درخواست حداقل ۱۰ کاراکتر باشد.','err');return;}
if(sub)sub.disabled=true;
return api('workerSubmitDevRequest',{module:f.elements.module.value,kind:f.elements.kind.value,priority:f.elements.priority.value,note:note},TOKEN)
.then(function(r){closeModal();toast('درخواست ثبت شد · '+(r&&r.id||''),'ok');return loadDev().then(render);})
.catch(function(x){if(sub)sub.disabled=false;throw x;});}
if(k==='profile'){
var u=f.elements.username.value.trim(),pw=f.elements.password.value;
if(!u){toast('نام کاربری الزامی است.','err');return;}
if(pw&&pw.length<4){toast('رمز عبور جدید حداقل ۴ کاراکتر باشد.','err');return;}
var p={username:u,description:f.elements.description.value};if(pw)p.password=pw;
if(sub)sub.disabled=true;
return api('updateWorkerProfile',p,TOKEN).then(function(){
USER.username=u;USER.description=p.description;toast('پروفایل ذخیره شد.','ok');
return api('getWorkerProfile',TOKEN).then(function(np){USER=np;paintUser();render();});})
.catch(function(x){if(sub)sub.disabled=false;throw x;});}};
try{var r=run();if(r&&typeof r.catch==='function')r.catch(function(x){toast(x.message||String(x),'err');});}
catch(x){toast(x.message||String(x),'err');}});
document.addEventListener('keydown',function(e){
if((e.ctrlKey||e.metaKey)&&String(e.key).toLowerCase()==='b'){var tg=(e.target&&e.target.tagName||'').toLowerCase();
if(tg==='input'||tg==='textarea'||e.target.isContentEditable)return;e.preventDefault();toggleRail();return;}
if(e.key==='Escape'){if($('#jpop').classList.contains('open')){jdClose();return;}
if($$('.zsel.open').length){zClose();return;}closeModal();closeDrawer();hideTip();return;}
if(e.key==='Enter'&&$('#loginView').style.display!=='none'&&(e.target.id==='loginUser'||e.target.id==='loginPass'))doLogin();});
document.addEventListener('mouseover',function(e){var el=e.target.closest?e.target.closest('.sidebar .nav-item'):null;
if(!el)return;clearTimeout(TIPT);TIPT=setTimeout(function(){showTip(el);},90);});

bootstrap().then(showApp).catch(function(){
