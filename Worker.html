<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>پنل متخصص | ZingoVingo</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23FF6B1A'/%3E%3Cpath d='M13 2 4.5 13.5H11L9.5 22 19 10h-6.5L13 2z' fill='%230B1736'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&family=Nunito:wght@900&display=swap" rel="stylesheet">
<style>
:root{--navy:#0B1736;--brand:#FF6B1A;--brand2:#FF8A3D;--brandDeep:#E4570B;--brandSoft:#FFB25E;
--teal:#0FA3A3;--tealL:#2BD9C8;--blue:#2E63E7;--blueL:#5B9BFF;--violet:#7C4DFF;--violetL:#A78BFA;
--pink:#E0447C;--amber:#D97706;--amberL:#FFC24D;--green:#0E9F6E;--greenL:#46D07C;--red:#E02D3C;--redL:#FF6257;--cyan:#22C9E0;--acid:#9BE24A;--slate:#64748B;
--bg:#070D1F;--surf:#0E1830;--surf2:#132241;--surf3:#0B1730;--surf4:#182B52;
--line:#1D2B4F;--line2:#2C3F6B;--ink:#E9EEFC;--ink2:#C6D2EE;--mut:#93A0C2;--mut2:#6E7DA3;
--scrim:rgba(3,7,20,.72);--sh:0 10px 30px rgba(0,0,0,.42);--sh2:0 22px 60px rgba(0,0,0,.58);
--grad:linear-gradient(135deg,#FF6B1A,#FF8A3D 55%,#FFB25E);--gData:linear-gradient(135deg,#2BD9C8,#2E63E7);
--hero:linear-gradient(125deg,#0B1736,#16295B 40%,#3B2E7E 76%,#7C4DFF 128%);
--r:16px;--tr:180ms cubic-bezier(.3,.9,.3,1);--sbw:272px}
[data-theme=light]{--bg:#EEF1F8;--surf:#fff;--surf2:#F5F7FC;--surf3:#F0F3FA;--surf4:#E4EAF6;
--line:#E2E7F3;--line2:#CBD5E9;--ink:#101A33;--ink2:#2C3A5C;--mut:#5C6784;--mut2:#8592B0;
--scrim:rgba(11,23,54,.5);--sh:0 8px 24px rgba(11,23,54,.09);--sh2:0 20px 50px rgba(11,23,54,.18);
--brandDeep:#C2470A;--tealL:#0FA3A3;--blueL:#2E63E7;--violetL:#7C4DFF;--amberL:#D97706;--greenL:#0E9F6E;--redL:#E02D3C}
*{margin:0;padding:0;box-sizing:border-box}
*{scrollbar-width:thin;scrollbar-color:var(--brandDeep) var(--surf3)}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track{background:var(--surf3);border-radius:9px}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--brand2),var(--brandDeep));border-radius:9px;border:2.5px solid var(--surf3)}
::-webkit-scrollbar-thumb:hover{background:linear-gradient(180deg,var(--brandSoft),var(--brand))}
::selection{background:rgba(255,107,26,.32);color:var(--ink)}
html{font-size:15px;scroll-behavior:smooth}
body{font-family:'Vazirmatn',Tahoma,sans-serif;background:var(--bg);color:var(--ink);line-height:1.78;min-height:100vh;overflow-x:hidden}
body.lock{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:none;cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2.5px solid var(--brand);outline-offset:2px;border-radius:8px}
b,strong{font-weight:800}
.ltr{direction:ltr;unicode-bidi:embed}.num{font-variant-numeric:tabular-nums}
.bw{font-family:'Nunito','Vazirmatn',sans-serif;font-weight:900;letter-spacing:-.5px}.bw span{color:var(--brand2)}
#bgfx{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#bgfx span{position:absolute;border-radius:50%;filter:blur(100px);opacity:.42;display:block}
#bgfx .f1{width:640px;height:640px;top:-16%;right:-9%;background:radial-gradient(circle,#FF6B1A,transparent 66%);animation:drift 34s ease-in-out infinite alternate}
#bgfx .f2{width:560px;height:560px;bottom:-20%;left:4%;background:radial-gradient(circle,#2E63E7,transparent 66%);animation:drift 42s ease-in-out infinite alternate-reverse}
#bgfx .f3{width:440px;height:440px;top:36%;left:-12%;background:radial-gradient(circle,#7C4DFF,transparent 66%);opacity:.3;animation:drift 50s ease-in-out infinite alternate}
#bgfx .f4{width:380px;height:380px;top:8%;left:38%;background:radial-gradient(circle,#0FA3A3,transparent 68%);opacity:.24;animation:drift 38s ease-in-out infinite alternate-reverse}
[data-theme=light] #bgfx span{opacity:.2}
body::after{content:"";position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.055;mix-blend-mode:overlay;background-image:radial-gradient(rgba(255,255,255,.9) 1px,transparent 1.3px);background-size:26px 26px}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(70px,46px) scale(1.14)}}
#app{position:relative;z-index:2}
#sidebar{position:fixed;top:0;right:0;bottom:0;width:var(--sbw);z-index:60;display:flex;flex-direction:column;gap:12px;padding:16px 14px;background:linear-gradient(180deg,rgba(10,21,49,.94),rgba(11,23,54,.94) 45%,rgba(26,20,64,.94));backdrop-filter:blur(16px);border-left:1px solid var(--line);overflow-y:auto;overflow-x:hidden;transition:width 250ms cubic-bezier(.3,.9,.3,1)}
[data-theme=light] #sidebar{background:linear-gradient(180deg,#0A1531,#0B1736 45%,#1A1440)}
.sbrand{display:flex;align-items:center;gap:11px;padding:4px 6px;min-height:48px}
.smark{width:44px;height:44px;flex:0 0 44px;border-radius:14px;background:var(--grad);display:grid;place-items:center;color:#221503;box-shadow:0 6px 20px rgba(255,107,26,.42);animation:glow 3.6s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 6px 18px rgba(255,107,26,.34)}50%{box-shadow:0 6px 30px rgba(255,178,94,.6)}}
.sbrand b{font-size:19px;color:#fff;display:block;line-height:1.3}.sbrand small{display:block;font-size:10px;color:#93A0C2}
.nav{display:flex;flex-direction:column;gap:4px}
.navsec{font-size:9.5px;font-weight:800;color:#6E7DA3;margin:13px 10px 5px}
.navi{display:flex;align-items:center;gap:11px;padding:9.5px 12px;border-radius:12px;font-size:12.5px;font-weight:700;color:#B9C4DE;border:1px solid transparent;position:relative;transition:var(--tr);text-align:right;width:100%}
.navi:hover{color:#fff;background:rgba(255,255,255,.06);transform:translateX(-2px)}
.navi.on{color:#fff;background:linear-gradient(90deg,rgba(255,107,26,.24),rgba(124,77,255,.1));border-color:rgba(255,107,26,.34)}
.navi.on::before{content:"";position:absolute;right:-14px;top:22%;bottom:22%;width:3.5px;border-radius:4px;background:var(--grad)}
.nbdg{margin-inline-start:auto;min-width:21px;height:21px;padding:0 6px;border-radius:99px;background:var(--grad);color:#221503;font-size:10.5px;font-weight:900;display:grid;place-items:center}
.nbdg.v{background:linear-gradient(135deg,#A78BFA,#7C4DFF);color:#fff}
.nbdg.r{background:linear-gradient(135deg,#FF6257,#E02D3C);color:#fff}
.ndot{margin-inline-start:auto;width:8px;height:8px;border-radius:50%;background:var(--brandSoft)}
.sspace{flex:1;min-height:8px}
.srow{display:flex;align-items:center;gap:9px;padding:9px 12px;border:1px solid rgba(255,255,255,.1);border-radius:12px;background:rgba(255,255,255,.04)}
.srow .lbl{font-size:11.5px;font-weight:700;flex:1;color:#D6DEF3}
.srow .lbl small{display:block;font-size:9.5px;color:#8E9BC4;font-weight:500}
.pdot{width:8px;height:8px;border-radius:50%;background:var(--greenL);flex:none;animation:pulse 2.1s infinite}
.pdot.off{background:#6E7DA3;animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(70,208,124,.5)}70%{box-shadow:0 0 0 8px rgba(70,208,124,0)}100%{box-shadow:0 0 0 0 rgba(70,208,124,0)}}
.wchip{padding:10px 13px;border-radius:13px;border:1px solid rgba(255,174,26,.32);background:linear-gradient(135deg,rgba(255,174,26,.15),rgba(255,107,26,.05))}
.wchip .wl{display:flex;align-items:center;gap:6px;font-size:10.5px;color:#C6D2EE}
.wchip .wv{font-size:15px;font-weight:900;color:var(--brandSoft);margin-top:2px;font-variant-numeric:tabular-nums}
.wchip .wv small{font-size:10px;font-weight:600;color:#93A0C2}
.pchip{padding:9px 13px;border-radius:13px;border:1px solid rgba(124,77,255,.34);background:linear-gradient(135deg,rgba(124,77,255,.16),rgba(46,99,231,.06));display:flex;align-items:center;gap:9px;cursor:pointer}
.pchip .pt{flex:1;min-width:0}.pchip .pt b{display:block;font-size:12px;color:#fff}.pchip .pt small{display:block;font-size:9.5px;color:#A9B6D4}
.pchip .pv{font-size:16px;font-weight:900;color:var(--violetL)}
.sme{display:flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid rgba(255,255,255,.1);border-radius:13px;background:rgba(255,255,255,.05)}
.sme .who{flex:1;min-width:0}.sme .who b{display:block;font-size:12.5px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sme .who span{display:block;font-size:9.5px;color:#8E9BC4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sfoot{font-size:9.5px;color:#5F6E93;text-align:center}
.avw{position:relative;flex:none}.avw .pdot{position:absolute;bottom:0;left:0;border:2px solid #0E1830}
html.rail{--sbw:80px}
html.rail .sbrand{justify-content:center;padding:4px 0}html.rail .sbrand>div:last-child{display:none}
html.rail .navsec{font-size:0;height:1px;margin:12px 8px;background:rgba(255,255,255,.18);overflow:hidden}
html.rail .navi{justify-content:center;gap:0;padding:11px 0}html.rail .navi>span{display:none}
html.rail .navi .nbdg{position:absolute;top:4px;left:6px;margin:0;min-width:9px;width:9px;height:9px;padding:0;font-size:0;box-shadow:0 0 0 2px #0B1736}
html.rail .navi .ndot{position:absolute;top:6px;left:8px;margin:0}
html.rail .srow,html.rail .wchip,html.rail .pchip{padding:8px 6px;justify-content:center}
html.rail .srow .lbl,html.rail .wchip .wl,html.rail .wchip .wv,html.rail .pchip .pt,html.rail .pchip .pv,html.rail .sme .who,html.rail .sme .ibtn,html.rail .sfoot{display:none}
html.rail .sme{justify-content:center;padding:8px 4px}
#tip{position:fixed;z-index:300;pointer-events:none;background:linear-gradient(135deg,#0B1736,#3B2E7E);color:#fff;font-size:11.5px;font-weight:800;padding:7px 12px;border-radius:10px;white-space:nowrap;border:1px solid rgba(255,138,61,.4);box-shadow:0 12px 30px rgba(0,0,0,.5);opacity:0;transition:opacity 140ms}
#tip.on{opacity:1}#tip b{color:var(--brandSoft);margin-right:6px;font-size:10.5px}
#main{margin-right:var(--sbw);min-height:100vh;transition:margin-right 250ms cubic-bezier(.3,.9,.3,1)}
#topbar{position:sticky;top:0;z-index:50;height:66px;display:flex;align-items:center;gap:10px;padding:0 22px;background:color-mix(in srgb,var(--bg) 84%,transparent);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.tbt h2{font-size:16.5px;font-weight:900;line-height:1.35}.tbt p{font-size:10.5px;color:var(--mut)}
.tbsp{flex:1}
.ibtn{width:39px;height:39px;border-radius:11px;border:1px solid var(--line);background:var(--surf);color:var(--mut);display:grid;place-items:center;position:relative;transition:var(--tr);flex:none}
.ibtn:hover{color:var(--brand);border-color:rgba(255,107,26,.5);transform:translateY(-1px)}
.ibtn.on{color:var(--brandSoft);border-color:rgba(255,174,26,.45);background:rgba(255,174,26,.1)}
.bbell{position:absolute;top:-5px;left:-5px;min-width:18px;height:18px;padding:0 4px;border-radius:99px;background:var(--red);color:#fff;font-size:9.5px;font-weight:900;display:grid;place-items:center;border:2px solid var(--bg)}
.vr{width:1px;height:26px;background:var(--line);margin:0 2px}
.avbtn{display:flex;align-items:center;gap:9px;padding:5px 10px 5px 6px;border-radius:12px;border:1px solid var(--line);background:var(--surf);transition:var(--tr)}
.avbtn:hover{border-color:rgba(255,107,26,.5)}.avbtn b{font-size:12.5px}
#menuBtn{display:none}.bmini{display:none;align-items:center;gap:8px;font-weight:900;font-size:15px}
.bmini .smark{width:32px;height:32px;flex-basis:32px;border-radius:9px}
html.rail #railBtn .ra{transform:scaleX(-1)}
#railBtn .ra{transition:transform 250ms}
#content{padding:22px;max-width:1400px;margin:0 auto}
.vhead{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.vhead h2{font-size:21px;font-weight:900;line-height:1.4}
.vhead .grad{background:linear-gradient(100deg,#FFB25E,#2BD9C8);-webkit-background-clip:text;background-clip:text;color:transparent}
.vhead p{font-size:12.5px;color:var(--mut)}.vhead .sp{flex:1}
.card{background:linear-gradient(180deg,var(--surf2),var(--surf));border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
[data-theme=light] .card{background:var(--surf)}
.pad{padding:17px}
.chead{display:flex;align-items:center;gap:9px;margin-bottom:12px;flex-wrap:wrap}
.chead h3{font-size:14.5px;font-weight:900;flex:1;min-width:120px}.chead .ic{color:var(--tealL)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 17px;border-radius:12px;font-size:12.5px;font-weight:800;border:1px solid transparent;transition:var(--tr);white-space:nowrap}
.btn:active{transform:scale(.97)}.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn.sm{height:33px;padding:0 12px;font-size:11.5px;border-radius:10px;gap:6px}
.btn.p{background:var(--grad);color:#221503;box-shadow:0 6px 18px rgba(255,107,26,.3)}
.btn.p:hover:not(:disabled){filter:brightness(1.07);transform:translateY(-1px)}
.btn.v{background:linear-gradient(135deg,#A78BFA,#7C4DFF);color:#fff}
.btn.t{background:linear-gradient(135deg,#2BD9C8,#0FA3A3);color:#04211C}
.btn.g{background:linear-gradient(135deg,#46D07C,#0E9F6E);color:#06220F}
.btn.gh{border-color:var(--line2);color:var(--ink);background:var(--surf2)}
.btn.gh:hover:not(:disabled){border-color:rgba(255,107,26,.55);color:var(--brand)}
.btn.d{border-color:rgba(224,45,60,.42);color:var(--redL);background:rgba(224,45,60,.08)}
.chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 13px;border-radius:99px;font-size:11.5px;font-weight:800;border:1px solid var(--line);color:var(--mut);background:var(--surf3);transition:var(--tr)}
.chip:hover{color:var(--ink);border-color:var(--line2)}
.chip.on{color:#04211C;background:linear-gradient(135deg,#2BD9C8,#0FA3A3);border-color:transparent}
.chip .cnt{font-size:10px;background:rgba(0,0,0,.16);border-radius:99px;padding:0 6px;min-width:19px;text-align:center}
.chip:not(.on) .cnt{background:var(--surf4)}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;font-weight:900;padding:3px 10px;border-radius:99px;border:1px solid;white-space:nowrap}
.badge i{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.b-new{color:var(--brandSoft);background:rgba(255,174,26,.13);border-color:rgba(255,174,26,.38)}
.b-new i{animation:pulse 1.9s infinite}
.b-quoted{color:var(--blueL);background:rgba(46,99,231,.14);border-color:rgba(46,99,231,.4)}
.b-accepted{color:var(--tealL);background:rgba(15,163,163,.14);border-color:rgba(15,163,163,.4)}
.b-doing{color:var(--violetL);background:rgba(124,77,255,.15);border-color:rgba(124,77,255,.42)}
.b-doing i{animation:pulse 1.6s infinite}
.b-done{color:var(--greenL);background:rgba(14,159,110,.14);border-color:rgba(14,159,110,.4)}
.b-declined{color:var(--redL);background:rgba(224,45,60,.12);border-color:rgba(224,45,60,.4)}
.b-gray{color:var(--mut);background:var(--surf3);border-color:var(--line)}
.inp{width:100%;height:42px;padding:0 13px;border-radius:12px;border:1px solid var(--line);background:var(--surf3);font-size:13px;transition:var(--tr);color:var(--ink)}
.inp:focus{outline:none;border-color:rgba(255,107,26,.65);box-shadow:0 0 0 3px rgba(255,107,26,.15)}
.inp.bad{border-color:var(--redL);box-shadow:0 0 0 3px rgba(224,45,60,.15)}
.inp[readonly]{background:rgba(255,107,26,.1);border-color:rgba(255,107,26,.3);color:var(--brandSoft);font-weight:800}
textarea.inp{height:auto;min-height:86px;padding:10px 13px;resize:vertical;line-height:1.95}
select.inp{appearance:none;-webkit-appearance:none;cursor:pointer;padding-left:34px}
select.inp option{background:#0E1830;color:#E9EEFC}
.selw{position:relative}.selw .ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--mut)}
.sw{width:44px;height:25px;border-radius:99px;background:var(--surf4);border:1px solid var(--line2);position:relative;transition:var(--tr);flex:none}
.sw .knob{position:absolute;top:2px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--mut2);transition:var(--tr)}
.sw[aria-checked=true]{background:linear-gradient(135deg,#2BD9C8,#0FA3A3);border-color:transparent}
.sw[aria-checked=true] .knob{left:calc(100% - 21px);background:#04211C}
.ck{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--line2);background:var(--surf3);display:grid;place-items:center;transition:var(--tr);flex:none;color:#221503}
.ck .ic{opacity:0;transform:scale(.4);transition:var(--tr)}
.ck[aria-checked=true]{background:var(--grad);border-color:var(--brand)}
.ck[aria-checked=true] .ic{opacity:1;transform:scale(1)}
.ck.part{background:rgba(255,174,26,.26);border-color:var(--brandSoft);color:var(--brandSoft)}
.ck.part .ic{opacity:1;transform:scale(1)}
.tile{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none;border:1px solid}
.banner{display:flex;align-items:flex-start;gap:10px;padding:11px 14px;border-radius:12px;font-size:12px;border:1px solid;line-height:1.85}
.banner .ic{flex:none;margin-top:3px}
.banner.info{background:rgba(46,99,231,.1);border-color:rgba(46,99,231,.34);color:var(--blueL)}
.banner.warn{background:rgba(255,174,26,.1);border-color:rgba(255,174,26,.34);color:var(--brandSoft)}
.banner.ok{background:rgba(15,163,163,.11);border-color:rgba(15,163,163,.38);color:var(--tealL)}
.banner.bad{background:rgba(224,45,60,.1);border-color:rgba(224,45,60,.38);color:var(--redL)}
.banner.vio{background:rgba(124,77,255,.11);border-color:rgba(124,77,255,.38);color:var(--violetL)}
.banner .sp{flex:1}
.empty{padding:44px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.empty h4{font-size:15px;font-weight:900}.empty p{font-size:12.5px;color:var(--mut);max-width:360px}
.stag>*{animation:up .5s cubic-bezier(.2,.9,.25,1) both;animation-delay:calc(var(--d,0)*55ms)}
@keyframes up{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
.mchip{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;color:var(--mut);background:var(--surf3);border:1px solid var(--line);padding:3px 9px;border-radius:8px}
.mchip .ic{width:13px;height:13px}
.mchip.hot{color:var(--redL);border-color:rgba(224,45,60,.4);background:rgba(224,45,60,.08)}
.mchip.money{color:var(--brandSoft);border-color:rgba(255,174,26,.32)}
.mchip.ok{color:var(--tealL);border-color:rgba(15,163,163,.35)}
.bar{height:7px;border-radius:99px;background:var(--surf4);overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;border-radius:99px;background:var(--gData);transition:width .85s cubic-bezier(.2,.9,.25,1)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(198px,1fr));gap:14px;margin-bottom:18px}
.kpi{padding:15px 16px;display:flex;flex-direction:column;gap:8px;transition:var(--tr)}
.kpi.click{cursor:pointer}.kpi.click:hover{transform:translateY(-3px);border-color:rgba(255,107,26,.5)}

function setRate(id,v,silent){var s=S.services.filter(function(x){return x.id===id;})[0];if(!s)return;

var f=$('[data-fmt="'+id+'"]');if(f)f.innerHTML=money(cl)+'<span class="tk">✓</span>';

function svcDel(id){var i=-1;S.services.forEach(function(x,k){if(x.id===id)i=k;});if(i<0)return;var s=S.services.splice(i,1)[0];

function bulkPct(p){var act=S.services.filter(function(s){return s.active;});if(!act.length){toast("warn","خدمت فعالی وجود ندارد.");return;}
var snap=act.map(function(s){return{id:s.id,rate:s.myRate};}),hits=0;
act.forEach(function(s){var ce=ceilOf(s),want=Math.round(s.myRate*(1+p/100)/1000)*1000;if(want>ce)hits++;s.myRate=clamp(want,s.floor,ce);});
logAct("percent","#FFAE1A","نرخ "+fa(act.length)+" خدمت "+(p>0?"۱۰٪ افزایش":"۱۰٪ کاهش")+" یافت");beep(SND.tick);save();renderView();
toast(hits?"warn":"success","نرخ "+fa(act.length)+" خدمت تغییر یافت."+(hits?" "+fa(hits)+" مورد به سقف خورد.":""),{label:"بازگردانی",fn:function(){snap.forEach(function(x){var s=S.services.filter(function(y){return y.id===x.id;})[0];if(s)s.myRate=x.rate;});save();if(U.view==="rates")renderView();}});}
function toCeiling(){var act=S.services.filter(function(s){return s.active;});if(!act.length)return;
var snap=act.map(function(s){return{id:s.id,rate:s.myRate};}),gain=0;
act.forEach(function(s){var ce=ceilOf(s);gain+=Math.max(0,ce-s.myRate);s.myRate=ce;});
logAct("trend","#0FA3A3","همه نرخ‌ها به سقف مجاز رسید");beep(SND.up);save();renderView();
toast("success","نرخ‌ها به سقف رسید — ظرفیت آزادشده: <b>"+money(gain)+"</b>",{label:"بازگردانی",fn:function(){snap.forEach(function(x){var s=S.services.filter(function(y){return y.id===x.id;})[0];if(s)s.myRate=x.rate;});save();if(U.view==="rates")renderView();}});}

var ow=S.wallet;S.wallet+=amt;logAct("wallet","#46D07C","کیف پول "+money(amt)+" شارژ شد");notify("pay","مبلغ "+money(amt)+" به کیف پول اضافه شد.");

document.addEventListener("input",function(e){var t=e.target;
if(t.id==="q"){U.q=t.value;$("#qclear").classList.toggle("hidden",!U.q);renderOrders();return;}
if(t.id==="rateQ"){U.rateQ=t.value;var l=$("#svcList");if(l){var q=U.rateQ.trim().toLowerCase(),list=S.services.filter(function(s){return !q||(s.name+" "+CATS[s.cat].label).toLowerCase().indexOf(q)>=0;});
l.innerHTML=list.length?list.map(svcRow).join(""):'<div class="card empty">'+emptySVG()+'<h4>خدمتی یافت نشد</h4></div>';}return;}
if(t.id==="qp"){setPrice(num(t.value));return;}
if(t.id==="qRange"){setPrice(+t.value);return;}
if(t.id==="qn"){if(U.draft)U.draft.note=t.value;return;}
if(t.id==="pfBio"){var c=$("#bioCnt");if(c)c.textContent=fa(t.value.length)+" / ۳۰۰";return;}
if(t.id==="comIn"){S.commission=+t.value;var v=$("#comVal"),n=$("#comNet");if(v)v.textContent=fa(S.commission)+"٪";if(n)n.textContent=money(netOf(1e7));save();return;}
if(t.getAttribute&&t.getAttribute("data-rate")){var s=S.services.filter(function(x){return x.id===t.getAttribute("data-rate");})[0];
if(s){var vv=num(t.value);s.myRate=vv;var f=$('[data-fmt="'+s.id+'"]');if(f)f.innerHTML=money(vv)+'<span class="tk">✓</span>';save();}return;}});
document.addEventListener("change",function(e){var t=e.target;
if(t.id==="sortSel"){U.sort=t.value;renderOrders();return;}
if(t.id==="presetSel"){U.preset=t.value;
if(t.value==="urgentToday"){U.urgent=true;U.sort="urgent";U.filter="all";}
else if(t.value==="near"){U.urgent=false;U.sort="near";U.filter="all";}
else if(t.value==="rich"){U.urgent=false;U.sort="budget";U.filter="all";}else U.urgent=false;
var s2=$("#sortSel");if(s2)s2.value=U.sort;var u2=$("#urgChip");if(u2)u2.classList.toggle("on",U.urgent);renderOrders();return;}
if(t.id==="qQty"){setQty(num(t.value));return;}
if(t.id==="qh"){if(U.draft)U.draft.hrs=t.value;return;}
if(t.id==="qwd"){if(U.draft)U.draft.warDays=+t.value;return;}
if(t.id==="buyMembers"){if(U.buy){U.buy.members=+t.value;updateBuy();}return;}
if(t.id==="buyMethod"){if(U.buy){U.buy.method=t.value;updateBuy();}return;}});
document.addEventListener("focusout",function(e){var t=e.target;
if(t.getAttribute&&t.getAttribute("data-rate")){var s=S.services.filter(function(x){return x.id===t.getAttribute("data-rate");})[0];
if(s){setRate(s.id,s.myRate);t.value=s.myRate;}return;}
if(t.id==="qp"&&U.draft){var b=bounds();if(b){U.draft.price=clamp(U.draft.price,b.lo,b.hi);t.value=U.draft.price;updateFee();}return;}});
document.addEventListener("keydown",function(e){
if((e.ctrlKey||e.metaKey)&&String(e.key).toLowerCase()==="b"){var tg=(e.target.tagName||"").toLowerCase();if(tg==="input"||tg==="textarea")return;e.preventDefault();toggleRail();return;}
if(e.key==="Escape"){if($("#mwrap").classList.contains("open"))closeModal();else if(U.drawerId)closeDrawer();
else if(document.body.classList.contains("nav")){document.body.classList.remove("nav");lock();}
else if(U.notifOpen){U.notifOpen=false;renderNP();}hideTip();return;}
if(e.key==="Enter"&&e.target.id==="skInp"){e.preventDefault();addSkill();return;}
if(e.key==="Enter"&&e.target.classList&&e.target.classList.contains("oc")){openOrder(e.target.getAttribute("data-id"));return;}
if(e.key==="/"&&!/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)&&U.view==="orders"){e.preventDefault();var i=$("#q");if(i)i.focus();}});
document.addEventListener("mouseover",function(e){
var leg=e.target.closest("[data-leg]");if(leg){$$("#donut [data-seg]").forEach(function(g){g.classList.toggle("dim",g.getAttribute("data-seg")!==leg.getAttribute("data-leg"));});}
var nv=e.target.closest(".navi");if(nv){clearTimeout(TIPT);TIPT=setTimeout(function(){showTip(nv);},90);}});
document.addEventListener("mouseout",function(e){
if(e.target.closest("[data-leg]"))$$("#donut [data-seg]").forEach(function(g){g.classList.remove("dim");});
if(e.target.closest(".navi")){clearTimeout(TIPT);hideTip();}});
document.addEventListener("dragstart",function(e){var g=e.target.closest("[data-drag]");if(!g)return;U.dragSvc=g.getAttribute("data-drag");
e.dataTransfer.effectAllowed="move";try{e.dataTransfer.setData("text/plain",U.dragSvc);}catch(x){}});
document.addEventListener("dragover",function(e){var r=e.target.closest("[data-row]");if(!r||!U.dragSvc)return;e.preventDefault();
$$(".svc.over").forEach(function(x){x.classList.remove("over");});r.classList.add("over");});
document.addEventListener("drop",function(e){var r=e.target.closest("[data-row]");if(!r||!U.dragSvc)return;e.preventDefault();
var f=-1,t=-1;S.services.forEach(function(s,i){if(s.id===U.dragSvc)f=i;if(s.id===r.getAttribute("data-row"))t=i;});
if(f>=0&&t>=0&&f!==t){var m=S.services.splice(f,1)[0];S.services.splice(t,0,m);save();renderView();beep(SND.tick);}
U.dragSvc=null;$$(".svc.over").forEach(function(x){x.classList.remove("over");});});
document.addEventListener("dragend",function(){U.dragSvc=null;$$(".svc.over").forEach(function(x){x.classList.remove("over");});});
window.addEventListener("scroll",hideTip,true);
window.addEventListener("resize",function(){hideTip();if(U.view==="dashboard")bindChart();});
window.addEventListener("beforeunload",persist);
$("#avFile").addEventListener("change",function(e){var f=e.target.files&&e.target.files[0];e.target.value="";if(!f||!U.pTmp)return;
if(f.type.indexOf("image/")!==0){toast("danger","فقط فایل تصویری مجاز است.");return;}
if(f.size>2.5*1024*1024){toast("danger","حجم تصویر باید کمتر از ۲ مگابایت باشد.");return;}
var rd=new FileReader();rd.onload=function(){var img=new Image();
img.onload=function(){try{var side=Math.min(img.width,img.height),cv=document.createElement("canvas");cv.width=cv.height=256;
var cx=cv.getContext("2d");cx.fillStyle="#0E1830";cx.fillRect(0,0,256,256);
cx.drawImage(img,(img.width-side)/2,(img.height-side)/2,side,side,0,0,256,256);
U.pTmp.avatar={type:"upload",data:cv.toDataURL("image/jpeg",.86)};refreshAvPick();beep(SND.tick);
toast("success","تصویر آماده شد؛ «ذخیره تغییرات» را بزنید.");}catch(x){toast("danger","پردازش تصویر ممکن نشد.");}};
img.onerror=function(){toast("danger","تصویر خوانده نشد.");};img.src=rd.result;};
rd.onerror=function(){toast("danger","خواندن فایل ممکن نشد.");};rd.readAsDataURL(f);});

try{if(localStorage.getItem("zv_wrk_rail")==="1")document.documentElement.classList.add("rail");}catch(e){}

S.orders.filter(function(o){return o.status==="quoted";}).forEach(function(o){scheduleDec(o.id,15000+Math.random()*15000);});
queueSim(true);})();
