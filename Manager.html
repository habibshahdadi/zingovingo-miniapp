<style>
:root{--navy:#0B1736;--navy2:#13234D;--brand:#FF6B1A;--brand2:#FF8A3D;--brandDeep:#E4570B;
--blue:#2E63E7;--violet:#7C4DFF;--teal:#0FA3A3;--green:#0E9F6E;--amber:#D97706;--red:#E02D3C;--pink:#E0447C;--slate:#64748B;
--bg:#F3F5FB;--surface:#fff;--surface2:#F6F8FD;--ink:#101A33;--muted:#5C6784;--line:#E2E7F3;--line2:#D3DAEC;
--scrim:rgba(7,13,31,.58);--sh:0 6px 22px rgba(11,23,54,.07);--sh2:0 16px 44px rgba(11,23,54,.16);
--r:16px;--tr:180ms ease;--grad:linear-gradient(135deg,#FF6B1A,#FF8A3D 55%,#FFB25E);
--hero:linear-gradient(120deg,#0B1736,#16295B 40%,#3B2E7E 74%,#7C4DFF 128%);
--glass:rgba(148,163,184,.16);--glassBrd:rgba(100,116,139,.28);--panBg:rgba(17,26,48,.95);--rail:78px}
[data-theme=dark]{--bg:#070D1F;--surface:#0E1830;--surface2:#121F3D;--ink:#E9EEFC;--muted:#93A0C2;--line:#1D2B4F;--line2:#27375F;--scrim:rgba(2,6,18,.74);--sh:0 8px 26px rgba(0,0,0,.42);--sh2:0 18px 50px rgba(0,0,0,.58);--glass:rgba(203,213,225,.11);--glassBrd:rgba(148,163,184,.26)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Vazirmatn,Tahoma,sans-serif;background:var(--bg);color:var(--ink);font-size:13.5px;line-height:1.8;min-height:100vh;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;z-index:-2;background:radial-gradient(700px 420px at 92% -6%,rgba(255,107,26,.14),transparent 60%),radial-gradient(640px 460px at -8% 108%,rgba(124,77,255,.14),transparent 60%),radial-gradient(520px 380px at 55% 118%,rgba(15,163,163,.09),transparent 60%)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid rgba(255,107,26,.45);outline-offset:2px;border-radius:8px}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--line2),var(--slate));border-radius:9px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:linear-gradient(180deg,var(--brand2),var(--brandDeep))}
svg.ic{width:18px;height:18px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#zvFatal{display:none;position:fixed;top:0;left:0;right:0;z-index:999;background:#E02D3C;color:#fff;padding:10px 16px;font-size:12px;direction:ltr}
.brand h1,.lbox h1{font-family:'Nunito','Vazirmatn',sans-serif!important;font-weight:900!important;letter-spacing:-.5px}
.brand h1 span,.lbox h1 span{color:var(--brand2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:38px;padding:8px 16px;border-radius:11px;border:1px solid transparent;font-size:12.5px;font-weight:800;cursor:pointer;transition:all var(--tr);white-space:nowrap}
.btn:hover{transform:translateY(-1px)}.btn:disabled{opacity:.55;cursor:not-allowed;transform:none}
.btn-p{background:var(--grad);color:#fff;box-shadow:0 6px 18px rgba(255,107,26,.35)}
.btn-v{background:linear-gradient(135deg,#7C4DFF,#9E7BFF);color:#fff;box-shadow:0 6px 18px rgba(124,77,255,.32)}
.btn-s{background:var(--surface2);border-color:var(--line);color:var(--ink)}.btn-s:hover{border-color:var(--brand);color:var(--brandDeep)}
.btn-d{background:rgba(224,45,60,.12);color:var(--red)}
.btn-sm{min-height:30px;padding:5px 11px;font-size:11.5px}
.btn-i{width:31px;height:31px;min-height:31px;padding:0;border-radius:9px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:18px}
.grid{display:grid;gap:16px}.kpis{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--sh);position:relative;overflow:hidden;transition:transform var(--tr)}
.kpi:hover{transform:translateY(-3px)}
.kpi .top{display:flex;justify-content:space-between;align-items:center}
.kpi .chip{width:38px;height:38px;border-radius:12px;display:grid;place-items:center}
.kpi .l{font-size:11.5px;color:var(--muted);font-weight:700;margin-top:10px}
.kpi .v{font-size:21px;font-weight:900;font-variant-numeric:tabular-nums;margin-top:2px}
.kpi .s{font-size:10.5px;color:var(--muted)}
.kpi svg.spark{position:absolute;bottom:0;left:0;width:100%;height:34px;opacity:.5;pointer-events:none}
.hero{background:var(--hero);color:#fff;border-radius:20px;padding:26px 28px;position:relative;overflow:hidden;margin-bottom:18px}
.hero:before{content:"";position:absolute;inset:0;background:radial-gradient(420px 220px at 88% 18%,rgba(255,107,26,.4),transparent 60%),radial-gradient(320px 210px at 8% 112%,rgba(15,163,163,.3),transparent 60%)}
.hero:after{content:"";position:absolute;inset:0;opacity:.16;background-image:radial-gradient(rgba(255,255,255,.85) 1px,transparent 1px);background-size:22px 22px}
.hero>*{position:relative;z-index:1}
.hero h2{font-size:21px;font-weight:900}.hero p{color:#D3DCF5;font-size:12px;margin-top:4px}
.hero .acts{display:flex;gap:9px;margin-top:16px;flex-wrap:wrap}
.hero .btn-s{background:rgba(255,255,255,.13);border-color:rgba(255,255,255,.22);color:#fff}
.hero .dchip{position:absolute;left:26px;top:24px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.24);padding:7px 14px;border-radius:12px;font-size:12px;font-weight:800;display:inline-flex;align-items:center;gap:7px}
.gauge{display:flex;align-items:center;gap:16px;margin-top:18px;flex-wrap:wrap}
.gauge .ring{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;position:relative;flex:0 0 96px}
.gauge .ring b{font-size:24px;font-weight:900}
.gauge .ring small{position:absolute;bottom:16px;font-size:9px;opacity:.8}
.gauge .txt{flex:1;min-width:200px}
.gauge .txt b{font-size:14px;display:block}
.gauge .txt span{font-size:11.5px;color:#D3DCF5}
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,var(--navy),#3B2E7E)}
.lbox{background:var(--surface);border-radius:22px;padding:34px;width:min(430px,100%);box-shadow:0 20px 60px #0004}
.lbox h1{text-align:center;color:var(--ink);font-size:27px}
.lbox .sub{text-align:center;color:var(--muted);font-size:12px;margin:6px 0 20px}
.errbox{display:none;background:rgba(224,45,60,.1);color:var(--red);padding:10px;border-radius:10px;font-size:12px;margin-bottom:12px}
.zv-login-logo{display:flex;justify-content:center;margin:0 auto 14px;width:82px;height:82px}
.zv-login-logo img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 8px 20px rgba(11,23,54,.22))}
#app{display:none;grid-template-columns:272px minmax(0,1fr);min-height:100vh;transition:grid-template-columns 240ms cubic-bezier(.3,.9,.3,1)}
.sidebar{background:linear-gradient(180deg,#0A1531,#0B1736 40%,#1A1440);color:#C7D1E8;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;z-index:60;transition:width 240ms cubic-bezier(.3,.9,.3,1)}
.brand{display:flex;gap:11px;align-items:center;padding:20px}
.mark{width:42px;height:42px;border-radius:14px;background:var(--grad);display:grid;place-items:center;color:#fff;box-shadow:0 6px 18px rgba(255,107,26,.45);overflow:hidden}
.mark.zv-logo{background:transparent!important;box-shadow:none!important}
.mark img{width:100%;height:100%;object-fit:contain}
.brand h1{font-size:19px;color:#fff}.brand small{display:block;font-size:10px;color:#8E9BC4}
.nav{flex:1;padding:6px 12px 12px}
.nav-sec{font-size:10px;font-weight:800;color:#7C89B4;margin:15px 10px 6px}
.nav-item{display:flex;align-items:center;gap:11px;padding:9.5px 12px;margin:2px 0;border-radius:11px;color:#B9C4DE;font-size:12.5px;font-weight:700;cursor:pointer;transition:all var(--tr);position:relative}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff}
.nav-item.on{background:linear-gradient(90deg,rgba(255,107,26,.22),rgba(124,77,255,.12));color:#fff}
.nav-item.on:before{content:"";position:absolute;right:-12px;top:8px;bottom:8px;width:3.5px;border-radius:4px;background:var(--grad)}
.nav-item.soon{opacity:.72}
.bdg{margin-right:auto;background:var(--brand);color:#fff;font-size:10px;font-weight:900;min-width:20px;height:20px;padding:0 6px;border-radius:12px;display:grid;place-items:center}
.bdg.b{background:var(--blue)}.bdg.r{background:var(--red)}.bdg.v{background:var(--violet)}.bdg.t{background:var(--teal)}.bdg.a{background:var(--amber)}
.side-foot{padding:14px;border-top:1px solid rgba(255,255,255,.08)}
.uchip{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:12px;background:rgba(255,255,255,.05)}
.uchip b{color:#fff;font-size:12.5px;display:block}.uchip small{color:#8E9BC4;font-size:10px}
.av{width:36px;height:36px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;font-weight:900;overflow:hidden;flex:0 0 auto;cursor:pointer}
.av img{width:100%;height:100%;object-fit:cover}
.av.lg{width:96px;height:96px;font-size:32px;border:3px solid var(--surface);box-shadow:0 0 0 2px var(--line)}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:12px;padding:12px 26px;background:color-mix(in srgb,var(--surface) 86%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.topbar h2{font-size:17px;font-weight:900}.crumb{font-size:11px;color:var(--muted)}.sp{flex:1}
.sbtn{display:flex;align-items:center;gap:9px;padding:8px 14px;border:1px solid var(--line);border-radius:11px;background:var(--surface2);color:var(--muted);cursor:pointer;font-size:12px;min-width:200px}
.sbtn kbd{margin-right:auto;background:var(--surface);border:1px solid var(--line2);border-radius:6px;padding:1px 7px;font-size:10px}
.ibtn{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--muted);position:relative}
.ibtn:hover{color:var(--brand);border-color:var(--brand)}
.ibtn .dot{position:absolute;top:7px;left:8px;width:8px;height:8px;border-radius:50%;background:var(--red);border:2px solid var(--surface)}
.rail-btn .ra{transition:transform 240ms}
html.zv-rail .rail-btn{color:var(--brandDeep);border-color:rgba(255,107,26,.45);background:rgba(255,107,26,.1)}
html.zv-rail .rail-btn .ra{transform:scaleX(-1)}
html.zv-rail #app{grid-template-columns:var(--rail) minmax(0,1fr)}
html.zv-rail .sidebar{width:var(--rail);overflow-x:hidden}
html.zv-rail .sidebar .brand{padding:18px 0;justify-content:center;gap:0}
html.zv-rail .sidebar .brand>div:last-child{display:none}
html.zv-rail .sidebar .mark{width:40px;height:40px}
html.zv-rail .sidebar .nav{padding:6px 10px 12px}
html.zv-rail .sidebar .nav-sec{font-size:0;height:1px;margin:14px 8px 12px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.2),transparent);overflow:hidden}
html.zv-rail .sidebar .nav-item{justify-content:center;gap:0;padding:11px 0}
html.zv-rail .sidebar .nav-item>span{display:none}
html.zv-rail .sidebar .nav-item .bdg{position:absolute;top:5px;left:7px;margin:0;min-width:9px;width:9px;height:9px;padding:0;font-size:0;box-shadow:0 0 0 2px #0B1736}
html.zv-rail .sidebar .side-foot{padding:12px 8px}
html.zv-rail .sidebar .uchip{flex-direction:column;gap:9px;padding:10px 4px}
html.zv-rail .sidebar .uchip>div:not(.av){display:none}
html.zv-rail .sidebar .av{width:34px;height:34px;font-size:14px}
#zvTip{position:fixed;z-index:300;pointer-events:none;background:linear-gradient(135deg,#0B1736,#3B2E7E);color:#fff;font-size:11.5px;font-weight:800;padding:7px 12px;border-radius:10px;white-space:nowrap;border:1px solid rgba(255,138,61,.35);box-shadow:0 12px 30px rgba(3,7,20,.45);opacity:0;transition:opacity 140ms}
#zvTip.on{opacity:1}
#zvTip b{color:#FFB25E;margin-right:6px;font-size:10.5px}
#page{padding:24px 26px 60px;max-width:1620px;width:100%;margin:0 auto}
.ph{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.ph h1{font-size:20px;font-weight:900}.ph .sub{font-size:11.5px;color:var(--muted)}
.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.inp,.sel{min-height:37px;padding:7px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:12px}
.inp:focus,.sel:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 3px rgba(255,107,26,.12)}
.sw{position:relative;min-width:230px;flex:1;max-width:340px}
.sw .ic{position:absolute;right:11px;top:10px;width:16px;height:16px;color:var(--muted)}
.sw input{width:100%;padding-right:36px}
.bulk{display:none;align-items:center;gap:10px;flex-wrap:wrap;background:linear-gradient(90deg,rgba(255,107,26,.1),rgba(124,77,255,.08));border:1px solid rgba(255,107,26,.3);padding:9px 14px;border-radius:12px;margin-bottom:12px;font-size:12px}
.bulk.show{display:flex}
.tw{overflow:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
table.tb{width:100%;border-collapse:collapse;font-size:12.5px;min-width:820px}
.tb th{position:sticky;top:0;background:var(--surface2);color:var(--muted);font-size:11px;font-weight:900;text-align:right;padding:11px 13px;border-bottom:1px solid var(--line);white-space:nowrap;z-index:2;cursor:pointer}
.tb td{padding:10px 13px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
.tb tbody tr:hover{background:color-mix(in srgb,var(--brand) 4%,var(--surface))}
.num{font-variant-numeric:tabular-nums}.ltr{direction:ltr;text-align:right}
.ra{display:flex;gap:5px;justify-content:flex-end}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--brand);cursor:pointer}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3.5px 11px;border-radius:20px;font-size:11px;font-weight:800;white-space:nowrap}
.pill:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-blue{background:rgba(46,99,231,.12);color:var(--blue)}.p-green{background:rgba(14,159,110,.13);color:var(--green)}
.p-amber{background:rgba(217,119,6,.13);color:var(--amber)}.p-red{background:rgba(224,45,60,.12);color:var(--red)}
.p-violet{background:rgba(124,77,255,.12);color:var(--violet)}.p-teal{background:rgba(15,163,163,.13);color:var(--teal)}
.p-gray{background:rgba(100,116,139,.14);color:var(--slate)}.p-brand{background:rgba(255,107,26,.13);color:var(--brandDeep)}
.p-pink{background:rgba(224,68,124,.12);color:var(--pink)}
.pager{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 4px 0;font-size:11.5px;color:var(--muted);flex-wrap:wrap}
.empty{text-align:center;padding:52px 20px;color:var(--muted)}
.empty .ei{width:74px;height:74px;margin:0 auto 14px;border-radius:22px;background:linear-gradient(135deg,rgba(255,107,26,.14),rgba(124,77,255,.14));display:grid;place-items:center;color:var(--brand)}
.empty .ei .ic{width:32px;height:32px}.empty h4{color:var(--ink);font-size:14px;margin-bottom:4px}
.tabs{display:flex;gap:5px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tab{padding:9px 16px;font-size:12.5px;font-weight:800;color:var(--muted);cursor:pointer;border-bottom:2.5px solid transparent;white-space:nowrap}
.tab.on{color:var(--brandDeep);border-bottom-color:var(--brand)}
.charts{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.cbox{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--sh)}
.cbox h3{font-size:13px;font-weight:900;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.cwrap{position:relative;height:250px}
.rank{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:11px;background:var(--surface2);margin-bottom:7px;font-size:12px}
.rank .rk{width:24px;height:24px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;font-size:10.5px;font-weight:900;flex:0 0 auto}
.rank .info{flex:1;min-width:0}.rank b{display:block;font-size:12px}.rank small{color:var(--muted);font-size:10px}
.rank .v{font-weight:900;color:var(--brandDeep)}
.bar{height:8px;border-radius:8px;background:var(--surface2);border:1px solid var(--line);overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:var(--grad);width:0;transition:width .9s cubic-bezier(.3,.9,.3,1)}
.kanban{display:flex;gap:13px;overflow-x:auto;padding-bottom:14px;align-items:flex-start}
.kcol{min-width:270px;width:270px;flex:0 0 auto;background:var(--surface2);border:1px solid var(--line);border-radius:15px;padding:10px}
.kcol.over{border-color:var(--brand);background:rgba(255,107,26,.07)}
.kch{display:flex;align-items:center;gap:8px;padding:4px 6px 10px;font-size:12px;font-weight:900}
.kch i{width:9px;height:9px;border-radius:50%}
.kch span{margin-right:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;font-size:10.5px;padding:1px 9px;color:var(--muted)}
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:9px;cursor:grab;box-shadow:var(--sh)}
.kcard b{font-size:12.5px;display:block;margin:3px 0}.kcard small{display:block;color:var(--muted);font-size:10.5px}
.kfoot{display:flex;justify-content:space-between;align-items:center;margin-top:9px;padding-top:8px;border-top:1px dashed var(--line)}
.scrim{position:fixed;inset:0;background:var(--scrim);backdrop-filter:blur(3px);z-index:90;opacity:0;pointer-events:none;transition:opacity .22s}
.scrim.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;left:0;height:100vh;width:min(560px,100%);background:var(--surface);z-index:95;transform:translateX(-103%);transition:transform .28s cubic-bezier(.3,.9,.3,1);display:flex;flex-direction:column;border-right:1px solid var(--line);box-shadow:var(--sh2)}
.drawer.show{transform:none}
.dh,.mh{display:flex;align-items:center;gap:11px;padding:17px 20px;border-bottom:1px solid var(--line);flex:0 0 auto}
.dh h3,.mh h3{font-size:15px;font-weight:900;flex:1}
.db{flex:1;overflow-y:auto;padding:18px 20px;min-height:0}
.df{padding:13px 20px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;flex:0 0 auto}
.mback{position:fixed;inset:0;z-index:100;background:var(--scrim);backdrop-filter:blur(4px);display:none;align-items:flex-start;justify-content:center;padding:5vh 16px;overflow-y:auto}
.mback.show{display:flex}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:20px;width:min(660px,100%);box-shadow:var(--sh2);max-height:90vh;display:flex;flex-direction:column;overflow:hidden}

.modal.dk .mh,.modal.dk .mf{border-color:#2E3A66}.modal.dk .mh h3{color:#fff}

.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.fgrid .full{grid-column:1/-1}

.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kvi{background:var(--surface2);border:1px solid var(--line);border-radius:11px;padding:9px 12px;min-width:0}

select{background:var(--glass);border:1px solid var(--glassBrd);color:inherit}
select option{background:#111A30;color:#fff}
.zsel{position:relative;width:100%}
.zsel>select{position:absolute!important;width:1px!important;height:1px!important;opacity:0;pointer-events:none;padding:0!important;border:0!important;margin:0!important}
.zsel-btn{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;min-height:40px;padding:9px 12px;border:1px solid var(--glassBrd);border-radius:10px;background:var(--glass);backdrop-filter:blur(12px);color:inherit;font-size:12.5px;font-weight:600;cursor:pointer;text-align:right;transition:all var(--tr)}

.zsel-opt.on{background:rgba(255,107,26,.34);font-weight:800}
.zsel-opt.muted{color:#A9B6D4}

.toast.ok{border-right-color:var(--green)}.toast.err{border-right-color:var(--red)}.toast.warn{border-right-color:var(--amber)}

.ins-h b{font-size:13.5px;flex:1;min-width:200px}
.ins-ev{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.ins-ev span{font-size:10.5px;background:var(--surface2);border:1px solid var(--line);border-radius:20px;padding:3px 10px;color:var(--muted)}
.ins-rec{margin-top:9px;font-size:12px;line-height:1.95;background:var(--surface2);border-radius:10px;padding:9px 12px}
.ins-f{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px;align-items:center}
.ins-imp{font-size:11px;font-weight:900;color:var(--brandDeep);margin-right:auto}
.note-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.note{border:1px solid var(--line);border-radius:14px;padding:15px;box-shadow:var(--sh);position:relative;overflow:hidden;transition:transform var(--tr)}
.note:hover{transform:translateY(-3px)}
.note:before{content:"";position:absolute;top:0;right:0;left:0;height:4px}
.note.زرد:before{background:#F5C33B}.note.آبی:before{background:var(--blue)}.note.سبز:before{background:var(--green)}
.note.قرمز:before{background:var(--red)}.note.بنفش:before{background:var(--violet)}.note.خاکستری:before{background:var(--slate)}
.note h4{font-size:13.5px;font-weight:900;margin:6px 0 7px;display:flex;gap:7px;align-items:center}
.note p{font-size:11.5px;color:var(--muted);white-space:pre-wrap;line-height:1.95;max-height:150px;overflow:auto}
.note .nf{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;align-items:center}
.note.done{opacity:.62}
.soon-hero{background:var(--hero);color:#fff;border-radius:20px;padding:30px;position:relative;overflow:hidden;margin-bottom:18px}
.soon-hero:before{content:"";position:absolute;inset:0;background:radial-gradient(420px 220px at 86% 15%,rgba(255,107,26,.4),transparent 60%)}
.soon-hero>*{position:relative;z-index:1}
.soon-hero .tag{display:inline-flex;gap:6px;align-items:center;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);padding:5px 14px;border-radius:20px;font-size:11px;font-weight:800;margin-bottom:12px}
.soon-hero h2{font-size:22px;font-weight:900;margin-bottom:8px}
.soon-hero p{color:#D3DCF5;font-size:12.5px;max-width:720px;line-height:2}
.prog{height:9px;border-radius:9px;background:rgba(255,255,255,.16);overflow:hidden;margin-top:16px;max-width:460px}
.prog i{display:block;height:100%;width:0;background:var(--grad);transition:width 1s cubic-bezier(.3,.9,.3,1)}
.prog-l{display:flex;justify-content:space-between;max-width:460px;font-size:11px;color:#D3DCF5;margin-top:6px;font-weight:700}
.soon-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.soon-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--sh)}
.soon-card .sic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;margin-bottom:10px}
.soon-card h4{font-size:13.5px;font-weight:900;margin-bottom:6px}
.soon-card p{font-size:11.5px;color:var(--muted);line-height:1.9}
.pe-frame{position:relative;width:min(300px,100%);aspect-ratio:1;margin:12px auto;border-radius:14px;overflow:hidden;background:#0B1736;touch-action:none;cursor:grab}
.pe-frame img{position:absolute;max-width:none;user-select:none;pointer-events:none}
.pe-row{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:12px}
.pe-row input[type=range]{flex:1;accent-color:var(--brand)}
.asset-pv{display:flex;align-items:center;gap:14px;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.asset-stage{width:64px;height:64px;flex:0 0 64px;border-radius:12px;display:grid;place-items:center;overflow:hidden;background:linear-gradient(135deg,#0B1736,#3B2E7E)}
.asset-stage img{width:100%;height:100%;object-fit:contain;padding:6px}
#printArea{display:none}
.loading{text-align:center;padding:44px;color:var(--muted)}
.spinner{display:inline-block;width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:1120px){
#app,html.zv-rail #app{grid-template-columns:1fr}
.sidebar,html.zv-rail .sidebar{position:fixed;right:0;top:0;width:276px;transform:translateX(105%);transition:transform .28s;z-index:96;box-shadow:var(--sh2)}
.sidebar.open{transform:none}
html.zv-rail .sidebar .brand{padding:20px;justify-content:flex-start;gap:11px}
html.zv-rail .sidebar .brand>div:last-child{display:block}
html.zv-rail .sidebar .nav-sec{font-size:10px;height:auto;margin:15px 10px 6px;background:none;color:#7C89B4}
html.zv-rail .sidebar .nav-item{justify-content:flex-start;gap:11px;padding:9.5px 12px}
html.zv-rail .sidebar .nav-item>span{display:inline}
html.zv-rail .sidebar .nav-item .bdg{position:static;margin-right:auto;min-width:20px;width:auto;height:20px;padding:0 6px;font-size:10px;box-shadow:none}
html.zv-rail .sidebar .uchip{flex-direction:row;padding:9px 10px}
html.zv-rail .sidebar .uchip>div:not(.av){display:block}
#zvTip{display:none!important}
}
@media(max-width:760px){
#page{padding:16px 14px 70px}.topbar{padding:10px 14px}

.fgrid,.kv{grid-template-columns:1fr}.hero .dchip{display:none}
.kcol{width:83vw;min-width:83vw}.drawer{width:100%}.topbar .btn-p span{display:none}
#notifPanel{left:3vw}.toolbar .zsel,.bulk .zsel{width:100%}
.zv-login-logo{width:68px;height:68px}
}
@media print{body>*{display:none!important}#printArea{display:block!important;font-family:Vazirmatn,Tahoma,sans-serif}}

function rowsFor(e){

(cfg.filters||[]).forEach(function(f){var v=PS.filters[f.k];if(v)rows=rows.filter(function(r){return String(r[f.k]==null?'':r[k])===String(v);});});
var F=DB.finance||{};
if(PS.filters.from)rows=rows.filter(function(r){var d=r.Date||r.StartDate||r.BuyDate||r.CreatedAt;return d&&String(d).slice(0,10)>=PS.filters.from;});
if(PS.filters.to)rows=rows.filter(function(r){var d=r.Date||r.StartDate||r.BuyDate||r.CreatedAt;return d&&String(d).slice(0,10)<=PS.filters.to;});
if(PS.sort){var c=cfg.cols.find(function(x){return x.k===PS.sort.k;});
var gv=function(r){return c&&c.sv?c.sv(r):r[PS.sort.k];};
rows.sort(function(a,b){var x=gv(a),y=gv(b);var cmp=(typeof x==='number'||typeof y==='number')?num(x)-num(y):String(x==null?'':x).localeCompare(String(y==null?'':y),'fa');return cmp*PS.sort.d;});}

if(k==='whatif')return whatIfRun(f);

};

});
