W10=['ده','یازده','دوازده','سیزده','چهارده','پانزده','شانزده','هفده','هجده','نوزده'],
W20=['','','بیست','سی','چهل','پنجاه','شصت','هفتاد','هشتاد','نود'],
W100=['','یکصد','دویست','سیصد','چهارصد','پانصد','ششصد','هفتصد','هشتصد','نهصد'],

    n=Math.floor(n/1000);i++;}

      '<span class="sub" style="flex:1">'+(o.end?'تا '+jDisp(o.end):'بدون انقضا')+' · استفاده شما: '+fa(o.used)+'</span>'+
      ibtn('copy-code','save','کپی کد',' data-code="'+esc(o.code)+'"')+'</div>';}).join(''):'<p class="sub">کد تخفیف فعالی وجود ندارد.</p>')+'</div>'+
    '<div class="cbox"><h3>'+icon('receipt','width:15px;height:15px;color:var(--teal)')+' تخفیف‌های استفاده‌شده ('+fa(red.length)+')</h3>'+
    (red.length?red.slice(0,10).map(function(r){return '<div class="rank"><div class="info"><b>'+esc(r.code)+'</b><small>'+esc(r.requestId)+' · '+jDT(r.at)+'</small></div><span class="v">'+money(r.amount)+'</span></div>';}).join(''):'<p class="sub">هنوز از کد تخفیفی استفاده نکرده‌اید.</p>')+'</div></div>';
  return h;
};
ACT['buy-plan']=function(d){
  var price=num(d.price);
  openModal('<div class="mh"><h3>خرید اشتراک '+esc(d.name)+'</h3><button class="ibtn" data-act="mclose">'+icon('x')+'</button></div>'+
    '<form data-form="buy-plan" data-id="'+esc(d.id)+'"><div class="mb">'+
    kv([['سطح فعلی',esc(USER.level||'عادی')],['سطح جدید',esc(d.name)],['مدت اعتبار',fa(d.validity)+' روز'],['وضعیت پس از خرید','در انتظار تأیید مالی']])+
    '<div class="fgrid" style="margin-top:12px">'+
    '<div class="field"><label>مبلغ (ریال)</label><input name="amountView" value="'+price+'" readonly></div>'+
    '<div class="field"><label>روش پرداخت</label><select name="method"><option>درگاه پرداخت</option><option>کارت به کارت</option><option>حواله بانکی</option><option>کیف پول</option></select></div>'+
    '<div class="field full"><label>توضیح / شماره پیگیری</label><input name="note" placeholder="اختیاری"></div></div>'+
    '<p class="hint" style="margin-top:10px">پس از تأیید واحد مالی در پنل مدیریت، سطح اشتراک شما به‌صورت خودکار ارتقا می‌یابد و تاریخ اعتبار ثبت می‌شود.</p>'+
    '</div><div class="mf"><button class="btn btn-p" type="submit">'+icon('send','width:14px;height:14px')+' ثبت درخواست خرید</button>'+
    '<button type="button" class="btn btn-s" data-act="mclose">انصراف</button></div></form>',false,true);
};
document.addEventListener('submit',function(e){
  var f=e.target;if(!f.dataset||f.dataset.form!=='buy-plan')return;
  e.preventDefault();e.stopPropagation();
  var sub=f.querySelector('[type="submit"]');if(sub)sub.disabled=true;
  api('custBuySubscription',{levelId:f.dataset.id,method:f.elements.method.value,note:f.elements.note.value},TOKEN)
    .then(function(r){closeModal();toast(r.message||'درخواست ثبت شد.','ok');PS.page='loyalty';return reload();})
    .catch(function(x){if(sub)sub.disabled=false;toast(x.message,'err');});
},true);

/* ── ۶) بازچینی ── */
setTimeout(enhanceAmounts,120);
if(window.PS&&window.render)render();
})();
</script>
</body>
</html>
