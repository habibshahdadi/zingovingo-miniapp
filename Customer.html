<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<base target="_top">
<title>پنل مشتری | ZingoVingo</title>
<script src="zv-api.js"></script>
<style>
:root{--navy:#0B1736;--navy-light:#1a2a4d;--orange:#FF6B1A;--orange-light:#ff8533;--bg:#f4f6fb;--text:#172033;--muted:#657086;--line:#dfe4ee;--green:#067647;--danger:#b42318;--blue:#1849a9;--yellow:#f79009;--shadow:0 2px 10px #17203308;--radius:14px}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:Tahoma,Arial,sans-serif;line-height:1.7;font-size:14px}
button,input,select,textarea{font-family:inherit;font-size:13px}
.login-page{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--navy) 0%,#1a2a4d 100%);padding:16px}
.login-box{background:#fff;border-radius:20px;padding:32px;width:min(440px,100%);box-shadow:0 20px 60px #0003}
.login-box h1{color:var(--navy);text-align:center;margin-bottom:6px;font-size:26px}
.login-box h1 span{color:var(--orange)}
.login-sub{text-align:center;color:var(--muted);margin-bottom:18px;font-size:12px}
.login-tabs{display:flex;gap:8px;margin-bottom:18px;background:#f4f6fb;padding:5px;border-radius:12px}
.login-tab{flex:1;padding:10px;text-align:center;border-radius:9px;cursor:pointer;font-size:12px;font-weight:700;color:var(--muted);transition:all .2s;border:0;background:transparent}
.login-tab.active{background:#fff;color:var(--navy);box-shadow:0 2px 8px #17203315}
.login-tab:hover:not(.active){color:var(--navy)}
.login-error{background:#fef3f2;color:var(--danger);padding:10px;border-radius:9px;font-size:12px;margin-bottom:12px;display:none}
.login-info{background:#eff6ff;color:var(--blue);padding:10px;border-radius:9px;font-size:12px;margin-bottom:12px;display:none}
.field{margin-bottom:12px}
.field label{display:block;margin-bottom:5px;font-weight:700;font-size:12px;color:var(--muted)}
.field input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:9px;outline:none;font-size:13px}
.field input:focus{border-color:var(--orange);box-shadow:0 0 0 3px #ff6b1a1c}
.btn{border:0;border-radius:10px;padding:11px 16px;font:inherit;font-weight:700;cursor:pointer;transition:all .2s}
.btn-primary{background:var(--orange);color:#fff;width:100%}.btn-primary:hover{background:var(--orange-light)}
.btn-primary:disabled{opacity:.6;cursor:not-allowed}
.btn-secondary{background:#eef1f7;color:var(--navy)}
.btn-secondary:hover{background:#dfe4ee}
.otp-row{display:flex;gap:8px}
.otp-row input{flex:1}
.otp-row button{white-space:nowrap;min-width:110px}
.otp-hint{font-size:11px;color:var(--muted);margin-top:6px;text-align:center}
.otp-timer{color:var(--orange);font-weight:700}
.tab-panel{display:none}
.tab-panel.active{display:block}
.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
.sidebar{background:var(--navy);color:#fff;padding:0;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column}
.brand{padding:18px 16px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand h2{font-size:20px;font-weight:900}.brand h2 span{color:var(--orange)}
.brand small{color:#8896b3;font-size:11px}
.nav-menu{flex:1;padding:10px 8px}
.nav-item{display:flex;align-items:center;gap:10px;padding:11px 14px;cursor:pointer;color:#c8d0e1;font-size:13px;border-right:3px solid transparent;transition:all .2s;background:transparent;border-left:0;border-top:0;border-bottom:0;width:100%;text-align:right}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff}
.nav-item.active{background:rgba(255,255,255,.1);color:#fff;border-right-color:var(--orange)}
.sidebar-footer{padding:14px 16px;border-top:1px solid rgba(255,255,255,.08);font-size:12px}
.user-info{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.user-avatar{width:36px;height:36px;border-radius:50%;background:var(--orange);display:grid;place-items:center;font-weight:900;color:#fff;overflow:hidden;flex:0 0 36px}
.user-avatar img{width:100%;height:100%;object-fit:cover}
.user-name{font-weight:700;font-size:13px;color:#fff}
.user-role{color:#8896b3;font-size:11px}
.logout-btn{width:100%;background:transparent;border:1px solid rgba(255,255,255,.12);color:#c8d0e1;padding:8px;border-radius:9px;cursor:pointer;font-size:12px}
.logout-btn:hover{background:rgba(255,255,255,.06);color:#fff}
.main{padding:22px;overflow-x:hidden}
.page-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;flex-wrap:wrap;gap:10px}
.page-title{font-size:19px;color:var(--navy);font-weight:900}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:16px;box-shadow:var(--shadow)}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.stat-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px;position:relative;overflow:hidden}
.stat-card::before{content:'';position:absolute;top:0;right:0;width:4px;height:100%;background:var(--orange)}
.stat-card.green::before{background:var(--green)}.stat-card.blue::before{background:var(--blue)}.stat-card.yellow::before{background:var(--yellow)}
.stat-label{font-size:11px;color:var(--muted);margin-bottom:5px}
.stat-value{font-size:22px;font-weight:900;color:var(--navy);font-variant-numeric:tabular-nums}
.table-wrap{overflow-x:auto;border-radius:var(--radius);border:1px solid var(--line)}
table{width:100%;border-collapse:collapse;font-size:12px}
th{background:#f8f9fc;padding:10px;text-align:right;font-weight:700;color:var(--navy);border-bottom:2px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:hover{background:#fafbfd}
.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:10px;font-weight:700}
.badge-new{background:#eff6ff;color:var(--blue)}.badge-progress{background:#fff7ed;color:#9a3412}
.badge-done{background:#ecfdf3;color:var(--green)}.badge-cancel{background:#fef3f2;color:var(--danger)}
.badge-info{background:#edf2ff;color:#4567bb}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.field-col{display:flex;flex-direction:column;gap:4px}
.field-col label{font-size:11px;font-weight:700;color:var(--muted)}
.field-col input,.field-col select{font:inherit;border:1px solid #cfd6e3;border-radius:8px;padding:8px 10px;background:#fff;outline:none;width:100%}
.field-col input:focus,.field-col select:focus{border-color:var(--orange);box-shadow:0 0 0 3px #ff6b1a1c}
.toast{position:fixed;bottom:20px;left:20px;background:var(--navy);color:#fff;padding:11px 18px;border-radius:10px;z-index:200;display:none;box-shadow:0 10px 30px #0003;font-size:12px}
.toast.show{display:block;animation:slideIn .3s}
.toast.success{background:var(--green)}.toast.error{background:var(--danger)}
@keyframes slideIn{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal{display:none;position:fixed;inset:0;background:#071127a8;z-index:100;padding:18px;align-items:center;justify-content:center}
.modal.open{display:flex}
.modal-box{width:min(600px,100%);background:#fff;border-radius:var(--radius);padding:22px;max-height:90vh;overflow-y:auto}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.modal-header h2{font-size:17px;color:var(--navy)}
.modal-close{background:transparent;border:0;font-size:22px;cursor:pointer;color:var(--muted)}
.modal-footer{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.loading{text-align:center;padding:30px;color:var(--muted)}
.spinner{display:inline-block;width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--orange);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.menu-toggle{display:none;background:var(--navy);color:#fff;border:0;padding:8px 12px;border-radius:8px;cursor:pointer}
@media(max-width:900px){.app{grid-template-columns:1fr}.sidebar{position:fixed;right:-280px;width:260px;z-index:50;transition:right .3s}.sidebar.open{right:0}.menu-toggle{display:block}}
.welcome-banner{background:linear-gradient(115deg,#0B1736,#203968);color:#fff;border-radius:18px;padding:20px 22px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.welcome-banner h2{font-size:16px;margin:0 0 5px;color:#fff}
.welcome-banner p{font-size:11px;color:#d2d9e8;margin:0}
.welcome-icon{font-size:42px;opacity:.8}
.level-chip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;background:#fff0e7;color:#bd4a0d;font-size:11px;font-weight:800}
.invoice-box{background:#fff;padding:24px;border-radius:12px}
.invoice-header{text-align:center;border-bottom:2px solid var(--navy);padding-bottom:12px;margin-bottom:16px}
.invoice-header h1{color:var(--navy);font-size:22px}
.invoice-header h1 span{color:var(--orange)}
.invoice-row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13px}
.invoice-row strong{color:var(--navy)}
.invoice-total{font-size:17px;font-weight:900;color:var(--orange);margin-top:12px;padding-top:12px;border-top:2px solid var(--navy)}
.thread-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px;border:1px solid var(--line);border-radius:11px;margin:8px 0;background:#fff}
.thread-meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:5px 0;font-size:10px;color:var(--muted)}
.thread-state{display:inline-flex;padding:3px 7px;border-radius:20px;font-size:10px;font-weight:800}
.thread-state.unread{background:#ffebed;color:#c62836}
.thread-state.open{background:#edf2ff;color:#4567bb}
.thread-state.closed{background:#f0f1f4;color:#687386}
.unread-badge{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 4px;margin-right:auto;border-radius:20px;background:#d92d3a;color:#fff;font-size:10px;font-weight:900}
</style>
</head>
<body>

<!-- صفحه لاگین -->
<div id="loginPage" class="login-page">
<div class="login-box">
<h1>Zingo<span>Vingo</span></h1>
<div class="login-sub">پنل مشتریان — پیگیری سفارشات و خدمات</div>

<div class="login-tabs">
<button class="login-tab active" data-tab="code" onclick="switchLoginTab('code')">🔑 کد اشتراک</button>
<button class="login-tab" data-tab="otp" onclick="switchLoginTab('otp')">📱 کد یکبار مصرف</button>
</div>

<div id="loginError" class="login-error"></div>
<div id="loginInfo" class="login-info"></div>

<!-- تب ۱: کد اشتراک -->
<div id="tabCode" class="tab-panel active">
<div class="field"><label>کد اشتراک</label><input id="loginCode" autocomplete="username" placeholder="مثلاً ZV-mvxx32v8"></div>
<div class="field"><label>شماره موبایل</label><input id="loginPhone1" inputmode="tel" autocomplete="tel" placeholder="09123456789"></div>
<button class="btn btn-primary" onclick="doLoginCode()">ورود به پنل</button>
</div>

<!-- تب ۲: OTP -->
<div id="tabOtp" class="tab-panel">
<div class="field"><label>شماره موبایل</label>
<div class="otp-row">
<input id="loginPhone2" inputmode="tel" autocomplete="tel" placeholder="09123456789">
<button class="btn btn-secondary" id="sendOtpBtn" onclick="sendOtp()">دریافت کد</button>
</div>
<div class="otp-hint" id="otpHint">کد ۶ رقمی به شماره بله شما ارسال می‌شود.</div>
</div>
<div class="field"><label>کد تأیید</label>
<div class="otp-row">
<input id="loginOtp" inputmode="numeric" maxlength="6" placeholder="______" style="letter-spacing:4px;text-align:center;font-size:16px;font-weight:900">
<button class="btn btn-primary" id="verifyOtpBtn" onclick="doLoginOtp()" style="min-width:100px" disabled>ورود</button>
</div>
<div class="otp-hint" id="otpTimer"></div>
</div>
</div>

<div style="text-align:center;margin-top:14px;font-size:11px;color:var(--muted)">
کد اشتراک ندارید؟ از <a href="?page=user" style="color:var(--orange)">فرم ثبت درخواست</a> استفاده کنید.
</div>
</div>
</div>

<!-- اپلیکیشن اصلی -->
<div id="appContainer" class="app" style="display:none">
<aside class="sidebar" id="sidebar">
<div class="brand"><h2>Zingo<span>Vingo</span></h2><small>پنل مشتریان</small></div>
<nav class="nav-menu" id="navMenu"></nav>
<div class="sidebar-footer">
<div class="user-info"><div class="user-avatar" id="userAvatar">?</div><div><div class="user-name" id="userName">—</div><div class="user-role" id="userLevel">—</div></div></div>
<button class="logout-btn" onclick="doLogout()">🚪 خروج</button>
</div>
</aside>
<main class="main">
<button class="menu-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')">☰ منو</button>
<div id="pageContent"><div class="loading"><div class="spinner"></div></div></div>
</main>
</div>

<div id="toast" class="toast"></div>
<div id="modal" class="modal"><div class="modal-box" id="modalBox"></div></div>

<script>
const $ = id => document.getElementById(id);
const money = n => new Intl.NumberFormat('en-US').format(Math.round(Number(n)||0)) + ' ریال';
const toFa = n => new Intl.NumberFormat('fa-IR').format(n);
const esc = v => String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let currentToken = localStorage.getItem('zv_cst_token') || null;
let currentUser = null;
let otpCountdown = null;

const MENU = [
{ id:'dashboard', label:'داشبورد', icon:'📊' },
{ id:'orders', label:'سفارشات من', icon:'📋' },
{ id:'cards', label:'کارت‌های من', icon:'🎫' },
{ id:'invoices', label:'فاکتورها', icon:'🧾' },
{ id:'messages', label:'پیام‌ها', icon:'💬', badge:true },
{ id:'newOrder', label:'سفارش جدید', icon:'➕' },
{ id:'profile', label:'پروفایل من', icon:'👤' }
];

// ==================== مدیریت تب‌های ورود ====================
function switchLoginTab(tab){
document.querySelectorAll('.login-tab').forEach(t=>t.classList.remove('active'));
document.querySelector(`.login-tab[data-tab="${tab}"]`).classList.add('active');
document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
$('tab'+(tab==='code'?'Code':'Otp')).classList.add('active');
hideLoginMessages();
}
function showLoginError(msg){ $('loginError').textContent=msg; $('loginError').style.display='block'; $('loginInfo').style.display='none'; }
function showLoginInfo(msg){ $('loginInfo').textContent=msg; $('loginInfo').style.display='block'; $('loginError').style.display='none'; }
function hideLoginMessages(){ $('loginError').style.display='none'; $('loginInfo').style.display='none'; }

// ==================== روش ۱: ورود با کد اشتراک ====================
function doLoginCode(){
const c=$('loginCode').value.trim(), p=$('loginPhone1').value.trim();
if(!c||!p){ showLoginError('کد اشتراک و موبایل را وارد کنید'); return; }
hideLoginMessages();
callServer('customerLogin',[c,p],r=>{
if(r&&r.success){ currentToken=r.token; currentUser=r.user;
localStorage.setItem('zv_cst_token',r.token); localStorage.setItem('zv_cst_user',JSON.stringify(r.user));
showApp(r.user);
} else { showLoginError((r&&r.message)||'خطا در ورود'); }
},e=>{ showLoginError(e.message||'خطا در ارتباط با سرور'); });
}

// ==================== روش ۲: ورود با OTP ====================
function sendOtp(){
const phone=$('loginPhone2').value.trim();
if(!/^09\d{9}$/.test(phone)){ showLoginError('شماره موبایل معتبر نیست (باید با 09 شروع شود)'); return; }
hideLoginMessages();
$('sendOtpBtn').disabled=true;
$('sendOtpBtn').textContent='در حال ارسال...';
callServer('requestCustomerOtp',[phone],r=>{
$('sendOtpBtn').disabled=false;
$('sendOtpBtn').textContent='دریافت کد';
$('verifyOtpBtn').disabled=false;
if(r&&r.success){
showLoginInfo('کد تأیید به شماره بله شما ارسال شد. (اعتبار: ۵ دقیقه)');
startOtpCountdown(120);
} else { showLoginError((r&&r.message)||'ارسال کد ناموفق بود'); }
},e=>{
$('sendOtpBtn').disabled=false;
$('sendOtpBtn').textContent='دریافت کد';
showLoginError(e.message||'خطا در ارسال کد');
});
}

function startOtpCountdown(seconds){
clearInterval(otpCountdown);
let s=seconds;
$('otpTimer').innerHTML='امکان ارسال مجدد کد تا <span class="otp-timer">'+toFa(s)+'</span> ثانیه دیگر';
otpCountdown=setInterval(()=>{
s--;
if(s<=0){ clearInterval(otpCountdown); $('otpTimer').textContent='می‌توانید کد جدید درخواست کنید.'; }
else { $('otpTimer').innerHTML='امکان ارسال مجدد کد تا <span class="otp-timer">'+toFa(s)+'</span> ثانیه دیگر'; }
},1000);
}

function doLoginOtp(){
const phone=$('loginPhone2').value.trim(), otp=$('loginOtp').value.trim();
if(!phone||!otp){ showLoginError('شماره موبایل و کد تأیید را وارد کنید'); return; }
if(otp.length!==6){ showLoginError('کد تأیید باید ۶ رقم باشد'); return; }
hideLoginMessages();
$('verifyOtpBtn').disabled=true;
$('verifyOtpBtn').textContent='در حال بررسی...';
callServer('verifyCustomerOtp',[phone,otp],r=>{
$('verifyOtpBtn').disabled=false;
$('verifyOtpBtn').textContent='ورود';
if(r&&r.success){ currentToken=r.token; currentUser=r.user;
localStorage.setItem('zv_cst_token',r.token); localStorage.setItem('zv_cst_user',JSON.stringify(r.user));
showApp(r.user);
} else { showLoginError((r&&r.message)||'کد تأیید اشتباه یا منقضی است'); }
},e=>{
$('verifyOtpBtn').disabled=false;
$('verifyOtpBtn').textContent='ورود';
showLoginError(e.message||'خطا در بررسی کد');
});
}

// ==================== توابع عمومی ====================
function toast(msg, type='info'){ const t=$('toast'); t.textContent=msg; t.className='toast show '+(type==='success'?'success':type==='error'?'error':''); setTimeout(()=>t.classList.remove('show'),3500); }
function openModal(html){ $('modalBox').innerHTML=html; $('modal').classList.add('open'); }
function closeModal(){ $('modal').classList.remove('open'); }
$('modal').addEventListener('click', e=>{ if(e.target===$('modal')) closeModal(); });
function statusBadge(s){ const cls=/جدید|ثبت/.test(s)?'new':/تکمیل/.test(s)?'done':/لغو/.test(s)?'cancel':/انجام|بررسی/.test(s)?'progress':'info'; return '<span class="badge badge-'+cls+'">'+esc(s)+'</span>'; }

function doLogout(){
if(currentToken) callServer('customerLogout',[currentToken],()=>{});
localStorage.removeItem('zv_cst_token'); localStorage.removeItem('zv_cst_user');
location.reload();
}

function showApp(user){
currentUser=user;
$('loginPage').style.display='none'; $('appContainer').style.display='grid';
$('userName').textContent=user.fullName||'—';
$('userLevel').textContent=(user.level||'عادی')+' — تخفیف '+toFa(user.discountRate||0)+'٪';
const av=$('userAvatar');
if(user.avatar) av.innerHTML='<img src="'+esc(user.avatar)+'">'; else av.textContent=(user.fullName||'?').charAt(0);
$('navMenu').innerHTML=MENU.map(i=>'<button class="nav-item" data-page="'+i.id+'"><span>'+i.icon+'</span><span>'+i.label+'</span>'+(i.badge?'<span class="unread-badge" id="msgBadge" hidden>0</span>':'')+'</button>').join('');
$('navMenu').querySelectorAll('.nav-item').forEach(b=>b.addEventListener('click',()=>{
$('navMenu').querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
b.classList.add('active'); $('sidebar').classList.remove('open'); loadPage(b.dataset.page);
}));
loadPage('dashboard'); refreshUnread();
}

function refreshUnread(){
if(!currentToken) return;
callServer('getCustomerUnreadCount',[currentToken],n=>{ const b=$('msgBadge'); if(b){ b.textContent=toFa(n||0); b.hidden=!n; } });
}

(function checkSession(){
const saved=localStorage.getItem('zv_cst_user');
if(currentToken&&saved){ try{ currentUser=JSON.parse(saved); showApp(currentUser); }catch(e){} }
})();

function loadPage(page){
$('pageContent').innerHTML='<div class="loading"><div class="spinner"></div></div>';
const m={dashboard:loadDashboard,orders:loadOrders,cards:loadCards,invoices:loadInvoices,messages:loadMessages,newOrder:loadNewOrder,profile:loadProfile};
(m[page]||loadDashboard)();
}

function loadDashboard(){
callServer('getCustomerDashboard',[currentToken],s=>{
$('pageContent').innerHTML=

function loadOrders(){

'<div class="page-header"><h1 class="page-title">سفارشات من</h1></div>'+
'<div class="card">'+
'<div class="filters">'+
'<div class="field-col"><label>از تاریخ</label><input id="ordFrom" placeholder="۱۴۰۵/۰۱/۰۱"></div>'+
'<div class="field-col"><label>تا تاریخ</label><input id="ordTo" placeholder="۱۴۰۵/۱۲/۲۹"></div>'+
'<div class="field-col"><label>شناسه سفارش</label><input id="ordReq" placeholder="Request-ID"></div>'+
'<div class="field-col"><label>وضعیت</label><select id="ordStatus"><option value="همه">همه</option><option>جدید</option><option>تبدیل به کارت</option><option>در حال انجام</option><option>تکمیل شده</option><option>لغو شده</option></select></div>'+
'<div class="field-col" style="justify-content:flex-end"><button class="btn btn-primary" onclick="fetchOrders()">🔍 جستجو</button></div>'+
'</div>'+
'<div id="ordersTable"></div>'+
'</div>';
fetchOrders();
}
function fetchOrders(){
const f={fromDate:$('ordFrom').value,toDate:$('ordTo').value,requestId:$('ordReq').value,status:$('ordStatus').value};
$('ordersTable').innerHTML='<div class="loading"><div class="spinner"></div></div>';
callServer('getCustomerOrders',[f,currentToken],rows=>{
if(!rows.length){ $('ordersTable').innerHTML='<div style="padding:18px;text-align:center;color:var(--muted);font-size:12px">سفارشی با این فیلترها یافت نشد.</div>'; return; }
$('ordersTable').innerHTML='<div class="table-wrap"><table><thead><tr><th>تاریخ</th><th>کد سفارش</th><th>خدمت</th><th>تاریخ اجرا</th><th>مبلغ</th><th>وضعیت</th><th>عملیات</th></tr></thead><tbody>'+
rows.map(r=>'<tr><td>'+esc(r.date)+'</td><td><strong>'+esc(r.requestId)+'</strong></td><td>'+esc(r.service)+'</td><td>'+esc(r.execDate)+' '+esc(r.execTime||'')+'</td><td>'+money(r.finalPrice)+'</td><td>'+statusBadge(r.status)+'</td><td><button class="btn btn-secondary" style="padding:5px 9px;font-size:11px" onclick="viewInvoice(\''+esc(r.requestId)+'\')">🧾 فاکتور</button></td></tr>').join('')+'</tbody></table></div>';
},e=>$('ordersTable').innerHTML='<div style="padding:18px;text-align:center;color:var(--danger);font-size:12px">'+esc(e.message)+'</div>');
}

'<div class="card">'+
'<div class="filters">'+

'<div class="field-col"><label>وضعیت</label><select id="cdStatus"><option value="همه">همه</option><option>جدید</option><option>در حال انجام</option><option>تکمیل شده</option><option>لغو شده</option></select></div>'+
'<div class="field-col" style="justify-content:flex-end"><button class="btn btn-primary" onclick="fetchCards()">🔍 جستجو</button></div>'+
'</div>'+

'</div>';

function fetchCards(){
const f={fromDate:$('cdFrom').value,toDate:$('cdTo').value,cardId:$('cdId').value,status:$('cdStatus').value};
$('cardsTable').innerHTML='<div class="loading"><div class="spinner"></div></div>';
callServer('getCustomerCards',[f,currentToken],rows=>{
if(!rows.length){ $('cardsTable').innerHTML='<div style="padding:18px;text-align:center;color:var(--muted);font-size:12px">کارتی یافت نشد.</div>'; return; }
$('cardsTable').innerHTML='<div class="table-wrap"><table><thead><tr><th>کارت</th><th>سفارش</th><th>خدمت</th><th>نیروی اجرا</th><th>تاریخ اجرا</th><th>مبلغ</th><th>وضعیت</th></tr></thead><tbody>'+
rows.map(r=>'<tr><td><strong>'+esc(r.cardId)+'</strong></td><td>'+esc(r.requestId)+'</td><td>'+esc(r.service)+'</td><td>'+esc(r.workerName)+'</td><td>'+esc(r.execDate)+' '+esc(r.execTime||'')+'</td><td>'+money(r.amount)+'</td><td>'+statusBadge(r.status)+'</td></tr>').join('')+'</tbody></table></div>';
},e=>$('cardsTable').innerHTML='<div style="padding:18px;text-align:center;color:var(--danger);font-size:12px">'+esc(e.message)+'</div>');
}

function loadInvoices(){
$('pageContent').innerHTML=
'<div class="page-header"><h1 class="page-title">فاکتورهای من</h1></div>'+
'<div class="card">'+
'<div class="field-col" style="max-width:320px"><label>شناسه سفارش</label><div style="display:flex;gap:8px"><input id="invReq" placeholder="ZV-..."><button class="btn btn-primary" onclick="viewInvoice($(\'invReq\').value)">🔍 مشاهده</button></div></div>'+
'<div style="margin-top:14px"><h3 style="font-size:14px;font-weight:800;color:var(--navy);margin:0 0 10px">فاکتورهای اخیر</h3><div id="invList"></div></div>'+
'</div>';
callServer('getCustomerOrders',[{},currentToken],rows=>{
const el=$('invList');
if(!rows.length){ el.innerHTML='<div style="padding:18px;text-align:center;color:var(--muted);font-size:12px">فاکتوری موجود نیست.</div>'; return; }
el.innerHTML='<div class="table-wrap"><table><thead><tr><th>کد سفارش</th><th>تاریخ</th><th>خدمت</th><th>مبلغ</th><th>عملیات</th></tr></thead><tbody>'+
rows.map(r=>'<tr><td><strong>'+esc(r.requestId)+'</strong></td><td>'+esc(r.date)+'</td><td>'+esc(r.service)+'</td><td>'+money(r.finalPrice)+'</td><td><button class="btn btn-secondary" style="padding:5px 9px;font-size:11px" onclick="viewInvoice(\''+esc(r.requestId)+'\')">مشاهده</button></td></tr>').join('')+'</tbody></table></div>';
});
}
function viewInvoice(requestId){
if(!requestId) return toast('شناسه سفارش را وارد کنید','error');
$('pageContent').innerHTML='<div class="loading"><div class="spinner"></div></div>';
callServer('getCustomerOrderInvoice',[requestId,currentToken],inv=>{
$('pageContent').innerHTML=
'<div class="page-header"><h1 class="page-title">فاکتور '+esc(inv.requestId)+'</h1><button class="btn btn-secondary" onclick="loadInvoices()">بازگشت</button></div>'+
'<div class="card invoice-box">'+
'<div class="invoice-header"><h1>Zingo<span>Vingo</span></h1><div style="color:var(--muted);font-size:11px">فاکتور رسمی خدمات</div></div>'+
'<div class="invoice-row"><span>کد اشتراک</span><strong>'+esc(inv.customerCode)+'</strong></div>'+
'<div class="invoice-row"><span>نام مشتری</span><strong>'+esc(inv.customerName)+'</strong></div>'+
'<div class="invoice-row"><span>تلفن</span><strong style="direction:ltr">'+esc(inv.phone)+'</strong></div>'+
'<div class="invoice-row"><span>سطح مشتری</span><strong>'+esc(inv.level)+' — '+toFa(inv.discountRate)+'٪</strong></div>'+
'<div class="invoice-row"><span>کد سفارش</span><strong>'+esc(inv.requestId)+'</strong></div>'+
'<div class="invoice-row"><span>کد کارت</span><strong>'+esc(inv.cardId||'—')+'</strong></div>'+
'<div class="invoice-row"><span>خدمت</span><strong>'+esc(inv.service)+'</strong></div>'+
'<div class="invoice-row"><span>تاریخ اجرا</span><strong>'+esc(inv.execDate)+' '+esc(inv.execTime||'')+'</strong></div>'+
'<div class="invoice-row"><span>نیروی اجراکننده</span><strong>'+esc(inv.workerName)+'</strong></div>'+
'<div class="invoice-row"><span>وضعیت</span><strong>'+statusBadge(inv.status)+'</strong></div>'+
'<div class="invoice-row"><span>قیمت پایه</span><strong>'+money(inv.basePrice)+'</strong></div>'+
'<div class="invoice-row"><span>تخفیف</span><strong style="color:var(--green)">− '+money(inv.discount)+'</strong></div>'+
'<div class="invoice-row"><span>مالیات</span><strong>'+money(inv.tax)+'</strong></div>'+
'<div class="invoice-row invoice-total"><span>مبلغ قابل پرداخت</span><span>'+money(inv.finalPrice)+'</span></div>'+
(inv.notes?'<div style="margin-top:12px;padding:10px;background:#f8f9fc;border-radius:9px;font-size:12px"><strong>توضیحات:</strong> '+esc(inv.notes)+'</div>':'')+
'<div style="margin-top:14px"><button class="btn btn-primary" onclick="window.print()">🖨 چاپ فاکتور</button></div>'+
'</div>';
},e=>$('pageContent').innerHTML='<div style="padding:18px;text-align:center;color:var(--danger);font-size:12px">'+esc(e.message)+'</div>');
}

function loadMessages(){
$('pageContent').innerHTML=
'<div class="page-header"><h1 class="page-title">پیام‌ها و پشتیبانی</h1><button class="btn btn-primary" onclick="newMessageModal()">✉️ پیام جدید</button></div>'+
'<div id="msgList"><div class="loading"><div class="spinner"></div></div></div>';
fetchMessages();
}
function fetchMessages(){
callServer('getCustomerConversations',[currentToken],rows=>{
const el=$('msgList');
if(!rows.length){ el.innerHTML='<div class="card"><div style="padding:18px;text-align:center;color:var(--muted);font-size:12px">هنوز پیامی ثبت نکرده‌اید.</div></div>'; return; }
el.innerHTML=rows.map(m=>
'<div class="thread-row">'+
'<div style="flex:1;min-width:0">'+
'<div style="font-weight:800;color:var(--navy);font-size:13px">'+esc(m.subject||'بدون موضوع')+'</div>'+
'<div style="font-size:12px;color:var(--text);margin:3px 0">'+esc(m.message)+'</div>'+
(m.reply?'<div style="font-size:11px;color:var(--muted);margin-top:5px;padding:7px;background:#f8f9fc;border-radius:8px"><strong>پاسخ پشتیبانی:</strong> '+esc(m.reply)+'</div>':'')+
'<div class="thread-meta"><span>'+esc(m.createdAt)+'</span><span class="thread-state '+(m.status==='unread'?'unread':m.status==='open'?'open':'closed')+'">'+(m.status==='unread'?'بدون پاسخ':m.status==='open'?'باز':'خوانده شده')+'</span></div>'+
'</div>'+
'<button class="btn btn-secondary" style="padding:5px 9px;font-size:11px" onclick="replyMessageModal(\''+esc(m.conversationId)+'\',\''+esc(m.subject)+'\')">↩️ پاسخ</button>'+
'</div>'
).join('');
refreshUnread();
},e=>toast(e.message,'error'));
}
function newMessageModal(){
openModal('<div class="modal-header"><h2>پیام جدید به پشتیبانی</h2><button class="modal-close" onclick="closeModal()">✕</button></div>'+
'<div style="display:grid;grid-template-columns:1fr;gap:10px"><div class="field-col"><label>موضوع</label><input id="msgSubject" placeholder="موضوع پیام"></div>'+
'<div class="field-col"><label>متن پیام</label><textarea id="msgBody" style="min-height:90px" placeholder="پیام خود را بنویسید…"></textarea></div></div>'+
'<div class="modal-footer"><button class="btn btn-secondary" onclick="closeModal()">انصراف</button><button class="btn btn-primary" onclick="sendNewMessage()">ارسال</button></div>');
}
function sendNewMessage(){
const s=$('msgSubject').value.trim(), b=$('msgBody').value.trim();
if(!b) return toast('متن پیام را وارد کنید','error');
callServer('createCustomerConversation',[s,b,currentToken],()=>{ closeModal(); toast('پیام ارسال شد','success'); loadMessages(); },e=>toast(e.message,'error'));
}
function replyMessageModal(id,subject){
openModal('<div class="modal-header"><h2>پاسخ به: '+esc(subject)+'</h2><button class="modal-close" onclick="closeModal()">✕</button></div>'+
'<div class="field-col"><label>متن پاسخ</label><textarea id="replyBody" style="min-height:90px"></textarea></div>'+
'<div class="modal-footer"><button class="btn btn-secondary" onclick="closeModal()">انصراف</button><button class="btn btn-primary" onclick="sendReply(\''+esc(id)+'\')">ارسال</button></div>');
}
function sendReply(id){
const b=$('replyBody').value.trim();
if(!b) return toast('متن را وارد کنید','error');
callServer('replyCustomerConversation',[id,b,currentToken],()=>{ closeModal(); toast('پاسخ ارسال شد','success'); loadMessages(); },e=>toast(e.message,'error'));
}

function loadNewOrder(){
$('pageContent').innerHTML=
'<div class="page-header"><h1 class="page-title">ثبت درخواست جدید</h1></div>'+
'<div class="card">'+
'<div style="padding:11px 13px;border-radius:9px;background:#fff7ed;color:#9a3412;border:1px solid #ffead5;font-size:12px;margin-bottom:12px">برای ثبت درخواست جدید، به فرم عمومی خدمات هدایت می‌شوید. کد اشتراک شما به‌صورت خودکار اعمال می‌شود و تخفیف سطح '+esc(currentUser.level)+' به سفارش شما تعلق می‌گیرد.</div>'+
'<button class="btn btn-primary" style="min-height:44px;font-size:13px" onclick="openNewOrderForm()">➕ باز کردن فرم سفارش</button>'+
'</div>';
}
function openNewOrderForm(){
window.open('?page=user&membershipCode='+encodeURIComponent(currentUser.customerId),'_blank');
}

'</div>'+
'</div>'+
'<div class="card" style="margin-top:14px">'+
'<h3 style="font-size:14px;font-weight:800;color:var(--navy);margin:0 0 10px">ویرایش اطلاعات</h3>'+

'<div class="field-col" style="grid-column:1/-1"><label>آدرس</label><textarea id="pfAddr" style="min-height:70px">'+esc(p.address)+'</textarea></div>'+

function saveProfile(){
const u={phone:$('pfPhone').value,email:$('pfEmail').value,province:$('pfProvince').value,city:$('pfCity').value,address:$('pfAddr').value,postalCode:$('pfPostal').value,avatar:$('pfAvatar').value};
callServer('updateCustomerProfile',[u,currentToken],()=>{ toast('پروفایل ذخیره شد','success'); },e=>toast(e.message,'error'));
}

document.addEventListener('keydown', e=>{
if(e.key==='Enter'){
if($('loginPage').style.display!=='none'){
if($('tabCode').classList.contains('active')) doLoginCode();
else if($('verifyOtpBtn')&&!$('verifyOtpBtn').disabled) doLoginOtp();
}
}
});
</script>
