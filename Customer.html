<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<base target="_top">
<title>پنل مشتری | ZingoVingo</title>
<script src="zv-api.js"></script>
<style>
:root{--navy:#0B1736;--navy-light:#1a2a4d;--orange:#FF6B1A;--orange-light:#ff8533;--bg:#f4f6fb;--text:#172033;--muted:#657086;--line:#dfe4ee;--white:#fff;--green:#067647;--danger:#b42318;--blue:#1849a9;--yellow:#f79009;--shadow:0 2px 10px #17203308;--radius:14px}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:Tahoma,Arial,sans-serif;line-height:1.7;font-size:14px}
button,input,select,textarea{font-family:inherit;font-size:13px}
.login-page{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--navy) 0%,#1a2a4d 100%)}
.login-box{background:#fff;border-radius:20px;padding:40px;width:min(420px,92%);box-shadow:0 20px 60px #0003}
.login-box h1{color:var(--navy);text-align:center;margin-bottom:8px;font-size:28px}
.login-box h1 span{color:var(--orange)}
.login-box .subtitle{text-align:center;color:var(--muted);margin-bottom:24px;font-size:13px}
.login-box .field{margin-bottom:14px}
.login-box label{display:block;margin-bottom:6px;font-weight:700;font-size:13px}
.login-box input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;outline:none}
.login-box input:focus{border-color:var(--orange);box-shadow:0 0 0 3px #ff6b1a1c}
.login-box .btn{width:100%;padding:13px;margin-top:8px}
.login-error{background:#fef3f2;color:var(--danger);padding:10px;border-radius:8px;margin-bottom:12px;font-size:13px;display:none}
.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
.sidebar{background:var(--navy);color:#fff;padding:0;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column}
.brand{padding:20px;border-bottom:1px solid var(--navy-light)}
.brand h2{font-size:22px;font-weight:900}
.brand h2 span{color:var(--orange)}
.brand small{color:#8896b3;font-size:11px}
.nav-menu{flex:1;padding:12px 0}
.nav-item{display:flex;align-items:center;gap:10px;padding:12px 20px;cursor:pointer;color:#c8d2e6;font-size:14px;border-right:3px solid transparent;transition:all .2s}
.nav-item:hover{background:var(--navy-light);color:#fff}
.nav-item.active{background:var(--navy-light);color:#fff;border-right-color:var(--orange)}
.sidebar-footer{padding:16px 20px;border-top:1px solid var(--navy-light);font-size:12px}
.user-info{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.user-avatar{width:36px;height:36px;border-radius:50%;background:var(--orange);display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;font-size:14px;overflow:hidden}
.user-avatar img{width:100%;height:100%;object-fit:cover}
.user-name{font-weight:700;font-size:13px}
.user-role{color:#8896b3;font-size:11px}
.logout-btn{background:transparent;border:1px solid var(--navy-light);color:#c8d2e6;padding:8px;border-radius:8px;cursor:pointer;width:100%;font-size:12px}
.logout-btn:hover{background:var(--navy-light);color:#fff}
.main{padding:24px;overflow-x:hidden}
.page-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:10px}
.page-title{font-size:20px;color:var(--navy);font-weight:900}
.btn{border:0;border-radius:10px;padding:9px 16px;font:inherit;font-weight:700;cursor:pointer;transition:all .2s}
.btn-primary{background:var(--orange);color:#fff}.btn-primary:hover{background:var(--orange-light)}
.btn-secondary{background:#eef1f7;color:var(--navy)}.btn-secondary:hover{background:#dfe4ee}
.btn-danger{background:#fef3f2;color:var(--danger)}.btn-danger:hover{background:#fee4e2}
.btn-sm{padding:5px 10px;font-size:12px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:16px;box-shadow:var(--shadow)}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:20px}
.stat-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:18px;position:relative;overflow:hidden}
.stat-card::before{content:'';position:absolute;top:0;right:0;width:4px;height:100%;background:var(--orange)}
.stat-card.green::before{background:var(--green)}.stat-card.blue::before{background:var(--blue)}.stat-card.yellow::before{background:var(--yellow)}.stat-card.red::before{background:var(--danger)}
.stat-label{font-size:12px;color:var(--muted);margin-bottom:6px}
.stat-value{font-size:24px;font-weight:900;color:var(--navy);font-variant-numeric:tabular-nums}
.table-wrap{overflow-x:auto;border-radius:var(--radius);border:1px solid var(--line)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#f8f9fc;padding:12px;text-align:right;font-weight:700;color:var(--navy);border-bottom:2px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:hover{background:#fafbfd}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700}
.badge-new{background:#eff6ff;color:var(--blue)}.badge-progress{background:#fff7ed;color:#9a3412}
.badge-done{background:#ecfdf3;color:var(--green)}.badge-cancel{background:#fef3f2;color:var(--danger)}
.badge-active{background:#ecfdf3;color:var(--green)}.badge-inactive{background:#fef3f2;color:var(--danger)}
.badge-role{background:var(--navy-light);color:#fff;padding:2px 8px;border-radius:10px;font-size:10px}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:16px}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12px;font-weight:700;color:var(--muted)}
input,select,textarea{font:inherit;border:1px solid #cfd6e3;border-radius:8px;padding:9px 11px;background:#fff;outline:none;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--orange);box-shadow:0 0 0 3px #ff6b1a1c}
textarea{min-height:80px;resize:vertical}
.modal{display:none;position:fixed;inset:0;background:#071127a8;z-index:100;padding:18px;align-items:center;justify-content:center}
.modal.open{display:flex}
.modal-box{width:min(900px,100%);background:#fff;border-radius:var(--radius);padding:24px;max-height:90vh;overflow-y:auto}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.modal-header h2{font-size:18px;color:var(--navy)}
.modal-close{background:transparent;border:0;font-size:22px;cursor:pointer;color:var(--muted);padding:4px 10px}
.modal-footer{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}
.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.form-grid .full{grid-column:1/-1}
.toast{position:fixed;bottom:20px;left:20px;background:var(--navy);color:#fff;padding:12px 20px;border-radius:10px;z-index:200;display:none;box-shadow:0 10px 30px #0003;font-size:13px}
.toast.show{display:block;animation:slideIn .3s}
.toast.success{background:var(--green)}.toast.error{background:var(--danger)}
@keyframes slideIn{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
.loading{text-align:center;padding:40px;color:var(--muted)}
.spinner{display:inline-block;width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--orange);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.menu-toggle{display:none;background:var(--navy);color:#fff;border:0;padding:8px 12px;border-radius:8px;cursor:pointer}
@media(max-width:900px){.app{grid-template-columns:1fr}.sidebar{position:fixed;right:-280px;width:260px;z-index:50;transition:right .3s}.sidebar.open{right:0}.menu-toggle{display:block}.form-grid{grid-template-columns:1fr}}
.welcome-banner{background:linear-gradient(115deg,#0B1736,#203968);color:#fff;border-radius:18px;padding:22px 25px;margin-bottom:18px;display:flex;justify-content:space-between;align-items:center;gap:15px;overflow:hidden;position:relative}
.welcome-banner h2{font-size:17px;margin:0 0 7px;color:#fff}
.welcome-banner p{font-size:11px;color:#d2d9e8;margin:0;line-height:1.9}
.welcome-icon{font-size:48px;opacity:.8;padding:0 10px}
.level-chip{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:20px;background:#fff0e7;color:#bd4a0d;font-size:11px;font-weight:800}
.invoice-box{background:#fff;padding:30px;border-radius:12px}
.invoice-header{text-align:center;border-bottom:2px solid var(--navy);padding-bottom:15px;margin-bottom:20px}
.invoice-header h1{color:var(--navy);font-size:24px}
.invoice-header h1 span{color:var(--orange)}
.invoice-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--line)}
.invoice-row strong{color:var(--navy)}
.invoice-total{font-size:18px;font-weight:900;color:var(--orange);margin-top:15px;padding-top:15px;border-top:2px solid var(--navy)}
.thread-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px;border:1px solid var(--line);border-radius:12px;margin:9px 0;background:#fff}
.thread-meta{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin:6px 0;font-size:11px;color:var(--muted)}
.thread-state{display:inline-flex;padding:4px 8px;border-radius:20px;font-size:10px;font-weight:800}
.thread-state.unread{background:#ffebed;color:#c62836}
.thread-state.open{background:#edf2ff;color:#4567bb}
.thread-state.closed{background:#f0f1f4;color:#687386}
.unread-badge{display:inline-flex;align-items:center;justify-content:center;min-width:19px;height:19px;padding:0 5px;margin-right:auto;border-radius:20px;background:#d92d3a;color:#fff;font-size:10px;font-weight:900;line-height:1;box-shadow:0 0 0 2px var(--navy)}
</style>
</head>
<body>

<div id="loginPage" class="login-page">
<div class="login-box">
<h1>Zingo<span>Vingo</span></h1>
<div class="subtitle">پنل مشتریان</div>
<div id="loginError" class="login-error"></div>
<div class="field"><label>کد اشتراک</label><input id="loginCode" autocomplete="username" placeholder="مثلاً ZV-mvxx32v8"></div>
<div class="field"><label>شماره موبایل</label><input id="loginPhone" inputmode="tel" autocomplete="tel" placeholder="09123456789"></div>
<button class="btn btn-primary" onclick="doLogin()">ورود به پنل</button>
</div>
</div>

<div id="appContainer" class="app" style="display:none">
<aside class="sidebar" id="sidebar">
<div class="brand"><h2>Zingo<span>Vingo</span></h2><small>پنل مشتریان</small></div>
<nav class="nav-menu" id="navMenu"></nav>
<div class="sidebar-footer">
<div class="user-info"><div class="user-avatar" id="userAvatar">?</div><div><div class="user-name" id="userName">—</div><div class="user-role" id="userLevel">—</div></div></div>
<button class="logout-btn" onclick="doLogout()">🚪 خروج</button>
</div>
</aside>
<main class="main">
<button class="menu-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')">☰ منو</button>
<div id="pageContent"><div class="loading"><div class="spinner"></div></div></div>
</main>
</div>

<div id="toast" class="toast"></div>
<div id="modal" class="modal"><div class="modal-box" id="modalBox"></div></div>

<script>
const $ = id => document.getElementById(id);
const money = n => new Intl.NumberFormat('en-US').format(Math.round(Number(n)||0)) + ' ریال';
const toFa = n => new Intl.NumberFormat('fa-IR').format(n);
const esc = v => String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let currentToken = localStorage.getItem('zv_cst_token') || null;
let currentUser = null;

const MENU = [
{ id:'dashboard', label:'داشبورد', icon:'📊' },
{ id:'orders', label:'سفارشات من', icon:'📋' },
{ id:'cards', label:'کارت‌های من', icon:'🎫' },
{ id:'invoices', label:'فاکتورها', icon:'🧾' },
{ id:'messages', label:'پیام‌ها', icon:'💬' },
{ id:'newOrder', label:'سفارش جدید', icon:'➕' },
{ id:'profile', label:'پروفایل من', icon:'👤' }
];

function toast(msg, type='info'){ const t=$('toast'); t.textContent=msg; t.className='toast show '+(type==='success'?'success':type==='error'?'error':''); setTimeout(()=>t.classList.remove('show'),3500); }
function openModal(html){ $('modalBox').innerHTML=html; $('modal').classList.add('open'); }
function closeModal(){ $('modal').classList.remove('open'); }
$('modal').addEventListener('click', e=>{ if(e.target===$('modal')) closeModal(); });
function statusBadge(s){ const cls=/جدید|ثبت/.test(s)?'new':/تکمیل/.test(s)?'done':/لغو/.test(s)?'cancel':/انجام|بررسی/.test(s)?'progress':'info'; return '<span class="badge badge-'+cls+'">'+esc(s)+'</span>'; }

function doLogin(){
const c=$('loginCode').value.trim(), p=$('loginPhone').value.trim();
if(!c||!p){ $('loginError').textContent='کد اشتراک و موبایل را وارد کنید'; $('loginError').style.display='block'; return; }
$('loginError').style.display='none';
callServer('customerLogin',[c,p],r=>{
if(r&&r.success){ currentToken=r.token; currentUser=r.user;
localStorage.setItem('zv_cst_token',r.token); localStorage.setItem('zv_cst_user',JSON.stringify(r.user));
showApp(r.user);
} else { $('loginError').textContent=(r&&r.message)||'خطا در ورود'; $('loginError').style.display='block'; }
},e=>{ $('loginError').textContent=e.message||'خطا'; $('loginError').style.display='block'; });
}
function doLogout(){
if(currentToken) callServer('customerLogout',[currentToken],()=>{});
localStorage.removeItem('zv_cst_token'); localStorage.removeItem('zv_cst_user');
location.reload();
}
function showApp(user){
currentUser=user;
$('loginPage').style.display='none'; $('appContainer').style.display='grid';
$('userName').textContent=user.fullName||'—';
$('userLevel').textContent=(user.level||'عادی')+' — تخفیف '+toFa(user.discountRate||0)+'٪';
const av=$('userAvatar');
if(user.avatar) av.innerHTML='<img src="'+esc(user.avatar)+'">'; else av.textContent=(user.fullName||'?').charAt(0);
$('navMenu').innerHTML=MENU.map(i=>'<div class="nav-item" data-page="'+i.id+'"><span>'+i.icon+'</span><span>'+i.label+'</span>'+(i.id==='messages'?'<span class="unread-badge" id="msgBadge" hidden>0</span>':'')+'</div>').join('');
$('navMenu').querySelectorAll('.nav-item').forEach(b=>b.addEventListener('click',()=>{
$('navMenu').querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
b.classList.add('active'); $('sidebar').classList.remove('open'); loadPage(b.dataset.page);
}));
loadPage('dashboard'); refreshUnread();
}
function refreshUnread(){
if(!currentToken) return;
callServer('getCustomerUnreadCount',[currentToken],n=>{ const b=$('msgBadge'); if(b){ b.textContent=toFa(n||0); b.hidden=!n; } });
}
(function checkSession(){
const saved=localStorage.getItem('zv_cst_user');
if(currentToken&&saved){ try{ currentUser=JSON.parse(saved); showApp(currentUser); }catch(e){} }
})();
function loadPage(page){
$('pageContent').innerHTML='<div class="loading"><div class="spinner"></div></div>';
const m={dashboard:loadDashboard,orders:loadOrders,cards:loadCards,invoices:loadInvoices,messages:loadMessages,newOrder:loadNewOrder,profile:loadProfile};
(m[page]||loadDashboard)();
}

function loadDashboard(){
callServer('getCustomerDashboard',[currentToken],s=>{
$('pageContent').innerHTML=
'<div class="welcome-banner"><div><h2>سلام '+esc(currentUser.fullName||'مشتری گرامی')+' 👋</h2><p>کد اشتراک: <strong>'+esc(currentUser.customerId)+'</strong> — سطح '+esc(s.level||'عادی')+' با '+toFa(s.discountRate||0)+'٪ تخفیف</p></div><div class="welcome-icon">🎉</div></div>'+
'<div class="stats-grid">'+
'<div class="stat-card"><div class="stat-label">کل سفارشات</div><div class="stat-value">'+toFa(s.totalOrders)+'</div></div>'+
'<div class="stat-card yellow"><div class="stat-label">در حال انجام</div><div class="stat-value">'+toFa(s.activeOrders)+'</div></div>'+
'<div class="stat-card green"><div class="stat-label">تکمیل شده</div><div class="stat-value">'+toFa(s.completedOrders)+'</div></div>'+
'<div class="stat-card blue"><div class="stat-label">مجموع خرید</div><div class="stat-value" style="font-size:18px">'+money(s.totalSpent)+'</div></div>'+
'</div>'+
'<div class="card"><h3 class="zv-card-title">آخرین سفارشات شما</h3><div id="recentOrders"><div class="loading"><div class="spinner"></div></div></div></div>';
callServer('getCustomerOrders',[{},currentToken],rows=>{
const el=$('recentOrders');
if(!rows||!rows.length){ el.innerHTML='<div style="padding:20px;text-align:center;color:var(--muted)">هنوز سفارشی ثبت نکرده‌اید.</div>'; return; }
el.innerHTML='<div class="table-wrap"><table><thead><tr><th>کد</th><th>خدمت</th><th>تاریخ</th><th>مبلغ</th><th>وضعیت</th></tr></thead><tbody>'+
rows.slice(0,5).map(r=>'<tr><td><strong>'+esc(r.requestId)+'</strong></td><td>'+esc(r.service)+'</td><td>'+esc(r.date)+'</td><td>'+money(r.finalPrice)+'</td><td>'+statusBadge(r.status)+'</td></tr>').join('')+'</tbody></table></div>';
});
},e=>toast(e.message,'error'));
}

function loadOrders(){
$('pageContent').innerHTML=
'<div class="page-header"><h1 class="page-title">سفارشات من</h1></div>'+
'<div class="card">'+
'<div class="filters">'+
'<div class="field"><label>از تاریخ</label><input id="ordFrom" placeholder="۱۴۰۵/۰۱/۰۱"></div>'+
'<div class="field"><label>تا تاریخ</label><input id="ordTo" placeholder="۱۴۰۵/۱۲/۲۹"></div>'+
'<div class="field"><label>شناسه سفارش</label><input id="ordReq" placeholder="Request-ID"></div>'+
'<div class="field"><label>وضعیت</label><select id="ordStatus"><option value="همه">همه</option><option>جدید</option><option>تبدیل به کارت</option><option>در حال انجام</option><option>تکمیل شده</option><option>لغو شده</option></select></div>'+
'<div class="field" style="justify-content:flex-end"><button class="btn btn-primary" onclick="fetchOrders()">🔍 جستجو</button></div>'+
'</div>'+
'<div id="ordersTable"></div>'+
'</div>';
fetchOrders();
}
function fetchOrders(){
const f={fromDate:$('ordFrom').value,toDate:$('ordTo').value,requestId:$('ordReq').value,status:$('ordStatus').value};
$('ordersTable').innerHTML='<div class="loading"><div class="spinner"></div></div>';
callServer('getCustomerOrders',[f,currentToken],rows=>{
if(!rows.length){ $('ordersTable').innerHTML='<div style="padding:20px;text-align:center;color:var(--muted)">سفارشی با این فیلترها یافت نشد.</div>'; return; }
$('ordersTable').innerHTML='<div class="table-wrap"><table><thead><tr><th>تاریخ</th><th>کد سفارش</th><th>خدمت</th><th>تاریخ اجرا</th><th>مبلغ</th><th>وضعیت</th><th>عملیات</th></tr></thead><tbody>'+
rows.map(r=>'<tr><td>'+esc(r.date)+'</td><td><strong>'+esc(r.requestId)+'</strong></td><td>'+esc(r.service)+'</td><td>'+esc(r.execDate)+' '+esc(r.execTime||'')+'</td><td>'+money(r.finalPrice)+'</td><td>'+statusBadge(r.status)+'</td><td><button class="btn btn-sm btn-secondary" onclick="viewInvoice(\''+esc(r.requestId)+'\')">🧾 فاکتور</button></td></tr>').join('')+'</tbody></table></div>';
},e=>$('ordersTable').innerHTML='<div style="padding:20px;text-align:center;color:var(--danger)">'+esc(e.message)+'</div>');
}

function loadCards(){
$('pageContent').innerHTML=
'<div class="page-header"><h1 class="page-title">کارت‌های من</h1></div>'+
'<div class="card">'+
'<div class="filters">'+
'<div class="field"><label>از تاریخ</label><input id="cdFrom" placeholder="۱۴۰۵/۰۱/۰۱"></div>'+
'<div class="field"><label>تا تاریخ</label><input id="cdTo" placeholder="۱۴۰۵/۱۲/۲۹"></div>'+
'<div class="field"><label>شناسه کارت</label><input id="cdId" placeholder="Card-ID"></div>'+
'<div class="field"><label>وضعیت</label><select id="cdStatus"><option value="همه">همه</option><option>جدید</option><option>در حال انجام</option><option>تکمیل شده</option><option>لغو شده</option></select></div>'+
'<div class="field" style="justify-content:flex-end"><button class="btn btn-primary" onclick="fetchCards()">🔍 جستجو</button></div>'+
'</div>'+
'<div id="cardsTable"></div>'+
'</div>';
fetchCards();
}
function fetchCards(){
const f={fromDate:$('cdFrom').value,toDate:$('cdTo').value,cardId:$('cdId').value,status:$('cdStatus').value};
$('cardsTable').innerHTML='<div class="loading"><div class="spinner"></div></div>';
callServer('getCustomerCards',[f,currentToken],rows=>{
if(!rows.length){ $('cardsTable').innerHTML='<div style="padding:20px;text-align:center;color:var(--muted)">کارتی یافت نشد.</div>'; return; }
$('cardsTable').innerHTML='<div class="table-wrap"><table><thead><tr><th>کارت</th><th>سفارش</th><th>خدمت</th><th>نیروی اجرا</th><th>تاریخ اجرا</th><th>مبلغ</th><th>وضعیت</th></tr></thead><tbody>'+
rows.map(r=>'<tr><td><strong>'+esc(r.cardId)+'</strong></td><td>'+esc(r.requestId)+'</td><td>'+esc(r.service)+'</td><td>'+esc(r.workerName)+'</td><td>'+esc(r.execDate)+' '+esc(r.execTime||'')+'</td><td>'+money(r.amount)+'</td><td>'+statusBadge(r.status)+'</td></tr>').join('')+'</tbody></table></div>';
},e=>$('cardsTable').innerHTML='<div style="padding:20px;text-align:center;color:var(--danger)">'+esc(e.message)+'</div>');
}

function loadInvoices(){
$('pageContent').innerHTML=
'<div class="page-header"><h1 class="page-title">فاکتورهای من</h1></div>'+
'<div class="card">'+
'<div class="field" style="max-width:320px"><label>شناسه سفارش</label><div style="display:flex;gap:8px"><input id="invReq" placeholder="ZV-..."><button class="btn btn-primary" onclick="viewInvoice($(\'invReq\').value)">🔍 مشاهده</button></div></div>'+
'<div style="margin-top:14px"><h3 class="zv-card-title">فاکتورهای اخیر</h3><div id="invList"></div></div>'+
'</div>';
callServer('getCustomerOrders',[{},currentToken],rows=>{
const el=$('invList');
if(!rows.length){ el.innerHTML='<div style="padding:20px;text-align:center;color:var(--muted)">فاکتوری موجود نیست.</div>'; return; }
el.innerHTML='<div class="table-wrap"><table><thead><tr><th>کد سفارش</th><th>تاریخ</th><th>خدمت</th><th>مبلغ</th><th>عملیات</th></tr></thead><tbody>'+
rows.map(r=>'<tr><td><strong>'+esc(r.requestId)+'</strong></td><td>'+esc(r.date)+'</td><td>'+esc(r.service)+'</td><td>'+money(r.finalPrice)+'</td><td><button class="btn btn-sm btn-secondary" onclick="viewInvoice(\''+esc(r.requestId)+'\')">مشاهده</button></td></tr>').join('')+'</tbody></table></div>';
});
}
function viewInvoice(requestId){
if(!requestId) return toast('شناسه سفارش را وارد کنید','error');
$('pageContent').innerHTML='<div class="loading"><div class="spinner"></div></div>';
callServer('getCustomerOrderInvoice',[requestId,currentToken],inv=>{
$('pageContent').innerHTML=
'<div class="page-header"><h1 class="page-title">فاکتور '+esc(inv.requestId)+'</h1><button class="btn btn-secondary" onclick="loadInvoices()">بازگشت</button></div>'+
'<div class="card invoice-box">'+
'<div class="invoice-header"><h1>Zingo<span>Vingo</span></h1><div style="color:var(--muted);font-size:12px">فاکتور رسمی خدمات</div></div>'+
'<div class="invoice-row"><span>کد اشتراک</span><strong>'+esc(inv.customerCode)+'</strong></div>'+
'<div class="invoice-row"><span>نام مشتری</span><strong>'+esc(inv.customerName)+'</strong></div>'+
'<div class="invoice-row"><span>تلفن</span><strong style="direction:ltr">'+esc(inv.phone)+'</strong></div>'+
'<div class="invoice-row"><span>سطح مشتری</span><strong>'+esc(inv.level)+' — '+toFa(inv.discountRate)+'٪</strong></div>'+
'<div class="invoice-row"><span>کد سفارش</span><strong>'+esc(inv.requestId)+'</strong></div>'+
'<div class="invoice-row"><span>کد کارت</span><strong>'+esc(inv.cardId||'—')+'</strong></div>'+
'<div class="invoice-row"><span>خدمت</span><strong>'+esc(inv.service)+'</strong></div>'+
'<div class="invoice-row"><span>تاریخ اجرا</span><strong>'+esc(inv.execDate)+' '+esc(inv.execTime||'')+'</strong></div>'+
'<div class="invoice-row"><span>نیروی اجراکننده</span><strong>'+esc(inv.workerName)+'</strong></div>'+
'<div class="invoice-row"><span>وضعیت</span><strong>'+statusBadge(inv.status)+'</strong></div>'+
'<div class="invoice-row"><span>قیمت پایه</span><strong>'+money(inv.basePrice)+'</strong></div>'+
'<div class="invoice-row"><span>تخفیف</span><strong style="color:var(--green)">− '+money(inv.discount)+'</strong></div>'+
'<div class="invoice-row"><span>مالیات</span><strong>'+money(inv.tax)+'</strong></div>'+
'<div class="invoice-row invoice-total"><span>مبلغ قابل پرداخت</span><span>'+money(inv.finalPrice)+'</span></div>'+
(inv.notes?'<div style="margin-top:14px;padding:12px;background:#f8f9fc;border-radius:10px;font-size:12px"><strong>توضیحات:</strong> '+esc(inv.notes)+'</div>':'')+
'<div style="margin-top:16px"><button class="btn btn-dark" onclick="window.print()">🖨 چاپ فاکتور</button></div>'+
'</div>';
},e=>$('pageContent').innerHTML='<div style="padding:20px;text-align:center;color:var(--danger)">'+esc(e.message)+'</div>');
}

function loadMessages(){
$('pageContent').innerHTML=
'<div class="page-header"><h1 class="page-title">پیام‌ها و پشتیبانی</h1><button class="btn btn-primary" onclick="newMessageModal()">✉️ پیام جدید</button></div>'+
'<div id="msgList"><div class="loading"><div class="spinner"></div></div></div>';
fetchMessages();
}
function fetchMessages(){
callServer('getCustomerConversations',[currentToken],rows=>{
const el=$('msgList');
if(!rows.length){ el.innerHTML='<div class="card"><div style="padding:20px;text-align:center;color:var(--muted)">هنوز پیامی ثبت نکرده‌اید.</div></div>'; return; }
el.innerHTML=rows.map(m=>
'<div class="thread-row">'+
'<div style="flex:1;min-width:0">'+
'<div style="font-weight:800;color:var(--navy);font-size:13px">'+esc(m.subject||'بدون موضوع')+'</div>'+
'<div style="font-size:12px;color:var(--text);margin:4px 0">'+esc(m.message)+'</div>'+
(m.reply?'<div style="font-size:12px;color:var(--muted);margin-top:6px;padding:8px;background:#f8f9fc;border-radius:8px"><strong>پاسخ پشتیبانی:</strong> '+esc(m.reply)+'</div>':'')+
'<div class="thread-meta"><span>'+esc(m.createdAt)+'</span><span class="thread-state '+(m.status==='unread'?'unread':m.status==='open'?'open':'closed')+'">'+(m.status==='unread'?'بدون پاسخ':m.status==='open'?'باز':'خوانده شده')+'</span></div>'+
'</div>'+
'<button class="btn btn-sm btn-secondary" onclick="replyMessageModal(\''+esc(m.conversationId)+'\',\''+esc(m.subject)+'\')">↩️ پاسخ</button>'+
'</div>'
).join('');
refreshUnread();
},e=>toast(e.message,'error'));
}
function newMessageModal(){
openModal('<div class="modal-header"><h2>پیام جدید به پشتیبانی</h2><button class="modal-close" onclick="closeModal()">✕</button></div>'+
'<div class="form-grid"><div class="field"><label>موضوع</label><input id="msgSubject" placeholder="موضوع پیام"></div>'+
'<div class="field full"><label>متن پیام</label><textarea id="msgBody" placeholder="پیام خود را بنویسید…"></textarea></div></div>'+
'<div class="modal-footer"><button class="btn btn-secondary" onclick="closeModal()">انصراف</button><button class="btn btn-primary" onclick="sendNewMessage()">ارسال</button></div>');
}
function sendNewMessage(){
const s=$('msgSubject').value.trim(), b=$('msgBody').value.trim();
if(!b) return toast('متن پیام را وارد کنید','error');
callServer('createCustomerConversation',[s,b,currentToken],()=>{ closeModal(); toast('پیام ارسال شد','success'); loadMessages(); },e=>toast(e.message,'error'));
}
function replyMessageModal(id,subject){
openModal('<div class="modal-header"><h2>پاسخ به: '+esc(subject)+'</h2><button class="modal-close" onclick="closeModal()">✕</button></div>'+
'<div class="field"><label>متن پاسخ</label><textarea id="replyBody"></textarea></div>'+
'<div class="modal-footer"><button class="btn btn-secondary" onclick="closeModal()">انصراف</button><button class="btn btn-primary" onclick="sendReply(\''+esc(id)+'\')">ارسال</button></div>');
}
function sendReply(id){
const b=$('replyBody').value.trim();
if(!b) return toast('متن را وارد کنید','error');
callServer('replyCustomerConversation',[id,b,currentToken],()=>{ closeModal(); toast('پاسخ ارسال شد','success'); loadMessages(); },e=>toast(e.message,'error'));
}

function loadNewOrder(){
$('pageContent').innerHTML=
'<div class="page-header"><h1 class="page-title">ثبت درخواست جدید</h1></div>'+
'<div class="card">'+
'<div style="padding:12px 14px;border-radius:10px;background:#fff7ed;color:#9a3412;border:1px solid #ffead5;font-size:12px;margin-bottom:14px">برای ثبت درخواست جدید، به فرم عمومی خدمات هدایت می‌شوید. کد اشتراک شما به‌صورت خودکار اعمال می‌شود و تخفیف سطح '+esc(currentUser.level)+' به سفارش شما تعلق می‌گیرد.</div>'+
'<button class="btn btn-primary" style="min-height:46px;font-size:14px" onclick="openNewOrderForm()">➕ باز کردن فرم سفارش</button>'+
'</div>';
}
function openNewOrderForm(){
window.open('?page=user&membershipCode='+encodeURIComponent(currentUser.customerId),'_blank');
}

function loadProfile(){
callServer('getCustomerProfile',[currentToken],p=>{
$('pageContent').innerHTML=
'<div class="page-header"><h1 class="page-title">پروفایل من</h1></div>'+
'<div class="card">'+
'<div style="display:flex;align-items:center;gap:16px">'+
'<div style="width:112px;height:112px;border-radius:50%;background:#fff0e7;color:#bd4a0d;display:grid;place-items:center;font-size:42px;font-weight:900;border:4px solid #fff;box-shadow:0 0 0 1px var(--line)">'+(p.avatar?'<img src="'+esc(p.avatar)+'" style="width:100%;height:100%;object-fit:cover">':(p.fullName||'?').charAt(0))+'</div>'+
'<div>'+
'<h3 style="color:var(--navy);margin:0 0 6px">'+esc(p.fullName)+'</h3>'+
'<div class="level-chip">⭐ '+esc(p.level)+' — '+toFa(p.discountRate||0)+'٪ تخفیف</div>'+
'<div style="color:var(--muted);font-size:11px;margin-top:8px">کد اشتراک: <strong>'+esc(p.customerId)+'</strong></div>'+
'</div>'+
'</div>'+
'</div>'+
'<div class="card" style="margin-top:16px">'+
'<h3 class="zv-card-title">ویرایش اطلاعات</h3>'+
'<div class="form-grid">'+
'<div class="field"><label>نام</label><input id="pfFirst" value="'+esc(p.firstName)+'"></div>'+
'<div class="field"><label>نام خانوادگی</label><input id="pfLast" value="'+esc(p.lastName)+'"></div>'+
'<div class="field"><label>موبایل</label><input id="pfPhone" value="'+esc(p.phone)+'"></div>'+
'<div class="field"><label>ایمیل</label><input id="pfEmail" value="'+esc(p.email)+'"></div>'+
'<div class="field"><label>استان</label><input id="pfProvince" value="'+esc(p.province)+'"></div>'+
'<div class="field"><label>شهر</label><input id="pfCity" value="'+esc(p.city)+'"></div>'+
'<div class="field full"><label>آدرس</label><textarea id="pfAddr">'+esc(p.address)+'</textarea></div>'+
'<div class="field"><label>کد پستی</label><input id="pfPostal" value="'+esc(p.postalCode)+'"></div>'+
'<div class="field"><label>URL عکس پروفایل</label><input id="pfAvatar" value="'+esc(p.avatar)+'"></div>'+
'</div>'+
'<button class="btn btn-primary" style="margin-top:14px" onclick="saveProfile()">💾 ذخیره تغییرات</button>'+
'</div>';
},e=>toast(e.message,'error'));
}
function saveProfile(){
const u={phone:$('pfPhone').value,email:$('pfEmail').value,province:$('pfProvince').value,city:$('pfCity').value,address:$('pfAddr').value,postalCode:$('pfPostal').value,avatar:$('pfAvatar').value};
callServer('updateCustomerProfile',[u,currentToken],()=>{ toast('پروفایل ذخیره شد','success'); },e=>toast(e.message,'error'));
}

document.addEventListener('keydown', e=>{ if(e.key==='Enter'&&$('loginPage').style.display!=='none') doLogin(); });
</script>
</body>
</html>
