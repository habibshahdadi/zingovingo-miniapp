<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<base target="_top">
<title>پنل مشتری | ZingoVingo</title>
<script src="zv-api.js"></script>
<style>
:root{--navy:#0B1736;--navy-light:#1a2a4d;--orange:#FF6B1A;--orange-light:#ff8533;--bg:#f4f6fb;--text:#172033;--muted:#657086;--line:#dfe4ee;--white:#fff;--green:#067647;--danger:#b42318;--blue:#1849a9;--yellow:#f79009;--shadow:0 2px 10px #17203308;--radius:14px}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:Tahoma,Arial,sans-serif;line-height:1.7;font-size:14px}
button,input,select,textarea{font-family:inherit;font-size:13px}
.login-page{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--navy) 0%,#1a2a4d 100%);padding:16px}
.login-box{background:#fff;border-radius:20px;padding:32px;width:min(440px,100%);box-shadow:0 20px 60px #0003}
.login-box h1{color:var(--navy);text-align:center;margin-bottom:6px;font-size:26px}
.login-box h1 span{color:var(--orange)}
.login-sub{text-align:center;color:var(--muted);margin-bottom:18px;font-size:12px}
.login-tabs{display:flex;gap:8px;margin-bottom:18px;background:#f4f6fb;padding:5px;border-radius:12px}
.login-tab{flex:1;padding:10px;text-align:center;border-radius:9px;cursor:pointer;font-size:12px;font-weight:700;color:var(--muted);transition:all .2s;border:0;background:transparent}
.login-tab.active{background:#fff;color:var(--navy);box-shadow:0 2px 8px #17203315}
.login-error{background:#fef3f2;color:var(--danger);padding:10px;border-radius:9px;font-size:12px;margin-bottom:12px;display:none}
.login-info{background:#eff6ff;color:var(--blue);padding:10px;border-radius:9px;font-size:12px;margin-bottom:12px;display:none}
.field{margin-bottom:12px;display:flex;flex-direction:column;gap:5px}
.field label{font-weight:700;font-size:12px;color:var(--muted)}
.field input,.field select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:9px;outline:none;font-size:13px}
.field input:focus,.field select:focus{border-color:var(--orange);box-shadow:0 0 0 3px #ff6b1a1c}
.btn{border:0;border-radius:10px;padding:11px 16px;font:inherit;font-weight:700;cursor:pointer;transition:all .2s}
.btn-primary{background:var(--orange);color:#fff}.btn-primary:hover{background:var(--orange-light)}
.btn-primary:disabled{opacity:.6;cursor:not-allowed}
.btn-secondary{background:#eef1f7;color:var(--navy)}.btn-secondary:hover{background:#dfe4ee}
.btn-full{width:100%}
.otp-row{display:flex;gap:8px}
.otp-row input{flex:1}
.otp-row button{white-space:nowrap;min-width:110px}
.otp-hint{font-size:11px;color:var(--muted);margin-top:6px;text-align:center}
.otp-timer{color:var(--orange);font-weight:700}
.tab-panel{display:none}
.tab-panel.active{display:block}
.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
.sidebar{background:var(--navy);color:#fff;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column}
.brand{padding:18px 16px;border-bottom:1px solid var(--navy-light)}
.brand h2{font-size:20px;font-weight:900}.brand h2 span{color:var(--orange)}
.brand small{color:#8896b3;font-size:11px}
.nav-menu{flex:1;padding:10px 8px}
.nav-item{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;color:#c8d2e6;font-size:13px;border-right:3px solid transparent;transition:all .2s}
.nav-item:hover{background:var(--navy-light);color:#fff}
.nav-item.active{background:var(--navy-light);color:#fff;border-right-color:var(--orange)}
.sidebar-footer{padding:14px 16px;border-top:1px solid var(--navy-light);font-size:12px}
.user-info{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.user-avatar{width:36px;height:36px;border-radius:50%;background:var(--orange);display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;overflow:hidden;flex:0 0 36px}
.user-avatar img{width:100%;height:100%;object-fit:cover}
.user-name{font-weight:700;font-size:13px}
.user-role{color:#8896b3;font-size:11px}
.logout-btn{background:transparent;border:1px solid var(--navy-light);color:#c8d2e6;padding:8px;border-radius:8px;cursor:pointer;width:100%;font-size:12px}
.logout-btn:hover{background:var(--navy-light);color:#fff}
.main{padding:22px;overflow-x:hidden}
.page-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;flex-wrap:wrap;gap:10px}
.page-title{font-size:19px;color:var(--navy);font-weight:900}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:16px;box-shadow:var(--shadow)}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.stat-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px;position:relative;overflow:hidden}
.stat-card::before{content:'';position:absolute;top:0;right:0;width:4px;height:100%;background:var(--orange)}
.stat-card.green::before{background:var(--green)}.stat-card.blue::before{background:var(--blue)}.stat-card.yellow::before{background:var(--yellow)}
.stat-label{font-size:11px;color:var(--muted);margin-bottom:5px}
.stat-value{font-size:22px;font-weight:900;color:var(--navy);font-variant-numeric:tabular-nums}
.table-wrap{overflow-x:auto;border-radius:var(--radius);border:1px solid var(--line)}
table{width:100%;border-collapse:collapse;font-size:12px}
th{background:#f8f9fc;padding:11px;text-align:right;font-weight:700;color:var(--navy);border-bottom:2px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:hover{background:#fafbfd}
.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:10px;font-weight:700}
.badge-new{background:#eff6ff;color:var(--blue)}.badge-progress{background:#fff7ed;color:#9a3412}
.badge-done{background:#ecfdf3;color:var(--green)}.badge-cancel{background:#fef3f2;color:var(--danger)}
.badge-info{background:#edf2ff;color:#4567bb}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.filters .field{margin-bottom:0}
.btn-sm{padding:5px 10px;font-size:11px}
.modal{display:none;position:fixed;inset:0;background:#071127a8;z-index:100;padding:18px;align-items:center;justify-content:center}
.modal.open{display:flex}
.modal-box{width:min(600px,100%);background:#fff;border-radius:var(--radius);padding:22px;max-height:90vh;overflow-y:auto}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.modal-header h2{font-size:17px;color:var(--navy)}
.modal-close{background:transparent;border:0;font-size:22px;cursor:pointer;color:var(--muted)}
.modal-footer{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.toast{position:fixed;bottom:20px;left:20px;background:var(--navy);color:#fff;padding:12px 18px;border-radius:10px;z-index:200;display:none;box-shadow:0 10px 30px #0003;font-size:12px}
.toast.show{display:block;animation:slideIn .3s}
.toast.success{background:var(--green)}.toast.error{background:var(--danger)}
@keyframes slideIn{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
.loading{text-align:center;padding:30px;color:var(--muted)}
.spinner{display:inline-block;width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--orange);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.menu-toggle{display:none;background:var(--navy);color:#fff;border:0;padding:8px 12px;border-radius:8px;cursor:pointer;margin-bottom:12px}
@media(max-width:900px){.app{grid-template-columns:1fr}.sidebar{position:fixed;right:-280px;width:260px;z-index:50;transition:right .3s}.sidebar.open{right:0}.menu-toggle{display:block}}
.welcome-banner{background:linear-gradient(115deg,#0B1736,#203968);color:#fff;border-radius:18px;padding:20px 22px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.welcome-banner h2{font-size:16px;margin:0 0 5px;color:#fff}
.welcome-banner p{font-size:11px;color:#d2d9e8;margin:0}
.welcome-icon{font-size:42px;opacity:.8}
.level-chip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;background:#fff0e7;color:#bd4a0d;font-size:11px;font-weight:800}
.invoice-box{background:#fff;padding:24px;border-radius:12px}
.invoice-header{text-align:center;border-bottom:2px solid var(--navy);padding-bottom:12px;margin-bottom:16px}
.invoice-header h1{color:var(--navy);font-size:22px}.invoice-header h1 span{color:var(--orange)}
.invoice-row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13px}
.invoice-row strong{color:var(--navy)}
.invoice-total{font-size:17px;font-weight:900;color:var(--orange);margin-top:12px;padding-top:12px;border-top:2px solid var(--navy)}
.thread-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px;border:1px solid var(--line);border-radius:11px;margin:8px 0;background:#fff}
.thread-meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:5px 0;font-size:10px;color:var(--muted)}
.thread-state{display:inline-flex;padding:3px 7px;border-radius:20px;font-size:10px;font-weight:800}
.thread-state.unread{background:#ffebed;color:#c62836}
.thread-state.open{background:#edf2ff;color:#4567bb}
.thread-state.closed{background:#f0f1f4;color:#687386}
.unread-badge{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 4px;margin-right:auto;border-radius:20px;background:#d92d3a;color:#fff;font-size:10px;font-weight:900}

.order-form .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.order-form .field{display:flex;flex-direction:column;gap:5px;min-width:0}
.order-form .field label{font-size:12px;font-weight:700;color:var(--muted)}
.order-form .field input,.order-form .field select,.order-form .field textarea{font:inherit;font-size:13px;width:100%;border:1px solid #cfd6e3;border-radius:9px;padding:10px 11px;background:#fff;outline:none}
.order-form .field input:focus,.order-form .field select:focus,.order-form .field textarea:focus{border-color:var(--orange);box-shadow:0 0 0 3px #ff6b1a1c}
.order-form .field textarea{min-height:80px;resize:vertical}
.order-form .full{grid-column:1/-1}
.order-form .hint{font-size:11px;color:var(--muted)}
.order-form .required{color:var(--danger)}
.order-form .levelbar{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#fff7f1;border:1px solid #ffd7c2;border-radius:12px;padding:12px 14px;margin-bottom:14px}
.order-form .level-pill{font-weight:900;color:var(--navy);font-size:13px}
.order-form .side-list{display:grid;gap:10px;margin-top:8px}
.order-form .side-item{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:10px}
.order-form .side-item input[type=checkbox]{width:18px;height:18px;accent-color:var(--orange)}
.order-form .side-name{flex:1;font-size:12px;font-weight:700}
.order-form .side-qty{width:80px}
.order-form .price-preview{background:#f8f9fc;border:1px dashed #cbd3e1;border-radius:12px;padding:14px}
.order-form .price-line{display:flex;justify-content:space-between;gap:12px;padding:4px 0;font-size:13px}
.order-form .price-final{border-top:1px solid var(--line);margin-top:7px;padding-top:10px;font-size:15px;color:var(--navy);font-weight:800}
.order-form .date-wrap{position:relative}
.order-form .date-pop{display:none;position:absolute;top:calc(100% + 6px);right:0;z-index:50;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;width:290px;box-shadow:0 10px 30px #17203320}
.order-form .date-pop.open{display:block}
.order-form .cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.order-form .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.order-form .cal-grid button{padding:6px 0;border:0;border-radius:7px;background:#f3f5f9;cursor:pointer;font:inherit;font-size:12px}
.order-form .cal-grid button:hover{background:#ffe4d6}
.order-form .cal-grid .day-label{background:#fff;color:var(--muted);font-size:11px}
.order-form .date-btn{position:absolute;left:5px;top:5px;padding:5px 9px;background:#eef1f7;border:0;border-radius:7px;cursor:pointer}
.order-form .date-wrap input{padding-left:50px}
.order-form .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
</style>
</head>
<body>

<div id="loginPage" class="login-page">
<div class="login-box">
<h1>Zingo<span>Vingo</span></h1>
<div class="login-sub">پنل مشتریان — پیگیری سفارشات و خدمات</div>
<div class="login-tabs">
<button class="login-tab active" data-tab="code" onclick="switchLoginTab('code')">🔑 نام کاربری</button>
<button class="login-tab" data-tab="otp" onclick="switchLoginTab('otp')">📱 کد یکبار مصرف</button>
</div>
<div id="loginError" class="login-error"></div>
<div id="loginInfo" class="login-info"></div>

<div id="tabCode" class="tab-panel active">
<div class="field"><label>نام کاربری</label><input id="loginUsername" autocomplete="username" placeholder="نام کاربری خود را وارد کنید"></div>
<div class="field"><label>رمز عبور</label><input id="loginPassword" type="password" autocomplete="current-password" placeholder="رمز عبور"></div>
<button class="btn btn-primary btn-full" id="loginBtn" onclick="doLoginCode()">ورود به پنل</button>
</div>

<div id="tabOtp" class="tab-panel">
<div class="field"><label>شماره موبایل</label>
<div class="otp-row"><input id="loginPhone2" inputmode="tel" autocomplete="tel" placeholder="09123456789"><button class="btn btn-secondary" id="sendOtpBtn" onclick="sendOtp()">دریافت کد</button></div>
<div class="otp-hint">کد ۶ رقمی به پیام‌رسان بله شما ارسال می‌شود.</div>
</div>
<div class="field"><label>کد تأیید</label>
<div class="otp-row"><input id="loginOtp" inputmode="numeric" maxlength="6" placeholder="______" style="letter-spacing:4px;text-align:center;font-size:16px;font-weight:900"><button class="btn btn-primary" id="verifyOtpBtn" onclick="doLoginOtp()" style="min-width:100px" disabled>ورود</button></div>
<div class="otp-hint" id="otpTimer"></div>
</div>
</div>

<div style="text-align:center;margin-top:14px;font-size:11px;color:var(--muted)">نام کاربری ندارید؟ از <a href="?page=user" style="color:var(--orange)">فرم ثبت درخواست</a> استفاده کنید.</div>
</div>
</div>

<div id="appContainer" class="app" style="display:none">
<aside class="sidebar" id="sidebar">
<div class="brand"><h2>Zingo<span>Vingo</span></h2><small>پنل مشتریان</small></div>
<nav class="nav-menu" id="navMenu"></nav>
<div class="sidebar-footer">
<div class="user-info"><div class="user-avatar" id="userAvatar">?</div><div><div class="user-name" id="userName">—</div><div class="user-role" id="userLevel">—</div></div></div>
<button class="logout-btn" onclick="doLogout()">🚪 خروج</button>
</div>
</aside>
<main class="main">
<button class="menu-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')">☰ منو</button>
<div id="pageContent"><div class="loading"><div class="spinner"></div></div></div>
</main>
</div>

<div id="toast" class="toast"></div>
<div id="modal" class="modal"><div class="modal-box" id="modalBox"></div></div>

<script>
/* ==================== پل ارتباطی با zv-api.js / google.script.run ==================== */
/* این تابع همان API مورد استفاده در Employee.html و Supervisor.html است */
function callServer(action, args, onSuccess, onFailure){
  const runner = google.script.run
    .withSuccessHandler(onSuccess || function(){});
  if (onFailure) runner.withFailureHandler(onFailure);
  else runner.withFailureHandler(function(e){ toast((e && e.message) ? e.message : String(e), 'error'); });
  runner[action].apply(runner, args || []);
}

const $ = id => document.getElementById(id);
const money = n => new Intl.NumberFormat('en-US').format(Math.round(Number(n)||0)) + ' ریال';
const toFa = n => new Intl.NumberFormat('fa-IR').format(n);
const esc = v => String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let currentToken = localStorage.getItem('zv_cst_token') || null;
let currentUser = null;
let otpCountdown = null;

const MENU = [
{ id:'dashboard', label:'داشبورد', icon:'📊' },
{ id:'orders', label:'سفارشات من', icon:'📋' },
{ id:'cards', label:'کارت‌های من', icon:'🎫' },
{ id:'invoices', label:'فاکتورها', icon:'🧾' },
{ id:'messages', label:'پیام‌ها', icon:'💬', badge:true },
{ id:'newOrder', label:'سفارش جدید', icon:'➕' },
{ id:'profile', label:'پروفایل من', icon:'👤' }
];

function toast(msg, type='info'){ const t=$('toast'); t.textContent=msg; t.className='toast show '+(type==='success'?'success':type==='error'?'error':''); setTimeout(()=>t.classList.remove('show'),3500); }
function openModal(html){ $('modalBox').innerHTML=html; $('modal').classList.add('open'); }
function closeModal(){ $('modal').classList.remove('open'); }
$('modal').addEventListener('click', e=>{ if(e.target===$('modal')) closeModal(); });
function statusBadge(s){ const cls=/جدید|ثبت/.test(s)?'new':/تکمیل/.test(s)?'done':/لغو/.test(s)?'cancel':/انجام|بررسی/.test(s)?'progress':'info'; return '<span class="badge badge-'+cls+'">'+esc(s)+'</span>'; }

/* ==================== تب‌های ورود ==================== */
function switchLoginTab(tab){
  document.querySelectorAll('.login-tab').forEach(t=>t.classList.remove('active'));
  document.querySelector('.login-tab[data-tab="'+tab+'"]').classList.add('active');
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
  $('tab'+(tab==='code'?'Code':'Otp')).classList.add('active');
  hideLoginMessages();
}
function showLoginError(msg){ $('loginError').textContent=msg; $('loginError').style.display='block'; $('loginInfo').style.display='none'; }
function showLoginInfo(msg){ $('loginInfo').textContent=msg; $('loginInfo').style.display='block'; $('loginError').style.display='none'; }
function hideLoginMessages(){ $('loginError').style.display='none'; $('loginInfo').style.display='none'; }

/* ==================== روش ۱: نام کاربری + رمز ==================== */
function doLoginCode(){
  const u=$('loginUsername').value.trim(), p=$('loginPassword').value;
  if(!u||!p){ showLoginError('نام کاربری و رمز عبور را وارد کنید'); return; }
  hideLoginMessages();
  $('loginBtn').disabled=true; $('loginBtn').textContent='در حال بررسی…';
  callServer('customerLogin',[u,p],r=>{
    $('loginBtn').disabled=false; $('loginBtn').textContent='ورود به پنل';
    if(r&&r.success){ currentToken=r.token; currentUser=r.user;
      localStorage.setItem('zv_cst_token',r.token); localStorage.setItem('zv_cst_user',JSON.stringify(r.user));
      showApp(r.user);
    } else { showLoginError((r&&r.message)||'خطا در ورود'); }
  },e=>{
    $('loginBtn').disabled=false; $('loginBtn').textContent='ورود به پنل';
    showLoginError((e&&e.message)||'خطا در ارتباط با سرور');
  });
}

/* ==================== روش ۲: OTP ==================== */
function sendOtp(){
  const phone=$('loginPhone2').value.trim();
  if(!/^09\d{9}$/.test(phone)){ showLoginError('شماره موبایل معتبر نیست (باید با 09 شروع شود)'); return; }
  hideLoginMessages();
  $('sendOtpBtn').disabled=true; $('sendOtpBtn').textContent='در حال ارسال…';
  callServer('requestCustomerOtp',[phone],r=>{
    $('sendOtpBtn').disabled=false; $('sendOtpBtn').textContent='دریافت کد';
    $('verifyOtpBtn').disabled=false;
    if(r&&r.success){ showLoginInfo('کد تأیید به بله شما ارسال شد. (اعتبار: ۵ دقیقه)'); startOtpCountdown(120); }
    else { showLoginError((r&&r.message)||'ارسال کد ناموفق بود'); }
  },e=>{
    $('sendOtpBtn').disabled=false; $('sendOtpBtn').textContent='دریافت کد';
    showLoginError((e&&e.message)||'خطا در ارسال کد');
  });
}
function startOtpCountdown(seconds){
  clearInterval(otpCountdown);
  let s=seconds;
  $('otpTimer').innerHTML='ارسال مجدد تا <span class="otp-timer">'+toFa(s)+'</span> ثانیه دیگر';
  otpCountdown=setInterval(()=>{
    s--;
    if(s<=0){ clearInterval(otpCountdown); $('otpTimer').textContent='می‌توانید کد جدید درخواست کنید.'; }
    else { $('otpTimer').innerHTML='ارسال مجدد تا <span class="otp-timer">'+toFa(s)+'</span> ثانیه دیگر'; }
  },1000);
}
function doLoginOtp(){
  const phone=$('loginPhone2').value.trim(), otp=$('loginOtp').value.trim();
  if(!phone||!otp){ showLoginError('شماره و کد تأیید را وارد کنید'); return; }
  if(otp.length!==6){ showLoginError('کد تأیید باید ۶ رقم باشد'); return; }
  hideLoginMessages();
  $('verifyOtpBtn').disabled=true; $('verifyOtpBtn').textContent='بررسی…';
  callServer('verifyCustomerOtp',[phone,otp],r=>{
    $('verifyOtpBtn').disabled=false; $('verifyOtpBtn').textContent='ورود';
    if(r&&r.success){ currentToken=r.token; currentUser=r.user;
      localStorage.setItem('zv_cst_token',r.token); localStorage.setItem('zv_cst_user',JSON.stringify(r.user));
      showApp(r.user);
    } else { showLoginError((r&&r.message)||'کد تأیید اشتباه یا منقضی است'); }
  },e=>{
    $('verifyOtpBtn').disabled=false; $('verifyOtpBtn').textContent='ورود';
    showLoginError((e&&e.message)||'خطا در بررسی کد');
  });
}

function doLogout(){
  if(currentToken) callServer('customerLogout',[currentToken],()=>{});
  localStorage.removeItem('zv_cst_token'); localStorage.removeItem('zv_cst_user');
  location.reload();
}
function showApp(user){
  currentUser=user;
  $('loginPage').style.display='none'; $('appContainer').style.display='grid';
  $('userName').textContent=user.fullName||'—';
  $('userLevel').textContent=(user.level||'عادی')+' — تخفیف '+toFa(user.discountRate||0)+'٪';
  const av=$('userAvatar');
  if(user.avatar) av.innerHTML='<img src="'+esc(user.avatar)+'">'; else av.textContent=(user.fullName||'?').charAt(0);
  $('navMenu').innerHTML=MENU.map(i=>'<div class="nav-item" data-page="'+i.id+'"><span>'+i.icon+'</span><span>'+i.label+'</span>'+(i.badge?'<span class="unread-badge" id="msgBadge" hidden>0</span>':'')+'</div>').join('');
  $('navMenu').querySelectorAll('.nav-item').forEach(b=>b.addEventListener('click',()=>{
    $('navMenu').querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
    b.classList.add('active'); $('sidebar').classList.remove('open'); loadPage(b.dataset.page);
  }));
  loadPage('dashboard'); refreshUnread();
}
function refreshUnread(){
  if(!currentToken) return;
  callServer('getCustomerUnreadCount',[currentToken],n=>{ const b=$('msgBadge'); if(b){ b.textContent=toFa(n||0); b.hidden=!n; } });
}
(function checkSession(){
  const saved=localStorage.getItem('zv_cst_user');
  if(currentToken&&saved){ try{ currentUser=JSON.parse(saved); showApp(currentUser); }catch(e){} }
})();
function loadPage(page){

function initOrderForm(){
  initProvinceCities();
  // پر کردن آدرس و شهر مشتری
  if(currentUser.province){ populateCities(); setTimeout(()=>{ if(currentUser.city) $('city').value=currentUser.city; },50); }
  $('address').value=currentUser.address||'';
  initOrderCalendar();
  $('serviceId').addEventListener('change',()=>{renderServiceQuestions();renderSideServices();updateUnitHint();estimatePrice();});
  $('actionType').addEventListener('change',estimatePrice);
  $('offerCode').addEventListener('change',estimatePrice);
  $('estimateBtn').addEventListener('click',estimatePrice);
  $('applyOfferCode').addEventListener('click',applyOfferCode);
  $('removeOfferCode').addEventListener('click',()=>{$('offerCode').value='';$('offerCodeHint').textContent='کد تخفیف حذف شد.';estimatePrice();});
  // دریافت خدمات
  callServer('getServices',[],data=>{
    orderState.services=data.services||[];
    orderState.sideServices=data.sideServices||[];
    orderState.questions=data.questions||[];
    $('serviceId').innerHTML='<option value="">انتخاب کنید</option>'+orderState.services.map(s=>'<option value="'+esc(s.id)+'">'+esc(s.name)+'</option>').join('');
    renderSideServices();renderServiceQuestions();updateUnitHint();
  },e=>toast('خطا در دریافت خدمات: '+e.message,'error'));
}

function applyOfferCode(){
  const code=$('offerCode').value.trim();
  if(!code) return toast('ابتدا کد تخفیف را وارد کنید','error');
  callServer('validateOfferCode',[code],r=>{
    $('offerCodeHint').textContent=r.message||'';
    if(r.valid){ toast('کد تخفیف معتبر است','success'); estimatePrice(); }
    else { $('invoiceOfferDiscount').textContent='—'; toast(r.message||'کد تخفیف معتبر نیست','error'); }
  });
}

function renderSideServices(){
  const root=$('sideServices');
  const selected=orderState.services.find(x=>x.id===$('serviceId').value);
  const eligible=orderState.sideServices.filter(s=>{
    if(!s.relatedService) return false;
    const tokens=s.relatedService.split(/[,،;؛]/).map(x=>x.trim().toLowerCase()).filter(Boolean).map(t=>['cleaning_m','cleaning_f'].includes(t)?'home / office cleaning':t);
    return selected&&tokens.some(t=>t===selected.id.toLowerCase()||t===selected.name.toLowerCase());
  });
  if(!eligible.length){ root.innerHTML='<div class="hint">خدمت جانبی مرتبطی ثبت نشده است.</div>'; return; }
  root.innerHTML=eligible.map(s=>'<div class="side-item"><input type="checkbox" data-side-id="'+esc(s.id)+'"><span class="side-name">'+esc(s.name)+' <span class="hint">('+esc(s.unit)+')</span></span><input class="side-qty" type="number" min="1" max="10000" value="1" data-side-qty="'+esc(s.id)+'" disabled></div>').join('');
  root.querySelectorAll('input[type=checkbox]').forEach(cb=>cb.addEventListener('change',()=>{
    const q=root.querySelector('[data-side-qty="'+cb.dataset.sideId+'"]');
    q.disabled=!cb.checked; estimatePrice();
  }));
  root.querySelectorAll('[data-side-qty]').forEach(el=>el.addEventListener('change',estimatePrice));
}

function renderServiceQuestions(){
  const root=$('serviceQuestions');
  const qs=orderState.questions.filter(q=>q.serviceId===$('serviceId').value).sort((a,b)=>(a.position||0)-(b.position||0));
  if(!qs.length){ root.innerHTML=''; return; }
  root.innerHTML=qs.map((q,i)=>{
    const id='q-'+i;
    const required=/اجباری|required/i.test(q.fieldType||'');
    const req=required?' required':'';
    const raw=String(q.inputType||'text').trim().toLowerCase();
    const isSelect=/select|انتخاب|گزینه/.test(raw);
    let input='';
    if(isSelect){
      const opts=(q.options||'').split(/[,،؛;]/).map(x=>x.trim()).filter(Boolean);
      input='<select id="'+id+'" data-answer-column="'+esc(q.answerColumn)+'"'+req+'><option value="">انتخاب کنید</option>'+opts.map(o=>'<option value="'+esc(o)+'">'+esc(o)+'</option>').join('')+'</select>';
    } else {
      const type=['number','text','date','time','email','tel'].includes(raw)?raw:'text';
      input='<input id="'+id+'" type="'+type+'" data-answer-column="'+esc(q.answerColumn)+'"'+req+'>';
    }
    return '<div class="field"><label>'+esc(q.question)+(required?' <span class="required">*</span>':'')+'</label>'+input+(q.help?'<div class="hint">'+esc(q.help)+'</div>':'')+'</div>';
  }).join('');
  root.querySelectorAll('[data-answer-column]').forEach(el=>{
    el.addEventListener('input',()=>{
      if(['مقدار','تعداد طبقات'].includes(el.dataset.answerColumn)){
        const v=parseNum(el.value); if(v>0) $('quantity').value=v;
      }
    });
    el.addEventListener('change',estimatePrice);
  });
}

function updateUnitHint(){
  const s=orderState.services.find(x=>x.id===$('serviceId').value);
  $('unitHint').textContent=s?('واحد محاسبه: '+s.unit):'';
}

function parseNum(v){return Number(String(v||'').replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٬,\s]/g,'').replace(/[^0-9.-]/g,''))||0;}

function collectOrderPayload(){
  const answers={};
  document.querySelectorAll('#serviceQuestions [data-answer-column]').forEach(el=>{ if(el.value!=='') answers[el.dataset.answerColumn]=el.value; });
  const derived=parseNum(answers['مقدار']||answers['تعداد طبقات']||1);
  $('quantity').value=derived>0?derived:1;
  return {
    requestId:orderState.requestId||(orderState.requestId='ZV-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,9)),
    serviceId:$('serviceId').value,
    quantity:Number($('quantity').value),
    sideServices:[...document.querySelectorAll('[data-side-id]:checked')].map(cb=>({id:cb.dataset.sideId,quantity:Number(document.querySelector('[data-side-qty="'+cb.dataset.sideId+'"]').value)||1})),
    answers,
    name:currentUser.fullName,
    firstName:currentUser.firstName,
    lastName:currentUser.lastName,
    membershipCode:currentUser.customerId,
    offerCode:$('offerCode').value.trim(),
    actionType:$('actionType').value,
    phone:currentUser.phone,
    requestDate:$('requestDate').value.trim(),
    requestTime:$('requestTime').value,
    address:$('address').value.trim(),
    province:$('province').value,
    city:$('city').value,
    notes:$('notes').value.trim()
  };
}

function resetInvoice(){['invoiceBase','invoiceSide','invoiceUrgent','invoiceDiscount','invoiceOfferDiscount','invoiceTax'].forEach(id=>$(id).textContent='—');$('invoiceSideDetails').innerHTML='';$('finalPrice').textContent='خدمت را انتخاب کنید';}

function estimatePrice(){
  const p=collectOrderPayload();
  if(!p.serviceId||!(p.quantity>0)){ resetInvoice(); orderState.estimate=null; return; }
  $('estimateBtn').disabled=true;
  callServer('getPriceEstimate',[p],r=>{
    orderState.estimate=r;
    $('invoiceBase').textContent=money(r.basePrice||0);
    $('invoiceSide').textContent=money(r.sideServicesTotal);
    $('invoiceSideDetails').innerHTML=(r.sideBreakdown||[]).map(x=>'<div class="price-line"><span>'+esc(x.name)+' × '+toFa(x.quantity)+'</span><strong>'+money(x.total)+'</strong></div>').join('');
    $('invoiceUrgent').textContent=money(r.urgentAmount);
    $('invoiceDiscount').textContent='− '+money(r.discountAmount)+' ('+toFa(r.discountRate||0)+'٪)';
    $('invoiceOfferDiscount').textContent='− '+money(r.offerDiscountAmount||0);
    $('offerCodeHint').textContent=r.offerCode?(r.offerMessage||'کد تخفیف اعمال شد.'):($('offerCode').value.trim()?(r.offerMessage||'کد تخفیف اعمال نشد.'):'کد تخفیف اختیاری است.');
    $('invoiceTax').textContent=money(r.taxAmount);
    $('finalPrice').textContent=money(r.finalPrice);
    $('estimateBtn').disabled=false;
  },e=>{ resetInvoice(); $('estimateBtn').disabled=false; toast(e.message,'error'); });
}

function submitOrder(ev){
  ev.preventDefault();
  if(orderState.submitting) return;
  const p=collectOrderPayload();
  if(!p.serviceId) return toast('یک خدمت انتخاب کنید','error');
  if(!/^\d{4}\/\d{2}\/\d{2}$/.test(p.requestDate)) return toast('تاریخ شمسی را با قالب ۱۴۰۵/۰۸/۲۲ وارد کنید','error');
  if(!p.requestTime) return toast('ساعت اجرا را وارد کنید','error');
  if(!p.address||p.address.length<5) return toast('آدرس دقیق را وارد کنید','error');
  if(!confirm('ثبت درخواست با مبلغ '+money(orderState.estimate?orderState.estimate.finalPrice:0)+' انجام شود؟')) return;
  orderState.submitting=true;
  $('submitBtn').disabled=true; $('submitBtn').textContent='در حال ثبت…';
  callServer('processOrder',[p],r=>{
    orderState.submitting=false;
    $('submitBtn').disabled=false; $('submitBtn').textContent='ثبت درخواست';
    if(r&&r.success){
      toast('✅ درخواست ثبت شد — کد پیگیری: '+r.orderId,'success');
      $('orderForm').reset(); orderState.requestId=null; orderState.estimate=null;
      resetInvoice(); renderSideServices(); renderServiceQuestions();
      $('address').value=currentUser.address||'';
      // رفرش داشبورد
      setTimeout(()=>{ $('navMenu').querySelector('[data-page="dashboard"]').click(); },1500);
    } else toast((r&&r.message)||'ثبت درخواست ناموفق بود','error');
  },e=>{
    orderState.submitting=false;
    $('submitBtn').disabled=false; $('submitBtn').textContent='ثبت درخواست';
    toast(e.message||'خطا در ثبت درخواست','error');
  });
}

/* تقویم شمسی فرم سفارش */
function g2j(gy,gm,gd){const gdm=[0,31,((gy%4===0&&gy%100!==0)||gy%400===0)?29:28,31,30,31,30,31,31,30,31,30,31];let gy2=gm>2?gy+1:gy;let days=355666+365*gy+Math.floor((gy2+3)/4)-Math.floor((gy2+99)/100)+Math.floor((gy2+399)/400)+gd;for(let i=1;i<gm;i++)days+=gdm[i];let jy=-1595+33*Math.floor(days/12053);days%=12053;jy+=4*Math.floor(days/1461);days%=1461;if(days>365){jy+=Math.floor((days-1)/365);days=(days-1)%365}let jm,jd;if(days<186){jm=1+Math.floor(days/31);jd=1+days%31}else{jm=7+Math.floor((days-186)/30);jd=1+(days-186)%30}return[jy,jm,jd]}
function j2g(jy,jm,jd){jy+=1595;let days=-355668+365*jy+Math.floor(jy/33)*8+Math.floor(((jy%33)+3)/4)+jd+(jm<7?(jm-1)*31:(jm-7)*30+186);let gy=400*Math.floor(days/146097);days%=146097;if(days>36524){gy+=100*Math.floor(--days/36524);days%=36524;if(days>=365)days++}gy+=4*Math.floor(days/1461);days%=1461;if(days>365){gy+=Math.floor((days-1)/365);days=(days-1)%365}let gd=days+1;const leap=gy%4===0&&(gy%100!==0||gy%400===0);const months=[0,31,leap?29:28,31,30,31,30,31,31,30,31,30,31];let gm=1;while(gm<=12&&gd>months[gm]){gd-=months[gm];gm++}return[gy,gm,gd]}
function renderOrderCalendar(){const months=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];$('calTitle').textContent=months[orderState.calMonth-1]+' '+toFa(orderState.calYear);const grid=$('calGrid');grid.innerHTML=['ش','ی','د','س','چ','پ','ج'].map(x=>'<button type="button" class="day-label" disabled>'+x+'</button>').join('');const first=j2g(orderState.calYear,orderState.calMonth,1);const weekday=(new Date(first[0],first[1]-1,first[2]).getDay()+1)%7;for(let i=0;i<weekday;i++)grid.insertAdjacentHTML('beforeend','<span></span>');const max=orderState.calMonth<=6?31:orderState.calMonth<=11?30:29;for(let d=1;d<=max;d++)grid.insertAdjacentHTML('beforeend','<button type="button" data-day="'+d+'">'+toFa(d)+'</button>');grid.querySelectorAll('[data-day]').forEach(b=>b.addEventListener('click',()=>{$('requestDate').value=orderState.calYear+'/'+String(orderState.calMonth).padStart(2,'0')+'/'+String(Number(b.dataset.day)).padStart(2,'0');$('datePop').classList.remove('open');}))}
function initOrderCalendar(){const now=new Date();[orderState.calYear,orderState.calMonth]=g2j(now.getFullYear(),now.getMonth()+1,now.getDate()).slice(0,2);$('dateToggle').addEventListener('click',()=>{$('datePop').classList.toggle('open');renderOrderCalendar()});$('prevMonth').addEventListener('click',()=>{orderState.calMonth--;if(orderState.calMonth<1){orderState.calMonth=12;orderState.calYear--}renderOrderCalendar()});$('nextMonth').addEventListener('click',()=>{orderState.calMonth++;if(orderState.calMonth>12){orderState.calMonth=1;orderState.calYear++}renderOrderCalendar()});document.addEventListener('click',e=>{if($('datePop')&&!$('datePop').contains(e.target)&&e.target!==$('dateToggle'))$('datePop').classList.remove('open')})}

const provinceCities={'آذربایجان شرقی':['تبریز','مراغه','مرند','میانه','اهر'],'آذربایجان غربی':['ارومیه','خوی','بوکان','مهاباد'],'اردبیل':['اردبیل','پارس‌آباد','مشگین‌شهر'],'اصفهان':['اصفهان','کاشان','خمینی‌شهر','نجف‌آباد'],'البرز':['کرج','فردیس','نظرآباد'],'ایلام':['ایلام','دهلران'],'بوشهر':['بوشهر','برازجان','گناوه'],'تهران':['تهران','ری','اسلامشهر','شهریار','قدس','ملارد','ورامین','پاکدشت','دماوند','پردیس','رباط‌کریم','قرچک'],'چهارمحال و بختیاری':['شهرکرد','بروجن'],'خراسان جنوبی':['بیرجند','قائن','فردوس'],'خراسان رضوی':['مشهد','نیشابور','سبزوار','تربت حیدریه','کاشمر'],'خراسان شمالی':['بجنورد','شیروان'],'خوزستان':['اهواز','دزفول','آبادان','خرمشهر'],'زنجان':['زنجان','ابهر','خرمدره','قیدار'],'سمنان':['سمنان','شاهرود'],'سیستان و بلوچستان':['زاهدان','زابل','چابهار','ایرانشهر','سراوان','خاش'],'فارس':['شیراز','مرودشت','کازرون','جهرم'],'قزوین':['قزوین','تاکستان'],'قم':['قم','جعفریه'],'کردستان':['سنندج','سقز','مریوان','بانه'],'کرمان':['کرمان','سیرجان','رفسنجان','جیرفت'],'کرمانشاه':['کرمانشاه','اسلام‌آباد غرب'],'کهگیلویه و بویراحمد':['یاسوج','دهدشت'],'گلستان':['گرگان','گنبدکاووس','آق‌قلا'],'گیلان':['رشت','بندر انزلی','لاهیجان','آستارا'],'لرستان':['خرم‌آباد','بروجرد','دورود'],'مازندران':['ساری','بابل','آمل','قائم‌شهر','چالوس','تنکابن'],'مرکزی':['اراک','ساوه','خمین','محلات'],'هرمزگان':['بندرعباس','قشم','کیش','بندر لنگه'],'همدان':['همدان','ملایر','نهاوند'],'یزد':['یزد','میبد','اردکان','بافق','مهریز']};
function initProvinceCities(){const p=$('province');p.innerHTML='<option value="">انتخاب استان</option>'+Object.keys(provinceCities).map(x=>'<option>'+x+'</option>').join('');p.addEventListener('change',populateCities)}
function populateCities(){const p=$('province').value,c=$('city');const old=c.value;const cities=provinceCities[p]||[];c.innerHTML='<option value="">انتخاب شهر</option>'+cities.map(x=>'<option>'+x+'</option>').join('');c.disabled=!cities.length;if(cities.includes(old))c.value=old}


function loadMessages(){
  $('pageContent').innerHTML=
  '<div class="page-header"><h1 class="page-title">پیام‌ها و پشتیبانی</h1><button class="btn btn-primary" onclick="newMessageModal()">✉️ پیام جدید</button></div>'+
  '<div id="msgList"><div class="loading"><div class="spinner"></div></div></div>';
  fetchMessages();
}
function fetchMessages(){
  callServer('getCustomerConversations',[currentToken],rows=>{
    const el=$('msgList');
    if(!rows.length){ el.innerHTML='<div class="card"><div style="padding:18px;text-align:center;color:var(--muted);font-size:12px">هنوز پیامی ثبت نکرده‌اید.</div></div>'; return; }
    el.innerHTML=rows.map(m=>
    '<div class="thread-row"><div style="flex:1;min-width:0">'+
    '<div style="font-weight:800;color:var(--navy);font-size:13px">'+esc(m.subject||'بدون موضوع')+'</div>'+
    '<div style="font-size:12px;margin:3px 0">'+esc(m.message)+'</div>'+
    (m.reply?'<div style="font-size:11px;color:var(--muted);margin-top:5px;padding:7px;background:#f8f9fc;border-radius:8px"><strong>پاسخ پشتیبانی:</strong> '+esc(m.reply)+'</div>':'')+
    '<div class="thread-meta"><span>'+esc(m.createdAt)+'</span><span class="thread-state '+(m.status==='unread'?'unread':m.status==='open'?'open':'closed')+'">'+(m.status==='unread'?'بدون پاسخ':m.status==='open'?'باز':'بسته')+'</span></div>'+
    '</div><button class="btn btn-sm btn-secondary" onclick="replyMessageModal(\''+esc(m.conversationId)+'\',\''+esc(m.subject)+'\')">↩️ پاسخ</button></div>'
    ).join('');
    refreshUnread();
  },e=>toast(e.message,'error'));
}
function newMessageModal(){
  openModal('<div class="modal-header"><h2>پیام جدید به پشتیبانی</h2><button class="modal-close" onclick="closeModal()">✕</button></div>'+
  '<div class="field"><label>موضوع</label><input id="msgSubject" placeholder="موضوع پیام"></div>'+
  '<div class="field"><label>متن پیام</label><textarea id="msgBody" style="min-height:90px" placeholder="پیام خود را بنویسید…"></textarea></div>'+
  '<div class="modal-footer"><button class="btn btn-secondary" onclick="closeModal()">انصراف</button><button class="btn btn-primary" onclick="sendNewMessage()">ارسال</button></div>');
}
function sendNewMessage(){
  const s=$('msgSubject').value.trim(), b=$('msgBody').value.trim();
  if(!b) return toast('متن پیام را وارد کنید','error');
  callServer('createCustomerConversation',[s,b,currentToken],()=>{ closeModal(); toast('پیام ارسال شد','success'); loadMessages(); });
}
function replyMessageModal(id,subject){
  openModal('<div class="modal-header"><h2>پاسخ به: '+esc(subject)+'</h2><button class="modal-close" onclick="closeModal()">✕</button></div>'+
  '<div class="field"><label>متن پاسخ</label><textarea id="replyBody" style="min-height:90px"></textarea></div>'+
  '<div class="modal-footer"><button class="btn btn-secondary" onclick="closeModal()">انصراف</button><button class="btn btn-primary" onclick="sendReply(\''+esc(id)+'\')">ارسال</button></div>');
}
function sendReply(id){
  const b=$('replyBody').value.trim();
  if(!b) return toast('متن را وارد کنید','error');
  callServer('replyCustomerConversation',[id,b,currentToken],()=>{ closeModal(); toast('پاسخ ارسال شد','success'); loadMessages(); });
}

function saveProfile(){
  const u={firstName:$('pfFirst').value.trim(),lastName:$('pfLast').value.trim(),phone:$('pfPhone').value,email:$('pfEmail').value,province:$('pfProvince').value,city:$('pfCity').value,address:$('pfAddr').value,postalCode:$('pfPostal').value,avatar:$('pfAvatar').value};
  callServer('updateCustomerProfile',[u,currentToken],()=>{ toast('پروفایل ذخیره شد','success'); });

function changePassword(){
  const pass=$('pfNewPass').value;

  callServer('updateCustomerProfile',[{password:pass},currentToken],()=>{ toast('رمز عبور بروزرسانی شد','success'); $('pfNewPass').value=''; });
}
